openapi: 3.2.0
info:
  title: mabl Custom Filter API
  description: APIs for interacting with mabl services
  version: 0.599.3.1792436330
  x-readme-id: 62c896636916ce01d2ff4f5a
servers:
- url: /
security:
- basicAuth: []
- bearerAuth: []
tags:
- name: CustomFilter
paths:
  /workspaces/{workspace_id}/user/{user_id}/filters:
    get:
      tags:
      - CustomFilter
      summary: Query Workspace Custom Filters of User
      description: Query all the custom filters for the user in a workspace.
      operationId: queryCustomFilters
      parameters:
      - name: workspace_id
        in: path
        description: Workspace ID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: user_id
        in: path
        description: User ID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: limit
        in: query
        description: The limit to use for pagination
        required: false
        style: form
        explode: true
        schema:
          minimum: 1
          type: integer
          format: int32
      - name: cursor
        in: query
        description: The cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Results of the query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFilterQueryResult'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::CustomFilter
  /workspaces/filters:
    post:
      tags:
      - CustomFilter
      summary: Create New Custom Filter
      description: Creates a new custom filter
      operationId: createCustomFilter
      requestBody:
        description: The custom filter to create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomFilter'
        required: true
      responses:
        '201':
          description: Created Custom Filter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFilter'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Create::CustomFilter
  /workspaces/filters/{id}:
    get:
      tags:
      - CustomFilter
      summary: Get Custom Filter
      description: Retrieve the specified custom filter
      operationId: getCustomFilter
      parameters:
      - name: id
        in: path
        description: Custom filter identifier
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Retrieved Custom Filter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFilter'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: CustomFilter not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::CustomFilter
    delete:
      tags:
      - CustomFilter
      summary: Remove Custom Filter
      description: Remove custom filter
      operationId: removeCustomFilter
      parameters:
      - name: id
        in: path
        description: Custom filter identifier
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '204':
          description: Custom Filter Removed
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Delete::CustomFilter
    patch:
      tags:
      - CustomFilter
      summary: Update Custom Filter
      description: Update custom filter
      operationId: updateCustomFilter
      parameters:
      - name: id
        in: path
        description: Custom filter identifier
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: If-Match
        in: header
        description: If-Match header according to http/1.1 spec section 14.24
        required: false
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: The custom filter to update
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomFilter'
        required: true
      responses:
        '200':
          description: Updated Custom Filter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFilter'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: CustomFilter not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::CustomFilter
components:
  responses:
    ErrorResponse400:
      description: Invalid or missing parameter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse401:
      description: User not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse403:
      description: User not authorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse:
      description: Unknown error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
  schemas:
    ErrorResponseGeneric:
      type: object
      properties:
        id:
          type: string
          x-mabl-scope: public
        code:
          maximum: 599
          minimum: 100
          type: integer
          format: int32
          x-mabl-scope: public
        message:
          type: string
          x-mabl-scope: public
        error_code:
          type: string
          description: Machine-readable reason for the error, present only when the API names one. Values are guardrail_blocked (a guardrail policy refused an agent request), approval_required (a guardrail policy requires a person to approve the request first).
        guardrail:
          description: The guardrail policy that refused the request; present only when error_code is guardrail_blocked or approval_required.
          allOf:
          - $ref: '#/components/schemas/GuardrailRefusal'
    GuardrailApprovalRef:
      type: object
      properties:
        id:
          type: string
          description: The approval's id.
        state:
          description: Where the approval stands.
          allOf:
          - $ref: '#/components/schemas/GuardrailApprovalState'
        kind:
          description: Who decides the approval.
          allOf:
          - $ref: '#/components/schemas/GuardrailApprovalKind'
        request_expires_time:
          type: integer
          description: When the approval expires if nobody decides it, in epoch milliseconds.
          format: int64
        url:
          type: string
          description: The mabl app page where a person reviews the approval.
      description: 'An approval a guardrail policy asks for. While it is PENDING, stop: give the person the url, tell them the request is waiting for approval, and do not repeat the request or poll in a loop. Once a person tells you it is APPROVED, repeat the identical request with the header X-Mabl-Approval set to id. DENIED means a person said no, so do not work around it.'
    GuardrailApprovalState:
      type: string
      description: Where a guardrail approval stands. PENDING awaits a decision and expires undecided after 24 hours; APPROVED lets the agent repeat the request, as often as it does, for 20 minutes; DENIED refuses the same request for 20 minutes after the decision, after which asking again opens a new approval; CANCELLED means a person withdrew it while pending or revoked it while approved. EXPIRED and CANCELLED are final.
      enum:
      - PENDING
      - APPROVED
      - DENIED
      - EXPIRED
      - CANCELLED
    CustomFilter:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier
        workspace_id:
          type: string
          description: Associated workspace
        name:
          type: string
          description: Name of the filter
        filter_target:
          type: string
          description: The target the filter should be applied to
        filter:
          type: string
          description: The JSON serialized filter used to apply the appropriate filters
        active:
          type: boolean
          description: Indicates whether or not the filter is currently active
        created_time:
          type: integer
          description: Time at which the custom filter was created
          format: int64
        created_by_id:
          type: string
          description: The ID of the user who created this custom filter
        last_updated_time:
          type: integer
          description: Time the custom filter was last updated
          format: int64
        last_updated_by_id:
          type: string
          description: The ID of the user who last updated this custom filter
      x-implements-interface:
      - ActivityTrackingBaseEntity
      - HasWorkspaceId
      - HasName
    GuardrailRefusal:
      type: object
      properties:
        id:
          type: string
          description: The id of the guardrail policy that decided the refusal.
        reason:
          type: string
          description: Why the policy refuses the request, written for the person the agent acts for.
        decision_id:
          type: string
          description: The id of this decision in the guardrail decision log.
        action:
          type: string
          description: The action the request was evaluated as, written Verb::Resource (for example Delete::Test), as declared by the operation's x-mabl-action extension.
        policy_source:
          type: string
          description: 'Who set the deciding policy: workspace for a rule the workspace''s owners wrote, account for a rule set for the workspace''s account, mabl_agent_type for the agent type''s ceiling, and mabl_default for mabl''s own defaults.'
        approval:
          description: The approval for this request; present when error_code is approval_required and the approval could be recorded. Without it the request cannot be approved.
          allOf:
          - $ref: '#/components/schemas/GuardrailApprovalRef'
      description: The guardrail policy that refused an agent request.
    GuardrailApprovalKind:
      type: string
      description: Who decides a guardrail approval. SELF is decided by the person the agent acts for; WORKSPACE, for an agent acting for an API key, by a workspace owner or editor.
      enum:
      - SELF
      - WORKSPACE
    CustomFilterQueryResult:
      type: object
      properties:
        custom_filters:
          type: array
          description: All custom filters that matched the query
          readOnly: true
          items:
            $ref: '#/components/schemas/CustomFilter'
        cursor:
          type: string
          description: Cursor used for pagination
          readOnly: true
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: apiKey
      name: Authorization
      in: header
