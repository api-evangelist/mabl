          description: Optional test run ID to give the review agent access to test run analysis tools
        plan_run_id:
          type: string
          description: Optional plan run ID for results-analysis reviews of plan-run RAA sessions
        deployment_event_id:
          type: string
          description: Optional deployment event ID for results-analysis reviews of deployment RAA sessions
        batch_id:
          type: string
          description: Optional identifier linking reviews from the same backfill or batch run
    SpecialMessage:
