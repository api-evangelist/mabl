      type: object
      properties:
        id:
          type: string
          description: The id of the agent session
        workspace_id:
          type: string
          description: The id of the workspace
        created_time:
          type: integer
          description: The timestamp of the agent session creation in epoch milliseconds
          format: int64
        created_by_id:
          type: string
          description: The id of the user who created the agent session
        last_updated_time:
          type: integer
          description: The timestamp of the agent session last update in epoch milliseconds
          format: int64
        last_updated_by_id:
          type: string
          description: The id of the user who last updated the agent session
        agent_type:
          $ref: '#/components/schemas/AgentType'
        is_trial:
          type: boolean
          description: Whether this agent session is associated with a trial account
        parent_session_id:
          type: string
          description: The id of the parent agent session
        initiating_request_id:
          type: string
          description: A unique identifier for the request that initiated this agent session. If set, this must be globally unique and requests to create a new agent session with the same initiating_request_id will fail.
        startup_params:
          $ref: '#/components/schemas/AgentSessionStartupParams'
        instance_ids:
          type: array
          description: IDs of all cloud instances created for this session (in chronological order). Empty for local-client-driven sessions.
          items:
            type: string
        instance_type:
          $ref: '#/components/schemas/AgentInstanceType'
        latest_instance_status:
          $ref: '#/components/schemas/AgentInstanceStatus'
        latest_termination_reason:
          $ref: '#/components/schemas/AgentCloudInstanceTerminationReason'
        related_artifacts:
          type: array
          description: Artifacts related to this agent session (e.g., generated tests, flows, etc.). Visible to all workspace members via queryAgentSessions — do not store creator-private content here; use `messages` on the full AgentSession for private content.
          items:
            $ref: '#/components/schemas/Artifact'
          default: []
        agent_variant:
          type: string
          description: 'The authoring-agent arm assigned to this session at creation time (values: `generic` or `flexible`). Only set for `test_authoring` sessions; unset for other agent types. Carried on the summary so query results can be grouped by arm without refetching each session.'
      description: A summary of an agent session without messages (used in list/query responses)
      x-implements-interface:
      - HasId
      - HasWorkspaceId
      - HasCreatedActivity
      - HasUpdatedActivity
    RateLimitedSchedulingResult:
      required:
      - scheduled_count
      - workspaces_processed
      type: object
      properties:
        scheduled_count:
          type: integer
          description: Number of instances transitioned from rate_limited to queued status
          format: int32
        workspaces_processed:
          type: integer
          description: Number of workspaces that were processed
          format: int32
      description: Result of the rate-limited session scheduling cron job
    ToolOutputTextContentItem:
      type: object
      properties:
        type:
          type: string
          enum:
          - text
        text:
          type: string
          description: Text content
    AgentSessionContextPageEntity:
      type: string
      description: 'What the page is about. A closed set for the same reason the actions are: each member decides what the server says to the agent, and a member meaning "something else" would put the wording back in the client.'
      enum:
      - test_run
      - plan_run
      - deployment
      - pull_request
    RecordAgentSessionContextActionRequest:
      required:
      - action
      type: object
      properties:
        action:
          $ref: '#/components/schemas/AgentSessionContextAction'
        test_configuration:
          description: '`test_configuration_edited`: the configuration as the user left it. Sent whole rather than as a description of what moved, because the agent''s own tool takes the whole thing and a prose diff would make it reconstruct the object.'
          allOf:
          - $ref: '#/components/schemas/TestCreationPlanningTestInformation'
        configuration_origin:
          $ref: '#/components/schemas/AgentSessionContextConfigurationOrigin'
        reference:
          $ref: '#/components/schemas/AgentSessionContextReference'
        attachment:
          $ref: '#/components/schemas/AgentSessionContextAttachment'
        page:
          $ref: '#/components/schemas/AgentSessionContextPage'
        idempotency_key:
          maxLength: 256
          type: string
          description: 'Makes a retry safe, on the same terms as the inbox: the same key to the same session twice returns the message stored the first time and queues nothing new. The work behind the action is idempotent on its own — a re-sent attachment id resolves to the file already stored under it, and a reference action stores nothing to repeat.'
      description: 'One thing the user did. Deliberately carries no message text and no storage location: the text is composed by the server from the action and its metadata, which is what keeps model-facing wording versioned with the API rather than written in each client, and the location is minted by the server.'
    AgentInboxSenderType:
      type: string
      description: 'Who the message is from, which decides how it reaches the model. `user` is a person, and their text is marked as human authorship. `system` is mabl speaking — a notification, a trigger — and is deliberately NOT marked that way, so an agent is never fed its own machinery back as "what the user asked for". `agent` is another agent session speaking, which names itself in `sender_agent_session_id`.

        Derived from the authenticated caller, never sent: a caller with nobody behind it cannot claim a person typed something. An agent''s credential names its session, and that is the more specific fact about a caller who is also acting for a person — so a credential naming a session is read as `agent` rather than as the person it acts on behalf of.'
      enum:
      - user
      - system
      - agent
    TestObjectiveSource:
      type: string
      description: Who authored the objective summary.
      enum:
      - user
      - agent
    UpdateAgentSessionRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/LocalSettableAgentInstanceStatus'
      description: Partial-update request for an agent session. All fields are optional; only fields present in the body are updated.
    AgentReviewSessionStartupParams:
