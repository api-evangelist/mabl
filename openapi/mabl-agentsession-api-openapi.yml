          description: 'Artifacts related to this agent session. MERGED into the session''s existing artifacts, not substituted for them: inline artifacts dedupe by `name`, remote artifacts by `entity_kind` + `entity_id`, and the ones in this request win on a collision. Omit the field entirely to leave the session''s artifacts untouched. To attach artifacts without a message, use `POST /agentSession/{id}/artifacts` instead.'
