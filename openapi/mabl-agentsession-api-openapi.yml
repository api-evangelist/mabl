    SendAgentInboxMessageRequest:
      required:
      - message
      type: object
      properties:
        message:
          maxLength: 32768
          type: string
          description: What to tell the agent.
        context:
          maxItems: 25
          type: array
          description: 'What the user did alongside this message -- attached files, pointed the session at a test, moved to another page. Each is recorded through the context endpoint, in the order given, BEFORE the message is queued, so the api composes the text and queues it as `system`. Sent here rather than as separate calls because every queued message WAKES the agent, this one included: record them afterwards and the agent may answer before they arrive; record them first and the first write wakes it on context with no question in it, and on only part of what was attached. Sent together the agent wakes once, holding all of it. A list rather than one because a single message routinely carries several -- two files, or a file and the page they are about -- and there is no safe way to split those across calls. Carry an `idempotency_key` inside each when you retry, the same as for the message.'
          items:
            $ref: '#/components/schemas/RecordAgentSessionContextActionRequest'
        idempotency_key:
          maxLength: 256
          type: string
          description: Makes a retry safe. Sending the same key to the same session twice returns the message stored the first time and queues nothing new — including when the second call carries different text, because the first one is what the agent will act on.
      description: A message to queue for an agent, and optionally what the user was doing when they sent it. Everything else — who sent it, whether a person typed it, where it sits in the queue, when it arrived — is derived from the caller or assigned on write, so there is nothing here a caller could get wrong or claim falsely.
    ErrorContentToolOutput:
      type: object
      properties:
        type:
          type: string
          enum:
          - error-content
        error_content:
          type: array
          description: Array of error content items
          items:
            $ref: '#/components/schemas/ToolOutputContentItem'
    TestImpactMatch:
      required:
      - context
      - evidence
      - expected_outcome
      - relation
      - test_invariant_id
      - test_name
      type: object
      properties:
        test_invariant_id:
          type: string
          description: 'The test''s invariant id. Stable across versions — the same id accepted by GET

            /tests/{id} to look up this test, and by the id-based test-run mechanisms consumers

            already use elsewhere (mabl-cli, other agent tools).

            '
        test_name:
          type: string
          description: 'The test''s display name, for readability. Backfilled server-side from the tool call

            that surfaced this test (search result or a verified get_test_details fetch), not

            trusted from the model''s own copy.

            '
        role:
          type: string
          description: 'The Knowledge Graph relationship between this test and the changed area, when known

            from the graph: "validates" tests assert the area''s behavior directly; "uses"

            tests exercise it incidentally en route to testing something else. Omitted when the

            test was found via text/semantic search only, or the relationship isn''t modeled.

            '
          enum:
          - validates
          - uses
        relation:
          type: string
          description: 'Why this test''s result tells us something about the described change. "direct": a step

            in the test clicks, types into, navigates via, finds, or asserts something the change

            alters. "blast_radius": no step touches the changed thing directly, but a step

            interacts with something that shares a component, flow, or data with it. "adjacent":

            nothing in the test''s steps reaches the change; it is the nearest existing coverage in

            the same area. Model-judged from the test''s own steps, not its name.

            '
          enum:
          - direct
          - blast_radius
          - adjacent
        expected_outcome:
          type: string
          description: 'The agent''s advisory prediction if the change is done correctly; actual failures

            still need diagnosis. "should_pass": the test should continue to pass. "fails_by_design": the change intentionally

            removes, renames, moves, or makes required something this test finds, clicks, or

            asserts, so the test may need updating after its actual failure is diagnosed. "uncertain":

            the agent could not tell from its evidence which of the two applies.

            '
          enum:
          - should_pass
          - fails_by_design
          - uncertain
        evidence:
          type: string
          description: 'One sentence naming the deciding step or citation: the specific step, or, for a

            Knowledge-Graph-derived result, the graph citation or path, that made the agent include

            this test. Downstream agents can use this as a compact pointer into the test without

            reading the fuller context field.

            '
        context:
          type: string
          description: 'The agent''s own account, in plain terms, of why this test is relevant beyond the

            evidence citation — one concise Knowledge Graph path when the result came from the

            graph (e.g. "kg: Checkout -CONTAINS-> Payment form"), and any caveats. Two or three

            sentences, carrying no tool names and no ids. Model-authored throughout: it is the

            agent explaining its reading of its own results, not a mabl fact.

            '
        run_context:
          $ref: '#/components/schemas/TestImpactRunContext'
