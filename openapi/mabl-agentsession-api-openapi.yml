    RemoteArtifact:
      type: object
      properties:
        artifact_type:
          type: string
          enum:
          - remote
        entity_kind:
          $ref: '#/components/schemas/ArtifactEntityKind'
        entity_id:
          type: string
          description: The ID of the referenced entity
        entity_name:
          type: string
          description: The name of the referenced entity
        metadata:
          maxProperties: 20
          type: object
          additionalProperties:
            maxLength: 512
            type: string
          description: '(Optional) Free-form string-to-string detail about WHY this entity is attached to the session — e.g. `relation`, `revision`, `source`, `url` on a deployment event an analysis triggered. `relation` reads outward from the session: `triggered` (this session''s analysis caused that deployment event), `spawned` (this session started that session), `reported` (that test run reported back to this session). `source` names who or what put the entity there, and it answers a slightly different question per relation, so read it with its relation rather than as one vocabulary: on a `triggered` deployment event it is the `TestSelection.source` that chose the tests (`agent` or `user`); on a `triggered` plan run it is who dispatched the batch (`agent`); on a `reported` test run it is where the run happened (`mabl_local`); on a `spawned` authoring session it is the client that wrote the link (`agent` from the MCP tools, `mabl_cli_authoring` from the CLI). A new writer joins the value space its relation already uses rather than opening another one. Both are conventions, not validated enums. Values are strings so the Datastore/Spanner JSON round trip stays unambiguous and nothing structured hides behind an untyped map. A remote artifact''s identity is `entity_kind` + `entity_id` and a re-write of the same pair replaces the whole artifact (last write wins), so `metadata` must never be the only carrier of something that matters.'
      allOf:
      - $ref: '#/components/schemas/BaseArtifact'
