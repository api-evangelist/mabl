      summary: Mint a token for an agent acting within the caller's request
      description: Mints a short-lived JWT for an agent that runs inside a request the session's own creator made, so the agent's calls are limited to its type's ceiling as well as the creator's permissions. Only the person who created the session can mint one, and only for an agent type that has a ceiling. Logging out revokes it along with the token the creator presented. A type without a ceiling gets 400. A caller who is not a person, is not the session's creator, or names a session that does not exist gets 403.
      operationId: createAgentSessionToken
      parameters:
      - name: agent_session_id
        in: path
