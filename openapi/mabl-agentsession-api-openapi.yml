      type: object
      properties:
        application_id:
          type: string
          description: The id of the application the impact analysis was scoped to
        shadow_of_session_id:
          type: string
          description: The id of the original test_impact session this shadow replays
        variant:
          type: string
          description: 'The experimental condition this replay ran under (e.g. baseline, no_knowledge_graph). A free-form value on purpose: a new condition is a new value, never a schema change.'
        replicate:
          type: integer
          description: 1-based index distinguishing repeated shadow replays of the same original session and variant. Part of the derived idempotency key that keeps a re-run of the same batch window from double-creating a shadow session.
        include_plans:
          type: boolean
          description: Whether the replay assumed the original session's plan associations.
      description: 'Context for a hidden shadow session that replays a completed test impact analysis session under an experimental variant for internal comparison. Not part of any customer-visible flow; see TestImpactSessionStartupParams for the session being shadowed. application_id, shadow_of_session_id, variant and replicate are required for this session type but are not declared `required` here: the anyOf members flatten into one generated interface, so a required field on one shape becomes required on all of them (see the test_run_id comment on RepairNotesSessionStartupParams below). Enforced by the caller instead.

        '
    Artifact:
      type: object
      properties:
        artifact_type:
          type: string
          enum:
          - inline
          - remote
      anyOf:
      - $ref: '#/components/schemas/InlineArtifact'
      - $ref: '#/components/schemas/RemoteArtifact'
    TestImpactSessionStartupParams:
      type: object
      properties:
        application_id:
          type: string
          description: The id of the application the impact analysis was scoped to
        initiating_user_id:
          type: string
          description: 'The id of the user who requested the analysis, when the request carried a user identity. Absent for API key callers, which have no associated user; see initiating_auth_type to tell that case apart from an identity that was simply not recorded.

            '
        initiating_auth_type:
          $ref: '#/components/schemas/TestImpactInitiatingAuthType'
        references:
          maxItems: 5
          minItems: 1
          type: array
          description: '(Optional) The normalized change references the analysis was requested for. Provenance: they are what group this analysis with the other analyses, deployments and runs of the same change. Nothing is granted by them and nothing dereferences them.'
          items:
            $ref: '#/components/schemas/ChangeReference'
        revision:
          maxLength: 200
          type: string
          description: (Optional) The revision the analysis was requested for, same meaning as a deployment event's revision. The per-commit key for lining an analysis up with that commit's deployments and runs.
        mabl_branch:
          maxLength: 200
          type: string
          description: (Optional) The mabl branch the analysis read tests on. Absent when it read master.
      description: 'Context for a test impact analysis session. Test impact sessions are written under the server-agents service credential rather than the caller''s, so created_by_id identifies the service account and not the requester — the initiating identity is recorded here instead. Trust level: these fields are reported by the service that creates the session, not derived server-side from the authenticated principal, so like every other startup_params field they are only as trustworthy as the credential that wrote the session. Treat them as provenance for internal review, never as an authorization or audit input.

        '
    TestImpactAnalysis:
      required:
      - session
      type: object
      properties:
        session:
          description: The session as the test impact query lists it
          allOf:
          - $ref: '#/components/schemas/TestImpactSessionSummary'
        request:
          description: The request as the analysis ran it, after validation and normalization. Absent until the analysis returns, and on a session whose recorded request cannot be read or no longer matches this schema.
          allOf:
          - $ref: '#/components/schemas/TestImpactRequest'
        result:
          description: The result as stored on the session. For a caller who can read the workspace's agent sessions, each test carries the run_context stored with it, facts as of when they were stored rather than re-read. A key holding only read:test_impact_analyses gets each test without it, and quality_window and run_context_incomplete then describe run context this read leaves out. A test whose stored run_context no longer matches its schema comes back without it, the rest of the result kept, and run_context_incomplete is then true. Absent until the analysis returns, and on a session whose stored result cannot be read or no longer matches this schema, as a result stored before a property became required does.
          allOf:
          - $ref: '#/components/schemas/TestImpactResult'
      description: One test impact analysis, with the request it ran and the result it returned
    GuardrailApprovalRef:
      type: object
      properties:
        id:
          type: string
          description: The approval's id.
        state:
          description: Where the approval stands.
          allOf:
          - $ref: '#/components/schemas/GuardrailApprovalState'
        kind:
          description: Who decides the approval.
          allOf:
          - $ref: '#/components/schemas/GuardrailApprovalKind'
        request_expires_time:
          type: integer
          description: When the approval expires if nobody decides it, in epoch milliseconds.
          format: int64
        url:
          type: string
          description: The mabl app page where a person reviews the approval.
      description: 'An approval a guardrail policy asks for. While it is PENDING, stop: give the person the url, tell them the request is waiting for approval, and do not repeat the request or poll in a loop. Once a person tells you it is APPROVED, repeat the identical request with the header X-Mabl-Approval set to id. DENIED means a person said no, so do not work around it.'
    MessageRole:
      type: string
      enum:
      - user
      - model
      - tool_output
      - special
    CloudAgentPlatform:
      type: string
      description: The platform the agent operates on
      enum:
      - none
      - web
    CodeExecutionCallPart:
      type: object
      properties:
        type:
          type: string
          enum:
          - code_execution_call
        language:
          type: string
          description: Programming language identifier from Gemini's Language enum (e.g. PYTHON). LANGUAGE_UNSPECIFIED when the model omitted it.
        code:
          type: string
          description: Source code that was executed in the sandbox.
        signature:
          type: string
          description: Thought signature (Gemini 3 with thinking enabled).
      description: Code the model asked the Gemini built-in Python execution sandbox to run. Emitted alongside a matching CodeExecutionResultPart on the same model turn — the sandbox runs synchronously and returns its result in the same response. Only appears when the agent enables the code execution tool and the model chooses to use it.
    UpsertAgentSessionMessagesRequest:
      required:
      - messages
      type: object
      properties:
        messages:
          type: array
          description: The messages to upsert in the session
          items:
            $ref: '#/components/schemas/AgentSessionMessage'
        related_artifacts:
          type: array
          description: 'Artifacts related to this agent session. MERGED into the session''s existing artifacts, not substituted for them: inline artifacts dedupe by `name`, remote artifacts by `entity_kind` + `entity_id`, and the ones in this request win on a collision. Omit the field entirely to leave the session''s artifacts untouched. To attach artifacts without a message, use `POST /agentSession/{id}/artifacts` instead.'
          items:
            $ref: '#/components/schemas/Artifact'
        inbox_cursor_through:
          minimum: 0
          type: integer
          description: Advance the session's inbox cursor past this `message_index`, in the SAME transaction as this message write. The caller has already put those messages into the conversation it is writing, so consuming them and recording the turn that consumed them commit together or not at all. A message that arrived after the caller read has a higher index and is left for the next turn. A session with no inbox is not an error — nothing is advanced.
          format: int64
        status_update:
          $ref: '#/components/schemas/AgentInstanceStatus'
      description: Request to upsert messages in an agent session. Messages are matched by ID - new messages are inserted, existing messages are updated.
    TestImpactRequest:
      required:
      - application_id
      - change_description
      type: object
      properties:
        change_description:
          maxLength: 20000
          type: string
          description: 'A description of the code change, framed around the user-facing area(s) it reaches.

            May be long: the agent decomposes it into focused probes across multiple tool calls

            and rounds internally, so this is not capped at a short-query length the way a single

            search query would be. The length limit here is a sanity ceiling against abuse, not a

            target — a few sentences naming the affected areas is usually enough.

            '
        application_id:
          type: string
          description: 'The application to analyze. Required: analysis is scoped to one application''s tests

            and Knowledge Graph, and real usage of this endpoint effectively always has one. If

            you don''t know it, look it up first with an existing mabl application-listing/lookup

            tool. A change touching more than one application should be split into one call per

            application_id rather than combined into a single request.

            '
        guidance:
          maxLength: 4000
          type: string
          description: 'Optional free text stating your needs or direction for this call — for example

            "everything potentially relevant, I''m validating nothing broke" versus "just the

            top-priority handful", or an update-oriented framing. This is intent only you know;

            it shapes how broadly the agent searches and how large a set it returns, not which

            tests exist. With no guidance, the default is: every test that directly exercises a

            changed area, plus the clearly relevant users of those areas, prioritized —

            comprehensive within relevance, never an exhaustive dump of weak matches.

            '
        include_plans:
          type: boolean
          description: 'When true, each returned test''s run_context additionally lists the run policies

            (plans) that include it — id, name, enabled, browsers, retry, trigger presence.

            Defaults to false: plan membership costs one plan-index lookup per returned test,

            and most run/skip decisions are answerable from the always-included fields.

            '
        include_markdown:
          type: boolean
          description: 'When true, the result additionally carries `markdown`: the result rendered

            server-side, the same document mabl records on the session. Defaults to false. Ask for

            it when you will display the result rather than act on it -- a pull request comment, a

            chat message -- so the rendering and its escaping stay in one place.

            '
        references:
          maxItems: 5
          minItems: 1
          type: array
          description: 'Optional references to the change being analyzed, in the systems that own it — a pull

            request, the commit, the ticket it closes. Supply every one you know: each reference

            is normalized to a canonical key and recorded on the analysis session, so every later

            analysis, deployment and test run stamped with the same reference is groupable without

            anyone re-describing the change.


            Provenance, not an instruction. References are never placed in front of the model and

            do not steer the analysis — put intent in guidance instead. At most five; a sixth, an

            id or url carrying whitespace or `<`, `>`, `"`, `\`, a malformed commit sha, or an id

            that contradicts a parseable url is rejected with a 400 naming the offending entry. A

            backslash is refused because a url parser reads it as a path separator and a person does

            not, so one value would name two hosts.

            '
          items:
            $ref: '#/components/schemas/ChangeReference'
        revision:
          maxLength: 200
          type: string
          description: 'Optional revision the analysis was run against — the same word and meaning as a

            deployment event''s revision, normally a commit sha. Echoed back on the result and

            recorded on the analysis session, where it is the per-commit key that lines an

            analysis up with the deployments and runs of the same commit.


            Recorded verbatim, so like a reference id it is rejected with a 400 when it carries

            whitespace or `<`, `>`, `"`, `\`. A sha-shaped value is lowercased so the two ways of naming

            one commit produce one key; anything else keeps its case.

            '
        mabl_branch:
          maxLength: 200
          type: string
          description: 'Optional mabl branch to analyze. The analysis reads each test at its version on this

            branch, else at its master version, and tests the branch created or edited are

            candidates too. Blank and `master` mean master, which is also the default. `main` means

            master too, unless the workspace has a branch named `main`.


            A name that is not an open branch in this workspace is rejected with a 400, merged and

            snapshot branches included. The analysis never falls back to master on its own; retry

            without the branch if that is what you want.

            '
      description: 'Inputs for the test-impact agent. The caller (typically a coding agent) is expected to

        enumerate every user-facing area a change reaches, in product/user vocabulary — concrete

        UI specifics (button labels, headings, page names) are good probe material and welcome;

        internal-only jargon (class names, file paths) as the sole framing is not, since it has no

        counterpart in the indexed test content.

        '
    JsonToolOutput:
      type: object
      properties:
        type:
          type: string
          enum:
