    TestImpactGapCandidate:
      required:
      - test_invariant_id
      type: object
      properties:
        test_invariant_id:
          type: string
          description: The test's invariant id, accepted by GET /tests/{id}.
        test_name:
          maxLength: 500
          type: string
          description: The test's display name, filled in by mabl rather than by the agent.
        after_step:
          maxLength: 40
          pattern: ^\d+(\.\d+)*$
          type: string
          description: 'The step after which the suggested change would go, in the test''s own step numbering

            as mabl lists it on the branch view the analysis read (mabl_branch, else master):

            "18" is the test''s 18th step, "3.2" the second step inside step 3 (a flow or step

            group). Present only when the analysis read that step in the test''s step list. A dotted step may sit inside a reusable flow, where an edit changes every

            test that runs the flow; rationale says so when that is the case.

            '
        reaches:
          maxLength: 200
          type: string
          description: What the test has done, or where it is in the application, at after_step.
        suggested_change:
          maxLength: 200
          type: string
          description: 'The edit that would cover the gap, e.g. "assert the list issues a single request when

            opened".

            '
        rationale:
          maxLength: 200
          type: string
          description: Why this test is a good place for the change, and any caveat.
      description: An existing test near a coverage gap, and where it could be extended.
    TerminalAgentInstanceStatus:
      type: string
      description: 'Statuses an instance can transition to as it stops doing work. Terminal for the pod (which exits and releases its quota slot); whether the task can continue is tracked separately. ''skipped'' signals that the agent chose not to do work (e.g., a dedupe gate matched) and is distinct from ''terminated'' which signals an interruption. ''needs_attention'' signals the agent paused on a user-input request (execute_ask_for_help) — the pod stops but the session remains continuable.

        '
      enum:
      - completed
      - failed
      - terminated
      - skipped
      - needs_attention
    TestCreationTaskPlan:
      required:
      - screenshots_cited
      - suggested_flow_options
      - suggested_snippet_options
      - suggested_validation
      - task
      type: object
      properties:
        task:
          type: string
          description: A clear description of the task to be performed
        suggested_validation:
          type: string
          description: Description of what to validate when this task is complete
        suggested_flow_options:
          type: array
          description: List of recommended flow options for this task
          items:
            $ref: '#/components/schemas/TestCreationFlowOption'
        suggested_snippet_options:
          type: array
          description: List of recommended code snippet options for this task
          items:
            $ref: '#/components/schemas/TestCreationSnippetOption'
        implementation_notes:
          type: string
          description: Notes about how to create a good task for the plan, including information from relevant screenshots if available
        screenshots_cited:
          type: array
          description: List of screenshots cited in the implementation notes
          items:
            $ref: '#/components/schemas/TestGenerationScreenshotReference'
      description: A single task in a test plan with suggested flows and snippets
    ToolCallPartInputType:
      type: string
      enum:
      - text
      - json
    AgentSessionContextAction:
      type: string
      description: 'What the user did. A closed set, because each member decides what the server does and what it says to the agent — there is no member meaning "something else, here is the text", which is the thing this endpoint exists instead of.

        `test_configuration_edited` is the user changing the configuration the agent saved, and is the one action that asks the agent to do something rather than merely telling it something. The four reference actions each name one thing the user pointed the session at. `file_attached` stores the file where the agent can read it by id. `page_viewed` says which page the user is on, which is the one action describing a state rather than an event: it is re-sent when they navigate, and each one replaces the last.'
      enum:
      - test_configuration_edited
      - test_referenced
      - test_case_referenced
      - xray_test_referenced
      - tracker_issue_referenced
      - file_attached
      - page_viewed
    ChangeReference:
      required:
      - type
      type: object
      properties:
        type:
          type: string
          description: The kind of thing the reference names, which decides how mabl normalizes the id.
          enum:
          - pull_request
          - commit
          - branch
          - issue
          - test_case
          - release
          - custom
        id:
          maxLength: 200
          type: string
          description: 'The identifier in the owning system, e.g. "github.com/mablhq/ui#3341", "9f2c1ab", "MABL-21839". For a pull_request the host is part of the canonical key, so a hostless id such as "mablhq/ui#3341" is a different reference from "github.com/mablhq/ui#3341" and the two never group together; supply the pull request url, either here or in url, and mabl derives the host-qualified form. Required unless url is given and parseable. Whitespace and the characters < > " are rejected, as is a backslash: url parsers read one as a path separator, so a value carrying it names a different thing than it reads as.'
        url:
          maxLength: 512
          type: string
          description: Optional link. Rendered, never parsed for meaning, except to derive the canonical id for a pull_request. When both are given and both name a pull request, they must name the same one. Held to http or https, and rejected for whitespace, < > " or a backslash - a backslash is a path separator to a url parser and an ordinary character to a reader, so one url would name two hosts.
          format: uri
        title:
          maxLength: 256
          type: string
          description: The pull request title. On the test impact reads (queryTestImpactSessions, getTestImpactAnalysis and queryTestImpactReferences), mabl sets it from the source control of a linked deployment event that lists this pull request, and leaves it absent when no such event is known or the reference is not a pull request. On those reads the session's references and each reference row carry this value in place of any title sent on input.
      description: 'A reference to the change an analysis is about, in the system that owns it. Supply every reference you know (a pull request and the ticket it closes, for example): the more references an analysis carries, the more views it appears in. Normalized by mabl before it is stored.'
    AgentSessionReviewOutcome:
      type: string
      description: 'What the user decided about a finished authoring task. `accepted` keeps the authored work; `closed` discards the task. Neither deletes anything on its own; a caller closing a task can additionally ask for its test to be deleted via `delete_test`. Both are terminal session-level statuses — see AgentInstanceStatus, whose values these mirror.

        '
      enum:
      - accepted
      - closed
    ErrorTextToolOutput:
      type: object
      properties:
        type:
          type: string
          enum:
          - error-text
        error_text:
          type: string
          description: Error message as text
    GuardrailApprovalState:
      type: string
      description: Where a guardrail approval stands. PENDING awaits a decision and expires undecided after 24 hours; APPROVED lets the agent repeat the request, as often as it does, for 20 minutes; DENIED refuses the same request for 20 minutes after the decision, after which asking again opens a new approval; CANCELLED means a person withdrew it while pending or revoked it while approved. EXPIRED and CANCELLED are final.
      enum:
      - PENDING
      - APPROVED
      - DENIED
      - EXPIRED
      - CANCELLED
    ToolOutputHarJsonContentItem:
      type: object
      properties:
        type:
          type: string
          enum:
          - har-json
        har:
          type: object
          additionalProperties: true
          description: HAR document (typically includes log.entries)
      description: Inline W3C HAR JSON for rich network waterfall rendering
    TestImpactRunContextRunHistory:
      required:
      - latest_run_time
      - latest_status
      - runs_examined
      type: object
      properties:
        latest_status:
          description: 'Status of the newest run in the sample carrying BOTH a start time and a status this enum names - a status, not a verdict. A newer started run whose status this contract does not name is passed over rather than reported, so this can trail the sample''s true newest start. Read it with latest_run_time: no time window is applied behind the query, so a completed here can be months old.'
          allOf:
          - $ref: '#/components/schemas/TestImpactRunHistoryStatusEnum'
        latest_run_time:
          type: integer
          description: 'Epoch ms when the run described by latest_status started — the newest start time in

            the sample among runs this contract can report, which is not necessarily the newest

            start time in the sample. Always present whenever this object is: with no time window

            on the query behind it, a status without a clock reads as current when it may be

            months stale.

            '
          format: int64
        last_passed_time:
          type: integer
          description: 'Epoch ms of the most recent examined run that passed (status completed). Absent when

            none of the examined runs passed — which is not the same as never having passed, since

            only this sample was read, and some of it may not have started at all.

            '
          format: int64
        median_passed_duration_ms:
          type: integer
          description: 'Median wall-clock length, start to completion, of the examined runs that passed

            (status completed). Failed and terminated runs are left out because they stop early or

            run to a timeout. Absent when no examined run passed with both clocks recorded.

            '
          format: int64
        passed_runs_timed:
          minimum: 1
          type: integer
          description: 'How many passed runs median_passed_duration_ms was taken over. Present exactly when

            that median is.

            '
        runs_examined:
          minimum: 1
          type: integer
          description: 'How many runs the sample holds — the count the endpoint returned for this test. It

            counts every returned run, including ones that had not started and so could not

            contribute a status or a time to the fields above.

            '
      description: 'A sample of this test''s recent runs: the runs_examined most recently RECORDED ones, where

        recorded means when the run row was created — which is not the start clock. The fields below

        describe the newest run by start time WITHIN that sample, so a run recorded earlier but

        started later than every examined run falls outside it. Workspace-wide: the query applies no

        time window and no environment, plan, or branch filter, so the sample is drawn from anywhere

        in the workspace — not necessarily the runs the target you intend to run would produce.

        '
    AgentInstanceStatus:
      type: string
      description: The status of the latest agent instance driving a session. The same enum is used for cloud and local instances. Cloud-only values (`queued`, `terminating`, `rate_limited`, `skipped`) are set by the cloud instance lifecycle (start/terminate/end). Common values (`running`, `needs_attention`, `completed`, `failed`, `terminated`) are written by either cloud or local clients. `merged` is a session-level state applied after a `completed` authoring task's branch is merged into master (via the branch merge endpoint or the session's `auto_merge` setting); the underlying cloud instance stays `completed`. `accepted` and `closed` are session-level review outcomes for a finished authoring task, set only through the review endpoint; the underlying cloud instance keeps its own status. `accepted` records that the user kept the authored test. `closed` records that the user discarded it; the session's test is left in place unless the caller asked for it to be deleted (`delete_test` on the review request), no branch is deleted either way, and the session's conversation is retained so the task can be regenerated from it. Both are terminal in the same sense as `merged` — neither is resumable, and no lifecycle transition leaves them. `resuming` is a transient, server-set-only state on the session (no instance holds it) — the cloud TAA continuation flow flips a resumable session to `resuming` while it plans the answer, then to `queued` when the new instance spawns (or back to a resumable status on re-clarification, or `failed` on error). It is the concurrency guard, so a second answer to a `resuming` session is rejected. The session's `instance_type` field indicates which kind of instance owns the session. Use `none` in query parameters to match sessions without any status.
      enum:
      - queued
      - running
      - needs_attention
      - completed
      - failed
      - terminated
      - terminating
      - rate_limited
      - skipped
      - merged
      - accepted
      - closed
      - resuming
      - none
    AgentSessionContextConfigurationOrigin:
      type: string
      description: Which configuration the user edited, which is the only thing that changes how the edit is put to the agent. `live` is the configuration the conversation is working on. `saved` is a historical snapshot of a configuration the agent already saved, where editing it cannot rewrite anything, so the agent is told to adopt the values rather than that its own working copy moved.
      enum:
      - live
      - saved
