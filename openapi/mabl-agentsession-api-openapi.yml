    AgentSessionContextAttachment:
      required:
      - content
      - filename
      - id
      - mime_type
      type: object
      properties:
        id:
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
          type: string
          description: How the agent will name this attachment. Chosen by the caller so that a retry resolves to the file already stored rather than storing a second copy; re-sending an id that this session already holds returns the stored file and writes nothing.
        filename:
          maxLength: 255
          type: string
          description: What the user calls the file. Shown to the agent and stored as the object's own metadata; nothing is derived from it, and it is not part of where the file lands.
        mime_type:
          maxLength: 255
          type: string
          description: The file's type, which decides both whether it can be attached at all and how large it may be — a text file is read into the conversation whole, while a PDF reaches the model as media at a fixed cost per page.
        content:
          maxLength: 14000000
          type: string
          description: The file itself, base64-encoded. The outer bound here is only what a request body may carry; the ceiling that applies is the one for this file's type, and both it and the per-session totals are enforced on the way in.
      description: 'A file the user attached. The bytes ride inline on this request and are written to the workspace''s storage before anything is persisted on the session, so raw content never reaches the session row — which is rewritten on every turn, and would therefore be paid for on every turn.

        There is deliberately no field for where it is stored. The server mints the location from the session and the id, and the response does not report it: a caller has no way to legitimately know a storage location, so one supplied by a caller would be forged by definition.'
    TestImpactRunContextQuality:
      required:
      - score
      - total_plan_runs
      type: object
      properties:
        score:
          type: integer
          description: 'Composite 0-100 quality score (pass rate, reliability, stability, and transition

            history). A score computed from very few attempt groups is not yet meaningful — read it

            as unknown rather than as a low or high score. total_plan_runs is the count to judge

            that by.

            '
        total_plan_runs:
          type: integer
          description: 'The sample the score was computed from. It counts scenario attempt groups — one per data

            row, per browser, and for mobile per device and OS version, per plan run — not plan

            runs, so a data-driven test running on several browsers contributes many per plan run.

            Read it as the weight behind the score, not as how many times the test ran.

            '
        runs_capped:
          type: boolean
          description: True when metrics were computed over a truncated sample of the window's attempt groups.
        flake_rate:
          type: number
          description: 'Fraction of the examined attempt groups showing intermittent (flaky) behavior — the

            same denominator as total_plan_runs, which is the window''s groups only when runs_capped

            is false. See total_plan_runs for what an attempt group is.

            '
        flaky_plan_runs:
          type: integer
          description: Count of attempt groups classified flaky in the window.
        last_flaky_time:
          type: integer
          description: Epoch ms of the most recent attempt group classified flaky in the window, when any exists.
          format: int64
      description: 'The test''s reliability history over the result''s quality_window, computed server-side by

        the product''s canonical quality formula (the same source as the test-quality report; do

        not re-derive from raw runs). Read score against total_plan_runs: a score over a handful

        of attempt groups is low-information, while a low score at a high count is confident bad

        news. Never quote the score without total_plan_runs.

        Workspace-wide: it covers every run of this test in the window regardless of which

        application recorded it, so a test exercised by more than one application returns one

        blended figure. The request''s application_id does not narrow it.

        '
    ToolOutputFileUrlContentItem:
      type: object
      properties:
        type:
          type: string
          enum:
          - file-url
        file_url:
          type: string
          description: URL of the file
