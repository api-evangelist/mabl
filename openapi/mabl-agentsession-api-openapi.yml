components:
  schemas:
    JsonToolCallPartInput:
      type: object
      properties:
        type:
          type: string
          enum:
          - json
        json:
          type: object
          additionalProperties: true
          description: JSON input
    ThinkingPart:
      type: object
      properties:
        type:
          type: string
          enum:
          - thinking
        thinking:
          type: string
          description: The thinking/reasoning text
        signature:
          type: string
          description: Signature of the thinking/reasoning
    Base64FileSource:
      type: object
      properties:
        source_type:
          type: string
          enum:
          - base64
        data:
          type: string
          description: Base64-encoded file data
      allOf:
      - $ref: '#/components/schemas/BaseFileSource'
    EndAgentCloudInstanceRequest:
      required:
      - status
      type: object
      properties:
        status:
          $ref: '#/components/schemas/TerminalAgentInstanceStatus'
        reason:
          $ref: '#/components/schemas/AgentCloudInstanceTerminationReason'
      description: Request to end a cloud instance with a terminal status
    TestCreationPlanningTestInformation:
      type: object
      properties:
        test_id:
          type: string
          description: The ID of an existing test to edit instead of creating a new one
        test_variant_id:
          type: string
          description: The variant (version) ID of the test being edited. Distinct from `test_id`, which is the invariant test identity — `test_variant_id` pins a specific snapshot. Set when the caller wants the edit applied against a known version (for example, to dedup auto-triggered edits for the same version).
        source_test_id:
          type: string
          description: The invariant ID of an existing test to COPY as the starting point for a brand new test. The source test is only read — it is never modified — and the test that gets created is a new, independent test. Mutually exclusive with `test_id`, which edits an existing test in place rather than copying it. Set this when the user wants to start from an existing test ("make a copy of X and then ...") and leave `test_id` unset.
        name:
          type: string
          description: The name of the test
        description:
          type: string
          description: The description of the test
        application_id:
          type: string
          description: The ID of the application for the test
        environment_id:
          type: string
          description: The ID of the environment for the test
        deployment_id:
          type: string
          description: The ID of the deployment for the test
        test_case:
          type: string
          description: The test case for the test
        url_override:
          type: string
          description: The base URL for the test, if there is no application or if the application's base URL should be overridden for this test
        credentials_id:
          type: string
          description: The ID of the credentials for the test
        http_auth_credentials_id:
          type: string
          description: The ID of the HTTP Basic Auth credentials for the test - passed in the HTTP request, as opposed to the interactive login credentials in credentials_id
        test_type:
          $ref: '#/components/schemas/TestTypeEnum'
        viewport_width:
          type: integer
          description: Browser viewport width in pixels
        viewport_height:
          type: integer
          description: Browser viewport height in pixels
        datatable_id:
          type: string
          description: The ID of the data table for data-driven tests
        scenario_id:
          type: string
          description: The ID of a specific scenario within the data table
        labels:
          type: array
          description: Labels to apply to the test
          items:
            type: string
        branch_id:
          type: string
          description: The ID of the branch to save the test to (the save-to / destination branch)
        source_branch_id:
          type: string
          description: The ID of the branch to load the test, or the flow for a flow authoring edit, from as the starting point for edits. Only meaningful when test_id or flow_id is set (editing an existing test or flow). When unset, the test is loaded from master (it does NOT fall back to branch_id). This is the load-from branch; branch_id remains the save-to (destination) branch.
        plan_id:
          type: string
          description: The ID of the plan to add the test to after creation
        device_preset:
          $ref: '#/components/schemas/DevicePresetTypeEnum'
        device_orientation:
          $ref: '#/components/schemas/DeviceOrientationEnum'
        flow_id:
          type: string
          description: Flow authoring only. The invariant ID of an existing reusable flow to edit instead of creating a new one. A flow authoring session rejects the test-only fields, such as test_id and source_test_id.
        setup_test_id:
          type: string
          description: Flow authoring only. The invariant ID of a test that reaches the flow's start state. On an edit, its steps before its first call to the flow seed the session as setup; on a create, the agent imports its steps up to the start state. Setup steps are never saved. When unset on a flow edit, the server picks a test that uses the flow.
        test_objective:
          $ref: '#/components/schemas/TestObjective'
      description: Test configuration and metadata selected during planning
    CaseLinkIntent:
      required:
      - link
      - platform
      - workspace_integration_id
      type: object
      properties:
        platform:
          $ref: '#/components/schemas/CaseLinkPlatformEnum'
        link:
          type: string
          description: 'The exact value added to the test''s `test_cases`: `C123` for TestRail, `PROJ-T12` for Zephyr, and https://dev.azure.com/{organization}/{project id}/_workitems/edit/{id} for Azure Boards.'
        workspace_integration_id:
          type: string
          description: The integration the case was picked from.
      description: One external test case an authoring session links the test it saves to. Server-resolved at session creation; see `case_links`.
    TestImpactCoverageGap:
      required:
      - area
      - basis
      - candidates
      - recommendation
      type: object
      properties:
        area:
          maxLength: 200
          type: string
          description: Short name of the user-facing area that lacks coverage, e.g. "Issue list loading".
        basis:
          maxLength: 700
          type: string
          description: 'Why the area is considered uncovered: what was searched and what came back, or that

            the analysis ran out of budget before verifying a candidate. May be empty when the

            analysis stated the gap without a separate basis. Short enough that area, the

            separator and basis together fit the 700 characters of a coverage_gaps entry.

            '
        recommendation:
          type: string
          description: 'How the gap could be closed. "extend_existing": a candidate test already reaches the

            right page or state, and what is missing is an assertion or a short branch from

            there. "new_test": no test reaches the page or route, or reaching it needs different

            setup, data, or sign-in. "unclear": the analysis could not tell. "extend_existing"

            always comes with at least one candidate; a "new_test" gap may still list candidates, as

            starting points or references for the new test.

            '
          enum:
          - extend_existing
          - new_test
          - unclear
        candidates:
          maxItems: 3
          type: array
          description: 'The nearest existing tests to the gap, best first. Every id was surfaced by the

            analysis''s own search or test reads in this workspace, and exists on the branch view it

            read. Empty when nothing came close.

            '
          items:
            $ref: '#/components/schemas/TestImpactGapCandidate'
      description: One coverage gap, with the nearest existing tests and how the gap could be closed.
    TestCreationSnippetOption:
      required:
      - preference
      - reasoning
      - snippet_id
      - snippet_name
      type: object
      properties:
        snippet_id:
          type: string
          description: The unique identifier of the code snippet to be used
        snippet_name:
          type: string
          description: The human-readable name of the code snippet
        reasoning:
          type: string
          description: Explanation of why this snippet is recommended for the task
        preference:
          type: string
          description: Whether this is a primary or secondary snippet option
          enum:
          - primary
          - secondary
      description: A recommended code snippet option for a task
    LocalSettableAgentInstanceStatus:
      type: string
      description: AgentInstanceStatus values that local clients (e.g. mabl CLI) can write via updateAgentSession. Subset of AgentInstanceStatus that excludes cloud-orchestration values (`queued`, `terminating`, `rate_limited`, `skipped`) which are managed by the cloud instance lifecycle, not by local clients.
      enum:
      - running
      - needs_attention
      - completed
      - failed
      - terminated
    AgentTriggerState:
      type: string
      enum:
      - armed
      - fired
      - disarmed
    AgentSession:
      required:
      - agent_type
      - created_by_id
      - created_time
      - id
      - is_trial
      - last_updated_by_id
      - last_updated_time
      - messages
      - workspace_id
      type: object
      properties:
        id:
          type: string
          description: The id of the agent session
        notify_trigger_id:
          type: string
          description: The trigger armed on the parent by notify_on_complete. Present only on the response that created this session, never stored.
        workspace_id:
          type: string
          description: The id of the workspace
        created_time:
          type: integer
          description: The timestamp of the agent session creation in epoch milliseconds
          format: int64
        created_by_id:
          type: string
          description: The id of the user who created the agent session
        last_updated_time:
          type: integer
          description: The timestamp of the agent session last update in epoch milliseconds
          format: int64
        last_updated_by_id:
          type: string
          description: The id of the user who last updated the agent session
        agent_type:
          $ref: '#/components/schemas/AgentType'
        is_trial:
          type: boolean
          description: Whether this agent session is associated with a trial account
        parent_session_id:
          type: string
          description: The id of the parent agent session
        root_session_id:
          type: string
          description: The id of the first session in this session's chain, recorded when the session is created; the session's own id when it has no parent
        launch_principal_user_id:
          type: string
          description: Set by the server. The person the session's agent acts for, recorded when the session is created and never changed; wakes act for it
        launch_principal_api_key_id:
          type: string
          description: Set by the server. The API key the session's agent acts for when it was started with a key and no person, recorded when the session is created and never changed
        launch_principal_is_support_admin:
          type: boolean
          description: Set by the server. True when launch_principal_user_id is a support admin who is not a member of the session's workspace
        initiating_request_id:
          type: string
          description: A unique identifier for the request that initiated this agent session. If set, this must be globally unique and requests to create a new agent session with the same initiating_request_id will fail.
        startup_params:
          $ref: '#/components/schemas/AgentSessionStartupParams'
        messages:
          type: array
          description: The messages in the agent session
          items:
            $ref: '#/components/schemas/AgentSessionMessage'
        unread_inbox_messages:
          type: array
          description: 'Messages queued for this agent that it has not consumed yet, oldest first. Returned on a read so a turn learns about them from the fetch it already makes rather than a second call. Reading does not consume them: the cursor advances only when a write names them, so a turn that dies before writing sees the same messages again rather than losing them. Absent when there are none.'
          items:
            $ref: '#/components/schemas/AgentInboxMessage'
        instance_ids:
          type: array
          description: IDs of all cloud instances created for this session (in chronological order). Empty for local-client-driven sessions.
          items:
            type: string
        instance_type:
          $ref: '#/components/schemas/AgentInstanceType'
        latest_instance_status:
          $ref: '#/components/schemas/AgentInstanceStatus'
        latest_termination_reason:
          $ref: '#/components/schemas/AgentCloudInstanceTerminationReason'
        related_artifacts:
          type: array
          description: Artifacts related to this agent session (e.g., generated tests, flows, etc.). Visible to all workspace members via queryAgentSessions — do not store creator-private content here; use `messages` for private content.
          items:
            $ref: '#/components/schemas/Artifact'
          default: []
        agent_variant:
          type: string
          description: 'The authoring-agent arm assigned to this session at creation time (values: `generic` or `flexible`). Records which test-authoring agent variant the runtime should use for the session. Only set for `test_authoring` sessions; unset for other agent types.'
