          description: Number of running instances transitioned to failed
          format: int32
      description: Result of the stuck agent cloud instance reaping cron job
    WorkspaceScopeChangedData:
      type: object
      properties:
        type:
          type: string
          enum:
          - workspace_scope_changed
        previous_scope:
          $ref: '#/components/schemas/WorkspaceResultsScopeSnapshot'
        current_scope:
          $ref: '#/components/schemas/WorkspaceResultsScopeSnapshot'
      description: Marks the point in a workspace results chat where the user changed the dashboard filters. Turns before it answered from `previous_scope`; turns after it answer from `current_scope`. Clients render it as a divider. Both scopes are present whenever `type` is `workspace_scope_changed`; they are not declared required because the generated clients flatten every special data variant into one type.
    TestImpactRunContextDefaults:
      type: object
      properties:
        url_set:
          type: boolean
          description: 'Whether the test records its own default URL. When false, a local CLI run given no

            --url fails immediately asking for one; cloud runs are unaffected whenever a

            deployment or URL override pins the target (the normal CI / ephemeral-preview case).

            '
        environment_id:
          type: string
          description: The environment recorded on the test, when set.
        credentials_id:
          type: string
          description: 'The credentials recorded on the test at authoring time, when set. What a run actually

            uses can differ — plans carry their own credentials; a cloud run given none proceeds

            with a warning, while a local login-dependent run simply fails its login.

            '
        credential_cloud_only:
          type: boolean
          description: 'True when the recorded credential''s secrets are accessible to cloud runs only. That

            blocks LOCAL dispatch with this credential; for a cloud/CI run it is the credential''s

            normal case, not a blocker. Present only when credentials_id is set and the credential

            was resolvable.

            '
        datatable_ids:
          type: array
          description: 'DataTables satisfying the test''s parameter requirements. Non-empty means the test is

            data-driven: an ad-hoc run exercises one scenario — narrower coverage than its plan

            runs.

            '
          items:
            type: string
      description: 'Configuration recorded on the test itself at authoring time — what a bare run would

        resolve, not necessarily what the test''s plans use at run time.

        '
    TextPart:
      type: object
      properties:
        type:
          type: string
          enum:
          - text
        text:
          type: string
          description: Text content
        signature:
          type: string
          description: Thought signature from the model (used by Gemini 3 for text parts with thinking)
        user_prompted:
          type: boolean
          description: True when this text part originated from a user-initiated prompt (user-typed input, a selected suggested prompt, or an auto-sent prompt on the user's behalf). This is content that will be displayed in the UI in a chat bubble with the user profile picture.
    AgentTriggerEventName:
      type: string
      description: What happened to the entity. completed applies to plan_run, test_run and failure_analysis; ended, awaiting_input and finalized apply to agent_session. Other pairs are refused.
      enum:
      - completed
      - ended
      - awaiting_input
      - finalized
    BaseToolOutputDataContentItem:
      type: object
      properties:
        media_type:
          type: string
          description: IANA media type
    FileAssertionSessionStartupParams:
      type: object
      properties:
        test_run_id:
          type: string
          description: The ID of the test run this file assertion evaluation belongs to.
    ExploratoryQaSessionStartupParams:
      type: object
      properties:
        impact_session_id:
          type: string
          description: (Optional) The test impact analysis session whose change this session explores
        application_id:
          type: string
          description: The ID of the application being tested
        environment_id:
          type: string
          description: The ID of the environment being tested
        url:
          type: string
          description: The URL to start testing from
        credentials_id:
          type: string
          description: (Optional) The credentials the session signs in to the app with
        initiating_user_id:
          type: string
          description: The id of the user who started the session
        initiating_auth_type:
          $ref: '#/components/schemas/TestImpactInitiatingAuthType'
      description: 'Context for an exploratory QA session: the finished test impact analysis session it explores the change of, when it started from one, and where to run the app. application_id and url are required.'
    BaseArtifact:
      required:
      - artifact_type
      type: object
      properties:
        artifact_type:
          type: string
          description: The type of artifact
          enum:
          - inline
          - remote
    UpsertAgentSessionArtifactsRequest:
      required:
      - related_artifacts
      type: object
      properties:
        related_artifacts:
          maxItems: 100
          minItems: 1
          type: array
          description: 'The artifacts to attach. MERGED into the session''s existing artifacts: inline artifacts dedupe by `name`, remote artifacts by `entity_kind` + `entity_id`, and the ones in this request win on a collision, so re-sending one is idempotent and nothing already on the session is dropped.'
          items:
            $ref: '#/components/schemas/Artifact'
      description: Request to attach artifacts to an agent session without writing a message. Object-wrapped rather than a bare array because Swagger Inflector cannot bind a top-level array of a polymorphic schema to its generated model and degrades it to raw JSON nodes.
    AgentSessionMessage:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/MessageRole'
      anyOf:
      - $ref: '#/components/schemas/ModelMessage'
      - $ref: '#/components/schemas/UserMessage'
      - $ref: '#/components/schemas/ToolOutputMessage'
      - $ref: '#/components/schemas/SpecialMessage'
    AgentCloudInstanceStarted:
      type: object
      properties:
        event_type:
          type: string
          enum:
          - started
        triggered_by_message_id:
          type: string
          description: The message ID that triggered this instance to start
        agent_type:
          type: string
          description: The type of agent being run on the cloud instance
        machine_config:
          type: object
          additionalProperties: true
          description: Configuration details for the cloud machine
      allOf:
      - $ref: '#/components/schemas/BaseAgentCloudInstanceLifecycleEvent'
    ReviewAgentSessionRequest:
      required:
      - outcome
      type: object
      properties:
        outcome:
          description: The decision to record. The session ends in the matching status.
          allOf:
          - $ref: '#/components/schemas/AgentSessionReviewOutcome'
        delete_test:
          type: boolean
          description: '(Optional) Delete the test this session saved, as part of closing it. Valid only with the `closed` outcome; sending it with `accepted` is a 400. The caller must hold write access to journeys in the session''s workspace, the same permission deleting the test directly would need. The test is identified from the session (`startup_params.test_id`, else its one remote `Test` artifact) rather than named by the caller, and only a test the session itself authored is deletable — established from `authoring_mode` and from the test having been created after the session began, either of which refusing on its own. A session with no saved test, several with nothing to single one out, or one it did not author, and a test that cannot be deleted, are each a 409 with nothing closed — as is the session itself changing between the target being resolved and the close. The TEST is deliberately not version-pinned: a concurrent edit to it does not block the deletion, which removes the test rather than a particular version of it. Nothing else is deleted — flows cascade as they do for any test deletion, and the branch is untouched.'
          default: false
      description: Request to record a review outcome on a finished authoring session
    TextToolCallPartInput:
      type: object
      properties:
        type:
          type: string
          enum:
          - text
        text:
          type: string
          description: Text input
    TestObjective:
      type: object
      properties:
        summary:
          type: string
          description: A natural language summary of what this test version does. Omitting it on a save keeps the stored one; sending it empty removes the objective outright, since source, state, and gap all describe a summary.
        source:
          $ref: '#/components/schemas/TestObjectiveSource'
        state:
          $ref: '#/components/schemas/TestObjectiveState'
        gap:
          type: string
          description: 'When state is drifted or accepted_gap, how the steps of this version fall short of the summary. Retained after the user accepts the gap so the accepted difference stays readable. Unindexed: free prose nothing queries, and long enough to exceed Datastore''s 1500-byte ceiling on an indexed string.'
          x-dao-unindexed: true
      description: 'What this test version is trying to accomplish, in natural language. Version-scoped, so each version records the objective it was authored against rather than sharing one across the whole test''s history. Saved through test_objective: a full save may set it alongside steps as one version, and omitting it keeps the stored one. A field_mask=test_objective write may only record state and gap; changing summary or source that way is refused, so use a full save.'
    FilePart:
      type: object
      properties:
        type:
          type: string
          enum:
          - file
        source:
          $ref: '#/components/schemas/FileSource'
        title:
          type: string
          description: Optional file title/name
        display_name:
          type: string
          description: Optional display name
    TestAuthoringSessionStartupParams:
      type: object
      properties:
        test_run_id:
          type: string
          description: The ID of the test run this session is scoped to
        agent_state:
          $ref: '#/components/schemas/NextStepGenerationState'
        application_id:
          type: string
          description: The ID of the application being tested
        environment_id:
          type: string
          description: The ID of the environment being tested
        url:
          type: string
          description: The URL to start testing from
        agent_session_source:
          $ref: '#/components/schemas/AgentSessionSourceEnum'
        authoring_mode:
          description: (Optional) Whether the session authored a new test or started from one that already existed. Derived server-side at session creation from every representation an edit can arrive in (`test_information.test_id`, `test_variant_id`, `agent_state.testInformation.test_id`) and never rewritten, so it records what the session was rather than what its mutable fields say later — `test_id` in particular is rolled forward onto creations at each save. A value supplied by the caller is ignored. Absent on sessions created before it existed, where consumers fall back to inspecting those same fields.
          allOf:
          - $ref: '#/components/schemas/AuthoringMode'
        xray_binding_issue_id:
          type: string
          description: (Optional) The Jira issue id of the Xray test case this session binds the test it saves to. Resolved server-side at session creation from the references the planning session copied onto this one, and only when the creating caller was authorized to create TCM bindings in this workspace — the binding is provenance the user delegated at creation, so it is frozen here rather than re-read later from a manifest any holder of session write can restate. Never rewritten afterwards, and a value supplied by the caller is ignored. Absent when the caller was unauthorized, when the session references no Xray case or more than one, or when the integration does not belong to this workspace. Meaningless without `xray_binding_integration_id`, which names the Jira site that resolves it.
        xray_binding_integration_id:
          type: string
          description: (Optional) The Xray workspace integration naming the Jira site that resolves `xray_binding_issue_id`. Resolved server-side at session creation under the same conditions as that field and checked then to belong to this session's workspace; never rewritten, and a value supplied by the caller is ignored. Set and cleared only together with `xray_binding_issue_id`.
        case_links:
          type: array
          description: '(Optional) The external test cases this session links the test it saves to, by adding each `link` to that test''s `test_cases`. Resolved server-side at session creation from the references the planning session copied onto this one: at most one per platform, and only when the session references exactly one item of that platform, the creating caller was authorized to edit tests in this workspace, its account has that platform''s integration enabled, and the integration is an enabled one of this workspace configured for the case (for Zephyr, its project; for Azure Boards, its organization and project). Never rewritten afterwards, and a value supplied by the caller is ignored. An Azure Boards work item is included only when the tracker reports its category as test case, checked once at creation. Each link''s integration and configuration are re-checked when it is written; its category is not.'
          items:
            $ref: '#/components/schemas/CaseLinkIntent'
        zephyr_link_case_key:
          type: string
          description: DEPRECATED, superseded by `case_links`, and no longer written. On a session created before `case_links` existed, the Zephyr test case key (for example `PROJ-T12`) this session links the test it saves to; still honored when `case_links` is absent. A value supplied by the caller is ignored.
          deprecated: true
        zephyr_link_integration_id:
          type: string
          description: DEPRECATED, superseded by `case_links`, and no longer written. The Zephyr workspace integration the case named by `zephyr_link_case_key` was picked from. A value supplied by the caller is ignored.
          deprecated: true
        test_variant_id:
          type: string
          description: The variant (version) ID of the test being edited, when this session is an edit of a specific known version. Set in conjunction with `test_information.test_id`.
        resume_cursor:
          type: string
          description: Optional 1-based-inclusive index of the last saved step the next instance replays before continuing the LLM loop (e.g. "5" replays steps 1–5; absent or "0" replays nothing). Set by the resume planner on continue via `PATCH /agentSession/{id}/startupParams`; not used at session creation.
        test_id:
          type: string
          description: The invariant id of the test this authoring session operates on. Set at session creation for edits (mirrored from `test_information.test_id`) and rolled forward by the cloud TAA continuation flow at each save/pause via `PATCH /agentSession/{id}/startupParams`, so a resuming instance continues the same test rather than authoring a new one.
        branch_id:
          type: string
          description: '(Optional) The id of the save-to branch — every test and flow version the agent writes lands on it, leaving master untouched. Set once at session creation and mirrored from `test_information.branch_id`; a supplied name is canonicalized to the id, which must resolve inside the session''s workspace. An edit session (`test_id` set) that omits it gets a server-created feature branch unless the workspace sets `require_agent_edits_on_branches: false`; creation sessions author on master. Absent on local sessions, which carry the value on `test_information`. A resume reuses it. The branch outlives the session and is closed only by a merge into master (via the branch merge endpoint or `auto_merge`), which is also what flips the session to `merged`.'
        source_branch_id:
          type: string
          description: (Optional) The id of the load-from branch — the branch the agent reads the starting test version from. Mirrored from `test_information.source_branch_id` at session creation. The agent never saves to it (it saves to `branch_id`); when unset, the version loads from master (it does NOT fall back to `branch_id`). Only meaningful for edit sessions.
        base_version:
          type: integer
          description: (Optional) The immutable source-branch version number the edit LOADED FROM — the variant of the `source_branch_id` branch (or master, when unset) at the moment the runtime fetched the starting test. Written once by the runtime at initial load and never rolled forward, so it pins the "Review changes" diff baseline to the version actually edited rather than the source branch's current tip (which can advance while the edit is in flight). Only meaningful for edit sessions; absent on older sessions, where consumers fall back to the source branch's current version tag.
          format: int64
        auto_merge:
          type: boolean
          description: When true, the session's `branch_id` is merged into master on a successful session completion (provided the branch still resolves to this workspace and has new versions). Defaults to absent/false — the branch is left open for human review.
        repair_notes_session_id:
          type: string
          description: The runtime repair notes session whose finding seeded this edit
        impact_session_id:
          type: string
          description: '(Optional) The test impact analysis session this session answers — the reverse half of the link whose forward half is a remote artifact of kind `AgentSession` on that impact session. Like every other startup_params field it is only as trustworthy as the credential that wrote the session. On an authoring session it is provenance only: nothing is granted by it and nothing dereferences it. The initiate endpoint (`initiateTestAuthoringSession`) checks that it exists, is in the same workspace and is a `test_impact` session; this generic create path does not, so a session written directly here can carry an unchecked value. An `exploratory_qa` session that started from an analysis explores that session''s change; its initiate endpoint (`initiateExploratoryQaSession`) runs the same checks and also requires the analysis to have finished. Deliberately NOT `parent_session_id`, which on this path means the planning session whose artifacts are copied into this one.'
    AgentSessionContextTrackerPlatform:
      type: string
      description: Which tracker a `tracker_issue_referenced` issue lives in.
      enum:
      - azure_boards
      - jira
    AgentTriggerQueryResult:
      required:
      - triggers
      type: object
      properties:
        triggers:
          type: array
          items:
            $ref: '#/components/schemas/AgentTrigger'
        cursor:
          type: string
          description: Pass as cursor to read the next page. Absent on the last page.
    CodeExecutionResultPart:
      type: object
      properties:
        type:
          type: string
          enum:
          - code_execution_result
        outcome:
          type: string
          description: Outcome identifier from Gemini's Outcome enum (OUTCOME_OK, OUTCOME_FAILED, OUTCOME_DEADLINE_EXCEEDED, or OUTCOME_UNSPECIFIED).
        output_text:
          type: string
          description: Combined stdout and stderr captured from the sandbox. Named `output_text` (not `output`) to avoid colliding with ToolOutputMessagePart.output in the flattened MessagePart interface — see the comment on this schema.
      description: The result of the sandbox executing the immediately preceding CodeExecutionCallPart. Bundled with the call on the same model turn; there is no separate tool-output round-trip.
    ContentToolOutput:
      type: object
      properties:
        type:
          type: string
          enum:
          - content
        content:
          type: array
          description: Array of content items
          items:
            $ref: '#/components/schemas/ToolOutputContentItem'
    TestImpactInitiatingAuthType:
      type: string
      description: 'The authentication mode of the caller that initiated a test impact analysis. `api_key` callers carry no user identity, so initiating_user_id is expected to be absent for them.

        '
      enum:
      - user
      - api_key
    ToolOutput:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ToolOutputType'
      anyOf:
      - $ref: '#/components/schemas/TextToolOutput'
      - $ref: '#/components/schemas/JsonToolOutput'
      - $ref: '#/components/schemas/ExecutionDeniedToolOutput'
      - $ref: '#/components/schemas/ErrorTextToolOutput'
      - $ref: '#/components/schemas/ErrorJsonToolOutput'
      - $ref: '#/components/schemas/ContentToolOutput'
      - $ref: '#/components/schemas/ErrorContentToolOutput'
    AgentCloudInstanceStopped:
      type: object
      properties:
        event_type:
          type: string
          enum:
          - stopped
        cause:
          type: string
          description: Reason for stopping (e.g., "completed", "failed", "timeout", "cancelled")
        reason:
          $ref: '#/components/schemas/AgentCloudInstanceTerminationReason'
      allOf:
      - $ref: '#/components/schemas/BaseAgentCloudInstanceLifecycleEvent'
    AgentCloudInstanceTerminationReason:
      type: string
      description: The reason for terminating a cloud instance. 'infra_shutdown' covers any shutdown signal from the runtime environment (K8s pod eviction, Cloud Run instance cycling, etc.) — kept generic so it applies regardless of where the agent runs. 'dispatch_failed' means the instance never started — its start message failed to publish, or expired in the queue before any runner claimed it. 'agent_stalled' means the agent was still alive but stopped making progress, so a watchdog hard-killed it. 'agent_error' means the agent threw or exited unexpectedly while its work was still in flight.
      enum:
      - execution_timeout
      - stop_requested
      - infra_shutdown
      - dispatch_failed
      - agent_stalled
      - agent_error
      - unknown
    CreateAgentTriggerRequest:
      type: object
      properties:
        entity_type:
          $ref: '#/components/schemas/AgentTriggerEntityType'
        entity_id:
          maxLength: 256
          type: string
        event:
          $ref: '#/components/schemas/AgentTriggerEventName'
        ttl_seconds:
          maximum: 86400
          minimum: 60
          type: integer
          description: How long the trigger stays armed. Defaults to two hours.
          format: int32
        fire_after_seconds:
          maximum: 86400
          minimum: 1
          type: integer
          description: Seconds from now until a timer fires, or until an event trigger's fallback fires. Not yet supported; setting it is refused with a 400.
          format: int32
        interval_seconds:
          maximum: 86400
          minimum: 60
          type: integer
          description: Makes a timer repeat at this period until it expires. Not yet supported; setting it is refused with a 400.
          format: int32
        idempotency_key:
          maxLength: 256
          type: string
          description: Makes a retry safe. The same key on the same session returns the trigger stored the first time.
      description: 'An event trigger names entity_type, entity_id and event; a timer names fire_after_seconds or interval_seconds and no entity. An event trigger may add fire_after_seconds as a fallback, so it fires at that time if the event never arrives. Timers and fallbacks are not yet supported: a request setting fire_after_seconds or interval_seconds is refused with a 400.'
    TestImpactResult:
      required:
      - application_id
      - coverage_gaps
      - more_may_exist
      - policy
      - quality_window
      - run_context_incomplete
      - summary
      - tests
      - workspace_id
      type: object
      properties:
        tests:
          maxItems: 50
          type: array
          description: 'The tests relevant to the change, ordered direct and fails_by_design first, then

            blast_radius, then adjacent. Sized to match the request''s guidance (small or large)

            rather than a fixed target, under this hard ceiling. Follow-up calls (e.g. narrowed

            guidance or a refined change_description) are expected if this set doesn''t fully

            answer your need.

            '
          items:
            $ref: '#/components/schemas/TestImpactMatch'
        policy:
          type: string
          description: 'The inclusion policy the agent applied, chosen from the request''s guidance (or

            "default" with none given). "broad": also returns adjacent tests and reaches further

            into shared-component consumers. "default": returns every direct and fails_by_design

            test plus every named-mechanism blast_radius test, and adjacent tests only for an

            area that has no other coverage. "precise": direct and fails_by_design tests only.

            Explains why the returned set is sized the way it is.

            '
          enum:
          - broad
          - default
          - precise
        summary:
          type: string
          description: 'Free-text overview of the analysis: what was searched, how the returned set was

            prioritized, and anything the caller should know before acting on it.

            '
        coverage_gaps:
          maxItems: 15
          type: array
          description: 'Explicit statements naming a queried user-facing area for which no source (text

            search, semantic search, or the Knowledge Graph) turned up credible test coverage.

            Each entry is self-contained: it names the area and then states the basis in plain

            terms, one or two sentences, so a reader knows what was searched and why nothing

            covers it — including when the agent ran out of budget before verifying a candidate

            rather than having ruled the area out. Empty when every queried area had credible

            coverage. Absence of coverage here is not proof the area is untested — mabl''s indexes

            may simply not model it yet — so treat it as inconclusive, not a confirmed gap.


            Capped at 15 entries; the agent is held to that limit while composing its answer and

            the server re-checks as a backstop. A list of exactly 15 may mean it had more to say.

            '
          items:
            maxLength: 700
            type: string
        coverage_gap_details:
          maxItems: 15
          type: array
          description: 'The same gaps as coverage_gaps, in the same order and one-for-one, each broken into

            its area, its basis, a recommendation, and the nearest existing tests. Entry N here

            describes entry N of coverage_gaps, whose text is this entry''s area and basis joined

            by " — ".


            Advisory, like coverage_gaps: the recommendation and the suggested edits are the

            agent''s judgment from the steps it read, not a verified plan. Omitted by analyses

            recorded before this field existed.

            '
          items:
            $ref: '#/components/schemas/TestImpactCoverageGap'
        more_may_exist:
          type: boolean
          description: 'True when the returned set was bound by the ~50 result ceiling rather than by there

            being nothing else relevant — i.e. more relevant tests likely exist beyond what was

            returned. A capped return is never exhaustive; when true, more_may_exist_note explains

            how to narrow the request (e.g. by user-facing area) to see more.

            '
        more_may_exist_note:
          type: string
          description: Present when more_may_exist is true; explains how to narrow a follow-up call.
        quality_window:
          $ref: '#/components/schemas/TestImpactQualityWindow'
        run_context_incomplete:
          type: boolean
          description: 'True when some part of the per-test run_context enrichment could not be completed —

            a lookup failed or the enrichment time budget was hit. Fields that were resolved are

            present and trustworthy; each affected test names what is missing in its

            run_context.incomplete_reasons. Treat a missing field as unknown, never as "fine".

            '
        workspace_id:
          type: string
          description: 'The workspace the analysis ran in: the workspaceId the request supplied, validated to

            own the application before the analysis started. The returned tests belong to it.

            '
        application_id:
          type: string
          description: 'The application the analysis was scoped to: the application_id the request supplied,

            trimmed and validated to exist in workspace_id before the analysis started.

            '
        markdown:
          type: string
          description: 'The result as a Markdown document, present only when the request set

            `include_markdown`. The same document mabl records on the session, so the two cannot

            disagree, and it never names a test absent from `tests` and `coverage_gap_details`.


            Its structure is safe to trust: nothing the analysis wrote can open a heading, a

            bullet or a code fence, and ids, link labels and revisions are escaped for the slot they

            sit in. Inline Markdown is not escaped -- a link, an image or raw HTML inside a summary

            or a test''s context survives as written -- so escape it yourself where that matters.

            '
        session_id:
          type: string
          description: 'The id of the agent session that recorded this analysis. Omitted when the session could

            not be opened, in which case the analysis still ran and no trace exists.

            '
        references:
          maxItems: 5
          type: array
          description: 'The references the request supplied, normalized to their canonical form and echoed

            back. Omitted when the request carried none. Present so a caller that fans this result

            out to runs, deployments or follow-up sessions stamps them all with the same values

            mabl stored, rather than with its own spelling of them.

            '
          items:
            $ref: '#/components/schemas/ChangeReference'
        revision:
          type: string
          description: The revision the request supplied, echoed back. Omitted when the request carried none.
        mabl_branch:
          type: string
          description: The mabl branch the analysis read tests on. Omitted when it read master.
    ExecutionMetrics:
      type: object
      properties:
        total:
          type: integer
          description: The total number of executions
          format: int64
          readOnly: true
          x-mabl-scope: public
        passed:
          type: integer
          description: The number of executions that passed
          format: int64
          readOnly: true
          x-mabl-scope: public
        failed:
          type: integer
          description: The number of executions that failed
          format: int64
          readOnly: true
          x-mabl-scope: public
        running:
          type: integer
          description: The number of executions that are still running
          format: int64
          readOnly: true
          x-mabl-scope: public
        skipped:
          type: integer
          description: The number of executions that were skipped
          format: int64
          readOnly: true
          x-mabl-scope: public
        terminated:
          type: integer
          description: The total number of executions that were terminated before completion
          format: int64
          readOnly: true
          x-mabl-scope: public
    AgentTriggerDisarmReason:
      type: string
      enum:
      - cancelled
      - session_terminal
      - session_removed
    ToolOutputType:
      type: string
      enum:
      - text
      - json
      - execution-denied
      - error-text
      - error-json
      - content
      - error-content
  responses:
    ErrorResponse403:
      description: User not authorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse409:
      description: Conflicts with the current state of the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse401:
      description: User not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse404:
      description: Entity not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse400:
      description: Invalid or missing parameter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse:
      description: Unknown error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
  securitySchemes:
    basicAuth:
      type: http
