          description: Optional. A mabl API deploy-preview tag (e.g. `dp-my-branch`) that routes the launched cloud agent's own API calls through `https://<tag>.api-preview.mabl.com` instead of the standard API. Used to exercise API changes end-to-end within an authoring session. Non-prod, cloud-mode only. Leave unset to use the standard API.
