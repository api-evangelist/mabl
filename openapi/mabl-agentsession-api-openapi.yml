openapi: 3.2.0
info:
  title: mabl Agent Session API
  description: APIs for interacting with mabl services
  version: 0.599.3.1792436330
  x-readme-id: 62c896636916ce01d2ff4f5a
servers:
- url: /
security:
- basicAuth: []
- bearerAuth: []
tags:
- name: AgentSession
paths:
  /agentSession/{id}/triggers:
    get:
      tags:
      - AgentSession
      summary: List a session's triggers
      description: The triggers registered on this session, oldest first.
      operationId: queryAgentTriggers
      parameters:
      - name: id
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: state
        in: query
        description: Only triggers in this state.
        required: false
        style: form
        explode: true
        schema:
          $ref: '#/components/schemas/AgentTriggerState'
      - name: limit
        in: query
        description: The maximum number of triggers to return.
        required: false
        style: form
        explode: true
        schema:
          maximum: 200
          minimum: 1
          type: integer
          format: int32
      - name: cursor
        in: query
        description: The cursor returned by the previous page.
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: A page of triggers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTriggerQueryResult'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::AgentSession
    post:
      tags:
      - AgentSession
      summary: Arm a trigger that wakes an agent
      description: 'Arms a one-shot trigger on this session. An event trigger fires when the named entity reaches the named event; a timer trigger, not yet supported, would fire at a time or on an interval until it expires. Firing queues a message in the session''s inbox and starts the agent if nothing is running. A session run locally is refused, and so is watching one, since neither a wake nor its lifecycle events reach it.

        A trigger registered for something that has already happened fires immediately, so a caller never has to check first. Sending the same idempotency_key to the same session again returns the trigger stored the first time.'
      operationId: createAgentTrigger
      parameters:
      - name: id
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentTriggerRequest'
        required: true
      responses:
        '201':
          description: The armed trigger.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTrigger'
        '200':
          description: The trigger stored earlier under the same idempotency_key; nothing new was armed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTrigger'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
        '409':
          $ref: '#/components/responses/ErrorResponse409'
        '429':
          description: The session, the workspace or the watched entity already holds the most armed triggers allowed; nothing was armed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Run::AgentSession
  /agentSession/{id}/triggers/{trigger_id}:
    delete:
      tags:
      - AgentSession
      summary: Cancel a trigger
      description: 'Disarms a trigger so it never fires. Idempotent: a trigger that already fired, was already disarmed, or does not exist answers the same way.'
      operationId: removeAgentTrigger
      parameters:
      - name: id
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: trigger_id
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '204':
          description: The trigger is not armed.
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Delete::AgentSession
  /agentSession/{id}/context/actions:
    post:
      tags:
      - AgentSession
      summary: Record something the user did, for the agent running this session
      description: 'Tells the agent running this session that the user did something in a client — edited the test configuration it saved, pointed the session at a test, a test case or a tracker issue, or attached a file — and does the server-side work that makes it true.

        Separate from the inbox because the inbox is a caller speaking. The sender recorded there is derived from the authenticated caller precisely so a caller cannot claim a person typed something, which leaves a client with no way to report a user action except to write prose and send it as the user''s own words. These actions are mabl speaking: the caller names an action and its metadata, the server composes the text and queues it as `system`, so what the model reads is versioned with the API rather than assembled in each client.

        The server also does the work the action implies, and records none of it on the session. An agent session''s artifacts belong to the turn that is running — a turn writes its whole merged set, built from what it loaded, and artifacts merge by name — so anything written into them from outside is replaced by that turn''s stale copy. Nothing here writes one.

        An attachment''s bytes go to the workspace''s own storage, under a path derived from the session and the id and recorded nowhere. The agent finds the file by the id this message gives it, so a caller never supplies and never learns a location: one it supplied would be forged by definition, and there is no string that would resolve anywhere else.

        A reference is announced and validated, not stored. Reading one back still takes the reference list a planning client maintains; an agent keeping its own note of what it was told is a separate change.'
      operationId: recordAgentSessionContextAction
      parameters:
      - name: id
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordAgentSessionContextActionRequest'
        required: true
      responses:
        '200':
          description: The queued message, plus the identifier the agent will know the referenced or attached thing by. On a repeat of an idempotency key this is the message stored the first time, and nothing new was queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSessionContextActionResult'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Run::AgentSession
  /agentSession/{id}/inbox/messages:
    post:
      tags:
      - AgentSession
      summary: Send a message to an agent
      description: 'Queues a message for the agent running this session. The agent reads it when it next runs — this does not start one, so a message to a session with nothing running waits rather than waking it.

        Who may send is decided by the session''s agent type, not by the caller''s say-so, and the sender recorded is the authenticated caller rather than anything the body claims. The session''s inbox is created by the first message sent to it, so there is nothing to set up.'
      operationId: sendAgentInboxMessage
      parameters:
      - name: id
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendAgentInboxMessageRequest'
        required: true
      responses:
        '200':
          description: The queued message. On a repeat of an idempotency key this is the message stored the first time, and nothing new was queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentInboxMessage'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Run::AgentSession
  /agentSession:
    get:
      tags:
      - AgentSession
      summary: Query agent sessions
      description: Query agent sessions with optional filters
      operationId: queryAgentSessions
      parameters:
      - name: workspace_id
        in: query
        description: The ID of the workspace to query sessions for
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: agent_type
        in: query
        description: Filter by agent type (deprecated, use agent_types instead)
        required: false
        deprecated: true
        style: form
        explode: true
        schema:
          $ref: '#/components/schemas/AgentType'
      - name: agent_types
        in: query
        description: Filter by multiple agent types. If both agent_type and agent_types are null, defaults to the public agent types the workspace is entitled to see (test_recovery if Test Recovery Agent mode is on, runtime_recovery_summary_agent if the workspace can also start recovery work, test_authoring and repair_notes if generative AI is enabled for the workspace), plus test_impact when reference is given.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            $ref: '#/components/schemas/AgentType'
      - name: latest_instance_status
        in: query
        description: Filter by latest instance status. Include 'none' to match sessions without any cloud instance.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            $ref: '#/components/schemas/AgentInstanceStatus'
      - name: created_by_id
        in: query
        description: Filter by the user who created the agent session
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: test_variant_id
        in: query
        description: Deprecated; use test_id, which accepts the same full variant id for an exact-version match. Filters by the exact test variant ID stored on the session's startup_params (test authoring sessions only).
        required: false
        deprecated: true
        style: form
        explode: true
        schema:
          type: string
      - name: test_id
        in: query
        description: Filter test authoring sessions by test id. A bare invariant id (e.g. "abc123") matches sessions for any version of the test; a full variant id including the version (e.g. "abc123:2") matches only that version. Matches against startup_params.test_variant_id, which is stored as "<invariant_id>:<version>". Combine with other filters (AND semantics).
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: branch_id
        in: query
        description: Filter test authoring sessions by the mabl branch they operate on, matching startup_params.branch_id exactly. The branch a session edits on is recorded at session creation, so this returns only the sessions that authored changes on that branch (not every session for the branch's tests). Combine with other filters (AND semantics).
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: agent_session_source
        in: query
        description: Filter by the source attribution stored on the session's startup_params. Use this together with test_variant_id to dedup auto-triggered edit sessions.
        required: false
        style: form
        explode: true
        schema:
          $ref: '#/components/schemas/AgentSessionSourceEnum'
      - name: limit
        in: query
        description: The limit to use for pagination
        required: false
        style: form
        explode: true
        schema:
          minimum: 1
          type: integer
          format: int32
      - name: cursor
        in: query
        description: The cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: test_run_id
        in: query
        description: Filter by the test run recorded on the session's startup_params, matching startup_params.test_run_id exactly. Requires agent_types (or the deprecated agent_type); a run lookup with no type filter is rejected with a 400. More than one agent type records a test_run_id, so without a type filter the lookup returns every kind of session attached to that run — the type filter is what scopes it to one agent, and it is also what keeps the lookup cheap. Combine with other filters (AND semantics).
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: agent_variant
        in: query
        description: Filter by the authoring-agent arm stamped on the session at creation, matching `agent_variant` exactly. Only `test_authoring` sessions carry a variant, so any other agent type is excluded by this filter. Combine with other filters (AND semantics).
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: reference
        in: query
        description: Filter to sessions carrying this normalized change reference key, e.g. `pull_request:github.com/mablhq/ui#3341`. Exact match. Only `test_impact` sessions record references. A query with this parameter may return `test_impact` sessions, by default or when named in `agent_types`; without it they are never listed. Combine with other filters (AND semantics). Results are newest first.
        required: false
        style: form
        explode: true
        schema:
          maxLength: 240
          type: string
      responses:
        '200':
          description: Query results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSessionQueryResult'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::AgentSession
    post:
      tags:
      - AgentSession
      summary: Create a new agent session
      description: Creates a new agent session
      operationId: createAgentSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentSessionRequest'
        required: true
      responses:
        '201':
          description: The created agent session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSession'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Run::AgentSession
  /testImpact:
    get:
      tags:
      - AgentSession
      summary: Query test impact analysis sessions
      description: Lists a workspace's test impact analysis sessions, newest first, with the change references each was requested for and the outcome of the test runs it triggered. Sessions are listed whether or not they carry a change reference. Empty when generative AI is not enabled for the workspace.
      operationId: queryTestImpactSessions
      parameters:
      - name: workspace_id
        in: query
        description: The ID of the workspace to list analyses for
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: application_id
        in: query
        description: Filter to analyses scoped to this application
        required: false
        style: form
        explode: true
        schema:
          maxLength: 64
          type: string
      - name: reference_type
        in: query
        description: Filter to analyses carrying at least one change reference of this type, one of the ChangeReference type values, e.g. `pull_request`.
        required: false
        style: form
        explode: true
        schema:
          maxLength: 64
          type: string
      - name: reference
        in: query
        description: Filter to analyses carrying this normalized change reference key, e.g. `pull_request:github.com/mablhq/ui#3341`. Exact match.
        required: false
        style: form
        explode: true
        schema:
          maxLength: 240
          type: string
      - name: limit
        in: query
        description: The limit to use for pagination
        required: false
        style: form
        explode: true
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
      - name: cursor
        in: query
        description: The cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Query results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestImpactSessionQueryResult'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::TestImpactAnalysis
  /testImpact/references:
    get:
      tags:
      - AgentSession
      summary: Query change references with their newest test impact analysis
      description: Lists a workspace's change references of one type that a live test impact analysis names, one row per reference with its newest such analysis, newest first. A page may hold fewer items than limit, or none, and still return a cursor; the list ends only when cursor is absent. Each page continues after the last row of the previous one, so a reference analyzed again while you page moves to the head and shows on a fresh first page, and a reference whose listed analysis is deleted may appear again further down with an older one. Empty when generative AI is not enabled for the workspace.
      operationId: queryTestImpactReferences
      parameters:
      - name: workspace_id
        in: query
        description: The ID of the workspace to list references for
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: reference_type
        in: query
        description: The kind of change reference to list, one of the ChangeReference type values, e.g. `pull_request`.
        required: true
        style: form
        explode: true
        schema:
          maxLength: 64
          type: string
      - name: application_id
        in: query
        description: Consider only analyses scoped to this application, so each row carries the reference's newest analysis in this application.
        required: false
        style: form
        explode: true
        schema:
          maxLength: 64
          type: string
      - name: limit
        in: query
        description: The maximum number of references to return, 50 when not given
        required: false
        style: form
        explode: true
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
      - name: cursor
        in: query
        description: The cursor returned with the previous page
        required: false
        style: form
        explode: true
        schema:
          maxLength: 512
          type: string
      responses:
        '200':
          description: Query results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestImpactReferenceQueryResult'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::TestImpactAnalysis
  /testImpact/{id}:
    get:
      tags:
      - AgentSession
      summary: Get a test impact analysis
      description: 'Retrieves one test impact analysis: the session summary the query lists, the request the analysis ran and the result it returned. A session that is not a test impact analysis, or that the caller cannot read, is reported as not found.'
      operationId: getTestImpactAnalysis
      parameters:
      - name: id
        in: path
        description: The ID of the test impact analysis session
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: The test impact analysis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestImpactAnalysis'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::TestImpactAnalysis
  /agentSession/{id}:
    get:
      tags:
      - AgentSession
      summary: Get an agent session by ID
      description: Retrieves an agent session by its ID
      operationId: getAgentSession
      parameters:
      - name: id
        in: path
        description: The ID of the agent session
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: The agent session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSession'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::AgentSession
      x-generate-raw: true
    delete:
      tags:
      - AgentSession
      summary: Delete an agent session
      description: Deletes an agent session
      operationId: deleteAgentSession
      parameters:
      - name: id
        in: path
        description: The ID of the agent session
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '204':
          description: Successfully deleted
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Delete::AgentSession
    patch:
      tags:
      - AgentSession
      summary: Update an agent session
      description: Partial update of an agent session. Currently supports writing `status` to drive a local-client lifecycle. A `status` write requires an `instance_type` of `local` — cloud-managed sessions (and legacy sessions with no `instance_type`) are driven by the cloudInstance endpoints instead — and is refused once the session holds a terminal session-level status. A request with no `status` only touches audit metadata and is always allowed. Uses If-Match for optimistic locking against concurrent updates.
      operationId: updateAgentSession
      parameters:
      - name: id
        in: path
        description: The ID of the agent session
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: If-Match
        in: header
        description: If-Match header for optimistic locking. Required when `latest_instance_status` is non-null to prevent concurrent clients from overwriting each other.
        required: false
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentSessionRequest'
        required: true
      responses:
        '200':
          description: The updated agent session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSession'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
        '409':
          $ref: '#/components/responses/ErrorResponse409'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::AgentSession
  /agentSession/{id}/startupParams:
    patch:
      tags:
      - AgentSession
      summary: Update an agent session's startup params
      description: Partial update of the resumable subset of an agent session's `startup_params` field, used by the cloud Test Authoring Agent (TAA) continuation flow to roll the session's "latest used / next to be used" authoring context forward. All fields are optional; only fields present in the body are written. Creation-attribution fields on the underlying `startup_params` (`agent_session_source`, `test_variant_id`) and the polymorphic discriminator (`type`) are preserved unchanged across every call — this endpoint is NOT a full partial-update of the `startup_params` JSON object. Only sessions whose `agent_type` is `test_authoring` accept this update; other agent types receive a 409. Uses If-Match for optimistic locking against concurrent updates.
      operationId: updateAgentSessionStartupParams
      parameters:
      - name: id
        in: path
        description: The ID of the agent session
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: If-Match
        in: header
        description: If-Match header for optimistic locking. Required when other clients may be writing to this session concurrently.
        required: false
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentSessionStartupParamsRequest'
        required: true
      responses:
        '200':
          description: The updated agent session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSession'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
        '409':
          $ref: '#/components/responses/ErrorResponse409'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::AgentSession
  /agentSession/{id}/beginResume:
    post:
      tags:
      - AgentSession
      summary: Begin resuming an agent session (flip it to the transient `resuming` status)
      description: 'Atomically transitions a resumable test-authoring session to the transient `resuming` status, BEFORE the resume planner runs. This is the concurrency guard for the cloud TAA continuation flow: two concurrent answers to the same `needs_attention` session cannot both run a planner or spawn competing cloud instances, because only one wins the flip to `resuming` and the loser gets a 409. Granted only when the session''s `latest_instance_status` is resumable (`needs_attention`, `failed`, or `completed`), or it is already `resuming` but stale (last updated longer ago than the server-side TTL — a crashed attempt, safe to steal). A live (non-stale) `resuming` session returns 409. The session leaves `resuming` when the resume spawns a new instance (→ `queued`) or via a `status_update` on the messages endpoint (re-clarification / error restore); a crashed attempt is reclaimed by the next answer''s TTL steal. Only `test_authoring` sessions accept this call.'
      operationId: beginResume
      parameters:
      - name: id
        in: path
        description: The ID of the agent session
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: The agent session, now in the `resuming` status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSession'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
        '409':
          $ref: '#/components/responses/ErrorResponse409'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Run::AgentSession
  /agentSession/{id}/review:
    post:
      tags:
      - AgentSession
      summary: Record the outcome of reviewing a finished test-authoring session
      description: 'Records what the user decided about a finished `test_authoring` session, flipping it to the reviewed outcome: `accepted` when they kept the authored work, `closed` when they discarded it. A status write only, unless the caller opts into `delete_test` alongside `closed` — see that field. Nothing is ever deleted implicitly, and no branch is deleted at all. Valid for creation and edit sessions alike. Granted only from `completed` or `needs_attention`, enforced inside the write transaction; every other status is a 409, including an already-reviewed session, so a repeated call is rejected rather than silently succeeding. Session-level like `merged` (the cloud instance keeps its own status) and terminal: a reviewed session cannot be resumed, reviewed again, spawned on, or have its status rewritten through updateAgentSession. The conversation is retained either way, so a closed task can be regenerated from it.'
      operationId: reviewAgentSession
      parameters:
      - name: id
        in: path
        description: The ID of the agent session
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewAgentSessionRequest'
        required: true
      responses:
        '200':
          description: The agent session, now holding the reviewed outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSession'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
        '409':
