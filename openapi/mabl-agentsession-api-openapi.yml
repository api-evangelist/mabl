    AgentSessionContextPage:
      required:
      - entity_id
      - entity_type
      type: object
      properties:
        entity_type:
          $ref: '#/components/schemas/AgentSessionContextPageEntity'
        entity_id:
          maxLength: 256
          type: string
          description: The id of the thing the page is about, in the form its own tool takes.
        label:
          maxLength: 200
          type: string
          description: What the page calls it. Display only, so the agent can refer to it the way the user does -- never so it can look it up.
        url:
          maxLength: 2048
          type: string
          description: The page the user is on, when the client knows it. Recorded, never fetched.
      description: 'Where the user is while they talk to the agent, so a workspace-scoped assistant knows which run or deployment "this one" means.

        State rather than an event, and the only action here that is: it is re-sent when the user navigates, and each one supersedes the last. That is why it carries the page rather than a change to it, and why the composed message says plainly that it replaces any earlier one.

        An entity the agent can already read by id. Nothing is fetched here and nothing is stored on the session: this says what the user is looking at, and the agent reads it with the tool for that kind if it needs to.'
    TestObjectiveState:
      type: string
      description: 'Whether the steps of this test version have been checked against the objective summary, and what the check found. unverified means the summary has not been checked against these steps; aligned means it was checked and the steps satisfy it; drifted means it was checked and the steps fall short, with the difference in gap; accepted_gap means the user saw that gap and chose to keep it.

        Scoped to the step list stored on this version. Steps reached through a referenced flow are not covered: a flow is held by ID and resolved to a version at run time, and that resolution depends on the branch, so editing a referenced flow, or reading this version from a branch that resolves it differently, can leave the state describing steps the check never saw.'
      enum:
      - unverified
      - aligned
      - drifted
      - accepted_gap
    AgentSessionSummary:
      required:
      - agent_type
      - created_by_id
      - created_time
      - id
      - is_trial
      - last_updated_by_id
      - last_updated_time
