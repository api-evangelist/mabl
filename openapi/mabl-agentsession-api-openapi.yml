      summary: Create a new cloud instance for a session
      description: Creates a new cloud instance under an agent session and publishes a message to the agent-tasks queue. For `test_authoring` sessions the spawn is refused when a live instance already owns the session, or when the session has reached a terminal session-level status — a spawn stamps the new instance's status onto the session, so neither may be overwritten. Other agent types keep the multi-instance contract.
