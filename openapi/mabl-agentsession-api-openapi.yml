    UpdateAgentSessionStartupParamsRequest:
      type: object
      properties:
        agent_state:
          $ref: '#/components/schemas/NextStepGenerationState'
        resume_cursor:
          type: string
          description: 1-based-inclusive index of the last saved step to replay before the resumed instance continues (absent or "0" replays nothing). Set by the resume planner on continue.
        test_id:
          type: string
          description: The invariant id of the test the session operates on. Set by the resume flow at pause (and at each save) so the next instance continues the same test.
        url:
          type: string
          description: The URL the next instance should boot against (the pausing pod's most recent URL).
        application_id:
          type: string
          description: Refined application id if the pausing pod resolved a previously-unknown application.
        environment_id:
          type: string
          description: Refined environment id if the pausing pod resolved a previously-unknown environment.
        branch_id:
          type: string
          description: The id of the branch the agent operates on. Lifecycle is documented on `TestAuthoringSessionStartupParams.branch_id`.
        base_version:
          type: integer
          description: 'The source-branch version the edit actually LOADED FROM, reported by the runtime once at initial load (see `TestAuthoringSessionStartupParams.base_version`). This is the server-computed `entity_version` the load returned, not a value the caller derives. Write-once and validated: it is stored only when the session has no `base_version` yet and the supplied version is >= 0 (versions are zero-indexed, so 0 is a valid initial-version baseline; a negative sentinel is dropped). A later pause/save that re-sends it (or a newer value) is ignored, so the baseline can never drift off the loaded version.'
          format: int64
        auto_merge:
          type: boolean
          description: Whether the session's branch should be auto-merged into master on clean completion.
        test_information_updates:
          $ref: '#/components/schemas/ResumableTestInformationUpdates'
      description: 'Partial update of the resumable subset of an agent session''s `startup_params` field, used by the cloud TAA continuation flow to roll the session''s "latest used / next to be used" authoring context forward. All fields are optional; only fields present in the body are written. Creation-attribution fields on the underlying `startup_params` (`agent_session_source`, `test_variant_id`) and the polymorphic discriminator (`type`) are preserved unchanged — this endpoint is NOT a full partial-update of the `startup_params` JSON object.

        '
    UserMessagePart:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/MessagePartType'
      anyOf:
      - $ref: '#/components/schemas/TextPart'
      - $ref: '#/components/schemas/FilePart'
    AgentCloudInstance:
