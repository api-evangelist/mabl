openapi: 3.2.0
info:
  title: mabl Test API
  description: APIs for interacting with mabl services
  version: 0.599.3.1792436330
  x-readme-id: 62c896636916ce01d2ff4f5a
servers:
- url: /
security:
- basicAuth: []
- bearerAuth: []
tags:
- name: Test
paths:
  /test/journeys:
    get:
      tags:
      - Test
      summary: Retrieve a set of latest test versions by query and branch
      description: 'Used to query tests. The secondary filters (include_labels, exclude_labels, include_test_case_ids, author_id, application_id, name) are applied in memory after the workspace''s tests are fetched and combine as a logical AND, so when any of them is supplied the endpoint returns up to `limit` matching tests from a full scan and the returned cursor reflects that underlying scan rather than the filtered set. test_type is different: it is applied at the datastore layer via the test-type index (so a type-only query is a seek, not a full scan) and combines as a logical AND with the in-memory filters. credentials_id takes a separate path: it takes precedence over and is mutually exclusive with all other filters — supplying it together with name returns 400 rather than silently ignoring name.'
      operationId: queryTests
      parameters:
      - name: organization_id
        in: query
        description: The organization id to query
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: include_labels
        in: query
        description: at least one label must be matched, if supplied, otherwise all tests considered
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
          default: []
      - name: exclude_labels
        in: query
        description: any matching labels will exclude entity from matching, if supplied, otherwise all tests considered
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
          default: []
      - name: include_test_case_ids
        in: query
        description: at least one id must be matched, if supplied
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
          default: []
      - name: branch
        in: query
        description: mabl branch to retrieve tests for
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: branch_changes_only
        in: query
        description: Run ONLY tests MODIFIED on above mabl branch
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          default: false
      - name: author_id
        in: query
        description: filter results by mabl user ID of author
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: credentials_id
        in: query
        description: filter results to tests whose latest version references this credentials id
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: application_id
        in: query
        description: filter results to tests whose training application is this application id
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: test_type
        in: query
        description: filter results to tests of this type (browser, api, performance, or mobile); applied at the datastore layer via the test-type index
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: limit
        in: query
        description: The limit to use for pagination
        required: false
        style: form
        explode: true
        schema:
          minimum: 1
          type: integer
          format: int32
      - name: cursor
        in: query
        description: The cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: name
        in: query
        description: Return only tests whose name equals this value, ignoring case and surrounding whitespace. This is one of the in-memory filters, so it returns up to `limit` matches and the returned cursor reflects the underlying scan rather than the filtered set. Cannot be combined with credentials_id (returns 400).
        required: false
        style: form
        explode: true
        schema:
          maxLength: 500
          type: string
      responses:
        '200':
          description: Array of tests matching the query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestQueryResult'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::Test
    post:
      tags:
      - Test
      summary: Create a Test
      description: Creates a Test
      operationId: createTest
      parameters:
      - name: branch
        in: query
        description: The branch the test should be created on.  Defaults to master
        required: false
        style: form
        explode: true
        schema:
          type: string
          default: master
      requestBody:
        description: The test to create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Test'
        required: true
      responses:
        '201':
          description: The complete test that was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Test'
        '400':
          description: Invalid test was supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Create::Test
  /test/journeysByType:
    get:
      tags:
      - Test
      summary: Retrieve a set of latest test versions by query and branch
      description: Used to query tests by type
      operationId: queryTestsByType
      parameters:
      - name: organization_id
        in: query
        description: The organization id to query
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: test_type
        in: query
        description: The test type to query
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: branch
        in: query
        description: mabl branch to retrieve tests for
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: limit
        in: query
        description: The limit to use for pagination
        required: false
        style: form
        explode: true
        schema:
          minimum: 1
          type: integer
          format: int32
      - name: cursor
        in: query
        description: The cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Array of tests matching the query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestQueryResult'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::Test
  /test/journeys/removeMultiple:
    post:
      tags:
      - Test
      summary: Bulk remove tests
      description: Used to remove multiple tests simultaneously
      operationId: removeTests
      requestBody:
        description: List of test IDs to remove
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
        required: true
      responses:
        '204':
          description: Confirms the tests do not exist
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Delete::Test
  /test/journeys/byIds:
    get:
      tags:
      - Test
      summary: Retrieve a known set of tests by id on a branch view
      description: 'Reads exactly the requested tests in one call. Each test resolves on `branch` (master when omitted) the same way getTest resolves it with sourceControlTag: an explicit `:version`, else the branch version, else the master version when the branch is a feature branch or does not exist, else the test alone with no `version` or `flows`. An explicit `:version` that does not exist also returns the test alone. Tests that are missing, deleted, or in another workspace are left out, and the rest keep the requested order. `variables` is not computed.'
      operationId: getTestsByIds
      parameters:
      - name: workspace_id
        in: query
        description: The workspace the tests belong to
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: test_ids
        in: query
        description: Test ids, optionally with an explicit `:version`. Blanks and exact duplicates are ignored.
        required: true
        style: form
        explode: false
        schema:
          maxItems: 100
          minItems: 1
          type: array
          items:
            maxLength: 40
            type: string
      - name: branch
        in: query
        description: The mabl branch to read the tests on. Master when omitted.
        required: false
        style: form
        explode: true
        schema:
          maxLength: 200
          type: string
      responses:
        '200':
          description: The requested tests that exist in the workspace, in the requested order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestsByIdsResult'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::Test
  /test/journeys/sample:
    get:
      tags:
      - Test
      summary: Sample random tests with prioritization
      description: 'Returns a random sample of test variant IDs, prioritizing tests with recent passing runs,

        then tests with any recent runs, then all other tests in the workspace. For tests with

        runs, returns the latest variant that has passing runs, or else latest with any runs.

        Tests are associated with applications via their test run history.'
      operationId: sampleTests
      parameters:
      - name: organization_id
        in: query
        description: The organization/workspace ID to sample tests from
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: application_id
        in: query
        description: Optional application ID to filter tests (filters by test runs with this application_id)
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: sample_size
        in: query
        description: Number of test IDs to return (1-100)
        required: false
        style: form
        explode: true
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: Array of sampled test variant IDs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestSampleResult'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::Test
  /test/estimateCredits:
    post:
      tags:
      - Test
      summary: Get estimated credit costs for tests
      description: 'Calculates the estimated credit cost for executing multiple tests based on

        their accounts'' current execution credit weights. For performance tests, uses

        configured runtime; actual runtime may vary.'
      operationId: estimateTestCredits
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestCreditEstimateRequest'
        required: true
      responses:
        '200':
          description: Credit estimates for requested tests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCreditEstimateResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::Test
  /test/journey/{id}:
    get:
      tags:
      - Test
      summary: Retrieve test
      description: Used to retrieve an existing test
      operationId: getTest
      parameters:
      - name: id
        in: path
        description: The test ID or test invariant ID to retrieve. Invariant ID returns latest version.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: sourceControlTag
        in: query
        description: A source control tag to retrieve the version of the flow for
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: The test that was retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Test'
        '404':
          description: Test not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::Test
    delete:
      tags:
      - Test
      summary: Remove Test
      description: Used to remove existing tests
      operationId: removeTest
      parameters:
      - name: id
        in: path
        description: The ID of the test to remove
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '204':
          description: Confirms the test does not exist
        '404':
          description: Test not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Delete::Test
    patch:
      tags:
      - Test
      summary: Update Test
      description: Creates a new version for existing tests
      operationId: updateTest
      parameters:
      - name: id
        in: path
        description: The ID of the test to update
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: branch
        in: query
        description: The branch the test update should be saved to.  Defaults to master
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: If-Match header according to http/1.1 spec section 14.24
        required: false
        style: simple
        explode: false
        schema:
          type: string
      - name: force
        in: query
        description: Force an update to occur, even if no changes have been made
        required: false
        style: form
        explode: true
        schema:
          type: boolean
      - name: field_mask
        in: query
        description: A comma seperated set of fields to update. If provided, only fields in the field mask will be updated. Fields in the field mask but not in the body will be set to null.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      requestBody:
        description: The test fields to update
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Test'
        required: true
      responses:
        '200':
          description: The updated test
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Test'
        '404':
          description: Test not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::Test
  /test/journey/{id}/metadata:
    patch:
      tags:
      - Test
      summary: Update Test metadata
      description: Update the unversioned metadata of an existing test
      operationId: updateTestMetadataLegacy
      parameters:
      - name: id
        in: path
        description: The ID of the test to update
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: If-Match
        in: header
        description: If-Match header according to http/1.1 spec section 14.24
        required: false
        style: simple
        explode: false
        schema:
          type: string
      - name: field_mask
        in: query
        description: A comma separated set of fields to update. If provided, only fields in the field mask will be updated. Fields in the field mask but not in the body will be set to null.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      requestBody:
        description: The test metadata fields to update
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestMetadata'
        required: true
      responses:
        '200':
          description: Test metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestMetadata'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Test not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::Test
  /test/{id}/metadata:
    get:
      tags:
      - Test
      summary: Get test metadata
      description: Get the unversioned metadata of an existing test
      operationId: getTestMetadata
      parameters:
      - name: id
        in: path
        description: The ID of the test
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Test metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestMetadata'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Test not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::Test
      x-mabl-scope: public
    patch:
      tags:
      - Test
      summary: Update test metadata
      description: Update the unversioned metadata of an existing test
      operationId: updateTestMetadata
      parameters:
      - name: id
        in: path
        description: The ID of the test to update
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: If-Match
        in: header
        description: If-Match header according to http/1.1 spec section 14.24
        required: false
        style: simple
        explode: false
        schema:
          type: string
      - name: field_mask
        in: query
        description: A comma separated set of fields to update. If provided, only fields in the field mask will be updated. Fields in the field mask but not in the body will be set to null.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
        x-mabl-scope: private
      requestBody:
        description: The test metadata fields to update
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestMetadata'
        required: true
      responses:
        '200':
          description: The updated test on the master branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestMetadata'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Test not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::Test
      x-mabl-scope: public
  /test/journeys/addLabels:
    patch:
      tags:
      - Test
      summary: Add Labels to Tests
      description: Update tests to contain new labels
      operationId: addLabelsToTests
      parameters:
      - name: ids
        in: query
        description: List of test IDs
        required: true
        style: form
        explode: true
        schema:
          maxItems: 20
          type: array
          items:
            type: string
      requestBody:
        description: Array of labels to add; Unique label is determined by a unique combination of name and color
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Label'
        required: true
      responses:
        '200':
          description: Array of updated tests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestQueryResult'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Create::Test
  /test/metadata:
    post:
      tags:
      - Test
      summary: Retrieve test metadata for workspace
      description: Get metadata for all tests in a workspace
      operationId: queryTestsMetadata
      parameters:
      - name: workspace_id
        in: query
        description: The workspace ID to query tests for
        required: true
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Array of test metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TestMetadata'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::Test
  /recover/test/{id}:
    post:
      tags:
      - Test
      summary: Recover Test
      description: Used to undelete a test
      operationId: recoverTest
      parameters:
      - name: id
        in: path
        description: The ID of the test to recover
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '204':
          description: Confirms the test does not exist
        '404':
          description: Test not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Recover::Test
  /test/journey/{id}/version:
    get:
      tags:
      - Test
      summary: Retrieve test versions
      description: Used to retrieve test variant version list.
      operationId: listTestVersions
      parameters:
      - name: id
        in: path
        description: The test invariant or variant ID.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: branch
        in: query
        description: Filter the returned versions to those created on this mabl branch. Omit to return the full version history across all branches.
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: The test variant versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestVariantVersionQueryResult'
        '404':
          description: Test not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::Test
  /test/journeys/{id}/versions/{version}/objectiveCheck:
    get:
      tags:
      - Test
      summary: Get a test version's objective check
      description: The most recent objective check recorded against one test version, which is the version's current verdict. Not found when the version has never been checked.
      operationId: getTestObjectiveCheck
      parameters:
      - name: id
        in: path
        description: The test invariant ID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: version
        in: path
        description: The version of the test the check judges
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: The version's current objective check
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestObjectiveCheck'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::Test
    post:
      tags:
      - Test
      summary: Record an objective check
      description: Records whether the steps of one test version satisfy its objective summary, as a new check that becomes the version's current verdict. The test version itself is not changed. Who checked it comes from the caller's credentials. An agent may only record aligned or drifted, and only when the current check is missing or was recorded by an agent. accepted_gap is for people only and needs a gap. Re-sending the current verdict records nothing and returns the current check.
      operationId: createTestObjectiveCheck
      parameters:
      - name: id
        in: path
        description: The test invariant ID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: version
        in: path
        description: The version of the test the check judges
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
      requestBody:
        description: The verdict to record
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestObjectiveCheckRequest'
        required: true
      responses:
        '200':
          description: The request matched the current check, so nothing was recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestObjectiveCheck'
        '201':
