        annotated_step_text:
          type: string
          description: 'An excerpt of the test''s steps, not its flows in full. Each flow contributes

            a window of its annotated_step_descriptions around the steps that matched the

            query, or its opening steps when it did not match, and the windows are joined.

            For the default "combined" search the flows are ordered by how well their steps

            answer the query, most relevant first, so that a shortened excerpt keeps the

            steps the query was about; flows that answer it not at all follow in test order.

            A single-column search has no per-flow relevance, so it is always in test order

            and contributes opening steps rather than windows.

            Ordering never changes which tests match or how they rank against each other.

            Server caps the text at 20000 characters, applied both per flow and over the

            full concatenation; annotated_step_truncated reports when that cap cut a flow.

            The calling agent service applies its own adaptive truncation on top.

            '
        annotated_step_truncated:
          type: boolean
          description: 'True when the 20000-character cap cut this test''s step text, at either level:

            a single flow ran past it, or the test''s flows ran past it once joined even

            though each one fits. Independent of the excerpt window — the excerpt is a

            window around the matched steps, or the opening steps when nothing matched,

            and that windowing is not truncation and does not set this flag. False when

            the row carries every flow''s contribution whole.

            '
        score:
          type: number
          description: Relevance, higher = better, and not on a fixed scale. Comparable only among rows of a single response that share a match_source, because scores from test metadata and from flow step text come from different corpora. Never comparable across responses.
          format: double
        match_source:
          type: string
          description: 'What the query matched on, and the primary sort key. "metadata" means the test''s own

            name, description, intent or labels, so the test itself describes what was asked for;

            every metadata match ranks above every step-text match, and results already arrive in

            that order. "own_steps" and "shared_steps" mean nothing on the test matched and the

            query was found only in the step text of the test''s flows, which is weaker evidence

            about what the test is for: confirm against the test name and the step excerpt before

            treating such a row as belonging to the category that was searched for. "own_steps" is

            a flow belonging to this test alone; "shared_steps" is the weakest of the three,

            because the flow that matched is shared with other tests and says little about any one

            of them.

            '
          enum:
          - metadata
          - own_steps
          - shared_steps
        matched_field:
          type: string
          description: 'Echo of the requested search_field, i.e. which test_reference columns were

            searched. It does not say where the match landed: under "combined" a row may

            have surfaced through the step text of the test''s flows instead.

            '
          enum:
          - combined
          - name
          - description
          - intent
          - labels
    MobileTrainingInfo:
      type: object
      properties:
        device_name:
          type: string
          description: The name of the mobile device
        device_api_level:
          type: string
          description: The API level of the mobile device
        device_os_version:
          type: string
          description: The OS version of the mobile device
        screen_dimensions:
          $ref: '#/components/schemas/DeviceScreenDimensions'
        is_cloud_training:
          type: boolean
          description: Whether the training took place on a cloud device or local device
        is_real_device:
          type: boolean
          description: Whether the training took place on a real device or an emulator/simulator
        app_file_name:
          type: string
          description: The mobile app file name (only present for local training)
        app_file_id:
          type: string
          description: The file id of the mobile app (only present for cloud training)
    EntityStepIds:
      type: object
      properties:
        entityInvariantId:
          type: string
          description: The invariant id of the entity
        journeyRunId:
          description: The corresponding test run id if relevant
        entityId:
          type: string
          description: The version of the entity (variant ID)
        stepIdsByFlow:
          type: array
          description: The step ids for each flow in the entity in order
          items:
            $ref: '#/components/schemas/FlowStepIds'
      description: The step ids for a versioned test or flow used in a particular test run
    TestObjective:
      type: object
      properties:
        summary:
          type: string
          description: A natural language summary of what this test version does. Omitting it on a save keeps the stored one; sending it empty removes the objective outright, since source, state, and gap all describe a summary.
        source:
          $ref: '#/components/schemas/TestObjectiveSource'
        state:
          $ref: '#/components/schemas/TestObjectiveState'
        gap:
          type: string
          description: 'When state is drifted or accepted_gap, how the steps of this version fall short of the summary. Retained after the user accepts the gap so the accepted difference stays readable. Unindexed: free prose nothing queries, and long enough to exceed Datastore''s 1500-byte ceiling on an indexed string.'
          x-dao-unindexed: true
      description: 'What this test version is trying to accomplish, in natural language. Version-scoped, so each version records the objective it was authored against rather than sharing one across the whole test''s history. Saved through test_objective: a full save may set it alongside steps as one version, and omitting it keeps the stored one. A field_mask=test_objective write may only record state and gap; changing summary or source that way is refused, so use a full save.'
    TestVersionReference:
      required:
      - test_id
      - version
      type: object
      properties:
        test_id:
          type: string
          description: The test invariant ID
        version:
          type: integer
          format: int64
    TestWithContext:
      type: object
      description: Contains test data plus additional context information
      allOf:
      - $ref: '#/components/schemas/Test'
      - type: object
        properties:
          annotated_step_descriptions:
            type: string
            description: Detailed description of the steps in this test
          step_details:
            type: array
            description: Step-level details with screenshot GCS URIs from the most recent passing test run (only populated when include_screenshot_info parameter is true)
            items:
              $ref: '#/components/schemas/TestStepContextDetails'
      x-implements-interface:
      - ActivityTrackingBaseEntity
      - HasOrganizationId
      - HasWorkspaceId
      - HasName
      - HasVersion
    DeviceScreenDimensions:
      required:
      - height
      - width
      type: object
      properties:
        height:
          type: integer
          description: Height (pixels)
          format: int32
          x-mabl-scope: public
        width:
          type: integer
          description: Width (pixels)
          format: int32
          x-mabl-scope: public
    FlowConfiguration:
      type: object
      properties:
        iterations:
          $ref: '#/components/schemas/IterationConfiguration'
        parameters:
          type: object
          additionalProperties:
            type: string
          description: The parameter values to pass into the flow
        role:
          $ref: '#/components/schemas/FlowRole'
      description: Configuration for a flow instance
