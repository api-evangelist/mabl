          format: int64
          readOnly: true
        flow_step_start_index:
          type: integer
          description: The start index of the flow step in this chunk
          format: int64
          readOnly: true
        reusable_flow:
          type: boolean
          description: True when the chunk's steps live in a reusable flow, false when they are an inline (non-reusable) test-step fragment. Lets a consumer anchor a coverage link on the flow (reusable) versus the containing test position (non-reusable).
        distance:
          type: number
          description: Cosine distance between the query embedding and this chunk's embedding. Lower = more similar. Only populated by semantic (by-task) chunk queries; absent for non-semantic paths. A support signal for the consumer to weigh, not a ranking the API applies.
          format: double
