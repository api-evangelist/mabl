  /test/references/search:
    post:
      tags:
      - Test
      summary: Search active test references by full-text token query
      description: 'Token-based full-text search over a workspace''s active tests, using the Spanner

        SEARCH() function. A test is matched on its own name, description, intent, and

        labels through `idx_test_reference_search_v2`; the default "combined" search covers

        all four at once, and restricting `search_field` scopes the match to that one

        column. The combined search also matches on the step text of a test''s flows,

        through `idx_flow_reference_search_v3`, so a test whose steps describe the query is

        found even when its own name, description, intent and labels say nothing about it.

        Step matches rank below every metadata match rather than competing with them; see

        `match_source` for the tier rule.


        Returns rich per-test rows, including an excerpt of the annotated step descriptions

        of the test''s flows (joined through `test_reference.flows` -> `flow_reference`).

        Under the "combined" search a flow whose steps matched contributes a window of its

        step text around the matching steps, a flow that did not match contributes its

        opening steps, and the flows are ordered most relevant first, so that a capped

        excerpt keeps the steps the query was about rather than whichever flows happen to

        run first. Shaping the excerpt decides only which steps a row shows: it never

        admits a test, and never changes how the returned tests rank.


        The `query` follows Spanner search syntax — multi-token queries default to AND.

        Callers can join keywords with " OR " for broader recall, or quote phrases.

        `OR` binds only the two words beside it and parentheses do not group terms, so

        prefer one plain multi-word query (all words required) over mixing `OR` with

        other terms.'
      operationId: searchTestReferences
      parameters:
      - name: workspace_id
        in: query
        description: The workspace to search in.
        required: true
        style: form
        explode: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestReferenceTextSearchRequest'
        required: true
      responses:
        '200':
          description: Search results ordered by relevance score (descending).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestReferenceTextSearchResult'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::Test
components:
  schemas:
    Flow:
      type: object
      description: A Flow represents a set of steps in a Test
      allOf:
      - $ref: '#/components/schemas/FlowMetadata'
      - $ref: '#/components/schemas/FlowVersion'
      - $ref: '#/components/schemas/MergedVariant'
      - type: object
        properties:
          api_steps:
            type: object
            description: API steps for API only flow (stored in postman collection format)
          json_steps:
            type: object
            description: Steps in the new json format that replaces mablscript
      x-implements-interface:
      - ActivityTrackingBaseEntity
      - HasOrganizationId
      - HasWorkspaceId
      - HasVersion
    FlowTypeEnum:
      type: string
      description: the type of flow
      enum:
      - validate_page
      - login
      - verify_url
      - mablscript
      - check_links
      - visual_page_validation
      - api
      - mobile
      - desktop
      x-mobile-scope: public
    PerformanceFailureCriteriaOptionalParameters:
      type: object
      properties:
        metric_aggregation:
          type: string
          description: The aggregation level of the metric determining failure case
          enum:
          - average
          - percentile
        metric_percentile:
          type: integer
          description: The percentile for the metric we are considering
          format: int32
        metric_error_codes:
          type: array
          description: Response codes that count as errors for error rate
          items:
            type: string
            enum:
            - codes_3xx
            - codes_4xx
            - codes_5xx
        metric_step_ids:
          type: array
          description: IDs of steps to include in metric calculations
          items:
            type: string
        metric_cwv_measurements:
          type: array
          description: Individual CWV measurements' failure criteria configuration
          items:
            $ref: '#/components/schemas/PerformanceFailureCriteriaCWVMeasurement'
      description: Optional parameters related to specific failure criteria
    TestCreditEstimateResponse:
      type: object
      properties:
        estimates:
          type: array
          items:
            $ref: '#/components/schemas/TestCreditEstimate'
      description: Credit estimates for multiple tests
    PerformanceFailureCriteria:
      type: object
      properties:
        metric_comparator:
          type: string
          description: The comparator determining the failure case
          enum:
          - greater_than
          - less_than
        metric_threshold:
          type: number
          description: The cutoff value determining the failure case
          format: double
        metric_type:
          type: string
          description: The type of metric determining failure case
          enum:
          - response_time
          - http_error_rate
          - functional_test_failure_rate
          - core_web_vitals
          - step_duration
        metric_optional_parameters:
          $ref: '#/components/schemas/PerformanceFailureCriteriaOptionalParameters'
      description: Definition of failure criteria per workload
    FileValue:
      required:
      - mime_type
      - name
      - origin
      - size
      type: object
      properties:
        origin:
          type: string
          description: 'Provenance of the file. `upload` is a durable, reusable FileUpload (see file_upload_id). `download` is a transient file produced by a test run (see download_ref).

            '
          enum:
          - upload
          - download
        name:
          type: string
          description: the base file name
        mime_type:
          type: string
          description: the true MIME type (e.g. application/pdf), not a file extension
        size:
          type: integer
          description: the size of the file in bytes
          format: int64
        checksum:
          type: string
          description: optional content checksum
        file_upload_id:
          type: string
          description: 'Set when origin == upload; the id of a durable FileUpload (FileUpload.id). This is how a persisted or authored file variable references its file.

            '
        download_ref:
          description: Set when origin == download; run-scoped coordinates for a file downloaded during a test run.
          allOf:
          - $ref: '#/components/schemas/FileDownloadReference'
      description: 'A typed file value for a file-typed variable, reconciling field-for-field with the runtime FileValue (mabl-cli mablscript-find). `origin` selects which reference is populated: `upload` uses file_upload_id, `download` uses download_ref. This one-of invariant is NOT enforced by the schema (a oneOf/discriminator would make the generated Java/TS clients polymorphic and diverge from the flat runtime FileValue); it must be enforced by validation on the Flow/Test write path, tracked in MABL-20387, before file variables are consumed (first reader: MABL-20718). Until then a malformed file_value is accepted but unused. The run-local localUri from the runtime shape is intentionally omitted (ephemeral, never persisted).

        '
    ApiAuthentication:
      required:
      - type
      type: object
      properties:
        type:
          type: string
          description: The authentication type to use
          enum:
          - apikey
          - basic
          - bearer
          - noauth
          - oauth1
          - oauth2
        api_key:
          $ref: '#/components/schemas/ApiKeyAuthentication'
        basic:
          $ref: '#/components/schemas/BasicAuthentication'
        bearer:
          $ref: '#/components/schemas/BearerAuthentication'
        oauth1:
          $ref: '#/components/schemas/OAuth1Authentication'
        oauth2:
          $ref: '#/components/schemas/OAuth2Authentication'
      description: Configuration for API authentication
    TestSource:
      type: string
      description: Where the test lives
      enum:
      - mabl_cloud
      - external
      - mabl_local
      - mabl_agent
      x-mabl-scope: public
    MobilePlatformEnum:
      type: string
      description: The mobile platform associated with this object
      enum:
      - android
      - ios
      x-mabl-scope: public
    FlowVersion:
      type: object
      description: A Flow represents a set of steps in a Test
      allOf:
      - $ref: '#/components/schemas/Variant'
      - type: object
        properties:
          variant_last_updated_by_app_version:
            type: string
            description: The version of the desktop app used to create this version.
          script:
            type: string
            description: The flow's script
          script_description:
            type: string
            description: Description of what the script does
          step_annotations:
            type: object
