openapi: 3.2.0
info:
  title: mabl Reporting API
  description: APIs for interacting with mabl services
  version: 0.599.3.1792436330
  x-readme-id: 62c896636916ce01d2ff4f5a
servers:
- url: /
security:
- basicAuth: []
- bearerAuth: []
tags:
- name: Reporting
paths:
  /workspaces/{workspace_id}/reports/usage/testRunCounts:
    get:
      tags:
      - Reporting
      summary: Query test run counts
      description: 'Retrieve the count of test runs in an active workspace, aggregated into time buckets. Each bucket reports the total number of runs that started within the bucket window, as well as how many of those passed and how many failed or were terminated. Useful for plotting test activity over time, tracking reliability trends, and feeding external dashboards with per-day/week/month usage metrics.


        Runs are counted by their `start_time`, not `end_time` — a long-running test that starts on day D and finishes on day D+1 is attributed to day D. In-flight runs (ones that have started but not yet completed) are included in `total_test_runs` and counted as `failed_test_runs` until they complete, since they have not yet succeeded.


        Optional filters (`application_id`, `plan_id`, `test_type`) narrow the underlying row set. Optional `group_by` (`plan` or `application`) breaks each time bucket further into one bucket per group value, with the `group_id` field on each bucket identifying the dimension value.


        All timestamps in requests and responses are Unix epoch milliseconds. Bucket boundaries are aligned to UTC; convert to local time on the client side if needed. Time range is capped by granularity: daily (90 days), weekly/monthly (400 days). Data is served live from the test run database, so results reflect runs completed within seconds of the request.'
      operationId: queryWorkspaceTestRunCounts
      parameters:
      - name: workspace_id
        in: path
        description: The workspace ID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: start_time
        in: query
        description: Inclusive start of the time range to report on, as Unix epoch milliseconds. Must be strictly less than `end_time`.
        required: true
        style: form
        explode: true
        schema:
          type: integer
          format: int64
      - name: end_time
        in: query
        description: 'Exclusive end of the time range to report on, as Unix epoch milliseconds. Must be strictly greater than `start_time`. The total window `end_time - start_time` is capped by granularity: 90 days for `daily`, 400 days for `weekly` or `monthly`. Requests exceeding the cap return HTTP 400.'
        required: true
        style: form
        explode: true
        schema:
          type: integer
          format: int64
      - name: granularity
        in: query
        description: Time bucket size for the response. Valid values are `daily`, `weekly`, and `monthly`. Daily buckets start at midnight UTC. Weekly buckets follow ISO-8601 week boundaries (Monday 00:00 UTC). Monthly buckets align with the first day of each calendar month at 00:00 UTC.
        required: true
        style: form
        explode: true
        schema:
          type: string
          enum:
          - daily
          - weekly
          - monthly
      - name: group_by
        in: query
        description: Optional dimension to break the response down by. Without `group_by`, each time bucket aggregates all matching runs. With `group_by` set, each time bucket is further split by the grouping value and the `group_id` field on each bucket identifies which plan, application, or workspace it represents (workspace only appears on account-level endpoints). Buckets are emitted for every (period, group_id) combination that has at least one matching run; combinations with zero runs are omitted.
        required: false
        style: form
        explode: true
        schema:
          type: string
          enum:
          - plan
          - application
      - name: application_id
        in: query
        description: Filter results to runs associated with a specific mabl application. Only runs whose `application_id` matches this value exactly are included. Combined additively with other filters (`plan_id`, `test_type`) — runs must match all provided filters.
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: plan_id
        in: query
        description: Filter results to runs that were part of executions of a specific test plan. Useful for attributing usage to a particular CI pipeline, schedule, or deployment trigger. Runs not associated with any plan (for example, ad-hoc runs from the Trainer) are excluded when this filter is set.
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: test_type
        in: query
        description: Filter results to runs of a specific test type. Valid values are `browser` (UI automation), `api` (REST API tests), `mobile`, and `performance`. Useful when a workspace exercises multiple test types and you want to report on them independently — for example, to split UI-automation usage from API-test usage in an attribution dashboard. When omitted, all test types are included.
        required: false
        style: form
        explode: true
        schema:
          type: string
          enum:
          - api
          - browser
          - mobile
          - performance
      responses:
        '200':
          description: Test run counts grouped by time buckets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageTestRunCountsResponse'
        '400':
          description: Invalid or missing parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '403':
          description: User not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::Report
      x-mabl-scope: public
  /accounts/{account_id}/reports/usage/testRunCounts:
