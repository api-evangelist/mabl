            type: number
            format: double
          x-mabl-scope: public
        cumulative_api_response_time:
          type: number
          description: Cumulative API response time in milliseconds across all the requests of an API flow averaged across all flow instances
          format: double
          readOnly: true
          x-mabl-scope: public
        cumulative_api_response_time_by_flow_instance:
          type: array
