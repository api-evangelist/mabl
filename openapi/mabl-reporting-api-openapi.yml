          type: integer
          description: Total number of test runs that started within this bucket and match all filters on the request. Includes runs that are still in flight (have started but not yet completed).
          format: int64
          x-mabl-scope: public
        passed_test_runs:
          type: integer
          description: Subset of `total_test_runs` that completed successfully (status is `completed` and `success` is true). In-flight runs are excluded.
