  /workspaces/{workspace_id}/reports/usage/maxTestRunConcurrency:
    get:
      tags:
      - Reporting
      summary: Query workspace daily maximum concurrent test runs
      description: 'Retrieve the daily maximum number of simultaneously executing test runs in an active workspace, along with the workspace''s configured test run concurrency limit for the same test type. The reported `max_test_run_concurrency` is computed as the maximum number of runs executing at any single instant during the day — not an average, not a count of runs started. If ten runs start and finish within the same minute but a different run was also executing for that minute, the maximum for that minute is eleven.


        Use this endpoint to track how close a workspace is running to its purchased concurrency capacity, decide when to request a limit increase, identify load bursts, or correlate peak usage with customer-side deployment or traffic patterns. Compare the `max_test_run_concurrency` values against `configured_test_run_concurrency_limit` to see headroom.


        Data is pre-aggregated from billable events by a background job that runs every 12 hours, so values for the current calendar day may be incomplete until the next aggregation cycle finishes. Time range cannot exceed 90 days. If `start_time` and `end_time` are both omitted, the endpoint returns the last 90 completed days ending at the start of the current UTC day.


        The `configured_test_run_concurrency_limit` is resolved against the requested `test_type`. For `browser` (the default when unspecified), it is the sum of the workspace''s Linux, macOS, and Windows browser quotas. For `api`, `mobile`, or `performance`, it is the single numeric quota for that resource. A workspace with no configured quota for a given test type returns `configured_test_run_concurrency_limit: 0`.'
      operationId: queryWorkspaceMaxTestRunConcurrency
      parameters:
      - name: workspace_id
        in: path
        description: The workspace ID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: start_time
        in: query
        description: 'Inclusive start of the time range to report on, as Unix epoch milliseconds. Must be earlier than `end_time`. Optional: if both `start_time` and `end_time` are omitted, the endpoint returns the most recent 90 completed days. If `end_time` is provided but `start_time` is not, `start_time` defaults to 90 days before `end_time`. Any sub-day precision is snapped to midnight UTC of that day; the response echoes the snapped value.'
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int64
      - name: end_time
        in: query
        description: 'Exclusive end of the time range to report on, as Unix epoch milliseconds. Must be later than `start_time`. Optional: defaults to the start of the current calendar day in UTC (i.e. the end of the most recent completed day). The window `end_time - start_time` cannot exceed 90 days. Any sub-day precision is snapped to the start of the following UTC day; the response echoes the snapped value.'
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int64
      - name: test_type
        in: query
        description: Test type to report maximum test run concurrency for. Valid values are `browser` (UI automation), `api` (REST API tests), `mobile`, and `performance`. The returned `max_test_run_concurrency` values and the matching `configured_test_run_concurrency_limit` both reflect the selected test type. Defaults to `browser` when omitted.
        required: false
        style: form
        explode: true
        schema:
          type: string
          enum:
          - api
          - browser
          - mobile
          - performance
      responses:
        '200':
          description: Daily maximum concurrent test run data for the workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMaxTestRunConcurrencyResponse'
        '400':
          description: Invalid or missing parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '403':
          description: User not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::Report
      x-mabl-scope: public
  /accounts/{account_id}/reports/usage/maxTestRunConcurrency:
    get:
      tags:
      - Reporting
      summary: Query account daily maximum concurrent test runs
      description: 'Same as `/workspaces/{workspace_id}/reports/usage/maxTestRunConcurrency` but returns one block per active workspace the authenticated caller has access to within the account. Each workspace''s response includes its own `configured_test_run_concurrency_limit`, which can differ across workspaces in the same account (for example, one workspace might have a higher browser quota than another). Use this endpoint for account-wide capacity dashboards or to flag which workspaces are running near their limit.


        Scope to a single workspace by passing its identifier as the `workspace_id` query parameter while still authenticating with account-level credentials. Time range, `test_type`, and default-range semantics are identical to the workspace-level endpoint.'
      operationId: queryAccountMaxTestRunConcurrency
      parameters:
      - name: account_id
