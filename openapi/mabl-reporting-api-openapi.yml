components:
  schemas:
    AgentType:
      type: string
      enum:
      - test_authoring
      - flow_authoring
      - test_creation_planning
      - test_planning
      - agent_review
      - app_summary
      - test_run_analysis
      - test_recovery
      - runtime_recovery_summary_agent
      - plan_run_analysis
      - deployment_analysis
      - workspace_results_analysis
      - results_auto_analysis
      - workspace_assistant
      - app_modeling
      - app_modeling_run
      - file_assertion
      - test_impact
      - test_impact_shadow
      - repair_notes
      - external_agent
      - exploratory_qa
    AccountUserActivity:
      type: object
      properties:
        account_id:
          type: string
          description: Id of the associated account for this summary
        interval_start:
          type: integer
          description: Starting time of the interval in epoch milliseconds
          format: int64
        interval_end:
          type: integer
          description: Ending time of the interval in epoch milliseconds
          format: int64
        users:
          type: array
          description: List of users with their activity counts
          items:
            $ref: '#/components/schemas/UserActivitySummary'
        cursor:
          type: string
          description: Cursor for fetching the next page of results. Null if no more results.
      description: User activity summary for an account over a time range
    BaseTestRunResult:
      type: object
      properties:
        id:
          type: string
          description: Test run id
          x-mabl-scope: public
        test_ref_id:
          type: string
          description: reference to this test in another system
          x-mabl-scope: public
        workspace_id:
          type: string
          description: workspace Id
          x-mabl-scope: public
        started_time:
          type: integer
          description: Time test run was started, in epoch milliseconds
          format: int64
          x-mabl-scope: public
        completed_time:
          type: integer
          description: Time test run was completed, in epoch milliseconds
          format: int64
          x-mabl-scope: public
        tags:
          type: array
          description: Free text tags associated with this entity
          items:
            $ref: '#/components/schemas/Tag'
        journey_id:
          type: string
          description: (deprecated, use test_id) Test id
          readOnly: true
          x-mabl-scope: public
        test_id:
          type: string
          description: Test id
          readOnly: true
          x-mabl-scope: public
        test_labels:
          type: array
          description: Test labels
          items:
            type: string
          x-mabl-scope: public
        test_name:
          type: string
          description: Test name
          x-mabl-scope: public
        test_type:
          $ref: '#/components/schemas/TestTypeEnum'
        failure_summary:
          $ref: '#/components/schemas/TestRunFailureSummary'
        failure_categorization:
          $ref: '#/components/schemas/FailureCategorization'
        test_cases:
          type: array
          description: User provided external test cases
          readOnly: true
          items:
            $ref: '#/components/schemas/ExternalTestCase'
          x-mabl-scope: public
        timing_summary:
          $ref: '#/components/schemas/TimingSummary'
        execution_source:
          $ref: '#/components/schemas/TestSource'
        status:
          type: string
          description: The current status of this test run
          enum:
          - awaiting_precondition
          - skipped
          - rate_limited
          - queued
          - running
          - completed
          - failed
          - terminating
          - terminated
          x-mabl-scope: public
        status_cause:
          type: string
          description: Cause for setting given status, such as failure cause. Updated in pairs with Status.
          x-mabl-scope: public
        outcome:
          $ref: '#/components/schemas/TestRunResultOutcomeEnum'
        customer_log_uri:
          type: string
          description: Customer facing output log (formerly output_log_uri)
      description: Results of a test run
    WorkspaceAnnualConcurrentUsersSummary:
      type: object
      properties:
        workspace_id:
          type: string
          description: Id of the associated workspace for this summary
        interval_start:
          type: integer
          description: Starting time of the time-series in epoch milliseconds
          format: int64
        interval_end:
          type: integer
          description: Ending time of the time-series in epoch milliseconds
          format: int64
        data:
          type: array
          items:
            $ref: '#/components/schemas/MonthlyConcurrentUsersSummary'
      description: Monthly time-series summary of concurrent workspace user activity over the specified year
    Tag:
      required:
      - name
      type: object
      properties:
        name:
          type: string
          description: tag name
          x-mabl-scope: public
        values:
          maxItems: 32
          minItems: 0
          type: array
          items:
            type: string
    AdvancedFlowMetrics:
      type: object
      properties:
        cumulative_speed_index:
          type: number
          description: Cumulative app load time in milliseconds across all the steps of a flow averaged across all flow instances
          format: double
          readOnly: true
          x-mabl-scope: public
        cumulative_speed_index_by_flow_instance:
          type: array
          description: Cumulative app load time in milliseconds across all the steps of a flow per instance
