        automators:
          type: integer
          description: Total number of automators in the workspace for the specified month
          format: int32
        participants:
          type: integer
          description: Total number of participants in the workspace for the specified month
          format: int32
      description: Monthly summary of concurrent workspace users
    UserActivitySummary:
      type: object
      properties:
        user_id:
          type: string
          description: The user's ID
        email:
          type: string
          description: The user's email address
        name:
          type: string
          description: The user's full name
        activity_count:
          type: integer
          description: Total number of automator events (edits) by this user in the time range
          format: int32
        last_activity_time:
          type: integer
          description: Timestamp of the user's most recent activity in epoch milliseconds
          format: int64
      description: Activity summary for a single user
    ExternalTestCase:
      type: object
      properties:
        id:
          type: string
          description: Id associated with this test case
          x-mabl-scope: public
      description: External test case
