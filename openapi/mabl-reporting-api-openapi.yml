      properties:
        load_start_time:
          type: integer
          description: start time of load in Unix epoch milliseconds
          format: int64
          x-mabl-scope: public
        load_ramp_up_end_time:
          type: integer
          description: start time of load in Unix epoch milliseconds
          format: int64
          x-mabl-scope: public
        load_end_time:
          type: integer
          description: end time of load in Unix epoch milliseconds
          format: int64
