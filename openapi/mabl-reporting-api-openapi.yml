    WorkspaceMonthlyConcurrentUsersSummary:
      type: object
      properties:
        workspace_id:
          type: string
          description: Id of the associated workspace for this summary
        interval_start:
          type: integer
          description: Starting time of the time-series in epoch milliseconds
          format: int64
        interval_end:
          type: integer
          description: Ending time of the time-series in epoch milliseconds
          format: int64
        data:
          type: array
          items:
            $ref: '#/components/schemas/CumulativeDailyConcurrentUsersSummary'
      description: Daily time-series summary of concurrent workspace user activity over the specified month
    ErrorResponseGeneric:
      type: object
      properties:
        id:
          type: string
          x-mabl-scope: public
        code:
          maximum: 599
          minimum: 100
          type: integer
          format: int32
          x-mabl-scope: public
        message:
          type: string
          x-mabl-scope: public
        error_code:
          type: string
          description: Machine-readable reason for the error, present only when the API names one. Values are guardrail_blocked (a guardrail policy refused an agent request), approval_required (a guardrail policy requires a person to approve the request first).
        guardrail:
          description: The guardrail policy that refused the request; present only when error_code is guardrail_blocked or approval_required.
          allOf:
          - $ref: '#/components/schemas/GuardrailRefusal'
    UsageMaxTestRunConcurrencyBucket:
      type: object
      properties:
        bucket_start_time:
          type: integer
          description: Inclusive start of the day (midnight UTC) as Unix epoch milliseconds. Maximum test run concurrency is always computed against UTC calendar days.
          format: int64
          x-mabl-scope: public
        bucket_end_time:
          type: integer
          description: Exclusive end of the day (midnight UTC of the next day) as Unix epoch milliseconds. Always 24 hours after `bucket_start_time`.
          format: int64
          x-mabl-scope: public
        max_test_run_concurrency:
          type: integer
          description: Maximum number of test runs of the queried `test_type` that were executing simultaneously at any instant during this day. Computed via a sweep-line over run start/end times in the underlying billable events data.
          format: int64
          x-mabl-scope: public
      description: Maximum concurrent test runs observed during a single UTC calendar day. One bucket is emitted per day in the queried range that had at least one matching run.
      x-mabl-scope: public
    TestTypeEnum:
      type: string
      description: Type of test
      enum:
      - api
      - browser
      - performance
      - mobile
      - desktop
      x-mabl-scope: public
    UsageExecutionSecondsBucket:
      type: object
      properties:
        bucket_start_time:
          type: integer
          description: Inclusive start of the time bucket as Unix epoch milliseconds. Aligned to midnight UTC, Monday 00:00 UTC, or first-of-month 00:00 UTC per the selected granularity.
          format: int64
          x-mabl-scope: public
        bucket_end_time:
          type: integer
          description: Exclusive end of the time bucket as Unix epoch milliseconds. Equal to the `bucket_start_time` of the following period for that bucket size.
          format: int64
          x-mabl-scope: public
        group_id:
          type: string
          description: ID of the grouping dimension value. Only present when the request specifies `group_by`; omitted otherwise. The value is a plan ID when `group_by=plan`, an application ID when `group_by=application`, or a workspace ID when `group_by=workspace` (account-level endpoints only). Without `group_by` you get one bucket per time period; with `group_by` you get one bucket per (time period x dimension value), so consumers can break down counts or minutes by plan, application, or workspace.
          x-mabl-scope: public
        group_name:
          type: string
          description: Human-readable name of the group corresponding to `group_id`. Populated on a best-effort basis — may be absent for deleted or otherwise unresolvable entities. Not guaranteed unique; use `group_id` for joins.
          x-mabl-scope: public
        total_execution_seconds:
          type: integer
          description: Sum of (end_time - start_time) in whole seconds across every completed run whose `start_time` falls within the bucket. Measures time spent executing, not time queued. In-flight runs are excluded.
          format: int64
          x-mabl-scope: public
        total_test_runs:
          type: integer
          description: Number of completed runs contributing to `total_execution_seconds`. Excludes in-flight runs. This is NOT the same as the equivalent field on `testRunCounts`, which includes in-flight runs.
          format: int64
          x-mabl-scope: public
      description: Aggregated execution time for a single time bucket, optionally scoped to a grouping dimension value when `group_by` is set. Only completed runs are included in this bucket's totals.
      x-mabl-scope: public
    ActivityFeed:
      type: object
      properties:
        entries:
          type: array
          description: All activity logs that match the query
          readOnly: true
          items:
            $ref: '#/components/schemas/ActivityFeedEntry'
          x-mabl-scope: public
        cursor:
          type: string
          description: Cursor used for pagination
          readOnly: true
          x-mabl-scope: public
    MonthlyConcurrentUsersSummary:
      type: object
      properties:
        month:
          type: string
