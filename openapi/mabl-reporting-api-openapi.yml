          format: double
          x-mabl-scope: public
      description: Performance metrics returned by the bulk query endpoint
    TimingSummary:
      type: object
      properties:
        find_time_ms:
          type: integer
          description: Total time spent in finds for this run
          format: int64
        find_extra_wait_time_ms:
          type: integer
