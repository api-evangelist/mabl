          format: int64
      description: Sumamry of various timing measures for this run
    GuardrailRefusal:
      type: object
      properties:
        id:
          type: string
          description: The id of the guardrail policy that decided the refusal.
        reason:
          type: string
          description: Why the policy refuses the request, written for the person the agent acts for.
        decision_id:
          type: string
          description: The id of this decision in the guardrail decision log.
        action:
          type: string
          description: The action the request was evaluated as, written Verb::Resource (for example Delete::Test), as declared by the operation's x-mabl-action extension.
        policy_source:
          type: string
          description: 'Who set the deciding policy: workspace for a rule the workspace''s owners wrote, account for a rule set for the workspace''s account, mabl_agent_type for the agent type''s ceiling, and mabl_default for mabl''s own defaults.'
        approval:
          description: The approval for this request; present when error_code is approval_required and the approval could be recorded. Without it the request cannot be approved.
          allOf:
          - $ref: '#/components/schemas/GuardrailApprovalRef'
      description: The guardrail policy that refused an agent request.
    TestRunResults:
      type: object
      properties:
        workspace_id:
          type: string
          description: Workspace ID
          readOnly: true
          x-mabl-scope: public
        workspace_name:
          type: string
          description: Workspace name
          readOnly: true
          x-mabl-scope: public
        earliest_run_start_time:
          type: integer
          description: Beginning of the time range used to identify runs
          format: int64
          readOnly: true
          x-mabl-scope: public
        latest_run_start_time:
          type: integer
          description: End of the time range used to identify runs
          format: int64
          readOnly: true
          x-mabl-scope: public
        number_of_runs:
          type: integer
          description: Number of runs in this page, equal to the length of test_results. This is not a total for the requested time range and can be smaller than limit, even zero, when a cursor is returned; follow cursor until it is absent to enumerate every run in the range. number_of_successful_runs and number_of_failed_runs do not necessarily sum to this value, because runs in any other status count toward neither.
          format: int32
          readOnly: true
          x-mabl-scope: public
        number_of_successful_runs:
          type: integer
          description: Number of runs in this page that completed successfully
          format: int32
          readOnly: true
          x-mabl-scope: public
        number_of_failed_runs:
          type: integer
          description: Number of runs in this page that failed
          format: int32
          readOnly: true
          x-mabl-scope: public
