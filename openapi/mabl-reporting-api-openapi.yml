        failure_reason_assigned_by_id:
          type: string
          description: The ID of the user or system that assigned the failure reason. Server-managed; client-supplied values are ignored on write.
        failure_reason_assigned_time:
          type: integer
          description: Timestamp in epoch milliseconds when the failure reason was assigned. Server-managed; client-supplied values are ignored on write.
          format: int64
      description: Information describing the cause of a test run failure
    PlanRunResultSummary:
      type: object
      properties:
        workspace_id:
          type: string
          description: Workspace ID
          readOnly: true
          x-mabl-scope: public
        workspace_name:
          type: string
          description: Workspace name
          readOnly: true
          x-mabl-scope: public
        plan_id:
          type: string
          description: Plan ID
          readOnly: true
          x-mabl-scope: public
        plan_run_id:
          type: string
          description: Plan run ID
          readOnly: true
          x-mabl-scope: public
        plan_name:
          type: string
          description: Plan name
          readOnly: true
          x-mabl-scope: public
        plan_labels:
          type: array
          description: Plan labels
          readOnly: true
          items:
            type: string
          x-mabl-scope: public
        trigger_type:
          type: string
          description: Type of trigger that caused this plan run
          readOnly: true
          enum:
          - manual
          - retry
          - schedule
          - customer_event
          - insight
          x-mabl-scope: public
        triggering_deployment_event_id:
          type: string
          description: Deployment event ID that triggered this plan run, if any
          readOnly: true
          x-mabl-scope: public
        application_id:
          type: string
          description: Application ID
          readOnly: true
          x-mabl-scope: public
        application_name:
          type: string
          description: Application name
          readOnly: true
          x-mabl-scope: public
        environment_id:
          type: string
          description: Environment ID
          readOnly: true
          x-mabl-scope: public
        environment_name:
          type: string
          description: Environment name
          readOnly: true
          x-mabl-scope: public
        status:
          type: string
          description: Current status of the plan run
          readOnly: true
          enum:
          - queued
          - pre_execution
          - scheduling
          - scheduled
          - succeeded
          - failed
          - cancelled
          - post_execution
          - completed
          - terminated
          x-mabl-scope: public
        success:
          type: boolean
          description: True if this plan run completed successfully
          readOnly: true
          x-mabl-scope: public
        failure_analysis:
          $ref: '#/components/schemas/FailureRootCauseAnalysis'
        test_results:
          type: array
          description: Summaries for each test run in this plan run
          readOnly: true
          items:
            $ref: '#/components/schemas/TestRunResultSummary'
          x-mabl-scope: public
