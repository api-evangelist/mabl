openapi: 3.2.0
info:
  title: mabl Quota API
  description: APIs for interacting with mabl services
  version: 0.599.3.1792436330
  x-readme-id: 62c896636916ce01d2ff4f5a
servers:
- url: /
security:
- basicAuth: []
- bearerAuth: []
tags:
- name: Quota
paths:
  /quotas:
    get:
      tags:
      - Quota
      summary: Get Quota with query params
      operationId: getQuotaByWorkspaceId
      parameters:
      - name: workspaceId
        in: query
        description: The workspace ID the query belongs to
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '201':
          description: The quota that was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quota'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::Quota
    put:
      tags:
      - Quota
      summary: Create or update a Quota
      description: Used to create or update a quota. Each workspace can have at most 1 quota.
      operationId: createOrUpdateQuota
      requestBody:
        description: The quota to create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Quota'
        required: true
      responses:
        '201':
          description: The quota that was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quota'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Create::Quota
  /quotas/{id}:
    get:
      tags:
      - Quota
      summary: Get quota
      description: Used to retrieve an quota by ID
      operationId: getQuota
      parameters:
      - name: id
        in: path
        description: The ID of the quota to retrieve
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: The quota with the given ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quota'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Quota not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::Quota
    delete:
      tags:
      - Quota
      summary: Remove Quota
      description: Used to remove an quota
      operationId: removeQuota
      parameters:
      - name: id
        in: path
        description: The ID of the quota to remove
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: The quota that was removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quota'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Quota not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Delete::Quota
components:
  responses:
    ErrorResponse400:
      description: Invalid or missing parameter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse401:
      description: User not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse403:
      description: User not authorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse:
      description: Unknown error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
  schemas:
    Allocation:
      required:
      - resource
      - value
      type: object
      properties:
        resource:
          type: string
          description: The resource for this allocation
          enum:
          - performance
        sub_resource:
          type: string
          description: The sub resource for this allocation
          enum:
          - api
          - browser
        value:
          type: integer
          description: The remaining allocation
          format: int64
      description: Represents an allocation of resources that is reduced over time through usage, e.g. performance VUH
    Quota:
      type: object
      properties:
        id:
          type: string
          description: The ID of the quota
          readOnly: true
        created_time:
          type: integer
          description: Time at which the quota was created
          format: int64
          readOnly: true
        created_by_id:
          type: string
          description: The ID of the user who created this quota
          readOnly: true
        last_updated_time:
          type: integer
          description: Time at which the quota was last updated
          format: int64
          readOnly: true
        last_updated_by_id:
          type: string
          description: The ID of the user who last updated this quota
          readOnly: true
        workspace_id:
          type: string
          description: The ID of the workspace associated with this quota
        trial_default_limits:
          type: integer
          x-enum-int-values:
          - name: ANDROID_RUNNER
            value: 5
          - name: IOS_RUNNER
            value: 3
          - name: ANDROID_TRAINING_SESSION
            value: 3
          - name: IOS_TRAINING_SESSION
            value: 2
        paid_default_limits:
          type: integer
          x-enum-int-values:
          - name: ANDROID_RUNNER
            value: 10
          - name: IOS_RUNNER
            value: 5
          - name: ANDROID_TRAINING_SESSION
            value: 10
          - name: IOS_TRAINING_SESSION
            value: 3
        limits:
          type: array
          items:
            $ref: '#/components/schemas/Limit'
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/Allocation'
      x-implements-interface:
      - ActivityTrackingBaseEntity
      - HasWorkspaceId
    ErrorResponseGeneric:
      type: object
      properties:
        id:
          type: string
          x-mabl-scope: public
        code:
          maximum: 599
          minimum: 100
          type: integer
          format: int32
          x-mabl-scope: public
        message:
          type: string
          x-mabl-scope: public
        error_code:
          type: string
          description: Machine-readable reason for the error, present only when the API names one. Values are guardrail_blocked (a guardrail policy refused an agent request), approval_required (a guardrail policy requires a person to approve the request first).
        guardrail:
          description: The guardrail policy that refused the request; present only when error_code is guardrail_blocked or approval_required.
          allOf:
          - $ref: '#/components/schemas/GuardrailRefusal'
    Limit:
      type: object
      properties:
        resource:
          type: string
          description: Represents a fixed limit on concurrent use of a resource, e.g. 10 concurrent Safari executions
          enum:
          - link
          - browser
          - api
          - performance
          - permanent_mailbox
          - mobile
          - agent_session
        sub_resource:
          type: string
          description: The sub resource name the limit restricts. This is nullable.
          enum:
          - mac
          - linux
          - windows
          - runner
          - link_runner_per_execution
          - max_permanent_mailboxes
          - emails_to_permanent_mailbox_in_last_hour
          - emails_to_permanent_mailbox_in_last_24_hours
          - android_cloud_training_session
          - ios_cloud_training_session
          - android_cloud_runner
          - ios_cloud_runner
          - test_authoring_cloud_session
          - fa_burst_min_failures
          - fa_burst_fraction_pct
          - fa_burst_workspace_cap
          - fa_burst_workspace_window_minutes
          - fa_burst_plan_run_cap
          - fa_burst_plan_run_window_minutes
        value:
          type: integer
          description: The size of the limit
          format: int32
    GuardrailApprovalRef:
      type: object
      properties:
        id:
          type: string
          description: The approval's id.
        state:
          description: Where the approval stands.
          allOf:
          - $ref: '#/components/schemas/GuardrailApprovalState'
        kind:
          description: Who decides the approval.
          allOf:
          - $ref: '#/components/schemas/GuardrailApprovalKind'
        request_expires_time:
          type: integer
          description: When the approval expires if nobody decides it, in epoch milliseconds.
          format: int64
        url:
          type: string
          description: The mabl app page where a person reviews the approval.
      description: 'An approval a guardrail policy asks for. While it is PENDING, stop: give the person the url, tell them the request is waiting for approval, and do not repeat the request or poll in a loop. Once a person tells you it is APPROVED, repeat the identical request with the header X-Mabl-Approval set to id. DENIED means a person said no, so do not work around it.'
    GuardrailApprovalState:
      type: string
      description: Where a guardrail approval stands. PENDING awaits a decision and expires undecided after 24 hours; APPROVED lets the agent repeat the request, as often as it does, for 20 minutes; DENIED refuses the same request for 20 minutes after the decision, after which asking again opens a new approval; CANCELLED means a person withdrew it while pending or revoked it while approved. EXPIRED and CANCELLED are final.
      enum:
      - PENDING
      - APPROVED
      - DENIED
      - EXPIRED
      - CANCELLED
    GuardrailRefusal:
      type: object
      properties:
        id:
          type: string
          description: The id of the guardrail policy that decided the refusal.
        reason:
          type: string
          description: Why the policy refuses the request, written for the person the agent acts for.
        decision_id:
          type: string
          description: The id of this decision in the guardrail decision log.
        action:
          type: string
          description: The action the request was evaluated as, written Verb::Resource (for example Delete::Test), as declared by the operation's x-mabl-action extension.
        policy_source:
          type: string
          description: 'Who set the deciding policy: workspace for a rule the workspace''s owners wrote, account for a rule set for the workspace''s account, mabl_agent_type for the agent type''s ceiling, and mabl_default for mabl''s own defaults.'
        approval:
          description: The approval for this request; present when error_code is approval_required and the approval could be recorded. Without it the request cannot be approved.
          allOf:
          - $ref: '#/components/schemas/GuardrailApprovalRef'
      description: The guardrail policy that refused an agent request.
    GuardrailApprovalKind:
      type: string
      description: Who decides a guardrail approval. SELF is decided by the person the agent acts for; WORKSPACE, for an agent acting for an API key, by a workspace owner or editor.
      enum:
      - SELF
      - WORKSPACE
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: apiKey
      name: Authorization
      in: header
