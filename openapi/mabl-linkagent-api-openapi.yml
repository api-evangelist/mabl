    LinkMigrationFlagSourceEnum:
      type: string
      description: Where a Link migration flag is turned on, if anywhere
      enum:
      - account
      - workspace
      - none
    LinkAgentCarrier:
      type: object
      properties:
        router_id:
          type: string
          description: 'The Router these carriers terminate on, and the id the per-carrier debug actions target. Absent when the Agent could not learn it — the carrier is no longer tracked, or the Router advertised none. Not derivable from `endpoint`: behind the load balancer every Router answers on the same address.

            '
          x-mabl-scope: public
        endpoint:
          type: string
          description: 'The carrier wire-form the Agent dialed, e.g. `udp://mabl-quic.link.mabl.com:443` or `wss://mabl-wss.link.mabl.com:443/mablnet/v1/carrier`. Identifies the address the customer''s network has to allow, not the Router — Routers share it.

            '
          x-mabl-scope: public
        protocol:
          description: Transport carrying this group, `mablnet_quic` or `mablnet_wss`. Reported rather than parsed back out of `endpoint`, so no consumer has to know how a substrate spells its scheme.
          allOf:
          - $ref: '#/components/schemas/LinkAgentProtocolEnum'
          x-mabl-scope: public
        count:
          type: integer
          description: Open carriers in this group.
          format: int32
          x-mabl-scope: public
      description: 'One group of the Agent''s open carriers: those terminating on the same Router over the same endpoint. Rebuilt from the worker''s live carrier snapshot on every heartbeat, open carriers only.

        '
      x-mabl-scope: public
    LinkAgentCapacityStatusEnum:
      type: string
      description: 'Capacity health band, used both for the Agent overall and per resource dimension. `healthy` = comfortable headroom; `warning` = approaching a limit (tune or scale soon); `critical` = at/over a limit, or the Agent has already rejected connections for want of capacity; `unknown` = not enough data yet (no heartbeat carrying host stats). As an OS-warning severity only `warning` / `critical` are used.

        '
      enum:
      - healthy
      - warning
      - critical
      - unknown
      x-mabl-scope: public
    LinkMigrationBlockingAgent:
      type: object
      properties:
        agent_id:
          type: string
        label:
          type: string
        version:
          type: string
        last_error:
          type: string
          description: The Agent's most recent Link 3.0 connection error, if it reported one
      description: A live Link Agent without a Link 3.0 connection that blocks its workspace's next migration step
    LinkMigrationWorkspace:
      type: object
      properties:
        workspace_id:
          type: string
        workspace_name:
          type: string
        account_id:
          type: string
        account_name:
          type: string
        company_id:
          type: string
        phase:
          $ref: '#/components/schemas/LinkMigrationPhaseEnum'
        held:
          type: boolean
          description: The account excludes link_protocol_mablnet, which marks it as not to be migrated by fleet tooling
        native_link_3:
          type: boolean
          description: The account was created on Link 3.0 rather than migrated to it
        link_protocol_mablnet:
          description: Where link_protocol_mablnet is turned on
          allOf:
          - $ref: '#/components/schemas/LinkMigrationFlagSourceEnum'
        link_proxy_mablnet:
          description: Where link_proxy_mablnet is turned on
          allOf:
          - $ref: '#/components/schemas/LinkMigrationFlagSourceEnum'
        link_protocol_tunnel:
          type: boolean
          description: Whether link_protocol_tunnel is on, from the account or the workspace's labs
        live_agent_count:
          type: integer
          format: int32
        link_3_capable_agent_count:
          type: integer
          description: Live Agents running a Link 3.0 capable version
          format: int32
        link_3_connected_agent_count:
          type: integer
          description: Live Agents with a working Link 3.0 connection
          format: int32
        blocking_agents:
          type: array
          items:
            $ref: '#/components/schemas/LinkMigrationBlockingAgent'
      description: One workspace's Link 2.0 to 3.0 migration status
    LinkTunnelOwnerType:
      type: string
      description: 'The kind of entity a mablnet tunnel is scoped to — its "owner". `workspace` is the classic scope: one tunnel per workspace. `company` scopes a single tunnel to an entire company, so every workspace under that company shares one mablnet tenant (and one Link Agent fleet) instead of needing a tunnel each. `user` is a personal tunnel scoped to a single user, private to that user — its egress is the user''s own machine, used to route a cloud test run through it. All three are mablnet-only: legacy Link Tunnel is always workspace-scoped.

        '
      enum:
      - workspace
      - company
      - user
      x-mabl-scope: public
    LinkAgentUpstreamProxy:
      type: object
      properties:
        host:
          type: string
          description: Proxy host.
          x-mabl-scope: public
        port:
          type: integer
          description: Proxy port.
          format: int32
          x-mabl-scope: public
        exclusions:
          type: array
          description: Destinations that bypass this proxy and are dialed directly.
          items:
            type: string
          x-mabl-scope: public
      description: 'A fixed upstream HTTP CONNECT proxy applied to customer-test-target dials, with its bypass list. Credentials are never included.

        '
    ErrorResponseGeneric:
      type: object
      properties:
        id:
          type: string
          x-mabl-scope: public
        code:
          maximum: 599
          minimum: 100
          type: integer
          format: int32
          x-mabl-scope: public
        message:
          type: string
          x-mabl-scope: public
        error_code:
          type: string
          description: Machine-readable reason for the error, present only when the API names one. Values are guardrail_blocked (a guardrail policy refused an agent request), approval_required (a guardrail policy requires a person to approve the request first).
        guardrail:
          description: The guardrail policy that refused the request; present only when error_code is guardrail_blocked or approval_required.
          allOf:
          - $ref: '#/components/schemas/GuardrailRefusal'
    LinkAgentConnectionStatus:
      type: object
      properties:
        is_connected:
          type: boolean
          description: 'Whether the Agent currently has a working connection on this protocol. Updated on each heartbeat. Per-protocol state lets mabl ops identify accounts where one protocol is failing (e.g. firewall blocking mablnet''s :443 while legacy `wss` works) without losing the working path.

            '
          x-mabl-scope: public
        last_error:
          type: string
          description: 'Most recent connection error for this protocol, if `is_connected` is false. Empty when the connection is up.

            '
          x-mabl-scope: public
        last_connected_time:
          type: integer
          description: 'Time of the most recent successful connection on this protocol. Helps operators distinguish "never worked" from "worked recently and just dropped". Absent if the Agent has never seen a successful connection for this protocol.

            '
          format: int64
          x-mabl-scope: public
        unreachable_seconds:
          type: integer
          description: 'How long this protocol has been without a working connection, measured by the Agent from its own clock and reset the moment it connects. Absent while `is_connected` is true, and absent on Agents that predate the field.


            A duration rather than a timestamp on purpose: the api compares it against a threshold, and a customer host''s clock can be arbitrarily skewed from mabl''s. This is what lets the api tell a sustained loss of access apart from an Agent that is still on its first connect attempt — see the `link_endpoint_unreachable` advisory.

            '
          format: int64
          x-mabl-scope: public
      description: 'Agent-set per-protocol connection health. Keys align with `endpoints` so operators can pair "where the api told the Agent to go" with "what the Agent reports about it". Reported on heartbeat.

        '
      x-mabl-scope: public
    LinkAgentHostState:
      type: object
      properties:
        cpu_utilization_pct:
          type: number
          description: Host CPU utilization at the most recent sample, as a percentage (0–100) averaged across all cores.
          format: double
          x-mabl-scope: public
        peak_cpu_utilization_pct:
          type: number
          description: Highest CPU-utilization percentage (0–100) observed since the previous heartbeat.
          format: double
          x-mabl-scope: public
        memory_used_bytes:
          type: integer
          description: Host memory in use at the most recent sample, in bytes.
          format: int64
          x-mabl-scope: public
        peak_memory_used_bytes:
          type: integer
          description: Peak host memory in use since the previous heartbeat, in bytes.
          format: int64
          x-mabl-scope: public
        memory_available_bytes:
          type: integer
          description: Host memory available at the most recent sample, in bytes.
          format: int64
          x-mabl-scope: public
        open_fds:
          type: integer
          description: 'Open file descriptors held by the worker process at the most recent sample. Each proxied connection consumes one; compare against `os_settings.open_file_limit` for the dominant connection-ceiling headroom.

            '
          format: int64
          x-mabl-scope: public
        peak_open_fds:
          type: integer
          description: Peak worker open file descriptors since the previous heartbeat.
          format: int64
          x-mabl-scope: public
        ephemeral_ports_in_use:
          type: integer
          description: 'Outbound connections the worker currently holds open, each consuming one ephemeral port — compare against the `os_settings.ephemeral_port_range` size. Counts active connections only; sockets lingering in TIME_WAIT (which still hold a port briefly) are not included.

            '
          format: int64
          x-mabl-scope: public
        peak_ephemeral_ports_in_use:
          type: integer
          description: Peak worker ephemeral-port usage since the previous heartbeat.
          format: int64
          x-mabl-scope: public
        connections_rejected:
          type: integer
          description: 'Cumulative count, since the worker process started, of outbound dials the worker rejected because a host resource limit was hit (open-file-descriptor or ephemeral-port exhaustion) — not ordinary connection-refused/timeout failures. The unambiguous saturation signal: any nonzero value means the Agent has already turned customer traffic away for want of capacity.

            '
          format: int64
          x-mabl-scope: public
        load_average:
          type: number
          description: 'System load average (1-minute) at the most recent sample, from the JVM OperatingSystemMXBean. Compare against `cpu_cores`: a load approaching or exceeding the core count means the run queue is backed up (CPU- or IO-bound) in a way instantaneous CPU% can miss. Absent on Windows (the JVM doesn''t expose it there).

            '
          format: double
          x-mabl-scope: public
        swap_used_bytes:
          type: integer
          description: 'Swap space in use at the most recent sample, in bytes. Non-zero (and growing) swap use is a memory-pressure signal even when `memory_available_bytes` still looks healthy.

            '
          format: int64
          x-mabl-scope: public
        swap_total_bytes:
          type: integer
          description: Total swap space on the host, in bytes (the denominator for `swap_used_bytes`).
          format: int64
          x-mabl-scope: public
        disk_free_bytes:
          type: integer
          description: 'Free space, in bytes, on the filesystem holding the Agent''s working directory. A full disk breaks worker auto-updates, update staging, and logging.

            '
          format: int64
          x-mabl-scope: public
        disk_total_bytes:
          type: integer
          description: Total size, in bytes, of the filesystem holding the Agent's working directory.
          format: int64
          x-mabl-scope: public
        conntrack_count:
          type: integer
          description: 'Netfilter connection-tracking entries currently in use at the most recent sample (Linux `nf_conntrack_count`). On a connection-heavy host behind a stateful firewall/NAT, conntrack-table exhaustion drops new connections before any FD/port limit is hit. Absent when the conntrack module isn''t loaded.

            '
          format: int64
          x-mabl-scope: public
        peak_conntrack_count:
          type: integer
          description: Peak netfilter conntrack entries observed since the previous heartbeat.
          format: int64
          x-mabl-scope: public
        udp_rcvbuf_errors:
          type: integer
          description: 'UDP datagrams the kernel dropped for lack of receive-buffer space since the previous heartbeat (Linux `/proc/net/snmp` `Udp: RcvbufErrors`). Read as a trend, not as an attribution: the kernel sums this over **every** UDP socket in the host''s network namespace, so it covers the worker''s QUIC carrier sockets but also everything else on the box — a browser''s QUIC connections, mDNS, a local DNS resolver — and on a general-purpose host those usually dominate it. A nonzero value therefore means inbound UDP throughput is being lost somewhere on the host, not that the carrier lost anything. Correlate with `os_settings.udp_buffer_clamped` before concluding the buffers are too small: that flag is what says a requested socket buffer was actually capped, and it is the only case where raising `net.core.rmem_max` changes the outcome. Absent off Linux.

            '
          format: int64
          x-mabl-scope: public
      description: 'Host + worker-process resource-utilization snapshot the Agent assembles at heartbeat time. CPU and memory are host-wide, read from the JVM''s OperatingSystemMXBean (so they include the worker subprocess); the file-descriptor, ephemeral-port, and connection-rejection counts are the worker process''s own, pushed to the Agent over the worker IPC. Current samples plus high-water marks since the previous heartbeat — peaks matter for "how close to its limits" because a periodic sample misses bursts. Pair with the static `cpu_cores` / `total_memory_bytes` / `os_settings` on the Agent for the headroom denominators.

        '
      x-mabl-scope: public
    LinkAgentMablnetState:
      type: object
      properties:
        carriers_open:
          type: integer
          description: Number of carriers currently in OPEN state.
          format: int32
          x-mabl-scope: public
        carriers:
          maxItems: 32
          type: array
          description: 'The Agent''s open carriers, one row per (Router, endpoint) pair — so an Agent holding both a QUIC and a WSS carrier to the same Router reports two rows, and the count of distinct `router_id` values answers "is this Agent multi-homed?". Rows rather than a map keyed by endpoint because behind the load balancer every carrier on a substrate dials the same address, which cannot tell Routers apart. Empty until the worker''s first carrier-stats push and once that snapshot goes stale, alongside `carriers_open` reading 0.

            '
          items:
            $ref: '#/components/schemas/LinkAgentCarrier'
          x-mabl-scope: public
        peer_count:
          type: integer
          description: Number of remote peer Hosts the Agent's Host currently knows about.
          format: int32
          x-mabl-scope: public
        socks_streams_active:
          type: integer
          description: Number of inbound SOCKS5 streams currently active (handshake + bridging).
          format: int32
          x-mabl-scope: public
        socks_streams_total:
          type: integer
          description: Total inbound SOCKS5 streams accepted since the process started.
          format: int64
          x-mabl-scope: public
        rtt_p50_ms:
          type: number
          description: p50 of recent carrier RTT, in milliseconds.
          format: double
          x-mabl-scope: public
        rtt_p99_ms:
          type: number
          description: p99 of recent carrier RTT, in milliseconds.
          format: double
          x-mabl-scope: public
        send_window_saturation_pct:
          type: number
          description: 'Share of the last heartbeat window (0-100) during which the Agent''s tunnel send path was network-bound — SOCKS sessions sitting at their in-flight write-window high-water mark, i.e. customer data queued behind available tunnel capacity. Computed by the Agent from the worker''s cumulative saturation clock; clamped, so overlapping saturated sessions read as fully saturated rather than >100. Sustained high values mean the tunnel itself (not the host) is the constraint — the "add Link Agents" signal. Absent when the Agent or worker predates the signal.

            '
          format: double
          x-mabl-scope: public
        worker_version:
          type: string
          description: 'Version of the native mablnet host worker binary the Agent is currently running. Distinct from the Agent''s top-level `version` (the Agent software / distribution version): the worker self-updates on its own channel, so this tracks the running worker generation independently. Absent until the worker has started.

            '
          x-mabl-scope: public
      description: Per-Host mablnet snapshot, populated by the Agent from MablnetClient.
      x-mabl-scope: public
    LinkMigrationWorkspaceList:
      type: object
      properties:
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/LinkMigrationWorkspace'
      description: The Link 2.0 to 3.0 migration status of every workspace with a live Link Agent
    LinkAgent:
      type: object
      properties:
        id:
          type: string
          description: UUID for this Link Agent instance
          x-mabl-scope: public
        created_time:
          type: integer
          description: Time at which the Link Agent was created
          format: int64
          readOnly: true
          x-mabl-scope: public
        created_by_id:
          type: string
          description: The principal that registered this Link Agent — normally the API key the agent runs under. Server-set from the authenticated caller; supplying it is ignored. Activity feed attribution reads this, so an agent without it is reported as having been registered by mabl itself.
          readOnly: true
          x-mabl-scope: public
        last_updated_time:
          type: integer
          description: Time at which the Link Agent record last changed
          format: int64
          readOnly: true
          x-mabl-scope: public
        last_updated_by_id:
          type: string
          description: The principal behind the most recent change to this Link Agent — the API key for a status change reported by the agent, or the user who started or ended a maintenance window. Server-set from the authenticated caller; supplying it is ignored.
          readOnly: true
          x-mabl-scope: public
        deleted_time:
          type: integer
          description: Time at which the Link Agent was stopped or removed
          format: int64
          readOnly: true
          x-mabl-scope: public
        last_heartbeat_time:
          type: integer
          description: Time at which the Link Agent last sent a heartbeat
          format: int64
          readOnly: true
          x-mabl-scope: public
        version:
          type: string
          description: The version of the Link Agent software that this instance is running
          x-mabl-scope: public
        distribution:
          $ref: '#/components/schemas/LinkAgentDistributionEnum'
        update_available:
          type: boolean
          description: 'Whether a newer Link Agent release than this agent''s version is available for download. Computed for the Java distribution only — the mabl-cli distribution self-updates via its own channels and its version is not comparable to Java releases. Server-computed on read; absent when it cannot be determined (the mabl-cli distribution, an unknown or unparseable agent version, or the release inventory being unavailable).

            '
          readOnly: true
        latest_available_version:
          type: string
          description: The newest released Link Agent version, present whenever update_available is computed
          readOnly: true
        label:
          pattern: '[a-z0-9\-]{1,24}'
          type: string
          description: The user-provided label for this Link Agent instance
          x-mabl-scope: public
        point_of_contact:
          type: string
          description: 'Optional point of contact (a name or email address) for this Link Agent, supplied by the operator via config file or command-line at startup. Surfaced so support can tell who to contact about a given Agent. Free-form — not validated as an email.

            '
          x-mabl-scope: public
        no_ssl_verify:
          type: boolean
          description: Flag indicating whether the agent was started with SSL verification disabled
          x-mabl-scope: public
        tunnel_port:
          maximum: 65535
          minimum: 1
          type: integer
          description: DEPRECATED - Not used as of Link 2.0
          format: int32
        hostname:
          type: string
          description: The Link Agent instance's local hostname
          x-mabl-scope: public
        machine_identity:
          maxLength: 128
          type: string
          description: 'Opaque persisted per-machine identity — a mabl-minted UUID stored in the standard OS-specific mabl config directory — required when announcing a personal (`user`-owned) tunnel. The server derives the tunnel''s label from it (SHA-256 of `machine_identity ":" link_infrastructure_key`, lowercase hex, truncated to the 24-char label limit), so one machine keeps one stable tunnel identity per cluster across restarts, reboots, and hostname changes. Not used for workspace- or company-owned agents.

            '
          x-mabl-scope: public
        link_infrastructure_key:
          type: string
          description: 'On request, personal (`user`-owned) announces only: the explicit placement choice when the user''s workspace associations resolve to more than one link infrastructure — the ambiguous announce fails with an error naming the candidate keys, and the shared cluster''s key is always a valid choice. Omit when the associations are unambiguous. Ignored on requests for workspace- and company-owned agents. On response, for every agent: the link infrastructure key of the dedicated cluster this agent''s tunnel is on, omitted on the shared cluster (absent means shared). A personal tunnel reports its recorded placement; a workspace or company agent its owning company''s current key, which changes when the company moves between clusters. An agent fetches its peer-CA bundle for this key (`GET /link/mablnet/peer-ca?infrastructure_key=`).

            '
          x-mabl-scope: public
        address:
          type: string
          description: The Link Agent instance's local IP address
          x-mabl-scope: public
        java_version:
          type: string
          description: Value of the 'java.version' Java system property
          x-mabl-scope: public
        java_vm_name:
          type: string
          description: Value of the 'java.vm.name' Java system property
          x-mabl-scope: public
        operating_system_architecture:
          type: string
          description: Value of the 'os.arch' Java system property
          x-mabl-scope: public
        operating_system_name:
          type: string
          description: Value of the 'os.name' Java system property
          x-mabl-scope: public
        operating_system_version:
          type: string
          description: Value of the 'os.version' Java system property
          x-mabl-scope: public
        cpu_cores:
          type: integer
          description: Number of CPU cores available to the Agent host — the headroom denominator for CPU utilization.
          format: int32
          x-mabl-scope: public
        total_memory_bytes:
          type: integer
          description: Total physical memory on the Agent host, in bytes — the headroom denominator for memory utilization.
          format: int64
          x-mabl-scope: public
        tunnels_on_host:
          type: integer
          description: 'How many tunnels this Agent process supervises, as the Agent itself counts them. Every mablnet tunnel runs its own worker process, so this is the multiplier on the host''s memory requirement — the api pairs it with `total_memory_bytes` to flag an undersized host. Each of a multi-tunnel process''s Agent records reports the same value. Reported by the Agent rather than derived from records sharing a hostname, which containers and cloned VM images make unreliable. Absent from Agents predating the field.

            '
          format: int32
          x-mabl-scope: public
        os_settings:
          $ref: '#/components/schemas/LinkAgentOsSettings'
        capacity:
          $ref: '#/components/schemas/LinkAgentCapacity'
        protocol:
          $ref: '#/components/schemas/LinkAgentProtocolEnum'
        protocols:
          type: array
          description: 'The set of protocols this Link Agent is currently attempting to keep connections open for. Successor to the singular `protocol` field. A dual-stack Agent during the mablnet migration reports both `wss` (legacy Link Tunnel) and one of the `mablnet_*` values; mabl ops watches this set to determine which accounts are migration-eligible.

            '
          items:
            $ref: '#/components/schemas/LinkAgentProtocolEnum'
          x-mabl-scope: public
        capabilities:
          type: array
          description: 'Optional behaviors this Link Agent supports. Reported by the Agent at startup. Operator endpoints that depend on Agent-side handling (`POST /link/agents/{id}/maintenance`, etc.) reject requests when the relevant capability is missing — older Agents that predate the capability simply omit it.

            '
          items:
            $ref: '#/components/schemas/LinkAgentCapabilityEnum'
          x-mabl-scope: public
        is_connected:
          type: boolean
          description: 'DEPRECATED: legacy single-protocol connection state. Agents reporting `protocols` populate `endpoints` with per-protocol connection state; this field stays populated as `true` if any of the per-protocol states are connected.

            '
          x-mabl-scope: public
        current_link_server_id:
          type: string
          description: 'DEPRECATED: legacy single-Link-Server binding. Mablnet Agents are not bound to a single Server — they multi-home across Routers. Stays populated for legacy Agents.

            '
          x-mabl-scope: public
        current_link_server_endpoint:
          type: string
          description: 'DEPRECATED: legacy single-endpoint field. Use `endpoints[wss].address` for the same value; the legacy field stays populated for pre-mablnet Agents that don''t yet understand the `endpoints` map.

            '
          x-mabl-scope: public
        endpoints:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/LinkAgentEndpoint'
          description: 'Per-protocol endpoint the Link Agent should connect to, keyed by protocol name (matches `LinkAgentProtocolEnum`). Legacy Link Tunnel Agents only see (and need) the `wss` entry, which mirrors `current_link_server_endpoint`. Mablnet-capable Agents additionally see `mablnet_wss` and (when UDP/QUIC is exposed externally) `mablnet_quic`, pointing at the Application LB FQDN for this environment.

            api-set and read-only from the client perspective: the value flows api → Agent. Per-protocol connection health flowing the other direction (Agent → api) is reported via `connection_status`.

            Computed on every read from the LinkLabel + workspace migration flags + deployment config (`com.mabl.mablnet.domain` + the owner''s link infrastructure key); NOT persisted on the LinkAgent itself. A feature-flag flip, FQDN change, or LinkLabel-level update propagates to running Agents on their next poll (≈ 10 s), with no agent restart and no backfill cron. Downstream consumers that need the same view (BigQuery, Pub/Sub) should read via the api rather than the raw DAO entity.

            '
          readOnly: true
          x-mabl-scope: public
        connection_status:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/LinkAgentConnectionStatus'
          description: 'Per-protocol connection health, keyed by protocol name (same keys as `endpoints`). Reported by the Agent on heartbeat and merged in.

            '
          x-mabl-scope: public
        mablnet_tenant_id:
          type: integer
          description: 'Denormalised view of `LinkLabel.mablnet_tenant_id` for this Agent''s label. Computed on every read alongside `endpoints` (see that field''s description for the full server-set-fields contract); NOT persisted on the LinkAgent. Tenant ids themselves are immutable for a LinkLabel''s lifetime, so the value is stable across reads in practice.

            '
          format: int64
          readOnly: true
          x-mabl-scope: public
        mablnet_tenant_id_hex:
          type: string
          description: 'Zero-padded 8-character lowercase hex form of `mablnet_tenant_id`, e.g. `bee85e2b`. Provided for log/grep/observability ergonomics; the numeric and hex forms always agree (both computed together). Same lifecycle as `mablnet_tenant_id` — computed on every read, not persisted.

            '
          readOnly: true
          x-mabl-scope: public
        status:
          type: string
          description: The current status of the Link Agent
          enum:
          - initializing
          - updating
          - announcing
          - locating
          - connecting
          - ready
          - draining
          - drained
          - terminated
          x-mabl-scope: public
        maintenance:
          $ref: '#/components/schemas/LinkAgentMaintenance'
        operator_tunables:
          $ref: '#/components/schemas/LinkAgentOperatorTunables'
        operator_tunables_overrides:
          $ref: '#/components/schemas/LinkAgentOperatorTunables'
        agent_state:
          $ref: '#/components/schemas/LinkAgentState'
        agent_configuration:
          $ref: '#/components/schemas/LinkAgentConfiguration'
        operator_debug_queue:
          maxItems: 16
          type: array
          description: 'Debug requests queued by mabl ops for this Agent to execute on its next poll. Bounded — the api rejects enqueues that would exceed `maxItems`. The Agent drains entries on its next tick, executes idempotently (and short-circuits any `request_id` it''s seen recently), and acks the outcome via `operator_debug_results` on the next heartbeat. The api drops the matching queue entry on ack so the queue stays self-draining.

            '
          items:
            $ref: '#/components/schemas/LinkAgentOperatorDebugRequest'
          x-mabl-scope: public
        operator_debug_results:
          maxItems: 16
          type: array
          description: 'Acks pushed by the Agent on heartbeat for previously-queued debug requests. The api matches by `request_id`, drops the matching queue entry, and surfaces the outcome to whichever caller originally enqueued the request.

            '
          items:
            $ref: '#/components/schemas/LinkAgentOperatorDebugResult'
          x-mabl-scope: public
        workspace_id:
          type: string
          description: 'The workspace that owns this Link Agent, for `workspace`-owned tunnels. Unset for `company`-owned agents (mablnet-only) — read `owner_type`/`owner_id` for the canonical scope.

            '
          x-mabl-scope: public
        owner_type:
          $ref: '#/components/schemas/LinkTunnelOwnerType'
        owner_id:
          type: string
          description: 'The id of the owning entity — equals `workspace_id` for `workspace`-owned agents, the company id for `company`-owned agents.

            '
          x-mabl-scope: public
      description: Represents a single instance of a running Link Agent
      x-implements-interface:
      - HasId
      - HasWorkspaceId
      - HasCreatedActivity
      - HasUpdatedActivity
    LinkAgentOsSettings:
      type: object
      properties:
        open_file_limit:
          type: integer
          description: 'Soft `RLIMIT_NOFILE` — the max open file descriptors the process may hold and the limit that actually binds at runtime. Each proxied connection consumes one. `-1` means unlimited. The common Linux default (1024) is low for a busy tunnel.

            '
          format: int64
          x-mabl-scope: public
        open_file_limit_hard:
          type: integer
          description: 'Hard `RLIMIT_NOFILE` — the ceiling the soft limit can be raised to without privilege. `-1` means unlimited. When this is also low, raising the soft limit needs a `limits.conf` / systemd change rather than a plain `ulimit -n`.

            '
          format: int64
          x-mabl-scope: public
        max_user_processes:
          type: integer
          description: 'Soft `RLIMIT_NPROC` — the max processes/threads for the Agent''s user. `-1` means unlimited. JVM and worker threads (Netty event loops, etc.) count against it.

            '
          format: int64
          x-mabl-scope: public
        ephemeral_port_range_low:
          type: integer
          description: 'Low end of `net.ipv4.ip_local_port_range` — the first ephemeral port the kernel hands out to outbound connections. With `ephemeral_port_range_high` it bounds how many simultaneous outbound connections (per remote tuple) the host can open.

            '
          format: int32
          x-mabl-scope: public
        ephemeral_port_range_high:
          type: integer
          description: High end of `net.ipv4.ip_local_port_range` (inclusive).
          format: int32
          x-mabl-scope: public
        socket_recv_buffer_max:
          type: integer
          description: '`net.core.rmem_max` — the max receive socket buffer (bytes) an application may request. Caps carrier throughput on high-latency links when set below what the carrier asks for (the default of ~208 KB is a common bottleneck).

            '
          format: int64
          x-mabl-scope: public
        socket_send_buffer_max:
          type: integer
          description: '`net.core.wmem_max` — the max send socket buffer (bytes) an application may request.

            '
          format: int64
          x-mabl-scope: public
        udp_recv_buffer_achieved:
          type: integer
          description: 'Actual `SO_RCVBUF` (bytes) a UDP socket obtains when it requests the QUIC carrier''s target buffer — the post-clamp value `getsockopt` returns, which the kernel caps near `net.core.rmem_max` (and doubles for bookkeeping on Linux). The Agent measures this with a throwaway probe socket, so it is present on every OS (unlike `socket_recv_buffer_max`, which is Linux `/proc`-only). The real signal for whether this host can honor the QUIC carrier''s receive flow-control window.

            '
          format: int64
          x-mabl-scope: public
        udp_send_buffer_achieved:
          type: integer
          description: 'Actual `SO_SNDBUF` (bytes) a UDP socket obtains for the carrier''s target request — the send-side counterpart of `udp_recv_buffer_achieved`, capped near `net.core.wmem_max`.

            '
          format: int64
          x-mabl-scope: public
        udp_buffer_clamped:
          type: boolean
          description: 'True when the achieved UDP socket buffer fell materially short of the QUIC carrier''s request — i.e. the kernel clamped it (the host needs `net.core.rmem_max` / `wmem_max` raised, or, in a container, the host / WSL2 VM tuned). A clamped buffer throttles QUIC throughput on higher-latency links, so this is the health signal for deciding whether to default this host to the QUIC carrier or fall back to WSS.

            '
          x-mabl-scope: public
        conntrack_max:
          type: integer
          description: '`net.netfilter.nf_conntrack_max` — the connection-tracking table size limit, the ceiling for the dynamic `agent_state.host.conntrack_count`. Present only on Linux hosts with the conntrack module loaded (a stateful firewall/NAT); absent otherwise.

            '
          format: int64
          x-mabl-scope: public
      description: 'Static host OS resource limits and network sysctls the Agent reads once at startup (from `/proc` on Linux) and reports on announce. These bind a connection-heavy tunnel well before the mablnet protocol''s own stream ceiling: every proxied connection costs a file descriptor and an outbound ephemeral port, so a low open-file limit or a narrow ephemeral-port range caps how many concurrent connections the Agent — and its worker subprocess, which inherits the Agent''s rlimits — can carry. Surfaced so operators can audit whether a host is tuned for the Agent''s load. Fields are individually omitted when unreadable (e.g. on a non-Linux host), so the object may be sparse or absent.

        '
      x-mabl-scope: public
    LinkAgentConnectionFilter:
      type: object
      properties:
        mode:
          type: string
          description: '`allow` — only listed destinations are reachable; `deny` — listed destinations are refused and all others allowed; `disabled` — no filtering, every destination allowed.

            '
          enum:
          - allow
          - deny
          - disabled
          x-mabl-scope: public
        destinations:
          type: array
          description: 'The host/port rules the mode applies to — `host`, `host:port`, `:port`, IPv4/IPv6 literals, and CIDR ranges (IPv6 bracketed as `[addr]:port`).

            '
          items:
            type: string
          x-mabl-scope: public
      description: A Link Agent's destination allow/deny connection policy.
    LinkAgentMaintenance:
      type: object
      properties:
        drain_started:
          type: integer
          description: When the Agent was placed into maintenance and began draining (epoch millis).
          format: int64
          readOnly: true
          x-mabl-scope: public
        drain_completed:
          type: integer
          description: 'When the Agent finished draining — either all in-flight connections completed or `drain_timeout_seconds` elapsed (status `drained`). Set server-side when the Agent first reports it has drained; absent while the status is still `draining`. When present, the Agent is safe to terminate.

            '
          format: int64
          readOnly: true
          x-mabl-scope: public
        drain_timeout_seconds:
          minimum: 0
          type: integer
          description: 'Operator-supplied upper bound on how long the Agent will wait for in-flight connections to drain before transitioning to `drained`. Omitted for an unbounded wait.

            '
          format: int32
          readOnly: true
          x-mabl-scope: public
      description: 'Operator-requested maintenance state for a Link Agent. While the Agent''s status is `draining` or `drained`, mabl-side routing treats it as ineligible for new traffic (mablnet drains its carriers), but in-flight connections continue to be serviced until they finish or the drain timeout expires. The object persists as a record of the most-recent maintenance window after the Agent returns to service.

        '
      x-mabl-scope: public
    LinkAgentOsWarning:
      type: object
      properties:
        setting:
          type: string
          description: 'The flagged property, and the stable key a client localizes on — one of `open_file_limit`, `ephemeral_port_range`, `socket_buffer_limits`, `host_minimum_memory`, `host_minimum_cpu_cores`, `host_memory`, `link_endpoint_unreachable`. A client that does not recognise a value should skip the advisory: there is no prose here to fall back on.

            '
          x-mabl-scope: public
        severity:
          $ref: '#/components/schemas/LinkAgentCapacityStatusEnum'
        current:
          type: integer
          description: 'The Agent''s current value for the setting. Absent for an advisory that is not about a numeric setting at all (`link_endpoint_unreachable`).

            '
          format: int64
          x-mabl-scope: public
        recommended:
          type: integer
          description: 'The minimum value the api recommends for a busy tunnel. Absent where `current` is.

            '
          format: int64
          x-mabl-scope: public
        params:
          type: object
          additionalProperties:
            type: string
          description: 'Everything this advisory''s copy needs that `current` / `recommended` do not already carry. Keys are stable per `setting`:


            * `open_file_limit` — none; `current` and `recommended` are the whole story.

            * `ephemeral_port_range` — `low`, `high`: the range endpoints (`current` is its size).

            * `socket_buffer_limits` — `variant`: `sysctls_known` when the host''s `net.core.rmem_max` / `wmem_max` were readable and the advice can name them, else `sysctls_unknown`. The two texts differ in structure rather than in values, so a client selects between them (i18next: pass it as `context`) rather than interpolating. Both reproduce from `recommended`; nothing about the remediation needs prose from the api.

            * `host_minimum_memory` — none; `current` and `recommended` (the minimum) are in MiB. Always `critical`: the Agent cannot run its mablnet worker on such a host.

            * `host_minimum_cpu_cores` — none; `current` and `recommended` (the minimum) are cores.

            * `host_memory` — `tunnels`: how many tunnels the host runs, the multiplier behind `recommended`.

            * `link_endpoint_unreachable` — `quic_endpoint` / `wss_endpoint`: the `host:port` the Agent could not reach, present only for an endpoint it actually attempted (a mabl-bound HTTP proxy suppresses the QUIC carrier entirely, and naming an endpoint the Agent never dialled would send the customer after the wrong firewall rule). The Agent''s own account of the failure is on `connection_status[*].last_error`. Plus `variant`: `fallback_available` when the Agent is reporting a working legacy `wss` connection to carry traffic over meanwhile, `no_fallback` when it is not — either because the tunnel is mablnet-only or because the Agent cannot reach anything at all. The two consequences are different sentences, so a client selects between them (i18next: `context`) rather than interpolating. The transport belongs to the key, not a param: `quic_endpoint` is UDP, `wss_endpoint` is TCP.

            '
          x-mabl-scope: public
      description: 'Something about the Agent''s host or network that needs the customer''s action — an OS setting (`open_file_limit`, `ephemeral_port_range`, `socket_buffer_limits`), a host below the published minimums (`host_minimum_memory`, `host_minimum_cpu_cores`), the host''s memory against the tunnels it runs (`host_memory`), or a mabl endpoint the Agent cannot reach (`link_endpoint_unreachable`). Advisory — it flags a condition the customer can fix, distinct from a dimension''s live `status` (which reflects actual utilization). Thresholds live in the api; see the capacity-insights design doc.


        `setting` is a stable key, and `current` / `recommended` / `params` carry every value the copy needs, so a client renders its own localized string from them. There is deliberately no prose here: the api has no request locale, so anything it composed would be English for every reader, and a second copy of a sentence the client owns is only somewhere for the two to drift apart. A client is therefore expected to ship copy for a `setting` before — or with — the api starts sending it, and to skip an advisory whose key it does not recognise.

        '
      x-mabl-scope: public
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: apiKey
      name: Authorization
      in: header
