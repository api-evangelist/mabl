openapi: 3.2.0
info:
  title: mabl Link Agent API
  description: APIs for interacting with mabl services
  version: 0.599.3.1792436330
  x-readme-id: 62c896636916ce01d2ff4f5a
servers:
- url: /
security:
- basicAuth: []
- bearerAuth: []
tags:
- name: LinkAgent
paths:
  /link/agents/distribution-redirect:
    get:
      tags:
      - LinkAgent
      summary: Download Link Agent
      description: Redirect the client to download the latest Link Agent distribution
      operationId: redirectToLatestDistribution
      parameters:
      - name: branch
        in: query
        description: 'Deprecated: use `channel`. The Link Agent branch to retrieve; `branch=main` is `channel=latest`. May not be combined with `channel`.

          '
        required: false
        deprecated: true
        style: form
        explode: true
        schema:
          type: string
      - name: format
        in: query
        description: The format of the distribution to download
        required: false
        style: form
        explode: true
        schema:
          $ref: '#/components/schemas/LinkAgentDistributionFormatEnum'
      - name: auto_update
        in: query
        description: Check for agent updates at start-up?
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          default: true
      - name: channel
        in: query
        description: 'The release channel to download from: `stable` (the default) is the released Link Agent, `latest` is the newest build of the main branch, and any other name is that branch''s build. May not be combined with the deprecated `branch`.

          '
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '302':
          description: Redirect to the latest distribution matching the request
        '304':
          description: If-None-Match predicate was not satisfied (current Link Agent matched one of the given ETags)
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Link Agent distribution not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::LinkAgent
      x-mabl-scope: public
  /link/agents:
    get:
      tags:
      - LinkAgent
      summary: Query Link Agents
      description: Query for Link Agents by workspace ID
      operationId: queryLinkAgents
      parameters:
      - name: workspace_id
        in: query
        description: ID of the workspace for which to query Link Agents
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: label
        in: query
        description: Label for which to query Link Agents
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: max_heartbeat_age_sec
        in: query
        description: If specified, will only return Link Agents that have sent a heartbeat in the past max_heartbeat_age_sec seconds
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        description: The limit to use for pagination
        required: false
        style: form
        explode: true
        schema:
          minimum: 1
          type: integer
          format: int32
      - name: cursor
        in: query
        description: The cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Results of the query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkAgentQueryResult'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::LinkAgent
      x-mabl-scope: public
    post:
      tags:
      - LinkAgent
      summary: Indicates that a new or existing Link Agent instance has been started up
      operationId: onLinkAgentStartup
      requestBody:
        description: Details about the agent
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkAgent'
        required: true
      responses:
        '200':
          description: Complete information about the Link Agent that was started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkAgent'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '410':
          description: Unsupported Link Agent version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::LinkAgent
  /cron/link/agents/cleanup:
    get:
      tags:
      - LinkAgent
      summary: Clean up dead Link Agents
      operationId: cleanupLinkAgents
      responses:
        '204':
          description: Cleanup successful
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Delete::LinkAgent
  /cron/link/agents/metrics:
    get:
      tags:
      - LinkAgent
      summary: Emit fleet-visibility and Link migration metrics for live Link Agents
      operationId: emitLinkAgentMetrics
      responses:
        '204':
          description: Metrics emitted
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::LinkAgent
  /link/migration/workspaces:
    get:
      tags:
      - LinkAgent
      summary: List the Link 2.0 to 3.0 migration status of every workspace with a live Link…
      description: 'Operator-only fleet view of the Link 2.0 to 3.0 migration: one row per workspace that owns a live Link Agent, classified into its migration phase from the workspace''s migration flags and its Agents'' versions and Link 3.0 connection state. See migration-cutover.md in link/mablnet/docs.'
      operationId: listLinkMigrationWorkspaces
      responses:
        '200':
          description: The migration status of each workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkMigrationWorkspaceList'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::LinkAgent
  /link/agents/{id}/heartbeat:
    patch:
      tags:
      - LinkAgent
      summary: Indicates that a Link Agent has sent a heartbeat
      operationId: linkAgentHeartbeat
      parameters:
      - name: id
        in: path
        description: The ID of the agent sending the heartbeat
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: Link Agent update to piggyback on this heartbeat
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkAgent'
        required: false
      responses:
        '204':
          description: Heartbeat acknowledged
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Link Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '410':
          description: Link Agent has been terminated; the Link Agent process should shut down and should not attempt to reconnect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::LinkAgent
  /link/agents/{id}/terminate:
    post:
      tags:
      - LinkAgent
      summary: Terminate Link Agent
      description: Send a shutdown signal to a specific Link Agent. When invoked, the Link Agent process will shut down and will not attempt to reconnect.
      operationId: terminateLinkAgent
      parameters:
      - name: id
        in: path
        description: The ID of the agent to terminate
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '204':
          description: Termination request acknowledged
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::LinkAgent
      x-mabl-scope: public
  /link/agents/{id}/maintenance:
    post:
      tags:
      - LinkAgent
      summary: Place Link Agent into maintenance mode
      description: Place a Link Agent into maintenance mode. mabl-side routing immediately stops treating the Agent as an active target — legacy Link Servers no longer dispatch new requests to it, and the Agent's mablnet Host begins draining its carriers (refusing new streams while continuing to service in-flight ones). The Agent's status moves to `draining` immediately and to `drained` once all in-flight connections have finished. If `drain_timeout_seconds` is supplied, the Agent stops waiting for natural drain after that interval and moves to `drained` regardless; without a timeout it waits indefinitely. The Agent does not auto-shutdown — the final shutdown is left to whatever external orchestrator initiated the maintenance window (use `POST .../terminate` to stop it, or `DELETE` this resource to return it to service). Idempotent; re-posting while still draining updates `drain_timeout_seconds`.
      operationId: enterLinkAgentMaintenance
      parameters:
      - name: id
        in: path
        description: The ID of the agent to place into maintenance mode
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkAgentMaintenanceRequest'
        required: false
      responses:
        '204':
          description: Maintenance-mode request acknowledged
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Link Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::LinkAgent
      x-mabl-scope: public
    delete:
      tags:
      - LinkAgent
      summary: Take Link Agent out of maintenance mode
      description: Take a Link Agent out of maintenance mode. mabl-side routing resumes treating the Agent as eligible for new traffic; the Agent resumes accepting new connections on its next status poll. No-op if the Agent is not in maintenance mode.
      operationId: exitLinkAgentMaintenance
      parameters:
      - name: id
        in: path
        description: The ID of the agent to take out of maintenance mode
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '204':
          description: Exit-maintenance request acknowledged
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Link Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::LinkAgent
      x-mabl-scope: public
  /link/agents/{id}/operator-debug:
    post:
      tags:
      - LinkAgent
      summary: Enqueue an operator debug request for a Link Agent
      description: Append an operator-issued debug request to the Agent's `operator_debug_queue`. The Agent picks it up on its next poll (≈ 10 s), executes idempotently, and acks via `operator_debug_results` on the following heartbeat. The api drops the queued entry on ack — callers watch `operator_debug_results` for the matching `request_id` to learn the outcome.
      operationId: enqueueLinkAgentOperatorDebugRequest
      parameters:
      - name: id
        in: path
        description: The ID of the agent to enqueue the debug request against.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: The debug request to enqueue. `request_id` MUST be unique within the queue.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkAgentOperatorDebugRequest'
        required: true
      responses:
        '202':
          description: Request enqueued. The Agent acks on its next heartbeat.
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Link Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '409':
          description: 'Queue is full (16 entries) or the `request_id` collides with a still-pending request. Caller should drain the queue (let the Agent ack) or pick a fresh id.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Create::LinkAgent
  /link/agents/{id}/server:
    get:
      tags:
      - LinkAgent
      summary: Finds a Link Server for this Link Agent
      operationId: getLinkServerForAgent
      parameters:
      - name: id
        in: path
        description: The ID of the agent for which to find a Link Server
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Connection details about the link server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkServerConnection'
        '204':
          description: Request for Link Server is acknowledged, but the server is not ready for connections yet
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Link Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::LinkAgent
  /link/agents/{id}:
    get:
      tags:
      - LinkAgent
      summary: Get Link Agent
      description: Fetch the current state of a Link Agent, including operator-managed fields like `maintenance`. The Agent itself can poll this on its heartbeat cycle to learn about state changes set externally (entering/exiting maintenance, operator-supplied drain timeout, etc.).
      operationId: getLinkAgent
      parameters:
      - name: id
        in: path
        description: The ID of the agent to fetch
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: The Link Agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkAgent'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Link Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::LinkAgent
    delete:
      tags:
      - LinkAgent
      summary: Removes an existing Link Agent
      operationId: removeLinkAgent
      parameters:
      - name: id
        in: path
        description: The ID of the agent to remove
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: The agent that was deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkAgent'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Link Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Delete::LinkAgent
    patch:
      tags:
      - LinkAgent
      summary: Update operator-controlled fields on a Link Agent
      description: Update operator-managed fields on a Link Agent. v1 surface is restricted to `operator_tunables_overrides` — the only writable field on this endpoint. The resolved `operator_tunables` view that the Agent reads is recomputed on every read (defaults ⊕ label overrides ⊕ agent overrides); see the operator-control-plane design doc for details. To clear all per-Agent overrides at once, use DELETE `/link/agents/{id}/operator-tunables-overrides`.
      operationId: updateLinkAgent
      parameters:
      - name: id
        in: path
        description: The ID of the agent to update
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: If-Match
        in: header
        description: Conditional update — succeeds only if the agent's current ETag matches.
        required: false
        style: simple
        explode: false
        schema:
          type: string
      - name: field_mask
        in: query
        description: 'Comma-separated list of fields to update. If provided, only fields in the mask are written; fields in the mask but absent from the body are cleared. Without a mask the entire sparse body is applied (fields with `x-dao-apply-nulls` honour null-clears).

          '
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      requestBody:
        description: Sparse Link Agent update. Only `operator_tunables_overrides` is honoured.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkAgent'
        required: true
      responses:
        '200':
          description: The updated Link Agent (with the resolved `operator_tunables` view recomputed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkAgent'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Link Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '412':
          description: If-Match precondition failed (ETag mismatch).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::LinkAgent
  /link/agents/{id}/operator-tunables-overrides:
    delete:
      tags:
      - LinkAgent
      summary: Clear all operator-tunable overrides on a Link Agent
      description: Clear every per-Agent operator-tunable override in one call, restoring the Agent to the resolved defaults ⊕ label-level overrides. The resolved `operator_tunables` view is recomputed on the response. To clear a single override instead, PATCH that field to `null` via `PATCH /link/agents/{id}`. Idempotent — clearing when no per-Agent overrides are set is a no-op success.
      operationId: clearLinkAgentOperatorTunablesOverrides
      parameters:
      - name: id
        in: path
        description: The ID of the agent whose operator-tunable overrides should be cleared
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: If-Match
        in: header
        description: Conditional clear — succeeds only if the agent's current ETag matches.
        required: false
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: The updated Link Agent (with the resolved `operator_tunables` view recomputed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkAgent'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Link Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '412':
          description: If-Match precondition failed (ETag mismatch).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::LinkAgent
      x-mabl-scope: public
  /link/owner/{owner_type}/{owner_id}/agents:
    get:
      tags:
      - LinkAgent
      summary: Query Link Agents by owner
      description: Owner-scoped sibling of queryLinkAgents, for the fleet views that span tunnel owners other than a single workspace (the company dashboard). Workspace owners behave exactly like queryLinkAgents; company owners return the company's agents, enriched with the same computed fields as workspace reads. User (personal) owners return the caller's own personal agents — a user tunnel is private to its owner, so this query is authorized self-only (a caller can only list agents they own).
      operationId: queryLinkAgentsByOwner
      parameters:
      - name: owner_type
        in: path
        description: The kind of owner the agents' tunnels are scoped to
        required: true
        style: simple
        explode: false
        schema:
          $ref: '#/components/schemas/LinkTunnelOwnerType'
      - name: owner_id
        in: path
        description: ID of the owner (workspace ID or company ID) whose Link Agents to query
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: label
        in: query
        description: Label for which to query Link Agents
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: max_heartbeat_age_sec
        in: query
        description: If specified, will only return Link Agents that have sent a heartbeat in the past max_heartbeat_age_sec seconds
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        description: The limit to use for pagination
        required: false
        style: form
        explode: true
        schema:
          minimum: 1
          type: integer
          format: int32
      - name: cursor
        in: query
        description: The cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Results of the query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkAgentQueryResult'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::LinkAgent
components:
  responses:
    ErrorResponse400:
      description: Invalid or missing parameter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse:
      description: Unknown error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse403:
      description: User not authorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse401:
      description: User not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
  schemas:
    LinkAgentCapacityResourceEnum:
      type: string
      description: A resource dimension whose live utilization the api compares against its ceiling.
      enum:
      - cpu
      - memory
      - file_descriptors
      - ephemeral_ports
      - conntrack
      - disk
      - network
      x-mabl-scope: public
    LinkAgentDistributionFormatEnum:
      type: string
      description: 'Archive formats the Link Agent is distributed in, plus `msi` — the Windows installer, which registers the agent as a service so that it starts on boot. `auto_update` does not apply to `msi`: there is a single installer, and a service takes upgrades through the installer rather than through the in-place updater, so the parameter is ignored for that format.

        '
      enum:
      - tbz2
      - zip
      - msi
      x-mabl-scope: public
    LinkAgentConfiguration:
      type: object
      properties:
        connection_filter:
          $ref: '#/components/schemas/LinkAgentConnectionFilter'
        proxy_mode:
          $ref: '#/components/schemas/LinkAgentProxyMode'
        http_proxy:
          type: string
          description: 'The configured upstream HTTP CONNECT proxy as `host:port`. Credentials, if any, are omitted — see `proxy_auth_configured`. Absent when no fixed proxy is configured.

            '
          x-mabl-scope: public
        proxy_pac_url:
          type: string
          description: 'The proxy auto-configuration (PAC) URL the Agent evaluates to pick a proxy per destination, when PAC-based proxying is configured. Absent for fixed-proxy or no-proxy setups.

            '
          x-mabl-scope: public
        proxy_exclusions:
          type: array
          description: 'Destinations that bypass the proxy and are dialed directly — suffix, IPv4, IPv6, or CIDR expressions.

            '
          items:
            type: string
          x-mabl-scope: public
        proxy_auth_configured:
          type: boolean
          description: 'Whether proxy credentials (fixed-proxy or PAC) are configured. The credentials themselves are never reported; this flag lets support confirm auth is present when diagnosing a 407 from the customer''s proxy.

            '
          x-mabl-scope: public
        upstream_proxy:
          $ref: '#/components/schemas/LinkAgentUpstreamProxy'
        mablnet_update_channel:
          type: string
