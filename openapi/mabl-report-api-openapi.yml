        description: The ID of the workspace
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: step_id_in_flow
        in: query
        description: The ID of the step in the flow
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: flow_invariant_id
        in: query
        description: The ID of the flow invariant
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: step_id_in_test
        in: query
        description: The ID of the step in the test
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: test_invariant_id
        in: query
        description: The ID of the test invariant
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: metric_type
        in: query
        description: The metric type
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: limit
        in: query
        description: The limit to use for pagination
        required: false
        style: form
        explode: true
        schema:
          maximum: 200
          minimum: 1
          type: integer
          format: int32
          default: 100
      - name: cursor
        in: query
        description: The cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      requestBody:
        description: Filters to get the relevant accessibility checks. Limit of 90 days.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestSuiteFilterOptions'
        required: true
      responses:
        '200':
          description: Step metric trend over time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepMetricTrendResult'
        '400':
          description: Invalid or missing parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '403':
          description: User not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
      x-mabl-action: Read::Report
  /report/settings:
    get:
      tags:
      - Report
      summary: Get all workspace report settings
      description: Gets all of the ReportSetting objects for a given workspace
      operationId: getReportSettings
      parameters:
      - name: workspace_id
        in: query
        description: The ID of the workspace
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: cursor
        in: query
        description: The cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: The ReportSettingQueryResult
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSettingQueryResult'
        '400':
          description: Invalid or missing parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '403':
          description: User not authorized
          content:
