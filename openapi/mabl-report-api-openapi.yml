    GuardrailRefusal:
      type: object
      properties:
        id:
          type: string
          description: The id of the guardrail policy that decided the refusal.
        reason:
          type: string
          description: Why the policy refuses the request, written for the person the agent acts for.
        decision_id:
          type: string
          description: The id of this decision in the guardrail decision log.
        action:
          type: string
          description: The action the request was evaluated as, written Verb::Resource (for example Delete::Test), as declared by the operation's x-mabl-action extension.
        policy_source:
          type: string
          description: 'Who set the deciding policy: workspace for a rule the workspace''s owners wrote, account for a rule set for the workspace''s account, mabl_agent_type for the agent type''s ceiling, and mabl_default for mabl''s own defaults.'
        approval:
          description: The approval for this request; present when error_code is approval_required and the approval could be recorded. Without it the request cannot be approved.
          allOf:
          - $ref: '#/components/schemas/GuardrailApprovalRef'
      description: The guardrail policy that refused an agent request.
    WorkspaceEventMetric:
      type: object
      properties:
        metric_name:
          type: string
          description: Stable identifier for the metric (e.g. auto_heal_insights)
        display_name:
          type: string
          description: Customer-facing label for the metric, matching the Account Value dashboard (e.g. "Auto-heals applied")
        aggregation:
          type: string
          description: 'How this metric aggregates over the date range. "sum" (the default for count metrics) means `count` is the additive total and daily values are counts. "max" means the metric is a daily maximum: `peak` carries the single highest day, `count` is not populated, and daily values are maxima that must not be summed with each other or with sum metrics.'
          enum:
          - sum
          - max
        count:
          type: integer
          description: Total count of this metric in the workspace across the date range. Present only for aggregation "sum" metrics; omitted for "max" metrics (use `peak`).
          format: int64
        peak:
          type: integer
          description: The single highest daily value over the range, for aggregation "max" metrics (e.g. peak concurrent runs). Present only when aggregation is "max". Do not sum this with other metrics — it is a maximum, not a total.
          format: int64
        daily_counts:
          type: array
          description: Per-day values within the range. Days with zero activity are omitted (sparse). Returned in date-ascending order. For "sum" metrics these are counts; for "max" metrics these are that day's maximum.
          items:
            $ref: '#/components/schemas/WorkspaceEventMetricDailyCount'
        description:
          type: string
          description: One- or two-sentence explanation of what the metric counts. Customer-facing.
        benefit:
          type: string
          description: One- or two-sentence statement of what mabl is doing for the customer when this metric increments. Customer-facing.
        benefit_categories:
          type: array
          description: Tags grouping the metric by operational outcome (e.g. false_failure_prevented, defect_escape_reduced, engineering_time_saved). Consumers can group metrics by category to compose audience-appropriate reports.
          items:
            type: string
        cost_levers:
          type: array
          description: Tags grouping the metric by what kind of cost it reduces (e.g. labor_cost, defect_cost, opportunity_cost). Consumers can roll up metrics by lever when converting activity to dollar figures.
          items:
            type: string
      description: Event metric counts and customer-facing copy for a single metric in a workspace
