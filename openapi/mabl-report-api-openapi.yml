openapi: 3.2.0
info:
  title: mabl Report API
  description: APIs for interacting with mabl services
  version: 0.599.3.1792436330
  x-readme-id: 62c896636916ce01d2ff4f5a
servers:
- url: /
security:
- basicAuth: []
- bearerAuth: []
tags:
- name: Report
paths:
  /artifact:
    get:
      tags:
      - Report
      summary: download test artifact
      description: Get a test artifact
      operationId: getArtifact
      parameters:
      - name: path
        in: query
        description: The sub path to the artifact
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: kms_unsupported
        in: query
        description: KMS file download unsupported in client location
        required: false
        deprecated: true
        style: form
        explode: true
        schema:
          type: boolean
          default: false
      responses:
        '303':
          description: Redirect to storage location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedirectResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Artifact not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedirectResponse'
      x-mabl-action: Read::Artifact
  /artifact/url:
    get:
      tags:
      - Report
      summary: get test artifact url
      description: Get a test artifact url
      operationId: getArtifactUrl
      parameters:
      - name: path
        in: query
        description: The sub path to the artifact
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: kms_unsupported
        in: query
        description: KMS file download unsupported in client location
        required: false
        deprecated: true
        style: form
        explode: true
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: JSON blob containing signed URL for retrieving the artifact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedirectResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Artifact not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
      x-mabl-action: Read::Artifact
  /artifact/check-access:
    get:
      tags:
      - Report
      summary: check artifact access
      description: Check if the authenticated user has permission to access the specified artifact. Returns 204 if access is permitted. Does not return the artifact itself.
      operationId: checkArtifactAccess
      parameters:
      - name: path
        in: query
        description: The GCS URI or sub path to the artifact
        required: true
        style: form
        explode: true
        schema:
          type: string
      responses:
        '204':
          description: Access is permitted
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
      x-mabl-action: Read::Artifact
  /artifact/image/url:
    get:
      tags:
      - Report
      summary: get image urls
      description: Get a set of image urls
      operationId: getImageUrls
      parameters:
      - name: artifact_uri
        in: query
        description: The sub path to the artifact
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: kms_unsupported
        in: query
        description: KMS file download unsupported in client location
        required: false
        deprecated: true
        style: form
        explode: true
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: JSON blob containing signed URL for retrieving the artifact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUrls'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Artifact not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
      x-mabl-action: Read::Artifact
  /workspaces/{workspace_id}/reports/activityLog:
    get:
      tags:
      - Report
      summary: Retrieve the activity log for the given workspace
      description: (Deprecated - use '/workspaces/{workspace_id}/reports/activityLog') Query the activity log for a workspace. To test this endpoint, enter the word 'key', without the quotes, as the username, and paste your API key as the password for authentication.
      operationId: queryWorkspaceActivity
      parameters:
      - name: workspace_id
        in: path
        description: Workspace id to filter by
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: action_type
        in: query
        description: Type of action taken.  Can be create, update, delete, or recover.
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: entity_type
        in: query
        description: Type of object that was acted on
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: entity_name
        in: query
        description: Name of the entity acted on
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: actor_id
        in: query
        description: Id of the user or api key that performed the action
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: actor_is_mabl_employee
        in: query
        description: Filter activity logs by mabl employees.
        required: false
        style: form
        explode: true
        schema:
          type: boolean
      - name: start_time
        in: query
        description: Start time of the activity log data, in epoch milliseconds.
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int64
      - name: end_time
        in: query
        description: End time of the activity log data, in epoch milliseconds.
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int64
      - name: is_automator_event
        in: query
        description: Filter activity logs by automator events
        required: false
        style: form
        explode: true
        schema:
          type: boolean
      - name: limit
        in: query
        description: Maximum number of runs to return in a single response. Additional pages of results can be retrieved by passing the cursor (returned in the results) on a subsequent call.
        required: false
        style: form
        explode: true
        schema:
          maximum: 200
          minimum: 1
          type: integer
          format: int32
          default: 100
      - name: cursor
        in: query
        description: Cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Array of activity log entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityFeed'
        '400':
          description: Invalid or missing parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '403':
          description: User not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
      deprecated: true
      x-mabl-action: Read::Report
  /workspaces/{workspace_id}/reports/testSuiteStatus:
    post:
      tags:
      - Report
      summary: Retrieve the current status of the tests in your test suite
      description: Used to retrieve the current status of each test, pass rate, etc.
      operationId: queryTestSuiteStatus
      parameters:
      - name: workspace_id
        in: path
        description: Workspace id to filter by
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: limit
        in: query
        description: The limit to use for pagination
        required: false
        style: form
        explode: true
        schema:
          maximum: 500
          minimum: 1
          type: integer
          format: int32
          default: 300
      - name: cursor
        in: query
        description: The cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      requestBody:
        description: Filters to get the relevant tests in the test suite
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestSuiteFilterOptions'
        required: false
      responses:
        '200':
          description: Current status of the test suite for the time range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestSuiteStatusResult'
        '400':
          description: Invalid or missing parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '403':
          description: User not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
      x-mabl-action: Read::Report
  /workspaces/{workspace_id}/reports/testSuiteStatusOverTime:
    post:
      tags:
      - Report
      summary: Retrieve the status of tests in your test suite over a period of time
      description: Used to retrieve the pass rate, count test runs, and failure reasons over time
      operationId: queryTestSuiteStatusOverTime
      parameters:
      - name: workspace_id
        in: path
        description: Workspace id to filter by
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: timezone
        in: query
        description: IANA timezone/zone offset for aggregation boundary calculations only
        required: false
        style: form
        explode: true
        schema:
          type: string
          default: America/Los_Angeles
      - name: limit
        in: query
        description: The limit to use for pagination
        required: false
        style: form
        explode: true
        schema:
          maximum: 200
          minimum: 1
          type: integer
          format: int32
          default: 100
      - name: cursor
        in: query
        description: The cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      requestBody:
        description: Filters to get the relevant tests in the test suite. Limit of 60 days.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestSuiteFilterOptions'
        required: true
      responses:
        '200':
          description: Current status of the test suite for the time range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestSuiteStatusOverTimeResult'
        '400':
          description: Invalid or missing parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '403':
          description: User not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
      x-mabl-action: Read::Report
  /workspaces/{workspace_id}/reports/testSuitePerformanceOverTime:
    post:
      tags:
      - Report
      summary: Retrieve the performance of the test suite over time averaged per step
      description: Used to retrieve the test suite performance per step over time
      operationId: queryTestSuitePerformanceOverTime
      parameters:
      - name: workspace_id
        in: path
        description: Workspace id to filter by
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: timezone
        in: query
        description: IANA timezone/zone offset for aggregation boundary calculations only
        required: false
        style: form
        explode: true
        schema:
          type: string
          default: America/Los_Angeles
      - name: limit
        in: query
        description: The limit to use for pagination
        required: false
        style: form
        explode: true
        schema:
          maximum: 200
          minimum: 1
          type: integer
          format: int32
          default: 100
      - name: cursor
        in: query
        description: The cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      requestBody:
        description: Filters to get the relevant tests in the test suite. Limit of 60 days.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestSuiteFilterOptions'
        required: true
      responses:
        '200':
          description: Performance of the test suite over time. Note count_runs in the result is count of steps in this case.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AggregateMetricDailyTrendResult'
        '400':
          description: Invalid or missing parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '403':
          description: User not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
      x-mabl-action: Read::Report
  /workspaces/{workspace_id}/reports/qualityMetricOverTime:
    post:
      tags:
      - Report
      summary: Retrieve the quality metric of the entity over time
      description: Used to retrieve the entity quality metric over time
      operationId: queryQualityMetricOverTime
      parameters:
      - name: workspace_id
        in: path
        description: Workspace id to filter by
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: journey_invariant_id
        in: query
        description: Test invariant id associated with the entity
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: entity_invariant_id
        in: query
        description: Entity id for which the metric is calculated
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: metric_type
        in: query
        description: Metric type
        required: true
        style: form
        explode: true
        schema:
          type: string
          enum:
          - page_speed_index
          - step_execution_time
          - response_time
      - name: limit
        in: query
        description: The limit to use for pagination
        required: false
        style: form
        explode: true
        schema:
          maximum: 1000
          minimum: 1
          type: integer
          format: int32
          default: 300
      - name: cursor
        in: query
        description: The cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      requestBody:
        description: Filters to get the relevant tests in the test suite. Limit of 90 days.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestSuiteFilterOptions'
        required: true
      responses:
        '200':
          description: Performance of the entity over time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualityMetricOverTimeResult'
        '400':
          description: Invalid or missing parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '403':
          description: User not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
      x-mabl-action: Read::Report
  /workspaces/{workspace_id}/reports/qualityMetricsSummary:
    get:
      tags:
      - Report
      summary: Retrieve quality metric values associated with a test run
      description: Used to retrieve quality metrics for a test run
      operationId: queryQualityMetric
      parameters:
      - name: workspace_id
        in: path
        description: Workspace id to filter by
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: aggregation_run_id
        in: query
        description: Aggregation run id
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: group_id
        in: query
        description: Group id - the level of entity for which the metric is calculated
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: metric_types
        in: query
        description: Types of quality metric
        required: true
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - page_speed_index
            - step_execution_time
            - response_time
      responses:
        '200':
          description: Quality metric for the associated context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AggregateMetricResult'
        '400':
          description: Invalid or missing parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '403':
          description: User not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
      x-mabl-action: Read::Report
  /workspaces/{workspace_id}/reports/qualityMetrics/metricDailyTrend:
    get:
      tags:
      - Report
      summary: Retrieve daily quality metric values for a given time period
      description: Used to retrieve quality metrics for an entity with daily values
      operationId: queryAggregateDaily
      parameters:
      - name: workspace_id
        in: path
        description: Workspace id to filter by
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: start_time
        in: query
        description: The start time of the time period
        required: true
        style: form
        explode: true
        schema:
          type: integer
          format: int64
      - name: end_time
        in: query
        description: The end time of the time period
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int64
      - name: timezone
        in: query
        description: Time zone for the daily aggregation
        required: false
        style: form
        explode: true
        schema:
          type: string
          default: America/Los_Angeles
      - name: metric_type
        in: query
        description: The type of quality metric
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: aggregation_invariant_id
        in: query
        description: Id for the context of the trend
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: limit
        in: query
        description: The limit to use for pagination
        required: false
        style: form
        explode: true
        schema:
          maximum: 200
          minimum: 1
          type: integer
          format: int32
          default: 100
      - name: cursor
        in: query
        description: The cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Array of daily quality metrics for the associated context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AggregateMetricDailyTrendResult'
        '400':
          description: Invalid or missing parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '403':
          description: User not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
      x-mabl-action: Read::Report
  /report/step/metricTrend:
    post:
