                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
      x-mabl-action: Read::Report
components:
  schemas:
    TestAuthoringMetricsResult:
      type: object
      properties:
        workspace_id:
          type: string
          description: The workspace ID
        start_time:
          type: integer
          description: Start of the query time range in epoch milliseconds
          format: int64
        end_time:
          type: integer
          description: End of the query time range in epoch milliseconds
          format: int64
        test_authoring_metrics_over_time:
          type: array
          description: Daily breakdown of test authoring metrics
          items:
            $ref: '#/components/schemas/TestAuthoringMetricsOverTime'
        totals:
          $ref: '#/components/schemas/TestAuthoringMetricsTotals'
        by_test_type:
          type: array
          description: Breakdown of metrics by test type (only included when test_type filter is not applied)
          items:
            $ref: '#/components/schemas/TestAuthoringMetricsByTestType'
      description: Result of querying test authoring metrics for a workspace
    EventMetricSeries:
      type: object
      properties:
        metric_name:
          type: string
          description: Stable identifier for the metric (e.g. auto_heal_insights)
        buckets:
          type: array
          description: One bucket per calendar day in the range. Days with zero events across all in-scope workspaces are omitted (sparse encoding).
          items:
            $ref: '#/components/schemas/EventMetricBucket'
      description: Daily-bucketed counts for a single metric across the requested date range
    TestSuiteFilterOptions:
      type: object
      properties:
        application_ids:
          type: array
          description: Application IDs to filter by
          readOnly: true
          items:
            type: string
        environment_ids:
          type: array
          description: Environment IDs to filter by
          readOnly: true
          items:
            type: string
        triggering_resource_ids:
          type: array
          description: Triggering resource IDs to filter by
          readOnly: true
          items:
            type: string
        test_name:
          type: string
          description: Test name to filter by (partial match)
          readOnly: true
        test_type:
          $ref: '#/components/schemas/TestTypeEnum'
        browser:
          type: string
          description: The browser for the run
          readOnly: true
        execution_source:
          $ref: '#/components/schemas/TestSource'
        mobile_platform:
          $ref: '#/components/schemas/MobilePlatformEnum'
        test_labels:
          type: array
          description: Test labels to filter by
          readOnly: true
          items:
            type: string
        plan_labels:
          type: array
          description: Plan labels to filter by
          readOnly: true
          items:
            type: string
        start_time:
          type: integer
          description: The start time of the time period
          format: int64
          readOnly: true
        end_time:
          type: integer
          description: The end time of the time period
          format: int64
          readOnly: true
    QualityMetricSeries:
      type: object
      properties:
        metric_name:
          type: string
          description: Stable identifier for the metric (e.g. test_runs_executed, plan_runs_executed)
        buckets:
          type: array
          description: One bucket per calendar day in the range. Days with zero events across all in-scope workspaces are omitted (sparse encoding).
          items:
            $ref: '#/components/schemas/QualityMetricBucket'
      description: Daily-bucketed quality counts for a single metric across the requested date range
    WorkspaceQualityMetricCount:
      type: object
      properties:
        workspace_id:
          type: string
          description: The workspace ID
        workspace_name:
          type: string
          description: The workspace name
        total:
          type: integer
          description: Total runs for this workspace on this day
          format: int64
        passed:
          type: integer
          description: Passed runs
          format: int64
        failed:
          type: integer
          description: Failed runs
          format: int64
        stopped:
          type: integer
          description: Stopped (terminated mid-run) runs
          format: int64
        retried:
          type: integer
          description: Runs that were part of a retry
          format: int64
        by_test_type:
          type: array
          description: Optional sub-breakdown by test_type (browser / api / mobile). Present when the underlying metric is sub-keyed by test_type; omitted otherwise.
          items:
            $ref: '#/components/schemas/QualityMetricByTestType'
      description: A workspace's contribution to a single quality-metric+day bucket
    WorkspaceActiveUserCount:
      type: object
      properties:
        workspace_id:
          type: string
          description: The workspace ID
        workspace_name:
          type: string
          description: The workspace name
        active_user_count:
          type: integer
          description: Number of distinct active users in this workspace
          format: int32
      description: Active user count for a single workspace
    WorkspaceFailureCategoryMetrics:
      type: object
      properties:
        workspace_id:
          type: string
          description: The workspace ID
        workspace_name:
          type: string
          description: The workspace display name
        metrics:
          $ref: '#/components/schemas/FailureCategorySummaryQueryResult'
      description: Failure category history for a single workspace
    FlakyTestReportRequest:
      required:
      - end_time
      - start_time
      type: object
      properties:
        start_time:
          type: integer
          description: Start of the query time range in epoch milliseconds
          format: int64
        end_time:
          type: integer
          description: End of the query time range in epoch milliseconds
          format: int64
        application_id:
          type: string
          description: Optional application ID to filter by
        plan_id:
          type: string
          description: Optional plan ID to filter by
        environment_id:
          type: string
          description: Optional environment ID to filter by
        test_type:
          $ref: '#/components/schemas/TestTypeEnum'
        browser:
          $ref: '#/components/schemas/BrowserTypeEnum'
        execution_source:
          $ref: '#/components/schemas/TestSource'
        plan_labels:
          maxItems: 50
          type: array
          description: Plan labels to filter by (tests must belong to plans with these labels)
          items:
            maxLength: 256
            type: string
        min_plan_runs:
          minimum: 1
          type: integer
          description: Minimum number of plan runs required for a test to be included
          format: int32
          default: 5
      description: Filter and time-range parameters for queryFlakyTestCounts
    AccountTestAuthoringMetricsResult:
      type: object
      properties:
        account_id:
          type: string
          description: The account ID
        from_time:
          type: integer
          description: Start of the query time range in epoch milliseconds
          format: int64
        to_time:
          type: integer
          description: End of the query time range in epoch milliseconds
          format: int64
        aggregated:
          $ref: '#/components/schemas/TestAuthoringMetricsResult'
        by_workspace:
          type: array
          description: Per-workspace breakdown of test authoring metrics
          items:
            $ref: '#/components/schemas/WorkspaceTestAuthoringMetrics'
      description: Test authoring metrics across all workspaces in an account
    RunStatusSummary:
      type: object
      properties:
        passed_journey_run_count:
          type: integer
          description: Total number of journey runs with status completed
          format: int64
        failed_journey_run_count:
          type: integer
          description: Total number of journey runs with status failed
          format: int64
        terminated_journey_run_count:
          type: integer
          description: Total number of journey runs with status terminated
          format: int64
      description: Test run status summmary for a single grouping/aggregation
    AccountEventMetricsResult:
      type: object
      properties:
        account_id:
          type: string
          description: The account ID
        start_date:
          type: string
          description: Inclusive start of the date range (YYYY-MM-DD)
          format: date
        end_date:
          type: string
          description: Inclusive end of the date range (YYYY-MM-DD)
          format: date
        series:
          type: array
          description: One entry per metric name, ordered by metric_name
          items:
            $ref: '#/components/schemas/EventMetricSeries'
      description: Daily counts of registered event metrics across workspaces in an account
    RunStatusSummaryQueryResult:
      type: object
      properties:
        runStatusHistory:
          type: array
          description: A time series of run status summaries per day
          readOnly: true
          items:
            $ref: '#/components/schemas/RunStatusPeriodSummary'
        timezone:
          type: string
          description: Normalized IANA timezone or zone offset used for day bucket boundaries
    MetricsSummary:
      type: object
      properties:
        metric_id:
          type: string
          description: Specific identifier for this metrics, regardless of point in time.  Exact value depends on metric type
        metric_type:
          type: string
          description: Specific type/class of metric
        organization_id:
          type: string
          description: organization this metric is for
        appliction_id:
          type: string
          description: appication this metric is for
        environment_id:
          type: string
          description: environment this metric is for
        points:
          type: array
          description: instances of the metric at a point in time
          items:
            $ref: '#/components/schemas/MetricsSummaryPoints'
      description: Summary of one or more individual metric points
    AccountQualityMetricsDailyResult:
      type: object
      properties:
        account_id:
          type: string
          description: The account ID
        start_date:
          type: string
          description: Inclusive start of the date range (YYYY-MM-DD)
          format: date
        end_date:
          type: string
          description: Inclusive end of the date range (YYYY-MM-DD)
          format: date
        series:
          type: array
          description: One entry per metric name, ordered by metric_name
          items:
            $ref: '#/components/schemas/QualityMetricSeries'
      description: Daily quality metric breakdowns across workspaces in an account, with status sub-counts
    TestSource:
      type: string
      description: Where the test lives
      enum:
      - mabl_cloud
      - external
      - mabl_local
      - mabl_agent
      x-mabl-scope: public
    MobilePlatformEnum:
      type: string
      description: The mobile platform associated with this object
      enum:
      - android
      - ios
      x-mabl-scope: public
    MetricsSummaryPoints:
      type: object
      properties:
        interval_type:
          type: string
          description: Description of the interval type
          enum:
          - event
          - day
          - hour
        interval_start:
          type: integer
          description: interval start time
          format: int64
        interval_end:
          type: integer
          description: interval end time
          format: int64
        execution_count:
          type: integer
          description: Count of executions
        failed_count:
          type: integer
          description: Count of failures
        passed_count:
          type: integer
          description: Count of passes
        raw_value:
          type: integer
          description: Raw value used in anomaly detection
          format: int64
        tests_passing:
          type: integer
          description: Count of passes
        tests_failing:
          type: integer
          description: Count of passes
        scripts_passing:
          type: integer
          description: Count of passes
        scripts_failing:
          type: integer
          description: Count of passes
        run_time_sum_squared:
          type: integer
          description: Count of passes
          format: int64
        run_time_sum:
          type: integer
          description: Count of passes
          format: int64
    AccountQualityMetricsOverTimeResult:
      type: object
      properties:
        account_id:
          type: string
          description: The account ID
        from_time:
          type: integer
          description: Start of the query time range in epoch milliseconds
          format: int64
        to_time:
          type: integer
          description: End of the query time range in epoch milliseconds
          format: int64
        aggregated:
          $ref: '#/components/schemas/TestSuiteStatusOverTimeResult'
        by_workspace:
          type: array
          description: Per-workspace breakdown of quality metrics
          items:
            $ref: '#/components/schemas/WorkspaceQualityMetrics'
      description: Quality metrics across all workspaces in an account over a time range
    AccountUserActivityByUserResult:
      type: object
      properties:
        account_id:
          type: string
          description: The account ID
        interval_start:
          type: integer
          description: Start of the query time range in epoch milliseconds
          format: int64
        interval_end:
          type: integer
          description: End of the query time range in epoch milliseconds
          format: int64
        by_user:
          type: array
          description: One row per user with activity in the window. Users with zero actions are not included.
          items:
            $ref: '#/components/schemas/UserActivityRow'
      description: Per-user activity breakdown for an account over a time window
    ActivityFeed:
      type: object
      properties:
        entries:
          type: array
          description: All activity logs that match the query
          readOnly: true
          items:
            $ref: '#/components/schemas/ActivityFeedEntry'
          x-mabl-scope: public
        cursor:
          type: string
          description: Cursor used for pagination
          readOnly: true
          x-mabl-scope: public
    ReportSettingQueryResult:
      type: object
      properties:
        settings:
          type: array
          items:
            $ref: '#/components/schemas/ReportSetting'
        cursor:
          type: string
          description: Cursor used for pagination
          readOnly: true
      description: Multiple report settings that match a query
    TestFlakinessSummary:
      type: object
      properties:
        total_tests:
          type: integer
          description: Total number of tests matching the filters with sufficient data in the time range
        flaky_tests:
          type: integer
          description: Number of tests with any flakiness (flake_rate > 0)
        tests_above_threshold:
          type: integer
          description: Number of tests with flake_rate >= 10%
        average_flake_rate:
          type: number
          description: Average flake rate across all tests (0.0 to 1.0)
          format: double
        total_flaky_plan_runs:
          type: integer
          description: Total number of plan runs with mixed outcomes across all tests
      description: Aggregate flakiness statistics across ALL matching tests (not limited by pagination)
    AccessibilityRuleViolation:
      type: object
      properties:
        impact:
          type: string
          description: The impact of the rule
        rule_id:
          type: string
          description: The rule ID associated with the check
        path_pattern:
          type: string
          description: The path pattern associated with the check
        test_run_ids:
          type: array
          description: The test run IDs associated with the check
          items:
            type: string
        test_names:
          type: array
          description: The test names associated with test runs
          items:
            type: string
    FailureCategoryCount:
      type: object
      properties:
        failure_category:
          type: string
          description: The type of failure
          readOnly: true
        count:
          type: integer
          description: The count of the failure category
          format: int32
          readOnly: true
      description: The count of a failure reason
    RunStatusPeriodSummary:
      type: object
      properties:
        time_interval_start:
          type: integer
          description: Start of the time interval (in epoch milliseconds)
          format: int64
        time_interval_end:
          type: integer
          description: End of the time interval (in epoch milliseconds)
          format: int64
        status_by_application:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/RunStatusSummary'
        status_totals:
          $ref: '#/components/schemas/RunStatusSummary'
      description: Test run status summmary for a particular time period
    TestAuthoringMetricsTotals:
      type: object
      properties:
        new_test_count:
          type: integer
          description: Total number of new tests created
          format: int64
        updated_test_count:
          type: integer
          description: Total number of existing tests updated
          format: int64
      description: Aggregate totals for test authoring metrics
    RedirectResponse:
      type: object
      properties:
        redirectUrl:
          type: string
          x-mabl-scope: public
    TestSuiteStatusSummary:
      type: object
      properties:
        tests_with_runs:
          type: integer
          description: Number of tests with at least one run in the window
          format: int64
          readOnly: true
        tests_passing_latest:
          type: integer
          description: Number of tests whose latest run passed
          format: int64
          readOnly: true
        tests_failing_latest:
          type: integer
          description: Number of tests whose latest run failed
          format: int64
          readOnly: true
        new_tests:
          type: integer
          description: Number of tests with a run in the window that were created in the window
          format: int64
          readOnly: true
        updated_tests:
          type: integer
          description: Number of tests with a run in the window that were updated in the window
          format: int64
          readOnly: true
        by_test_type:
          type: array
          description: The same counts broken down by test type
          readOnly: true
          items:
            $ref: '#/components/schemas/TestSuiteStatusTypeSummary'
      description: Whole filtered set, identical on every page; latest = each test's most recent run in the window
    QualityMetricBucket:
      type: object
      properties:
        date:
          type: string
          description: Calendar day for this bucket (YYYY-MM-DD)
          format: date
        total:
          type: integer
          description: Sum of total_count across all in-scope workspace+test_type rows for the day
          format: int64
        passed:
          type: integer
          description: Sum of passed_count across all in-scope workspace+test_type rows for the day
          format: int64
        failed:
          type: integer
          description: Sum of failed_count across all in-scope workspace+test_type rows for the day
          format: int64
        stopped:
          type: integer
          description: Sum of stopped_count across all in-scope workspace+test_type rows for the day
          format: int64
        retried:
          type: integer
          description: Sum of retried_count across all in-scope workspace+test_type rows for the day
          format: int64
        by_workspace:
          type: array
          description: Per-workspace contribution to this bucket. Workspaces with zero total for the day are omitted. Status sub-counts within each workspace are summed across test_type sub-rows.
          items:
            $ref: '#/components/schemas/WorkspaceQualityMetricCount'
      description: A single (date, account-total, per-workspace breakdown) tuple for one quality metric on one day
    EventMetricBucket:
      type: object
      properties:
        date:
          type: string
          description: Calendar day for this bucket (YYYY-MM-DD)
          format: date
        count:
          type: integer
          description: Sum of the metric across all in-scope workspaces for the day
          format: int64
        by_workspace:
          type: array
          description: Per-workspace contribution to count for this day. Workspaces with zero events for the day are omitted.
          items:
            $ref: '#/components/schemas/WorkspaceEventMetricCount'
      description: A single (date, account-total, per-workspace breakdown) tuple for one metric
    QualityMetricByTestType:
      type: object
      properties:
        test_type:
          type: string
          description: browser | api | mobile
        total:
          type: integer
          format: int64
        passed:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
        stopped:
          type: integer
          format: int64
        retried:
          type: integer
          format: int64
      description: A workspace's quality counts for one test_type on one day
    GuardrailApprovalRef:
      type: object
      properties:
        id:
          type: string
          description: The approval's id.
        state:
          description: Where the approval stands.
          allOf:
          - $ref: '#/components/schemas/GuardrailApprovalState'
        kind:
          description: Who decides the approval.
          allOf:
          - $ref: '#/components/schemas/GuardrailApprovalKind'
        request_expires_time:
          type: integer
          description: When the approval expires if nobody decides it, in epoch milliseconds.
          format: int64
        url:
          type: string
          description: The mabl app page where a person reviews the approval.
      description: 'An approval a guardrail policy asks for. While it is PENDING, stop: give the person the url, tell them the request is waiting for approval, and do not repeat the request or poll in a loop. Once a person tells you it is APPROVED, repeat the identical request with the header X-Mabl-Approval set to id. DENIED means a person said no, so do not work around it.'
    QualityMetricOverTime:
      type: object
      properties:
        entry_time:
          type: integer
          description: the time of the metric being calculated (in epoch milliseconds)
          format: int64
        journey_run_id:
          type: string
          description: the journey run id associated with the metric
        quality_metric:
          type: number
          description: the quality metric value associated with the entity (in epoch milliseconds)
          format: double
    AccessibilityRuleViolationResult:
      type: object
      properties:
        accessibility_rule_violations:
          type: array
          description: All outstanding rule violations that match the filters
          readOnly: true
          items:
            $ref: '#/components/schemas/AccessibilityRuleViolation'
        cursor:
          type: string
          description: Cursor used for pagination
          readOnly: true
    QualityMetricOverTimeResult:
      type: object
      properties:
        quality_metric_over_time:
          type: array
          description: Quality metric over time for the associated context, env, and app
          readOnly: true
          items:
            $ref: '#/components/schemas/QualityMetricOverTime'
        cursor:
          type: string
          description: Cursor used for pagination
          readOnly: true
    TestStatus:
      type: object
      properties:
        workspace_id:
          type: string
          description: The ID of the workspace
          readOnly: true
        test_id:
          type: string
          description: The ID of the test
          readOnly: true
        test_name:
          type: string
          description: The name of the test
          readOnly: true
        test_type:
          $ref: '#/components/schemas/TestTypeEnum'
        test_created_time:
          type: integer
          description: The time the test was created
          format: int64
          readOnly: true
        test_updated_time:
          type: integer
          description: The time the test was most recently updated
          format: int64
          readOnly: true
        current_pass_rate:
          type: number
          description: The current pass rate for the test (percent)
          format: double
          readOnly: true
        recent_run_id:
          type: string
          description: The ID of the most recent test run
          readOnly: true
        recent_status:
          type: string
          description: The most recent test run status
          readOnly: true
          enum:
          - completed
          - failed
          - terminated
          - no_status
        recent_start_time:
          type: integer
          description: The start time of the most recent run
          format: int64
          readOnly: true
        first_start_time:
          type: integer
          description: The start time of the earliest run
          format: int64
          readOnly: true
        app_load_time_change:
          type: number
          description: The relative change (percent) in cumulative speed index between the first and last half of the time range
          format: double
          readOnly: true
        earliest_app_load_run_count:
          type: integer
          description: The number of runs considered in app load time calculations from the first half of the specified date range
          format: int64
          readOnly: true
        latest_app_load_run_count:
          type: integer
          description: The number of runs considered in app load time calculations from the second half of the specified date range
          format: int64
          readOnly: true
        response_time_change:
          type: number
          description: The relative change (percent) in cumulative API response time between the first and last half of the time range
          format: double
          readOnly: true
        earliest_response_time_run_count:
          type: integer
          description: The number of runs considered in API response time time calculations from the first half of the specified date range
          format: int64
          readOnly: true
        latest_response_time_run_count:
          type: integer
          description: The number of runs considered in API response time calculations from the second half of the specified date range
          format: int64
          readOnly: true
        app_load_time_ms:
          type: number
          description: The average test app load time in milliseconds
          format: double
        response_time_ms:
          type: number
          description: The average test response time in milliseconds
          format: double
        run_time_ms:
          type: number
          description: The average test run time in milliseconds
          format: double
          readOnly: true
        number_of_runs:
          type: integer
          description: The number of test runs
          format: int64
    TestSuiteStatusOverTimeResult:
      type: object
      properties:
        test_suite_status_over_time:
          type: array
          description: Status of the test suite at discrete times in the range
          readOnly: true
          items:
            $ref: '#/components/schemas/TestSuiteStatus'
        status_by_deployment:
          type: boolean
          description: True if deployment event IDs supplied in filters, otherwise false
          readOnly: true
        end_time:
          type: integer
          description: The latest time represented in these results
          format: int64
          readOnly: true
        start_time:
          type: integer
          description: The earliest time represented in these results
          format: int64
          readOnly: true
        cursor:
          type: string
          description: Cursor used for pagination
          readOnly: true
        total_distinct_tests:
          type: integer
          description: The total count of distinct tests across the entire date range
          format: int32
          readOnly: true
        total_active_plans:
          type: integer
          description: The total count of distinct active plans across the entire date range
          format: int32
        total_plan_runs:
          type: integer
          description: The total count of plan runs across the entire date range
          format: int32
        retried_test_run_count:
          type: integer
          description: Count of test runs within the date range whose parent plan run was a retry. Used to show how many test executions were covered by retry-on-failure.
          format: int64
        retried_test_run_passed_count:
          type: integer
          description: Subset of retried_test_run_count whose final status was success. The ratio indicates how often retry-on-failure successfully avoids human triage.
          format: int64
    TestSuiteStatusTypeSummary:
      type: object
      properties:
        test_type:
          type: string
          description: The test type
          readOnly: true
        tests_with_runs:
          type: integer
          description: Number of tests of this type with at least one run in the window
          format: int64
          readOnly: true
        tests_passing_latest:
          type: integer
          description: Number of tests of this type whose latest run passed
          format: int64
          readOnly: true
      description: Whole filtered set, identical on every page; latest = each test's most recent run in the window
    FailureCategorySummaryQueryResult:
      type: object
      properties:
        failureCategoryHistory:
          type: array
          description: A time series of failure category per day
