        test_authoring:
          type: integer
          description: Creates of test, reusable flow (reusable=true), or snippet
          format: int64
        test_maintenance:
          type: integer
          description: Updates and deletes of test, reusable flow (reusable=true), or snippet
          format: int64
        data_setup:
          type: integer
          description: Activity on data_table, credentials, file_upload, mailbox, database_connection
          format: int64
        plans_orchestration:
          type: integer
          description: Activity on plan, environment, branch
          format: int64
        workspace_configuration:
          type: integer
          description: Account-, workspace-, role-, and integration-level configuration activity
          format: int64
      description: 'Per-category counts for a single user. The sum of all five fields equals

        total_actions. See the API documentation for category definitions.

        '
    TestFlakinessSummaryItem:
      type: object
      properties:
        test_id:
          type: string
          description: The test's invariant ID
        flake_rate:
          type: number
          description: True flake rate (0.0 to 1.0). Calculated as flaky_plan_runs / total_plan_runs.
          format: double
        total_plan_runs:
          type: integer
          description: Total number of plan runs that included this test in the time range
        flaky_plan_runs:
          type: integer
          description: Number of plan runs with mixed outcomes (both passes and fails)
        consistent_pass_runs:
          type: integer
          description: Number of plan runs where all attempts passed
        consistent_fail_runs:
          type: integer
          description: Number of plan runs where all attempts failed (likely real failures, not flakiness)
        last_flaky_time:
          type: integer
          description: Timestamp of the most recent flaky plan run in epoch milliseconds. Null if no flaky runs.
          format: int64
      description: Flakiness metrics for a single test
    TestSuiteStatus:
      type: object
      properties:
        workspace_id:
          type: string
          description: The ID of the workspace
          readOnly: true
        start_time:
          type: integer
          description: Earliest time associated with this test suite status summary, deployment event time if applicable
          format: int64
          readOnly: true
        end_time:
          type: integer
          description: Latest time associated with this test suite status summary, deployment event time if applicable
          format: int64
          readOnly: true
        deployment_event_id:
          type: string
          description: The deployment event associated with this status summary, if applicable
          readOnly: true
        count_tests_pass:
          type: integer
          description: The count of passing test runs associated with this summary
          format: int32
          readOnly: true
        count_tests_fail:
          type: integer
          description: The count of failing test runs associated with this summary
          format: int32
          readOnly: true
        count_tests_stopped:
          type: integer
          description: The count of stopped test runs associated with this summary
          format: int32
          readOnly: true
        count_tests_distinct:
          type: integer
          description: The count of distinct tests whose runs are associated with this summary
          format: int32
        count_active_plans:
          type: integer
          description: The count of distinct active plans (plans with at least one test run) associated with this summary
          format: int32
        count_plan_runs:
          type: integer
          description: The count of plan runs associated with this summary
          format: int32
        count_plan_runs_failed:
          type: integer
          description: The count of failed plan runs associated with this summary
          format: int32
        categorized_failures:
          type: array
          description: The counts of each failure category
          readOnly: true
          items:
            $ref: '#/components/schemas/FailureCategoryCount'
    AccountFailureCategoryHistoryResult:
      type: object
      properties:
        account_id:
          type: string
          description: The account ID
        history_days:
          type: integer
          description: Number of days requested
          format: int32
        aggregated:
          $ref: '#/components/schemas/FailureCategorySummaryQueryResult'
        by_workspace:
          type: array
          description: Per-workspace breakdown of failure category history
          items:
            $ref: '#/components/schemas/WorkspaceFailureCategoryMetrics'
      description: Failure category history across workspaces in an account
    AggregateMetricResult:
      type: object
      properties:
        quality_metric_values:
          type: array
          description: Quality metrics for the associated context
          readOnly: true
          items:
            $ref: '#/components/schemas/AggregateMetric'
    WorkspaceEventMetricCount:
      type: object
      properties:
        workspace_id:
          type: string
          description: The workspace ID
        workspace_name:
          type: string
          description: The workspace name
        count:
          type: integer
          description: Count of events for this metric in this workspace on this day
          format: int64
      description: A workspace's contribution to a single metric+day bucket
    ImageUrls:
      type: object
      properties:
        fullImageUrl:
          type: string
          description: signed url to the full image
        thumbnailImageUrl:
          type: string
          description: signed url to the thumbnail image
      description: Signed image urls for a given base image
    TestQualityItem:
      type: object
      properties:
        test_id:
          type: string
          description: The test's invariant ID
        total_plan_runs:
          type: integer
          description: Total number of plan runs that included this test in the time range. Capped at the per-test analysis limit; see runs_capped.
        runs_capped:
          type: boolean
          description: True if this test had more runs than the per-test analysis limit in the time range, so its metrics (including total_plan_runs and the transition counts) reflect only the most recent runs rather than the full history. False when the full history was analyzed.
        flake_rate:
          type: number
          description: True flake rate (0.0 to 1.0). Calculated as flaky_plan_runs / total_plan_runs.
          format: double
        flaky_plan_runs:
          type: integer
          description: Number of plan runs with mixed outcomes (both passes and fails)
        consistent_pass_runs:
          type: integer
          description: Number of plan runs where all attempts passed
        consistent_fail_runs:
          type: integer
          description: Number of plan runs where all attempts failed
        last_flaky_time:
          type: integer
          description: Timestamp of the most recent flaky plan run in epoch milliseconds. Null if no flaky runs.
          format: int64
        breakage_rate:
          type: number
          description: Breakage rate (0.0 to 1.0). Calculated as pass_to_fail_transitions / passing_plan_runs.
          format: double
        passing_plan_runs:
          type: integer
          description: Number of plan runs where the previous run was passing (opportunities to break)
        pass_to_fail_transitions:
          type: integer
          description: Number of times this test went from passing to failing between consecutive runs
        fail_to_pass_transitions:
          type: integer
          description: Number of times this test went from failing to passing between consecutive runs
        last_breakage_time:
          type: integer
          description: Timestamp of the most recent pass-to-fail transition in epoch milliseconds. Null if no breakages.
          format: int64
        pass_rate:
          type: number
          description: Pass rate (0.0 to 1.0). Fraction of plan runs where all attempts passed.
          format: double
        stability_rate:
          type: number
          description: Stability rate (0.0 to 1.0). Calculated as 1 - flake_rate. Higher is better.
          format: double
        reliability_rate:
          type: number
          description: Reliability rate (0.0 to 1.0). Calculated as 1 - breakage_rate. Higher is better.
          format: double
        quality_score:
          type: integer
          description: Composite quality score (0-100). Geometric mean with aggressive exponents, calculated as round(100 * pass_rate^1.2 * stability_rate^1.0 * reliability_rate^0.9).
        last_run_time:
          type: integer
          description: Timestamp of this test's most recent plan run in the time range, in epoch milliseconds. Subject to the same runs_capped limit as total_plan_runs -- for a capped test, reflects only its most recent runs_capped-eligible runs.
          format: int64
        last_failed_run_time:
          type: integer
          description: Timestamp of the most recent plan run with a non-passing outcome (FAIL or MIXED) in epoch milliseconds. Null if every run in range passed cleanly. Subject to the same runs_capped limit as total_plan_runs -- for a capped test, only runs within the retained window are considered, so this can be null or stale even if an earlier, uncounted run in the full time range actually failed.
          format: int64
      description: Quality metrics for a single test including flakiness and breakage
    TestAuthoringMetricsOverTime:
      type: object
      properties:
        start_time:
          type: integer
          description: Start of the time bucket in epoch milliseconds
          format: int64
        end_time:
          type: integer
          description: End of the time bucket in epoch milliseconds
          format: int64
        new_test_count:
          type: integer
          description: Number of new tests created in this time bucket
          format: int64
        updated_test_count:
          type: integer
          description: Number of existing tests updated in this time bucket
          format: int64
      description: Test authoring metrics for a single time bucket
    AssetCounts:
      type: object
      properties:
        test_count:
          type: integer
          description: Total number of tests (by invariant ID)
          format: int64
        reusable_flow_count:
          type: integer
          description: Total number of reusable flows (by invariant ID)
          format: int64
        datatable_count:
          type: integer
          description: Total number of datatables
          format: int64
        plan_count:
          type: integer
          description: Total number of plans (existing, non-deleted)
          format: int64
      description: Counts of tests, reusable flows, datatables, and plans
    ActivityFeedEntry:
      type: object
      properties:
        id:
          type: string
          description: Id of the activity log entry
          x-mabl-scope: public
        workspace_id:
          type: string
          description: Workspace id associated with the action. Populated for workspace-owned entities; company-owned entities carry company_id instead.
          x-mabl-scope: public
        company_id:
          type: string
          description: Company id associated with the action. Populated for company-owned entities (for example Link agents); workspace-owned entities carry workspace_id instead.
        entity_id:
          type: string
          description: Id of the entity acted on
          x-mabl-scope: public
        entity_previous_id:
          type: string
          description: Entity id of the entity acted on, prior to the action
          x-mabl-scope: public
        entity_invariant_id:
          type: string
          description: Invariant id of the entity acted on, only populated for versioned entities
          x-mabl-scope: public
        entity_canonical_id:
          type: string
          description: Canonical id of the entity acted on, consistent across object versions.  Always populated.
          x-mabl-scope: public
        entity_name:
          type: string
          description: Name of the entity immediately after being acted on
          x-mabl-scope: public
        entity_previous_name:
          type: string
          description: Name of the entity immediately before the action
          x-mabl-scope: public
        entity_type:
          type: string
          description: Type of the entity acted on
          x-mabl-scope: public
        actor_id:
          type: string
          description: Id for the user or api key performing the action
          x-mabl-scope: public
        actor_is_mabler:
          type: boolean
          description: Defines if this activity log entry was performed by a mabl employee.
          x-mabl-scope: public
        agent_type:
          $ref: '#/components/schemas/AgentType'
        agent_caller:
          type: string
          description: 'Who the agent acting for the actor was: mabl''s own agent or an external agent connected to mabl, such as a coding agent over MCP. Null for actions not performed by an agent.'
          enum:
          - mabl
          - external
          x-mabl-scope: public
        agent_session_id:
          type: string
          description: Id of the agent session that performed the action. Null for actions not performed by an agent.
          x-mabl-scope: public
        on_behalf_of:
          type: string
          description: Id of the user or api key the agent acted on behalf of. Null for actions not performed by an agent.
        action_type:
          type: string
          description: Action type taken on the entity. Can be create, update, delete, or recover.
          x-mabl-scope: public
        action_subtype:
          type: string
          description: Subtype of the action taken on the entity
        action_timestamp:
          type: integer
          description: Time the action occurred, in epoch milliseconds
          format: int64
          x-mabl-scope: public
        created_time:
          type: integer
          description: Time the entity acted on was created, in epoch milliseconds
          format: int64
          x-mabl-scope: public
        entity_json:
          type: string
          description: Json of the entity acted on
        entity_previous_json:
          type: string
          description: Json of the entity immediately after being acted on
        entity_version_number:
          type: integer
          description: Version of the entity acted on, only populated for versioned types
          format: int64
          x-mabl-scope: public
        entity_previous_version_number:
          type: integer
          description: Version of the entity before the action, only populated for versioned types
          format: int64
        is_automator_event:
          type: boolean
          description: Defines if this activity log entry meets the basic definition of an automator event
          x-mabl-scope: public
      description: Single entry for the activity log
    WorkspaceAssetCounts:
      type: object
      properties:
        workspace_id:
          type: string
          description: The workspace ID
        workspace_name:
          type: string
          description: The workspace name
        counts:
          $ref: '#/components/schemas/AssetCounts'
      description: Asset counts for a single workspace
  responses:
    ErrorResponse403:
