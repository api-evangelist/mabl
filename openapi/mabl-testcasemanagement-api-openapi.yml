            default: false
          external_tcm_platform:
            $ref: '#/components/schemas/ExternalTcmPlatformTypeEnum'
          mabl_entity_type:
            $ref: '#/components/schemas/MablEntityTypeEnum'
          mabl_entity_id:
            type: string
            description: Unique identifier for the associated mabl entity
        description: Request body for creating an external TCM binding
    ExternalTcmBindingMutableFields:
      type: object
      properties:
        external_entity_id:
          type: string
          description: Unique identifier for the associated entity in the external TCM system
        workspace_integration_id:
          type: string
          description: Unique identifier for the WorkspaceIntegration to bind to
        auto_sync_enabled:
          type: boolean
          description: Per-binding automatic result synchronization setting. On PATCH, omission leaves the stored value unchanged.
      description: Fields that can be set when creating or updating an external TCM binding
    ZephyrCaseContentReasonEnum:
      type: string
      description: 'not_a_case_id: not a Zephyr case key shape. unknown_case: Zephyr does not know the key. out_of_scope: the key''s project is not one of the integration''s project_keys; Zephyr was not asked. no_readable_content: the case was read, but every readable field is blank. budget_exhausted: earlier cases in this request used the whole size budget, so none of this one was sent -- about us, not about the case. unavailable: Zephyr could not be asked.'
      enum:
      - not_a_case_id
      - unknown_case
      - out_of_scope
      - no_readable_content
      - budget_exhausted
      - unavailable
    ExternalTcmPlatformTypeEnum:
