      type: object
      properties:
        failure_category_id:
          type: string
          description: A failure category id
        failure_synopsis:
          type: string
          description: DEPRECATED -- Now persisted as FailureAnalysis -- A synopsis of the failure summary
          deprecated: true
        failure_summary_text:
          type: string
          description: A summary describing the test run failure and potential root cause
        is_failure_category_generated:
          type: boolean
          description: Indicates if the failure category was generated by AI
        is_failure_summary_generated:
          type: boolean
          description: Indicates if the failure summary was generated by AI
        suggested_failure_category_id:
          type: string
          description: Failure category ID suggested by automated analysis. Server-managed; client-supplied values are ignored on write.
        last_updated_by_id:
          type: string
          description: The ID of the user who updated the categorization of this failure
          readOnly: true
        last_updated_time:
          type: integer
          description: time the failure categorization was last updated
          format: int64
          readOnly: true
        failure_reason_assignment_source:
          type: string
          description: How the failure reason was assigned to this test run. Server-managed; client-supplied values are ignored on write.
          enum:
          - manual
          - auto
        failure_reason_assigned_by_id:
          type: string
          description: The ID of the user or system that assigned the failure reason. Server-managed; client-supplied values are ignored on write.
        failure_reason_assigned_time:
          type: integer
          description: Timestamp in epoch milliseconds when the failure reason was assigned. Server-managed; client-supplied values are ignored on write.
          format: int64
      description: Information describing the cause of a test run failure
    SourceControlBranch:
      required:
      - html_url
      - name
      type: object
      properties:
        name:
          type: string
          description: repository unique branch name
          x-mabl-scope: public
        html_url:
          type: string
          description: HTML page url to view branch tree
          x-mabl-scope: public
      description: the SCM branch associated with this object
    ExecutionSummary:
      type: object
      properties:
        status:
          type: string
          description: Current status of the plan run
          readOnly: true
          enum:
          - queued
          - pre_execution
          - scheduling
          - scheduled
          - succeeded
          - failed
          - cancelled
          - post_execution
          - completed
          - terminated
          x-mabl-scope: public
        status_cause:
          type: string
          description: Cause for setting given status, such as failure cause
          readOnly: true
          x-mabl-scope: public
        success:
          type: boolean
          description: true if the plan completed successfully
          readOnly: true
          x-mabl-scope: public
        plan:
          $ref: '#/components/schemas/PlanSummary'
        plan_execution:
          $ref: '#/components/schemas/PlanExecutionResult'
        journeys:
          type: array
          description: The tests in this plan
          readOnly: true
          items:
            $ref: '#/components/schemas/TestSummary'
          x-mabl-scope: public
        journey_executions:
          type: array
          description: The test runs in this plan
          readOnly: true
          items:
            $ref: '#/components/schemas/TestRunResult'
          x-mabl-scope: public
        start_time:
          type: integer
          description: Plan run start time
          format: int64
          readOnly: true
          x-mabl-scope: public
        stop_time:
          type: integer
          description: Plan run end time
          format: int64
          readOnly: true
          x-mabl-scope: public
    ExecutionStage:
      type: object
      properties:
        name:
          type: string
          description: Name of this stage
        concurrency:
          type: string
          description: How journeys should be executed
          enum:
          - sequential
          - parallel
        concurrency_limit:
          type: integer
          description: The maximum number of concurrent test runs for this stage. Only used with parallel execution
          format: int32
        always_run_stage:
          type: boolean
          description: if true this stage will always run regardless of whether previous stages have passed
        always_run_journeys:
          type: boolean
          description: if true all journeys within this stage will be run even if a preceding journey has failed
        journeys:
          type: array
          description: The journeys included in this stage; if concurrency is sequential they will be executed in this order
          items:
            $ref: '#/components/schemas/TestConfiguration'
        browser_types_override:
          type: array
          items:
            type: string
        use_browser_types_override:
          type: boolean
          description: If true, the browser types in this stage will be used instead of the browser types from the plan
        run_multiplier_override:
          minimum: 1
          type: integer
          format: int32
        use_run_multiplier_override:
          type: boolean
          description: If true, the run multiplier in this stage will be used instead of the run multiplier from the plan
        ignore_datatables:
          type: boolean
          description: If true, the data tables specified in the journeys in this stage will be ignored
      description: Describes a stage of plan execution
    ErrorResponseGeneric:
      type: object
      properties:
        id:
          type: string
          x-mabl-scope: public
        code:
          maximum: 599
          minimum: 100
          type: integer
          format: int32
          x-mabl-scope: public
        message:
          type: string
          x-mabl-scope: public
        error_code:
          type: string
          description: Machine-readable reason for the error, present only when the API names one. Values are guardrail_blocked (a guardrail policy refused an agent request), approval_required (a guardrail policy requires a person to approve the request first).
        guardrail:
          description: The guardrail policy that refused the request; present only when error_code is guardrail_blocked or approval_required.
          allOf:
          - $ref: '#/components/schemas/GuardrailRefusal'
    SourceControlAuthor:
      required:
      - avatar_url
      - html_url
      - id
      - user_name
      type: object
      properties:
        id:
          type: string
          description: vendor unique author id (invariant)
          x-mabl-scope: public
        user_name:
          type: string
          description: author username name (mutable)
          x-mabl-scope: public
        name:
          type: string
          description: author full name (mutable)
          x-mabl-scope: public
        email:
          type: string
          description: author email
          x-mabl-scope: public
        html_url:
          type: string
          description: HTML page url to view author
          x-mabl-scope: public
        avatar_url:
          type: string
          description: author avatar image URL
          x-mabl-scope: public
        user_type:
          type: string
          description: repository name unique within owner scope
          x-mabl-scope: public
      description: the SCM author associated with this object
    TestTypeEnum:
      type: string
      description: Type of test
      enum:
      - api
      - browser
      - performance
      - mobile
      - desktop
      x-mabl-scope: public
    TestRunResult:
      required:
      - app_href
      - href
      - journey_execution_id
      - journey_id
      type: object
      description: Provides information about the result of a test run
      allOf:
      - $ref: '#/components/schemas/BaseTestRunResult'
      - type: object
        properties:
          journey_execution_id:
            type: string
            description: (deprecated, use id instead) The test run ID
            readOnly: true
            x-mabl-scope: public
          application_id:
            type: string
            description: the id of the application associated with this run
            readOnly: true
            x-mabl-scope: public
          environment_id:
            type: string
            description: the id of the environment associated with this run
            readOnly: true
            x-mabl-scope: public
          initial_url:
            type: string
            description: the URL where the test started
            readOnly: true
            x-mabl-scope: public
          credentials_id:
            type: string
            description: The id of the credentials this run used, if any. This is the plan or deployment override when the run carried one, and otherwise the default set on the test version that ran.
            readOnly: true
            x-mabl-scope: public
          branch:
            type: string
            description: 'The branch this run was requested against, taken from the branch on the triggering deployment event or plan run override and, failing that, the environment''s branch. This is the branch asked for, which is not always the branch the executed test version came from: when a branch has not modified a test, the run executes that test''s master version. The version that actually ran is the trailing version suffix on test_id, so a caller can compare it against the test''s source_control_tags to tell a branch-specific version from an inherited master one.'
            readOnly: true
            x-mabl-scope: public
          run_multiplier_index:
            minimum: 0
            type: integer
            description: Zero-indexed run multiplier index for this run
            format: int32
            readOnly: true
            x-mabl-scope: public
          retry_of_id:
            type: string
            description: On a plan run retry, the ID of the test run from the retried plan run that this run re-runs
            readOnly: true
          browser_type:
            type: string
            description: the type of browser associated with this run
            readOnly: true
            x-mabl-scope: public
          scenario_name:
            type: string
            description: the scenario name associated with this run, if any
            readOnly: true
            x-mabl-scope: public
          success:
            type: boolean
            description: true if the test run completed successfully
            readOnly: true
            x-mabl-scope: public
          href:
            type: string
            description: URL for retrieving the test run
            readOnly: true
            x-mabl-scope: public
          app_href:
            type: string
            description: URL for viewing the test run results in the mabl app
            readOnly: true
            x-mabl-scope: public
          start_time:
            type: integer
            description: (deprecated, use started_time) The time this test run started
            format: int64
            readOnly: true
            x-mabl-scope: public
          stop_time:
            type: integer
            description: (deprecated, use completed_time) The time this test run stopped
            format: int64
            readOnly: true
            x-mabl-scope: public
          termination_reason:
            type: string
            description: Termination reason when status is terminated (mirrors TestRun.termination_reason values, e.g. usage_quota_exceeded)
            x-mabl-scope: public
    HttpHeader:
      required:
      - name
      type: object
      properties:
        name:
          type: string
          description: The name of the header
          x-mabl-scope: public
        value:
          type: string
          description: The value of the header
          x-mabl-scope: public
        log_header_value:
          type: boolean
          description: Log the header value in the execution log, if not true only the header name is logged.
          x-mabl-scope: public
      description: An HTTP header
    ExecutionMetrics:
      type: object
      properties:
        total:
          type: integer
          description: The total number of executions
          format: int64
          readOnly: true
          x-mabl-scope: public
        passed:
          type: integer
          description: The number of executions that passed
          format: int64
          readOnly: true
          x-mabl-scope: public
        failed:
          type: integer
          description: The number of executions that failed
          format: int64
          readOnly: true
          x-mabl-scope: public
        running:
          type: integer
          description: The number of executions that are still running
          format: int64
          readOnly: true
          x-mabl-scope: public
        skipped:
          type: integer
          description: The number of executions that were skipped
          format: int64
          readOnly: true
          x-mabl-scope: public
        terminated:
          type: integer
          description: The total number of executions that were terminated before completion
          format: int64
          readOnly: true
          x-mabl-scope: public
    ExecutionRunnerSizeEnum:
      type: string
      description: available runner sizes
      enum:
      - x1
      - x2
      - x3
      - x4
      - x5
      - x6
      - small
      - medium
      - large
      - inherit
    StaticScenarioSelection:
      required:
      - count
      - scenario_ids
      type: object
      properties:
        type:
          type: string
          enum:
          - static
        scenario_ids:
          type: array
          description: The selection scenario IDs
          items:
            type: string
        count:
          type: integer
          description: The estimated count of scenarios
      description: Static scenario selection parameter argument
    ExternalTestCase:
      type: object
      properties:
        id:
          type: string
          description: Id associated with this test case
          x-mabl-scope: public
      description: External test case
    EventQueryResult:
      type: object
      properties:
        events:
          type: array
          description: All events that matched the query
          readOnly: true
          items:
            $ref: '#/components/schemas/Event'
        cursor:
          type: string
          description: Cursor used for pagination
          readOnly: true
  responses:
    ErrorResponse400:
      description: Invalid or missing parameter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse403:
      description: User not authorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse401:
      description: User not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse:
      description: Unknown error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: apiKey
      name: Authorization
      in: header
