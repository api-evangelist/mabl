openapi: 3.2.0
info:
  title: mabl Event API
  description: APIs for interacting with mabl services
  version: 0.599.3.1792436330
  x-readme-id: 62c896636916ce01d2ff4f5a
servers:
- url: /
security:
- basicAuth: []
- bearerAuth: []
tags:
- name: Event
paths:
  /execution/result/event/{event_id}:
    get:
      tags:
      - Event
      summary: Get a deployment result summary
      description: Retrieve information about the plan runs executed using the deployment events API.
      operationId: getExecutionResultForEvent
      parameters:
      - name: event_id
        in: path
        description: The event ID to retrieve test execution results for
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Execution result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionResult'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-scope: public
      x-mabl-action: Read::PlanExecution
  /execution/result/event/{event_id}/plan/{plan_id}:
    get:
      tags:
      - Event
      summary: Get the execution result associated with an event ID and plan ID
      operationId: getExecutionResultForEventAndPlan
      parameters:
      - name: event_id
        in: path
        description: The event ID for which to retrieve execution results
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: plan_id
        in: path
        description: The plan ID to use to filter results; only results associated with this plan will be returned
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Execution result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionResult'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::PlanExecution
  /events:
    get:
      tags:
      - Event
      summary: Query Events
      description: Used to query events
      operationId: queryEvents
      parameters:
      - name: workspace_id
        in: query
        description: ID of the workspace for which to query events
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: environment_id
        in: query
        description: ID of the environment for which to query events
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: application_id
        in: query
        description: ID of the application for which to query events
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: limit
        in: query
        description: The limit to use for pagination
        required: false
        style: form
        explode: true
        schema:
          minimum: 1
          type: integer
          format: int32
      - name: cursor
        in: query
        description: The cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Results of the query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventQueryResult'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::DeploymentEvent
  /events/deployment:
    get:
      tags:
      - Event
      summary: Query Deployment Events
      description: Used to query deployment events
      operationId: queryDeploymentEvents
      parameters:
      - name: workspace_id
        in: query
        description: ID of the workspace for which to query deployment events
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: environment_id
        in: query
        description: ID of the environment for which to query deployment events
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: start_time
        in: query
        description: Start time of the query range, in epoch milliseconds.  Oldest allowed value is 400d in the past.
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int64
      - name: end_time
        in: query
        description: End time of the query range, in epoch milliseconds.  Oldest allowed value is 400d in the past.
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int64
      - name: include_test_executions
        in: query
        description: If false, excludes executions from the run_result in the response, improving performance for large result sets.
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          default: true
      - name: limit
        in: query
        description: The limit to use for pagination. Defaults to 10 if not specified; maximum limit is 100.
        required: false
        style: form
        explode: true
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
          default: 10
      - name: cursor
        in: query
        description: The cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Results of the query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentEventQueryResult'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::DeploymentEvent
      x-mabl-scope: public
    post:
      tags:
      - Event
      summary: Trigger tests on deployment
      description: Create a deployment event to trigger a parallel run of all active plans that meet specified conditions, including application, environment, and plan label. Learn more in the docs.
      operationId: onDeploy
      parameters:
      - name: preview
        in: query
        description: Set to true to preview what would be run
        required: false
        style: form
        explode: true
        schema:
          type: boolean
      requestBody:
        description: The deployment event
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentEvent'
        required: true
      responses:
        '201':
          description: The deployment event was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentEvent'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '403':
          description: The provided API Key is not authorized to make this call
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '404':
          description: The provided application or environment could not be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Run::DeploymentEvent
      x-mabl-scope: public
  /events/deployment/revision:
    get:
      tags:
      - Event
      summary: Query Deployment Events by revision
      description: Used to query deployment events by revision (commit ID/SHA)
      operationId: queryDeploymentEventsByRevision
      parameters:
      - name: workspace_id
        in: query
        description: ID of the workspace for which to query deployment events
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: revision
        in: query
        description: revision (commit ID/SHA) to filter by
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Results of the query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentEventQueryResult'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::DeploymentEvent
      x-mabl-scope: public
  /events/{id}:
    get:
      tags:
      - Event
      summary: Retrieve an existing event
      description: Used to retrieve an existing event
      operationId: getEvent
      parameters:
      - name: id
        in: path
        description: The ID of the event to retrieve
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: The event that was retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          description: Missing or invalid API token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '403':
          description: Given token is not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::DeploymentEvent
    delete:
      tags:
      - Event
      summary: Delete an event
      description: Used to delete an existing event
      operationId: removeEvent
      parameters:
      - name: id
        in: path
        description: The ID of the event to delete
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: The Event was successfully removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Insight not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Delete::DeploymentEvent
  /events/deployment/{id}:
    get:
      tags:
      - Event
      summary: Retrieve an existing deployment event
      description: Used to retrieve an existing deployment event
      operationId: getDeploymentEvent
      parameters:
      - name: id
        in: path
        description: The ID of the event to retrieve
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: The event that was retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentEventResult'
        '401':
          description: Missing or invalid API token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '403':
          description: Given token is not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::DeploymentEvent
    patch:
      tags:
      - Event
      summary: Update deployment event
      description: Update selective attributes on existing deployment event (backend only)
      operationId: updateDeploymentEvent
      parameters:
      - name: id
        in: path
        description: The ID of the event to update
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: If-Match
        in: header
        description: If-Match header according to http/1.1 spec section 14.24
        required: false
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: Update request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentEventUpdateRequest'
        required: true
      responses:
        '200':
          description: Updated entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentEventResult'
        '401':
          description: Missing or invalid API token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '403':
          description: Given token is not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::DeploymentEvent
  /events/runtime-recovery-session:
    post:
      tags:
      - Event
      summary: Record a Runtime Recovery Session event
      description: Publishes a SYSTEM_EVENT observation for a completed runtime recovery session whose verdict was "pass". Internal use only; called by server-agents after the Runtime Recovery Summary agent finalizes its verdict. The observation flows through the state-detection and insights pipelines and ultimately becomes an Insight.
      operationId: triggerRuntimeRecoverySessionEvent
      parameters: []
      requestBody:
        description: Details of the completed runtime recovery session.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeRecoverySessionEventRequest'
        required: true
      responses:
        '202':
          description: The runtime recovery session event was accepted for publishing
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Run::DeploymentEvent
components:
  schemas:
    TestSelection:
      required:
      - source
      - test_ids
      type: object
      properties:
        test_ids:
          maxItems: 50
          minItems: 1
          type: array
          description: The ids of the tests to run, at most 50 entries. An id repeated in the list runs once
          items:
            type: string
          x-mabl-scope: public
        impact_session_id:
          maxLength: 64
          type: string
          description: Optional id of the test impact analysis session that chose these tests. It must be a test impact session in this workspace that recorded the tests it returned, and every entry in test_ids must be one of them; otherwise the event is rejected with a 400 and nothing runs. The deployment event is recorded onto the session so the analysis and what it triggered stay linked; if that record cannot be written, link_warning says so and the event and its runs are unaffected
          x-mabl-scope: public
        source:
          type: string
          description: Whether a person chose this set of tests or software did. Which software is recorded by impact_session_id, which names the session rather than a category
          enum:
          - agent
          - user
          x-mabl-scope: public
        name:
          maxLength: 120
          type: string
          description: Optional display name for the synthesized plan
          x-mabl-scope: public
        retry_failed_tests:
          type: boolean
          description: When true, if any test in the selection fails, mabl reruns only the failed tests, once, on the same deployment event. The event's succeeded is true if the rerun passes; succeeded_first_attempt stays false so a pass on the second attempt is still visible. The rerun resolves each test's branch again, so it runs the latest version there. Each rerun test counts as a test run. Off when omitted
          x-mabl-scope: public
        credentials:
          maxItems: 50
          type: array
          description: Optional login credentials for individual selected tests, such as the plan_credentials_id a test impact analysis reports for each test. A listed test logs in with its credentials_id instead of plan_overrides.credentials_id, and a test not listed runs with plan_overrides as usual. Each test_id must be in test_ids and listed once, and each credentials_id must be credentials in this workspace; otherwise the whole event is refused and nothing runs
          items:
            $ref: '#/components/schemas/SelectedTestCredentials'
          x-mabl-scope: public
        skipped_tests:
          type: array
          description: Tests that were accepted but not run, with the reason. Set by mabl
          readOnly: true
          items:
            $ref: '#/components/schemas/SkippedTest'
          x-mabl-scope: public
        resolved_tests:
          type: array
          description: The version each test resolved to, and the mabl branch that version came from. Set by mabl
          readOnly: true
          items:
            $ref: '#/components/schemas/ResolvedTest'
          x-mabl-scope: public
      description: 'An explicit set of tests to run for a deployment, in place of matching stored plans by label. mabl runs them as one synthesized plan whose identity is scoped to the event, so the runs appear on the deployment results page like any other deployment run. Supports browser or API tests, without mixing types. Each test runs at its version on the selection''s mabl branch, falling back to master when it has none there. That branch is the event''s branch (or source_control_tag), else the deployment''s branch, else the snapshot action''s from, else the environment''s branch, else master, and must be the same for every deployment that can run the selected test type. A branch mabl does not have is not an error: every test runs at master, and resolved_tests shows it. The snapshot action''s from is the exception and must name an existing branch. A test with no version on the branch or master is refused. An environment''s snapshot branch has no master fallback, so a test missing from the snapshot is refused. Each enabled test requires a compatible deployment. The first run runs the versions in resolved_tests. Retries, from retry_failed_tests or a manual rerun, resolve the branch again and run any later edit. Flows are not pinned; they resolve on the branch when each test starts.'
    Event:
      required:
      - workspace_id
      type: object
      properties:
        id:
          type: string
          description: Unique ID for this event
        workspace_id:
          type: string
          description: The ID of the workspace associated with this event
        environment_id:
          type: string
          description: The ID of the environment associated with this event
        application_id:
          type: string
          description: The ID of the application associated with this event
        event_type:
          type: string
          description: The type of event
        event_time:
          type: integer
          description: Time at which the event occurred
          format: int64
        source_control:
          $ref: '#/components/schemas/SourceControl'
        received_time:
          type: integer
          description: Time at which the event was received by the API
          format: int64
        revision:
          type: string
          description: Revision associated with the event
        properties:
          type: object
          additionalProperties:
            type: string
          description: Arbitrary key-value pairs used to pass additional information about this event
        type_specific_fields:
          type: object
          additionalProperties: true
          description: Additional key-value pairs used to record additional, canonical fields relevant to only some event types
        triggered_plan_run_summaries:
          type: array
          description: Summaries of the plans that ran as a result of this event
          items:
            $ref: '#/components/schemas/DeploymentPlanSummary'
      description: Describes a generic event
      x-implements-interface:
      - HasId
      - HasWorkspaceId
    BaseTestRunResult:
      type: object
      properties:
        id:
          type: string
          description: Test run id
          x-mabl-scope: public
        test_ref_id:
          type: string
          description: reference to this test in another system
          x-mabl-scope: public
        workspace_id:
          type: string
          description: workspace Id
          x-mabl-scope: public
        started_time:
          type: integer
          description: Time test run was started, in epoch milliseconds
          format: int64
          x-mabl-scope: public
        completed_time:
          type: integer
          description: Time test run was completed, in epoch milliseconds
          format: int64
          x-mabl-scope: public
        tags:
          type: array
          description: Free text tags associated with this entity
          items:
            $ref: '#/components/schemas/Tag'
        journey_id:
          type: string
          description: (deprecated, use test_id) Test id
          readOnly: true
          x-mabl-scope: public
        test_id:
          type: string
          description: Test id
          readOnly: true
          x-mabl-scope: public
        test_labels:
          type: array
          description: Test labels
          items:
            type: string
          x-mabl-scope: public
        test_name:
          type: string
          description: Test name
          x-mabl-scope: public
        test_type:
          $ref: '#/components/schemas/TestTypeEnum'
        failure_summary:
          $ref: '#/components/schemas/TestRunFailureSummary'
        failure_categorization:
          $ref: '#/components/schemas/FailureCategorization'
        test_cases:
          type: array
          description: User provided external test cases
          readOnly: true
          items:
            $ref: '#/components/schemas/ExternalTestCase'
          x-mabl-scope: public
        timing_summary:
          $ref: '#/components/schemas/TimingSummary'
        execution_source:
          $ref: '#/components/schemas/TestSource'
        status:
          type: string
          description: The current status of this test run
          enum:
          - awaiting_precondition
          - skipped
          - rate_limited
          - queued
          - running
          - completed
          - failed
          - terminating
          - terminated
          x-mabl-scope: public
        status_cause:
          type: string
          description: Cause for setting given status, such as failure cause. Updated in pairs with Status.
          x-mabl-scope: public
        outcome:
          $ref: '#/components/schemas/TestRunResultOutcomeEnum'
        customer_log_uri:
          type: string
          description: Customer facing output log (formerly output_log_uri)
      description: Results of a test run
    ExecutionResult:
      type: object
      properties:
        event_status:
          $ref: '#/components/schemas/EventStatus'
        plan_execution_metrics:
          $ref: '#/components/schemas/ExecutionMetrics'
        journey_execution_metrics:
          $ref: '#/components/schemas/ExecutionMetrics'
        failure_analysis:
          $ref: '#/components/schemas/FailureRootCauseAnalysis'
        executions:
          type: array
          description: Complete list of all plan runs
          readOnly: true
          items:
            $ref: '#/components/schemas/ExecutionSummary'
          x-mabl-scope: public
      description: Summary of plan/test execution results
    SourceControl:
      type: object
      properties:
        revision:
          type: string
          description: the primary source revision associated with this object
          x-mabl-scope: public
        revisions:
          type: array
          description: all source revision ids associated with this object
          items:
            type: string
          x-mabl-scope: public
        commit_username:
          type: string
          description: the username of the user who committed the revision associated with this object
        branch_name:
          type: string
          description: the branch associated with this object
        branches:
          type: array
          description: Related branches
          items:
            $ref: '#/components/schemas/SourceControlBranch'
          x-mabl-scope: public
        pull_request:
          $ref: '#/components/schemas/SourceControlPullRequest'
        pull_requests:
          type: array
          description: Related pull requests
          items:
            $ref: '#/components/schemas/SourceControlPullRequest'
          x-mabl-scope: public
        authors:
          type: array
          description: Related authors. Should be at least one
          items:
            $ref: '#/components/schemas/SourceControlAuthor'
          x-mabl-scope: public
        repository_url:
          type: string
          description: the url of the repository associated with this object
        repository_name:
          type: string
          description: the name of the repository associated with this object
        repository:
          $ref: '#/components/schemas/SourceControlRepository'
    SkippedTest:
      required:
      - reason
      - test_id
      type: object
      properties:
        test_id:
          type: string
          description: The id of the test that was not run
          x-mabl-scope: public
        reason:
          type: string
          description: Why the test was not run
          enum:
          - disabled
          x-mabl-scope: public
      description: A test that a selection named but that mabl did not run
    ExecutionParameter:
      required:
      - type
      - value
      type: object
      properties:
        type:
          type: string
          description: The type of this parameter
          enum:
          - basic_auth
          - credentials
          - ignore_variables
          - value
          - variable_row
          - variables
        name:
          type: string
          description: The name of this parameter
        value:
          type: string
          description: The value of this parameter
        argument:
          type: string
          description: Additional text data for this parameter.
        argumentObject:
          description: Additional data for this parameter.
          oneOf:
          - $ref: '#/components/schemas/DynamicScenarioSelection'
          - $ref: '#/components/schemas/StaticScenarioSelection'
      description: A parameter that is passed during execution of a Plan
    Tag:
      required:
      - name
      type: object
      properties:
        name:
          type: string
          description: tag name
          x-mabl-scope: public
        values:
          maxItems: 32
          minItems: 0
          type: array
          items:
            type: string
    TestSummary:
      required:
      - app_href
      - href
      - id
      type: object
      properties:
        id:
          type: string
          description: Test id
          readOnly: true
          x-mabl-scope: public
        name:
          type: string
          description: test name
          readOnly: true
          x-mabl-scope: public
        href:
          type: string
          description: URL for retrieving the test
          readOnly: true
          x-mabl-scope: public
        app_href:
          type: string
          description: URL for viewing the test in the mabl app
          readOnly: true
          x-mabl-scope: public
        tags:
          type: array
