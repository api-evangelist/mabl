openapi: 3.2.0
info:
  title: mabl App Modeling API
  description: APIs for interacting with mabl services
  version: 0.599.3.1792436330
  x-readme-id: 62c896636916ce01d2ff4f5a
servers:
- url: /
security:
- basicAuth: []
- bearerAuth: []
tags:
- name: AppModeling
paths:
  /appModeling/run/seedFrontier:
    post:
      tags:
      - AppModeling
      summary: Seed the app modeling work frontier (internal)
      description: 'Upserts the app_model_coordinator row for the given application and seeds the work

        frontier from the requested scope (all app-tagged tests by default). Called exclusively

        by the TypeScript initiateAppModelingRun handler — not intended for external callers.

        A full seed is idempotent: re-running on an existing frontier safely adds new tests and

        removes de-tagged ones without re-opening what an earlier run already attempted. A

        scoped seed deliberately re-opens the tests it names.'
      operationId: seedAppModelingFrontier
      parameters:
      - name: workspaceId
        in: query
        description: The workspace ID
        required: true
        style: form
        explode: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeedAppModelingFrontierRequest'
        required: true
      responses:
        '200':
          description: Frontier seeded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeedAppModelingFrontierResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Run::AppModelingRun
  /appModeling/run/{application_id}/state:
    get:
      tags:
      - AppModeling
      summary: Get coordinator run state (internal)
      description: 'Returns the coordinator run state for the given application. Called internally by the

        TypeScript getAppModelingRunState handler to delegate coordinator bookkeeping to the

        Java service layer.'
      operationId: getAppModelingCoordinatorState
      parameters:
      - name: application_id
        in: path
        description: The application ID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: workspaceId
        in: query
        description: The workspace ID
        required: true
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Current coordinator run state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppModelingRunState'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '404':
          description: Coordinator row not found for this application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::AppModelingRun
  /appModeling/run/{application_id}/batch/dequeue:
    post:
      tags:
      - AppModeling
      summary: Dequeue next pending batch (internal)
      description: 'Returns the next pending test invariant IDs for the coordinator to process and

        transitions the run status to RUNNING. Called internally by the TypeScript

        dequeueNextAppModelingBatch handler.'
      operationId: dequeueAppModelingBatchInternal
      parameters:
      - name: application_id
        in: path
        description: The application ID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: workspaceId
        in: query
        description: The workspace ID
        required: true
        style: form
        explode: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppModelingDequeueInternalRequest'
        required: true
      responses:
        '200':
          description: Next batch, or exhausted signal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppModelingDequeueInternalResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '404':
          description: Coordinator row not found for this application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::AppModelingRun
  /appModeling/run/{application_id}/batch/complete:
    post:
      tags:
      - AppModeling
      summary: Mark batch as processed (internal)
      description: 'Marks batch test invariant IDs as attempted, records the inner session ID,

        clears in-flight state, and returns whether the frontier is now exhausted. Called

        internally by the TypeScript markAppModelingBatchComplete handler.'
      operationId: markAppModelingBatchCompleteInternal
      parameters:
      - name: application_id
        in: path
        description: The application ID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: workspaceId
        in: query
        description: The workspace ID
        required: true
        style: form
        explode: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppModelingMarkBatchCompleteInternalRequest'
        required: true
      responses:
        '200':
          description: Batch recorded; frontier exhaustion reported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppModelingMarkBatchCompleteInternalResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '404':
          description: Coordinator row not found for this application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::AppModelingRun
  /appModeling/run/{application_id}/inflight:
    put:
      tags:
      - AppModeling
      summary: Persist in-flight coordinator state (internal)
      description: 'Writes the active inner session ID, last executeAppModeling messages, and batch cursor

        so a pod restart can resume. Called internally by the TypeScript

        persistAppModelingInFlightState handler.'
      operationId: persistAppModelingInFlightStateInternal
      parameters:
      - name: application_id
        in: path
        description: The application ID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: workspaceId
        in: query
        description: The workspace ID
        required: true
        style: form
        explode: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppModelingInFlightStateInternalRequest'
        required: true
      responses:
        '200':
          description: In-flight state persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppModelingInFlightStateInternalResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '404':
          description: Coordinator row not found for this application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::AppModelingRun
  /appModeling/run/{application_id}/status:
    put:
      tags:
      - AppModeling
      summary: Set coordinator run status to terminal state (internal)
      description: 'Sets the coordinator run status to a terminal value (COMPLETED or ERROR). Called

        internally by the TypeScript markAppModelingRunComplete handler.'
      operationId: markAppModelingRunCompleteInternal
      parameters:
      - name: application_id
        in: path
        description: The application ID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: workspaceId
        in: query
        description: The workspace ID
        required: true
        style: form
        explode: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppModelingRunStatusUpdateRequest'
        required: true
      responses:
        '200':
          description: Run status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppModelingRunStatusUpdateResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '404':
          description: Coordinator row not found for this application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::AppModelingRun
components:
  schemas:
    JsonToolCallPartInput:
      type: object
      properties:
        type:
          type: string
          enum:
          - json
        json:
          type: object
          additionalProperties: true
          description: JSON input
    ThinkingPart:
      type: object
      properties:
        type:
          type: string
          enum:
          - thinking
        thinking:
          type: string
          description: The thinking/reasoning text
        signature:
          type: string
          description: Signature of the thinking/reasoning
    Base64FileSource:
      type: object
      properties:
        source_type:
          type: string
          enum:
          - base64
        data:
          type: string
          description: Base64-encoded file data
      allOf:
      - $ref: '#/components/schemas/BaseFileSource'
    TextToolOutput:
      type: object
      properties:
        type:
          type: string
          enum:
          - text
        text:
          type: string
          description: Text tool output that should be directly sent to the API
    FileSource:
      type: object
      properties:
        source_type:
          type: string
          enum:
          - base64
          - uri
      anyOf:
      - $ref: '#/components/schemas/Base64FileSource'
      - $ref: '#/components/schemas/UriFileSource'
    AppModelingDequeueInternalResponse:
      required:
      - exhausted
      type: object
      properties:
        exhausted:
          type: boolean
          description: True when the frontier is fully attempted and there is nothing left.
        batch_item_count:
          type: integer
          description: Number of test invariant IDs in this batch. Echo token passed back to markAppModelingBatchCompleteInternal.
          format: int32
        test_invariant_ids:
          type: array
          description: Test invariant IDs in this batch. Empty when exhausted is true.
          items:
            type: string
      description: Response from the internal dequeue endpoint.
    ToolOutputLogLinesContentItem:
      type: object
      properties:
        type:
          type: string
          enum:
          - log-lines
        lines:
          type: array
          items:
            $ref: '#/components/schemas/LogLineEntry'
        title:
          type: string
          description: Optional heading above the log list
      description: Structured log lines for monospace / level-colored rendering (parity with screenshot-style rich blocks)
    ToolOutputFileDataContentItem:
      type: object
      properties:
        type:
          type: string
          enum:
          - file-data
        file_data:
          type: string
          description: Base-64 encoded file data
        filename:
          type: string
          description: Optional filename of the file
      allOf:
      - $ref: '#/components/schemas/BaseToolOutputDataContentItem'
    SpecialMessageData:
      type: object
      properties:
        type:
          type: string
          enum:
          - cloud_instance_lifecycle
          - user_requested_stop
          - summarize_context
          - branch_merge_skipped
          - workspace_scope_changed
      anyOf:
      - $ref: '#/components/schemas/CloudInstanceLifecycleData'
      - $ref: '#/components/schemas/UserRequestedStopData'
      - $ref: '#/components/schemas/SummarizeContextData'
      - $ref: '#/components/schemas/BranchMergeSkippedData'
      - $ref: '#/components/schemas/WorkspaceScopeChangedData'
    SummarizeContextData:
      type: object
      properties:
        type:
          type: string
          enum:
          - summarize_context
        summary:
          type: string
          description: A summary of the conversation prior to this message
    ToolOutputHarUrlContentItem:
      type: object
      properties:
        type:
          type: string
          enum:
          - har-url
        har_url:
          type: string
          description: gs:// or https URI of the HAR resource
        label:
          type: string
          description: Optional short label for the HAR viewer
      description: Reference to a HAR file artifact (render like screenshot file URIs in the client)
    BaseAgentCloudInstanceLifecycleEvent:
      type: object
      properties:
        cloud_agent_instance_id:
          type: string
          description: The ID of the cloud instance
    BaseFileSource:
      type: object
      properties:
        media_type:
          type: string
          description: MIME type of the file
    AppModelingRunScopeMode:
      type: string
      description: 'Which tests a run''s work frontier is seeded from.


        full: every test that ran against this application in the last 90 days. The default,

        and the only mode that also drops de-tagged tests from the frontier and restores

        previously deferred ones.


        modified_since: the same run-history population, narrowed to tests whose content was

        last updated at or after the given timestamp. Intended for incremental knowledge-graph

        updates over recently-edited tests.


        explicit_tests: exactly the caller-supplied test invariant IDs.

        '
      enum:
      - full
      - modified_since
      - explicit_tests
    UserMessage:
      type: object
      properties:
        role:
          type: string
          enum:
          - user
        parts:
          type: array
          items:
            $ref: '#/components/schemas/UserMessagePart'
      allOf:
      - $ref: '#/components/schemas/BaseMessage'
    ToolOutputImageUrlContentItem:
      type: object
      properties:
        type:
          type: string
          enum:
          - image-url
        image_url:
          type: string
          description: URL of the image
    ToolOutputContentItem:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ToolOutputContentItemType'
      anyOf:
      - $ref: '#/components/schemas/ToolOutputTextContentItem'
      - $ref: '#/components/schemas/ToolOutputJsonContentItem'
      - $ref: '#/components/schemas/ToolOutputFileDataContentItem'
      - $ref: '#/components/schemas/ToolOutputFileUrlContentItem'
      - $ref: '#/components/schemas/ToolOutputImageDataContentItem'
      - $ref: '#/components/schemas/ToolOutputImageUrlContentItem'
      - $ref: '#/components/schemas/ToolOutputHarUrlContentItem'
      - $ref: '#/components/schemas/ToolOutputHarJsonContentItem'
      - $ref: '#/components/schemas/ToolOutputLogLinesContentItem'
    UriFileSource:
      type: object
      properties:
        source_type:
          type: string
          enum:
          - uri
        uri:
          type: string
          description: URI of the file
      allOf:
      - $ref: '#/components/schemas/BaseFileSource'
    ExecutionDeniedToolOutput:
      type: object
      properties:
        type:
          type: string
          enum:
          - execution-denied
        reason:
          type: string
          description: Optional reason for the execution denial
    ErrorJsonToolOutput:
      type: object
      properties:
        type:
          type: string
          enum:
          - error-json
        error_json:
          description: Error details as JSON value
    AppModelingRunStatus:
      type: string
      description: Lifecycle status of an app modeling run.
      enum:
      - IDLE
      - RUNNING
      - COMPLETED
      - ERROR
    LogLineEntry:
      required:
      - text
      type: object
      properties:
        text:
          type: string
        level:
          type: string
          description: Severity e.g. error, warn, info, debug
        source:
          type: string
          description: Origin e.g. console, browser, network
      description: A single log line for structured console or diagnostic output
    AppModelingMarkBatchCompleteInternalResponse:
      required:
      - frontier_exhausted
      type: object
      properties:
        frontier_exhausted:
          type: boolean
          description: Whether the frontier has nothing left for this run to do. True once no item is pending, which for a scoped run includes the tests it deferred — those are not attempted, they are waiting for a later full run.
      description: Response from the internal mark-batch-complete endpoint.
    WorkspaceResultsScopeSnapshot:
      required:
      - end_time
      - start_time
      type: object
      properties:
        start_time:
          type: string
          description: ISO-8601 start of the analysis window
        end_time:
          type: string
          description: ISO-8601 end of the analysis window
        environment_id:
          type: string
        environment_name:
          type: string
        application_id:
          type: string
        application_name:
          type: string
      description: The filters a workspace results chat session was scoped to at a point in time.
    ToolOutputMessage:
      type: object
      properties:
        role:
          type: string
          enum:
          - tool_output
        parts:
          type: array
          items:
            $ref: '#/components/schemas/ToolOutputMessagePart'
      allOf:
      - $ref: '#/components/schemas/BaseMessage'
    MessagePartType:
      type: string
      enum:
      - text
      - file
      - tool_call
      - tool_output
      - thinking
      - code_execution_call
      - code_execution_result
    ModelMessage:
      type: object
      properties:
        role:
          type: string
          enum:
          - model
        parts:
          type: array
          items:
            $ref: '#/components/schemas/ModelMessagePart'
      allOf:
      - $ref: '#/components/schemas/BaseMessage'
    BranchMergeSkippedData:
      type: object
      properties:
        type:
          type: string
          enum:
          - branch_merge_skipped
        branch_id:
          type: string
          description: The ID of the session branch whose automatic merge was skipped
        branch_name:
          type: string
          description: The name of the session branch whose automatic merge was skipped
        diverged_entity_names:
          type: array
          description: Names of the tests or flows whose master version changed after the agent's branch point, making an automatic merge unsafe; the branch is left open for manual review and merge
          items:
            type: string
    GuardrailApprovalRef:
      type: object
      properties:
        id:
          type: string
          description: The approval's id.
        state:
          description: Where the approval stands.
          allOf:
          - $ref: '#/components/schemas/GuardrailApprovalState'
        kind:
          description: Who decides the approval.
          allOf:
          - $ref: '#/components/schemas/GuardrailApprovalKind'
        request_expires_time:
          type: integer
          description: When the approval expires if nobody decides it, in epoch milliseconds.
          format: int64
        url:
          type: string
          description: The mabl app page where a person reviews the approval.
      description: 'An approval a guardrail policy asks for. While it is PENDING, stop: give the person the url, tell them the request is waiting for approval, and do not repeat the request or poll in a loop. Once a person tells you it is APPROVED, repeat the identical request with the header X-Mabl-Approval set to id. DENIED means a person said no, so do not work around it.'
    MessageRole:
      type: string
      enum:
      - user
      - model
      - tool_output
      - special
    CodeExecutionCallPart:
      type: object
      properties:
        type:
          type: string
          enum:
          - code_execution_call
        language:
          type: string
          description: Programming language identifier from Gemini's Language enum (e.g. PYTHON). LANGUAGE_UNSPECIFIED when the model omitted it.
        code:
          type: string
          description: Source code that was executed in the sandbox.
        signature:
          type: string
          description: Thought signature (Gemini 3 with thinking enabled).
      description: Code the model asked the Gemini built-in Python execution sandbox to run. Emitted alongside a matching CodeExecutionResultPart on the same model turn — the sandbox runs synchronously and returns its result in the same response. Only appears when the agent enables the code execution tool and the model chooses to use it.
    JsonToolOutput:
      type: object
      properties:
        type:
          type: string
          enum:
          - json
        json:
          description: Response content as JSON value
    UserMessagePart:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/MessagePartType'
      anyOf:
      - $ref: '#/components/schemas/TextPart'
      - $ref: '#/components/schemas/FilePart'
    ErrorContentToolOutput:
      type: object
      properties:
        type:
          type: string
          enum:
          - error-content
        error_content:
          type: array
          description: Array of error content items
          items:
            $ref: '#/components/schemas/ToolOutputContentItem'
    ToolOutputImageDataContentItem:
      type: object
      properties:
        type:
          type: string
          enum:
          - image-data
        image_data:
          type: string
          description: Base-64 encoded image data
      allOf:
      - $ref: '#/components/schemas/BaseToolOutputDataContentItem'
    UserRequestedStopData:
      type: object
      properties:
        type:
          type: string
          enum:
          - user_requested_stop
        cloud_agent_instance_id:
          type: string
          description: The ID of the cloud instance that the user requested to stop
        requested_by_id:
          type: string
          description: The ID of the user who requested the stop
    ErrorResponseGeneric:
      type: object
      properties:
        id:
          type: string
          x-mabl-scope: public
        code:
          maximum: 599
          minimum: 100
          type: integer
          format: int32
          x-mabl-scope: public
        message:
          type: string
          x-mabl-scope: public
        error_code:
          type: string
          description: Machine-readable reason for the error, present only when the API names one. Values are guardrail_blocked (a guardrail policy refused an agent request), approval_required (a guardrail policy requires a person to approve the request first).
        guardrail:
          description: The guardrail policy that refused the request; present only when error_code is guardrail_blocked or approval_required.
          allOf:
          - $ref: '#/components/schemas/GuardrailRefusal'
    ModelMessagePart:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/MessagePartType'
      anyOf:
      - $ref: '#/components/schemas/TextPart'
      - $ref: '#/components/schemas/ToolCallPart'
      - $ref: '#/components/schemas/ThinkingPart'
      - $ref: '#/components/schemas/CodeExecutionCallPart'
      - $ref: '#/components/schemas/CodeExecutionResultPart'
    CloudInstanceLifecycleData:
      type: object
      properties:
        type:
          type: string
          enum:
          - cloud_instance_lifecycle
        lifecycle_event:
          $ref: '#/components/schemas/AgentCloudInstanceLifecycleEvent'
    MessagePart:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/MessagePartType'
      anyOf:
      - $ref: '#/components/schemas/TextPart'
      - $ref: '#/components/schemas/FilePart'
      - $ref: '#/components/schemas/ToolCallPart'
      - $ref: '#/components/schemas/ThinkingPart'
      - $ref: '#/components/schemas/ToolOutputMessagePart'
      - $ref: '#/components/schemas/CodeExecutionCallPart'
      - $ref: '#/components/schemas/CodeExecutionResultPart'
    AppModelingRunStatusUpdateRequest:
      required:
      - run_status
      type: object
      properties:
        run_status:
          $ref: '#/components/schemas/AppModelingRunStatus'
        budget_capped:
          type: boolean
          description: 'True when the run is completing because it hit the MAX_BATCHES budget ceiling while

            the work frontier was NOT exhausted (a truncated run); false on a true frontier-drain

            completion. Persisted in run_metrics so a bound-out is distinguishable from a full

            drain. Optional; defaults false.

            '
          default: false
        run_session_id:
          type: string
          description: 'The run session this status belongs to. Supply it whenever the caller knows which run it is finalizing: the coordinator row is reused per application, so a newer run can have re-claimed it, and a status carrying a session id is applied only while that session still owns the row. Omitted, the status is written unconditionally.'
      description: Request to update the coordinator run status.
    ToolCallPart:
      type: object
      properties:
        type:
          type: string
          enum:
          - tool_call
        id:
          type: string
          description: Unique identifier for the tool call
        name:
          type: string
          description: Name of the tool/function
        input:
          $ref: '#/components/schemas/ToolCallPartInput'
        signature:
          type: string
          description: Thought signature from the model (required by Gemini 3 when thinking is enabled)
    GuardrailApprovalKind:
      type: string
      description: Who decides a guardrail approval. SELF is decided by the person the agent acts for; WORKSPACE, for an agent acting for an API key, by a workspace owner or editor.
      enum:
      - SELF
      - WORKSPACE
    SeedAppModelingFrontierResponse:
      required:
      - seeded_test_count
      type: object
      properties:
        seeded_test_count:
          type: integer
          description: Number of test invariant IDs the run's scope opened for modeling.
          format: int32
        deferred_test_count:
          type: integer
          description: Number of tests an earlier run left pending that this run set aside because they fall outside its scope. Always zero for a full run.
          format: int32
      description: Response from seedAppModelingFrontier.
    ToolOutputFileUrlContentItem:
      type: object
      properties:
        type:
          type: string
          enum:
          - file-url
        file_url:
          type: string
          description: URL of the file
    AppModelingRunScope:
      required:
      - mode
      type: object
      properties:
        mode:
          $ref: '#/components/schemas/AppModelingRunScopeMode'
        modified_since:
          type: string
          description: Required for modified_since, rejected otherwise. Tests whose last update is at or after this instant are seeded.
          format: date-time
        test_invariant_ids:
          type: array
          description: Required for explicit_tests, rejected otherwise. Each ID must name a test that exists in this workspace and is not deleted; unknown IDs fail the request rather than being silently skipped.
          items:
            type: string
      description: 'The subset of an application''s tests a run covers.


        In a scoped mode (modified_since, explicit_tests) the run''s scope becomes the frontier''s

        pending set: the scoped tests are opened for modeling even if an earlier run already

        attempted them, tests already attempted outside the scope stay attempted, and tests left

        pending by an earlier run that ended early are deferred so this run does not drain them.

        A later full run restores deferred tests, so nothing is lost.

        '
    AppModelingInFlightStateInternalRequest:
      required:
      - active_inner_session_id
      - batch_cursor
      type: object
      properties:
        active_inner_session_id:
          type: string
          description: The inner AMA session ID currently being driven.
        last_inner_messages:
          type: array
          description: The new_messages returned by the most recent executeAppModeling turn.
          items:
            type: object
            additionalProperties: true
        batch_cursor:
          type: integer
          description: Current batch cursor.
          format: int32
        last_kg_row_count:
          type: integer
          description: The kg_row_count observed after the most recent executeAppModeling turn.
          format: int64
        stall_reinvoke_count:
          type: integer
          description: Consecutive re-invocations so far with no net-new KG rows for this inner session.
          format: int32
        test_invariant_ids:
          type: array
          description: Test invariant IDs of the batch being processed, persisted so a resumed coordinator pod can mark the batch complete instead of re-dequeuing/re-modeling it.
          items:
            type: string
      description: Request body to persist in-flight coordinator state.
    BaseMessage:
      required:
