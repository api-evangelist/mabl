      type: object
      properties:
        run_status:
          $ref: '#/components/schemas/AppModelingRunStatus'
        frontier_exhausted:
          type: boolean
          description: Whether the work frontier has nothing left for this run to do. True once no item is pending, which for a scoped run includes the tests it deferred — those are not attempted, they are waiting for a later full run.
        batches_processed:
          type: integer
          description: Number of batches that have been marked complete.
          format: int32
        active_inner_session_id:
          type: string
          description: The inner AMA session ID currently being driven, if any.
        resume_state:
          $ref: '#/components/schemas/AppModelingResumeState'
        kg_row_count:
          type: integer
          description: 'Current count of this app''s active KG rows (nodes + edges + external refs). A

            read-only progress signal: the coordinator compares this value across

            executeAppModeling re-invocations to detect a stalled inner session (see

            AppModelingResumeState.last_kg_row_count). Counts only — never inspects what was

            written.

