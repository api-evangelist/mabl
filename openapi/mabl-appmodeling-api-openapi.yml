          format: int64
        budget_capped:
          type: boolean
          description: 'True if this run completed by hitting the MAX_BATCHES budget ceiling with the work

            frontier not yet exhausted (a truncated run), false otherwise. Surfaced from the

            persisted run_metrics so a bound-out is observable and not mistaken for a full drain.

