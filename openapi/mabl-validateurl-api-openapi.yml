openapi: 3.2.0
info:
  title: mabl Validate URL API
  description: APIs for interacting with mabl services
  version: 0.599.3.1792436330
  x-readme-id: 62c896636916ce01d2ff4f5a
servers:
- url: /
security:
- basicAuth: []
- bearerAuth: []
tags:
- name: ValidateUrl
paths:
  /validations/url:
    post:
      tags:
      - ValidateUrl
      summary: Create URL validation request
      operationId: createValidateUrl
      requestBody:
        description: validation request object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateUrl'
        required: true
      responses:
        '201':
          description: URL Validation request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateUrl'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Create::Validation
  /validations/url/{id}:
    get:
      tags:
      - ValidateUrl
      summary: Get URL Validation Request
      description: Get Async Validation Request
      operationId: getValidateUrl
      parameters:
      - name: id
        in: path
        description: validation request id
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: AsyncValidationRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateUrl'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: AsyncValidationRequest not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::Validation
    put:
      tags:
      - ValidateUrl
      summary: Upsert URL Validation Request
      operationId: updateValidateUrl
      parameters:
      - name: id
        in: path
        description: Validation request identifier
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: If-Match
        in: header
        description: If-Match header according to http/1.1 spec section 14.24
        required: false
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: URL validation request object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateUrl'
        required: true
      responses:
        '200':
          description: Updated URL validation request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateUrl'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: AsyncValidationRequest not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::Validation
    delete:
      tags:
      - ValidateUrl
      summary: Remove URL validation request
      operationId: removeValidateUrl
      parameters:
      - name: id
        in: path
        description: validation request id
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '204':
          description: Validation Request Removed
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Delete::Validation
components:
  responses:
    ErrorResponse400:
      description: Invalid or missing parameter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse401:
      description: User not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse403:
      description: User not authorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse:
      description: Unknown error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
  schemas:
    ValidationResult:
      type: object
      properties:
        valid:
          type: boolean
    ErrorResponseGeneric:
      type: object
      properties:
        id:
          type: string
          x-mabl-scope: public
        code:
          maximum: 599
          minimum: 100
          type: integer
          format: int32
          x-mabl-scope: public
        message:
          type: string
          x-mabl-scope: public
        error_code:
          type: string
          description: Machine-readable reason for the error, present only when the API names one. Values are guardrail_blocked (a guardrail policy refused an agent request), approval_required (a guardrail policy requires a person to approve the request first).
        guardrail:
          description: The guardrail policy that refused the request; present only when error_code is guardrail_blocked or approval_required.
          allOf:
          - $ref: '#/components/schemas/GuardrailRefusal'
    GuardrailApprovalRef:
      type: object
      properties:
        id:
          type: string
          description: The approval's id.
        state:
          description: Where the approval stands.
          allOf:
          - $ref: '#/components/schemas/GuardrailApprovalState'
        kind:
          description: Who decides the approval.
          allOf:
          - $ref: '#/components/schemas/GuardrailApprovalKind'
        request_expires_time:
          type: integer
          description: When the approval expires if nobody decides it, in epoch milliseconds.
          format: int64
        url:
          type: string
          description: The mabl app page where a person reviews the approval.
      description: 'An approval a guardrail policy asks for. While it is PENDING, stop: give the person the url, tell them the request is waiting for approval, and do not repeat the request or poll in a loop. Once a person tells you it is APPROVED, repeat the identical request with the header X-Mabl-Approval set to id. DENIED means a person said no, so do not work around it.'
    GuardrailApprovalState:
      type: string
      description: Where a guardrail approval stands. PENDING awaits a decision and expires undecided after 24 hours; APPROVED lets the agent repeat the request, as often as it does, for 20 minutes; DENIED refuses the same request for 20 minutes after the decision, after which asking again opens a new approval; CANCELLED means a person withdrew it while pending or revoked it while approved. EXPIRED and CANCELLED are final.
      enum:
      - PENDING
      - APPROVED
      - DENIED
      - EXPIRED
      - CANCELLED
    ValidateUrl:
      allOf:
      - $ref: '#/components/schemas/AsyncValidationRequest'
      - required:
        - target
        type: object
        properties:
          target:
            required:
            - url
            type: object
            properties:
              url:
                type: string
          validation_results:
            type: array
            description: Results of validations
            items:
              $ref: '#/components/schemas/ValidateUrlResult'
      x-implements-interface:
      - ActivityTrackingBaseEntity
      - HasWorkspaceId
    GuardrailRefusal:
      type: object
      properties:
        id:
          type: string
          description: The id of the guardrail policy that decided the refusal.
        reason:
          type: string
          description: Why the policy refuses the request, written for the person the agent acts for.
        decision_id:
          type: string
          description: The id of this decision in the guardrail decision log.
        action:
          type: string
          description: The action the request was evaluated as, written Verb::Resource (for example Delete::Test), as declared by the operation's x-mabl-action extension.
        policy_source:
          type: string
          description: 'Who set the deciding policy: workspace for a rule the workspace''s owners wrote, account for a rule set for the workspace''s account, mabl_agent_type for the agent type''s ceiling, and mabl_default for mabl''s own defaults.'
        approval:
          description: The approval for this request; present when error_code is approval_required and the approval could be recorded. Without it the request cannot be approved.
          allOf:
          - $ref: '#/components/schemas/GuardrailApprovalRef'
      description: The guardrail policy that refused an agent request.
    ValidateUrlResult:
      allOf:
      - $ref: '#/components/schemas/ValidationResult'
      - type: object
        properties:
          error_code:
            type: string
            description: validation failure code
            enum:
            - CERT_HOSTNAME_MISMATCH
            - HTTP_VERSION_UNSUPPORTED
            - MALFORMED_URL
            - METHOD_UNSUPPORTED
            - NO_RESPONSE
            - REDIRECT_LIMIT
            - SERVER_ERROR
            - SOCKET_EXCEPTION
            - SSL_ERROR
            - TIMEOUT
            - TUNNEL_REFUSED
            - UNKNOWN_HOST
            - UNKNOWN
            - UNREACHABLE
            - BAD_REQUEST
            x-force-uppercase: true
    AsyncValidationRequest:
      required:
      - workspace_id
      type: object
      properties:
        id:
          type: string
          description: unique identifier
        workspace_id:
          type: string
          description: Associated workspace
        status:
          type: string
          description: Validation status
          enum:
          - error
          - pending
          - running
          - success
        created_time:
          type: integer
          description: Time at which the insight was created
          format: int64
        created_by_id:
          type: string
          description: The ID of the user who created this insight
        last_updated_time:
          type: integer
          description: time the insight was last updated
          format: int64
        last_updated_by_id:
          type: string
          description: The ID of the user who last updated this insight
      x-implements-interface:
      - ActivityTrackingBaseEntity
      - HasWorkspaceId
    GuardrailApprovalKind:
      type: string
      description: Who decides a guardrail approval. SELF is decided by the person the agent acts for; WORKSPACE, for an agent acting for an API key, by a workspace owner or editor.
      enum:
      - SELF
      - WORKSPACE
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: apiKey
      name: Authorization
      in: header
