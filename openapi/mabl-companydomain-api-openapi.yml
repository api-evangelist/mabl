openapi: 3.2.0
info:
  title: mabl Company Domain API
  description: APIs for interacting with mabl services
  version: 0.599.3.1792436330
  x-readme-id: 62c896636916ce01d2ff4f5a
servers:
- url: /
security:
- basicAuth: []
- bearerAuth: []
tags:
- name: CompanyDomain
paths:
  /company-domains:
    get:
      tags:
      - CompanyDomain
      summary: Query Company Domains
      description: Used to query company domains
      operationId: queryCompanyDomains
      parameters:
      - name: companyId
        in: query
        description: The ID of the company that owns the domains
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: domainName
        in: query
        description: The domain name to look for
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: limit
        in: query
        description: The limit to use for pagination
        required: false
        style: form
        explode: true
        schema:
          minimum: 1
          type: integer
          format: int32
      - name: cursor
        in: query
        description: The cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Results of the query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyDomainQueryResult'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::Company
    post:
      tags:
      - CompanyDomain
      summary: Create CompanyDomain
      description: Used to create new Company Domains
      operationId: createCompanyDomain
      requestBody:
        description: The company domain to create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyDomain'
        required: true
      responses:
        '201':
          description: The company domain that was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyDomain'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Create::Company
  /company-domains/{id}:
    get:
      tags:
      - CompanyDomain
      summary: get company domain details
      description: Get the details for a given company domain
      operationId: getCompanyDomain
      parameters:
      - name: id
        in: path
        description: The id of the company domain to retrieve
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Company domain found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyDomain'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::Company
    delete:
      tags:
      - CompanyDomain
      summary: Remove Company Domain
      description: Removes a company domain
      operationId: removeCompanyDomain
      parameters:
      - name: id
        in: path
        description: The ID of the company domain to remove
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '204':
          description: The company domain that was removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyDomain'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Delete::Company
    patch:
      tags:
      - CompanyDomain
      summary: update company domain object
      description: Update the company domain object
      operationId: updateCompanyDomain
      parameters:
      - name: id
        in: path
        description: The id of the company domain to update
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: The company domain update to apply
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyDomain'
        required: true
      responses:
        '200':
          description: Company domain updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyDomain'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Company not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::Company
components:
  responses:
    ErrorResponse400:
      description: Invalid or missing parameter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse401:
      description: User not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse403:
      description: User not authorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse:
      description: Unknown error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse404:
      description: Entity not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
  schemas:
    ErrorResponseGeneric:
      type: object
      properties:
        id:
          type: string
          x-mabl-scope: public
        code:
          maximum: 599
          minimum: 100
          type: integer
          format: int32
          x-mabl-scope: public
        message:
          type: string
          x-mabl-scope: public
        error_code:
          type: string
          description: Machine-readable reason for the error, present only when the API names one. Values are guardrail_blocked (a guardrail policy refused an agent request), approval_required (a guardrail policy requires a person to approve the request first).
        guardrail:
          description: The guardrail policy that refused the request; present only when error_code is guardrail_blocked or approval_required.
          allOf:
          - $ref: '#/components/schemas/GuardrailRefusal'
    CompanyDomain:
      type: object
      properties:
        id:
          type: string
          description: The ID of the company domain
        company_id:
          type: string
          description: The ID of the company that owns the domain
        created_time:
          type: integer
          description: Time at which the domain was created
          format: int64
          readOnly: true
        created_by_id:
          type: string
          description: The ID of the user who created this domain
        last_updated_time:
          type: integer
          description: Time at which the domain was last updated
          format: int64
          readOnly: true
        last_updated_by_id:
          type: string
          description: The ID of the user who last updated this domain
        domain_name:
          type: string
          description: The fully qualified domain name
        sso_locking_enabled:
          type: boolean
          description: If enabled forces users from this domain (email) to log using SSO
          default: true
      description: A domain claimed by a company
    GuardrailApprovalRef:
      type: object
      properties:
        id:
          type: string
          description: The approval's id.
        state:
          description: Where the approval stands.
          allOf:
          - $ref: '#/components/schemas/GuardrailApprovalState'
        kind:
          description: Who decides the approval.
          allOf:
          - $ref: '#/components/schemas/GuardrailApprovalKind'
        request_expires_time:
          type: integer
          description: When the approval expires if nobody decides it, in epoch milliseconds.
          format: int64
        url:
          type: string
          description: The mabl app page where a person reviews the approval.
      description: 'An approval a guardrail policy asks for. While it is PENDING, stop: give the person the url, tell them the request is waiting for approval, and do not repeat the request or poll in a loop. Once a person tells you it is APPROVED, repeat the identical request with the header X-Mabl-Approval set to id. DENIED means a person said no, so do not work around it.'
    GuardrailApprovalState:
      type: string
      description: Where a guardrail approval stands. PENDING awaits a decision and expires undecided after 24 hours; APPROVED lets the agent repeat the request, as often as it does, for 20 minutes; DENIED refuses the same request for 20 minutes after the decision, after which asking again opens a new approval; CANCELLED means a person withdrew it while pending or revoked it while approved. EXPIRED and CANCELLED are final.
      enum:
      - PENDING
      - APPROVED
      - DENIED
      - EXPIRED
      - CANCELLED
    GuardrailRefusal:
      type: object
      properties:
        id:
          type: string
          description: The id of the guardrail policy that decided the refusal.
        reason:
          type: string
          description: Why the policy refuses the request, written for the person the agent acts for.
        decision_id:
          type: string
          description: The id of this decision in the guardrail decision log.
        action:
          type: string
          description: The action the request was evaluated as, written Verb::Resource (for example Delete::Test), as declared by the operation's x-mabl-action extension.
        policy_source:
          type: string
          description: 'Who set the deciding policy: workspace for a rule the workspace''s owners wrote, account for a rule set for the workspace''s account, mabl_agent_type for the agent type''s ceiling, and mabl_default for mabl''s own defaults.'
        approval:
          description: The approval for this request; present when error_code is approval_required and the approval could be recorded. Without it the request cannot be approved.
          allOf:
          - $ref: '#/components/schemas/GuardrailApprovalRef'
      description: The guardrail policy that refused an agent request.
    CompanyDomainQueryResult:
      type: object
      properties:
        domains:
          type: array
          description: All company domains that matched the query
          readOnly: true
          items:
            $ref: '#/components/schemas/CompanyDomain'
        cursor:
          type: string
          description: Cursor used for pagination
          readOnly: true
    GuardrailApprovalKind:
      type: string
      description: Who decides a guardrail approval. SELF is decided by the person the agent acts for; WORKSPACE, for an agent acting for an API key, by a workspace owner or editor.
      enum:
      - SELF
      - WORKSPACE
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: apiKey
      name: Authorization
      in: header
x-provenance:
  method: harvested
  publisher: Mabl
  source: https://api.mabl.com/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
