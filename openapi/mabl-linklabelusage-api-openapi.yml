openapi: 3.2.0
info:
  title: mabl Link Label Usage API
  description: APIs for interacting with mabl services
  version: 0.599.3.1792436330
  x-readme-id: 62c896636916ce01d2ff4f5a
servers:
- url: /
security:
- basicAuth: []
- bearerAuth: []
tags:
- name: LinkLabelUsage
paths:
  /workspaces/{workspace_id}/link/labelUsages:
    get:
      tags:
      - LinkLabelUsage
      summary: Query Link label usages in a workspace
      description: 'Lists the Link label settings of a workspace''s environments and database connections, and nothing else about them. Environments come first, then database connections. An environment is included when use_link_agent is true or it has any labels; a database connection is included when its default connection properties or any of its overrides have labels. Pages may hold fewer than limit items, even none: keep paging until no cursor is returned.'
      operationId: queryLinkLabelUsages
      parameters:
      - name: workspace_id
        in: path
        description: The ID of the workspace
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of environments or database connections to scan (not necessarily returned) for this page
        required: false
        style: form
        explode: true
        schema:
          maximum: 200
          minimum: 1
          type: integer
          format: int32
      - name: cursor
        in: query
        description: Pagination cursor returned by the previous page
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: A page of Link label usages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkLabelUsageQueryResult'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::LinkAgent
  /environments/{environment_id}/link:
    patch:
      tags:
      - LinkLabelUsage
      summary: Update an environment's Link labels
      description: Replaces only the environment's link_agent_labels (deduplicated) and keeps the deprecated link_agent_label equal to the first label. No other environment field changes.
      operationId: updateEnvironmentLinkLabels
      parameters:
      - name: environment_id
        in: path
        description: The ID of the environment
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: If-Match
        in: header
        description: 'The version from the label usage or environment being updated. Functionally required: omitting it returns 428. Declared optional so a missing header reaches the service instead of failing schema validation with a generic 400.'
        required: false
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentLinkLabelsUpdate'
        required: true
      responses:
        '200':
          description: The environment's updated Link label usage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkLabelUsage'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
        '412':
          $ref: '#/components/responses/ErrorResponse'
        '428':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::Environment
  /database/connections/{connection_id}/link:
    patch:
      tags:
      - LinkLabelUsage
      summary: Update a database connection's Link labels
      description: Replaces only the given Link labels (deduplicated) of the connection's default connection properties and of the overrides matched by environment_id, keeping each deprecated link_agent_label equal to the first label. Omitted labels and unmatched overrides are unchanged; no other field changes.
      operationId: updateDatabaseConnectionLinkLabels
      parameters:
      - name: connection_id
        in: path
        description: The ID of the database connection
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: If-Match
        in: header
        description: 'The version from the label usage or database connection being updated. Functionally required: omitting it returns 428. Declared optional so a missing header reaches the service instead of failing schema validation with a generic 400.'
        required: false
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatabaseConnectionLinkLabelsUpdate'
        required: true
      responses:
        '200':
          description: The database connection's updated Link label usage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkLabelUsage'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
        '412':
          $ref: '#/components/responses/ErrorResponse'
        '428':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::DatabaseConnection
components:
  schemas:
    LinkLabelUsageEntityType:
      type: string
      enum:
      - environment
      - database_connection
    LinkLabelUsageQueryResult:
      type: object
      properties:
        usages:
          type: array
          items:
            $ref: '#/components/schemas/LinkLabelUsage'
        cursor:
          type: string
          description: Cursor for the next page; absent on the last page
    ErrorResponseGeneric:
      type: object
      properties:
        id:
          type: string
          x-mabl-scope: public
        code:
          maximum: 599
          minimum: 100
          type: integer
          format: int32
          x-mabl-scope: public
        message:
          type: string
          x-mabl-scope: public
        error_code:
          type: string
          description: Machine-readable reason for the error, present only when the API names one. Values are guardrail_blocked (a guardrail policy refused an agent request), approval_required (a guardrail policy requires a person to approve the request first).
        guardrail:
          description: The guardrail policy that refused the request; present only when error_code is guardrail_blocked or approval_required.
          allOf:
          - $ref: '#/components/schemas/GuardrailRefusal'
    LinkLabelUsageOverride:
      required:
      - environment_id
      type: object
      properties:
        environment_id:
          type: string
          description: Environment ID of the override
        link_agent_labels:
          type: array
          description: Labels of the override's connection properties. Absent when none are stored, in which case the override routes by the environment's labels. Required when updating.
          items:
            type: string
      description: The Link labels of a database connection's override for one environment
    LinkLabelUsage:
      type: object
      properties:
        entity_type:
          $ref: '#/components/schemas/LinkLabelUsageEntityType'
        id:
          type: string
          description: Environment or database connection ID
        workspace_id:
          type: string
          description: Workspace ID
        name:
          type: string
          description: Environment or database connection name
        use_link_agent:
          type: boolean
          description: Environments only - whether test traffic routes through Link
        link_agent_labels:
          type: array
          description: Environment labels, or the database connection's default connection property labels. Absent when none are stored.
          items:
            type: string
        connection_overrides:
          type: array
          description: Database connections only - the labels of every per-environment override
          items:
            $ref: '#/components/schemas/LinkLabelUsageOverride'
        version:
          type: string
          description: The entity version, to send as If-Match when updating these labels
      description: The Link label settings of one environment or database connection
    GuardrailApprovalRef:
      type: object
      properties:
        id:
          type: string
          description: The approval's id.
        state:
          description: Where the approval stands.
          allOf:
          - $ref: '#/components/schemas/GuardrailApprovalState'
        kind:
          description: Who decides the approval.
          allOf:
          - $ref: '#/components/schemas/GuardrailApprovalKind'
        request_expires_time:
          type: integer
          description: When the approval expires if nobody decides it, in epoch milliseconds.
          format: int64
        url:
          type: string
          description: The mabl app page where a person reviews the approval.
      description: 'An approval a guardrail policy asks for. While it is PENDING, stop: give the person the url, tell them the request is waiting for approval, and do not repeat the request or poll in a loop. Once a person tells you it is APPROVED, repeat the identical request with the header X-Mabl-Approval set to id. DENIED means a person said no, so do not work around it.'
    GuardrailApprovalState:
      type: string
      description: Where a guardrail approval stands. PENDING awaits a decision and expires undecided after 24 hours; APPROVED lets the agent repeat the request, as often as it does, for 20 minutes; DENIED refuses the same request for 20 minutes after the decision, after which asking again opens a new approval; CANCELLED means a person withdrew it while pending or revoked it while approved. EXPIRED and CANCELLED are final.
      enum:
      - PENDING
      - APPROVED
      - DENIED
      - EXPIRED
      - CANCELLED
    EnvironmentLinkLabelsUpdate:
      required:
      - link_agent_labels
      type: object
      properties:
        link_agent_labels:
          type: array
          description: The environment's new labels, replacing the current ones
          items:
            type: string
    GuardrailRefusal:
      type: object
      properties:
        id:
          type: string
          description: The id of the guardrail policy that decided the refusal.
        reason:
          type: string
          description: Why the policy refuses the request, written for the person the agent acts for.
        decision_id:
          type: string
          description: The id of this decision in the guardrail decision log.
        action:
          type: string
          description: The action the request was evaluated as, written Verb::Resource (for example Delete::Test), as declared by the operation's x-mabl-action extension.
        policy_source:
          type: string
          description: 'Who set the deciding policy: workspace for a rule the workspace''s owners wrote, account for a rule set for the workspace''s account, mabl_agent_type for the agent type''s ceiling, and mabl_default for mabl''s own defaults.'
        approval:
          description: The approval for this request; present when error_code is approval_required and the approval could be recorded. Without it the request cannot be approved.
          allOf:
          - $ref: '#/components/schemas/GuardrailApprovalRef'
      description: The guardrail policy that refused an agent request.
    DatabaseConnectionLinkLabelsUpdate:
      type: object
      properties:
        link_agent_labels:
          type: array
          description: New labels for the default connection properties; unchanged when omitted
          items:
            type: string
        connection_overrides:
          type: array
          description: New labels for existing overrides, matched by environment_id; overrides not listed are unchanged
          items:
            $ref: '#/components/schemas/LinkLabelUsageOverride'
    GuardrailApprovalKind:
      type: string
      description: Who decides a guardrail approval. SELF is decided by the person the agent acts for; WORKSPACE, for an agent acting for an API key, by a workspace owner or editor.
      enum:
      - SELF
      - WORKSPACE
  responses:
    ErrorResponse400:
      description: Invalid or missing parameter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse401:
      description: User not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse403:
      description: User not authorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse:
      description: Unknown error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse404:
      description: Entity not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: apiKey
      name: Authorization
      in: header
