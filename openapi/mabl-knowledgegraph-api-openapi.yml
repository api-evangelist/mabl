          type: string
          description: The workspace this node belongs to
        application_id:
          type: string
          description: The application this node is associated with
        label:
          $ref: '#/components/schemas/KnowledgeGraphNodeLabel'
        name:
          type: string
          description: The name of the concept
        summary:
          type: string
          description: A short summary of the concept
        content:
          type: string
          description: Detailed content for this node (max 20K chars before embedding fallback)
        status:
          $ref: '#/components/schemas/KnowledgeGraphNodeStatus'
        confidence:
          type: number
          description: Confidence score (0.0-1.0) mapped from tier (high=1.0, medium=0.6, low=0.3)
          format: double
        provenance_summary:
          type: string
          description: Free-text provenance summary for this concept
        properties:
          type: object
          description: Additional structured properties for this node
        embedding_input_is_summary:
          type: boolean
          description: True if embedding was computed from summary rather than content (content exceeded 20K chars)
        version:
          type: integer
          description: Monotonic edit counter (server-managed, readOnly)
          format: int64
        u_version_:
          type: string
          description: ETag for optimistic locking (server-managed, readOnly)
        last_updated_by:
          type: string
          description: Principal who last updated this node (server-managed, readOnly)
        agent_type:
          type: string
          description: Agent type that wrote this node (e.g. AMA-Bootstrap, RAA-Enrichment)
        agent_version:
          type: string
          description: Agent version that wrote this node
        created_by:
          type: string
          description: Principal who created this node (server-managed, readOnly)
        created_at:
          type: string
          description: Creation timestamp
          format: date-time
        updated_at:
          type: string
          description: Last update timestamp
          format: date-time
      description: A node in the knowledge graph representing a concept (Page, Workflow, Feature, KnowledgeDoc, Pattern)
    AppModelIndexNode:
      type: object
      properties:
        node_id:
          type: string
          description: The node's identifier
        label:
          $ref: '#/components/schemas/KnowledgeGraphNodeLabel'
        name:
          type: string
          description: The name of the concept
        summary:
          type: string
          description: A short summary of the concept
        ref_counts:
          type: object
          additionalProperties:
            type: integer
            format: int32
          description: Linked-test counts by relationship (e.g. validates, uses)
      description: A trimmed ACTIVE concept node projected for the app model index
    KnowledgeGraphExternalRef:
      type: object
      properties:
        workspace_id:
          type: string
          description: The workspace this reference belongs to
        node_id:
          type: string
          description: The knowledge graph node this reference is attached to
        entity_type:
          type: string
          description: The type of external entity (e.g. test, flow, plan, step_execution)
        entity_id:
          type: string
          description: The ID of the external entity
        relationship:
          type: string
          description: The relationship between the node and the external entity
        entity_variant_id:
          type: string
          description: The variant/version ID of the external entity at time of linking
        referenced_entity_version:
          type: string
          description: The version of the externally referenced entity (not the ETag)
        description:
          type: string
          description: Human-readable description of this reference
        properties:
          type: object
          description: Additional structured properties for this reference
        version:
          type: integer
          description: Monotonic edit counter (server-managed, readOnly)
          format: int64
        u_version_:
          type: string
          description: ETag for optimistic locking (server-managed, readOnly)
        last_updated_by:
          type: string
          description: Principal who last updated this reference (server-managed, readOnly)
        created_by:
          type: string
          description: Principal who created this reference (server-managed, readOnly)
        agent_type:
          type: string
          description: Agent type that wrote this reference
        agent_version:
          type: string
          description: Agent version that wrote this reference
        created_at:
          type: string
          description: Creation timestamp
          format: date-time
        updated_at:
          type: string
          description: Last update timestamp
          format: date-time
      description: 'An external reference linking a knowledge graph node to an external entity. Composite primary key: (workspace_id, node_id, entity_type, entity_id, relationship).

        '
    KnowledgeGraphNodeListResult:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeGraphNode'
        cursor:
          type: string
          description: Cursor for fetching the next page of results (absent when no more pages)
      description: Paginated list result for knowledge graph nodes
    GuardrailApprovalRef:
      type: object
      properties:
        id:
          type: string
          description: The approval's id.
        state:
          description: Where the approval stands.
          allOf:
          - $ref: '#/components/schemas/GuardrailApprovalState'
        kind:
          description: Who decides the approval.
          allOf:
          - $ref: '#/components/schemas/GuardrailApprovalKind'
        request_expires_time:
          type: integer
          description: When the approval expires if nobody decides it, in epoch milliseconds.
          format: int64
        url:
          type: string
          description: The mabl app page where a person reviews the approval.
      description: 'An approval a guardrail policy asks for. While it is PENDING, stop: give the person the url, tell them the request is waiting for approval, and do not repeat the request or poll in a loop. Once a person tells you it is APPROVED, repeat the identical request with the header X-Mabl-Approval set to id. DENIED means a person said no, so do not work around it.'
    KnowledgeGraphNodeStatus:
      type: string
      description: Status of a knowledge graph node
      enum:
      - ACTIVE
      - ARCHIVED
    SearchKnowledgeGraphNodesRequest:
      required:
      - application_id
      - workspace_id
      type: object
      properties:
        workspace_id:
          type: string
          description: The workspace ID
        application_id:
          type: string
          description: The application ID
        query_text:
          type: string
          description: Semantic query text for vector similarity search
        literal_phrases:
          type: array
          description: 'Exact phrase(s) for FULLTEXT search. Phrases are OR-joined — a node matches when any one phrase matches, and ranking rewards nodes that match several.

            '
          items:
            type: string
        name_substring:
          type: string
          description: Substring match on node name
        label_filter:
          type: array
          description: Optional filter to restrict results to specific node labels
          items:
            $ref: '#/components/schemas/KnowledgeGraphNodeLabel'
        mode:
          type: string
          description: 'Search mode. auto (default) selects active modes based on provided inputs. Explicit values force a specific mode. modes_used in the response reflects the actual mode(s) that ran.

            '
          enum:
          - auto
          - semantic
          - fulltext
          - substring
          - rrf
          default: auto
        limit:
          maximum: 50
          minimum: 1
          type: integer
          description: 'Maximum number of results to return. Capped at 50 to keep the agent-facing response within a manageable LLM context budget.

            '
          format: int32
          default: 10
      description: 'Request body for hybrid knowledge graph node search. At least one of query_text, literal_phrases, or name_substring must be supplied.

        '
    CreateKnowledgeGraphExternalRefRequest:
      required:
