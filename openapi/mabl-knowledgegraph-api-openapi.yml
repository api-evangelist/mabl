          type: object
          description: Additional structured properties for this edge
        version:
          type: integer
          description: Monotonic edit counter (server-managed, readOnly)
          format: int64
        u_version_:
          type: string
          description: ETag for optimistic locking (server-managed, readOnly)
        last_updated_by:
          type: string
          description: Principal who last updated this edge (server-managed, readOnly)
        created_by:
          type: string
          description: Principal who created this edge (server-managed, readOnly)
        agent_type:
          type: string
          description: Agent type that wrote this edge
        agent_version:
          type: string
          description: Agent version that wrote this edge
        created_at:
          type: string
          description: Creation timestamp
          format: date-time
        updated_at:
          type: string
          description: Last update timestamp
          format: date-time
      description: A directed edge in the knowledge graph connecting two nodes
    SimilarityNeighborsKnowledgeGraphNodesRequest:
      required:
      - application_id
      - candidate_name
      - concept_type
      - workspace_id
      type: object
      properties:
        workspace_id:
          type: string
          description: The workspace ID
        application_id:
          type: string
          description: The application ID
        concept_type:
          type: string
          description: The concept type to look up neighbors against (writer-only labels only)
          enum:
          - Page
          - Workflow
          - Feature
        candidate_name:
          maxLength: 500
          minLength: 1
          type: string
          description: The candidate concept name; used both as the title prefix and as the embedding text fallback when candidate_text is absent
        candidate_text:
          maxLength: 20000
          type: string
          description: 'Optional candidate prose to embed (mirrors the stored concept''s `content` column). When supplied, the embedding input is `title: <concept_type>: <candidate_name> | text: <candidate_text>`. When absent, the candidate name alone is reused as the embedding text. Capped at 20000 characters to mirror the concept-content cap.

            '
        limit:
          maximum: 50
          minimum: 1
          type: integer
          description: 'Maximum number of neighbors to return (a result-count cap, not a similarity cutoff). Defaults to a small set the agent can inspect; the cap of 50 keeps responses within the agent context budget.

            '
          format: int32
          default: 5
      description: 'Request body for the App Modeling Agent''s concept-neighborhood lookup. Restricted to the agent''s writer concept labels (Page, Workflow, Feature).

        '
    KnowledgeGraphSearchResult:
      type: object
      properties:
        node_id:
          type: string
          description: Unique identifier of the matching node
        label:
          $ref: '#/components/schemas/KnowledgeGraphNodeLabel'
        name:
          type: string
          description: The name of the concept
        summary:
          type: string
          description: A short summary of the concept
        rrf_score:
          type: number
          description: Fused RRF score; present when mode=rrf or auto-degraded with multiple branches
          format: double
        semantic_rank:
          type: integer
          description: '1-based rank in the semantic branch from the RRF fusion. Absent when semantic mode did not contribute, and absent for single-branch results (when only one mode ran, no fusion occurs and result order is determined by the underlying relevance signal via `ORDER BY` directly — see `modes_used` to detect single-branch responses).

            '
          format: int32
        fulltext_rank:
          type: integer
          description: '1-based rank in the fulltext branch from the RRF fusion. Absent when fulltext mode did not contribute, and absent for single-branch results (when only one mode ran, no fusion occurs and result order is determined by the underlying relevance signal via `ORDER BY` directly — see `modes_used` to detect single-branch responses).

            '
          format: int32
        substring_rank:
          type: integer
          description: '1-based rank in the substring branch from the RRF fusion. Absent when substring mode did not contribute, and absent for single-branch results (when only one mode ran, no fusion occurs and result order is determined by the underlying relevance signal via `ORDER BY` directly — see `modes_used` to detect single-branch responses).

            '
          format: int32
        snippet:
          type: string
          description: 'Best-effort highlighted excerpt sourced from the node''s `summary` when the FULLTEXT branch contributed a match. May be absent when fulltext did not contribute, when no highlightable terms were found, or when the match was on `content` only (the fulltext index does not store `content`, so content-only matches still return the row but cannot be snippeted). Treat as advisory rendering, not as proof of why the row matched.

            '
      description: A single result from knowledge graph node search with per-mode ranking information
    CreateKnowledgeGraphNodeRequest:
      required:
      - label
      - name
      - workspace_id
      type: object
      properties:
        workspace_id:
          type: string
          description: The workspace to create the node in
        application_id:
          type: string
          description: The application this node is associated with
        label:
          $ref: '#/components/schemas/KnowledgeGraphNodeLabel'
        name:
          type: string
          description: The name of the concept
        summary:
          type: string
          description: A short summary of the concept
        content:
          type: string
          description: Detailed content for this node (max 20K chars before embedding fallback)
        confidence:
          type: number
          description: Confidence score (0.0-1.0)
          format: double
        provenance_summary:
          type: string
          description: Free-text provenance summary
        properties:
          type: object
          description: Additional structured properties
        agent_type:
          type: string
          description: Agent type creating this node
        agent_version:
          type: string
          description: Agent version creating this node
      description: Request body for creating a new knowledge graph node
    UpdateKnowledgeGraphNodeRequest:
      type: object
      properties:
        name:
          type: string
          description: Updated name (preserves existing value if absent or null; triggers re-embedding when changed)
        summary:
          type: string
          description: Updated summary (preserves existing value if absent or null; triggers re-embedding when changed)
        content:
          type: string
          description: Updated content (preserves existing value if absent or null; triggers re-embedding when changed; max 20K chars before fallback)
        status:
          $ref: '#/components/schemas/KnowledgeGraphNodeStatus'
        confidence:
          type: number
          description: Updated confidence score (preserves existing value if absent or null)
          format: double
        provenance_summary:
          type: string
          description: Updated provenance summary (preserves existing value if absent or null)
        properties:
          type: object
          description: Updated additional structured properties (preserves existing value if absent or null)
        agent_type:
          type: string
          description: Agent type performing the update (preserves existing value if absent or null)
        agent_version:
          type: string
          description: Agent version performing the update (preserves existing value if absent or null)
      description: 'Request body for updating a knowledge graph node. PATCH uses merge semantics: only fields present in the request body with a non-null value are updated; fields that are absent or explicitly null are preserved at their existing stored value. To clear a nullable field, the workflow is to update the node with a non-null replacement value. Immutable identity fields (workspace_id, node_id, application_id, label) cannot be changed via PATCH and any attempt to do so returns 400.

        '
    KnowledgeGraphEdgeListResult:
      type: object
      properties:
        edges:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeGraphEdge'
        cursor:
          type: string
          description: Cursor for fetching the next page of results (absent when no more pages)
      description: Paginated list result for knowledge graph edges
    ResolveKnowledgeGraphNodeResponse:
      required:
      - confidence
      - match_kind
      - node_id
      type: object
      properties:
        node_id:
          type: string
          description: The resolved node ID
        match_kind:
          type: string
          description: 'How the node''s name relates to the candidate: exact (case-insensitive name equality — a deterministic identity) or name_substring (the candidate name is a substring of the node''s name — a lexical overlap signal, not an identity verdict).

            '
          enum:
          - exact
          - name_substring
        confidence:
          maximum: 1.0
          minimum: 0.0
          type: number
          description: 'Fixed per match_kind (exact = 1.0, name_substring = 0.95). Retained for backward compatibility; it carries no information beyond match_kind and callers should key on match_kind instead.

            '
          format: double
      description: 'Resolution result returned with HTTP 200 when a node was matched by exact name or name substring. When no match is found, the endpoint returns HTTP 204 No Content with no body — callers should treat 204 as "no name match". All listed properties are required when this body is returned. match_kind distinguishes the two: exact is a deterministic identity; name_substring is a lexical name-overlap signal the caller weighs, not an identity verdict.

        '
    ErrorResponseGeneric:
      type: object
      properties:
        id:
          type: string
          x-mabl-scope: public
        code:
          maximum: 599
          minimum: 100
          type: integer
          format: int32
          x-mabl-scope: public
        message:
          type: string
          x-mabl-scope: public
        error_code:
          type: string
          description: Machine-readable reason for the error, present only when the API names one. Values are guardrail_blocked (a guardrail policy refused an agent request), approval_required (a guardrail policy requires a person to approve the request first).
        guardrail:
          description: The guardrail policy that refused the request; present only when error_code is guardrail_blocked or approval_required.
          allOf:
          - $ref: '#/components/schemas/GuardrailRefusal'
    AppModelIndexResponse:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/AppModelIndexNode'
        edge_counts:
          type: object
          additionalProperties:
            type: integer
            format: int32
          description: Edge counts by label across the application's node set
        truncated:
          type: boolean
          description: True when the node list hit the server's row cap and may be incomplete
        last_modeled_at:
          type: string
          description: Latest node updated_at in this application's graph; absent when the graph has no nodes
          format: date-time
      description: 'Condensed app model index for one application: its active Page/Workflow/Feature concepts with per-concept test-linkage counts, plus graph-wide edge counts.

        '
    KnowledgeGraphNodeLabel:
      type: string
      description: Label for a knowledge graph node indicating its concept type
      enum:
      - Page
      - Workflow
      - Feature
      - KnowledgeDoc
      - Pattern
    KnowledgeGraphExternalRefListResult:
      type: object
      properties:
        external_refs:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeGraphExternalRef'
        cursor:
          type: string
          description: Cursor for fetching the next page of results (absent when no more pages)
      description: Paginated list result for knowledge graph external references
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: apiKey
      name: Authorization
      in: header
