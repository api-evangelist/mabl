openapi: 3.2.0
info:
  title: mabl Knowledge Graph API
  description: APIs for interacting with mabl services
  version: 0.599.3.1792436330
  x-readme-id: 62c896636916ce01d2ff4f5a
servers:
- url: /
security:
- basicAuth: []
- bearerAuth: []
tags:
- name: KnowledgeGraph
paths:
  /knowledgeGraph/nodes:
    get:
      tags:
      - KnowledgeGraph
      summary: List knowledge graph nodes
      description: Lists nodes in a knowledge graph with optional filters
      operationId: listKnowledgeGraphNodes
      parameters:
      - name: workspace_id
        in: query
        description: The workspace ID (required for auth scope)
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: application_id
        in: query
        description: Filter by application ID
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: label
        in: query
        description: Filter by node label
        required: false
        style: form
        explode: true
        schema:
          $ref: '#/components/schemas/KnowledgeGraphNodeLabel'
      - name: name
        in: query
        description: Filter by exact node name
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: status
        in: query
        description: 'Filter by node status. If omitted, defaults to ACTIVE (matches the schema default and is the most common case). Pass `ARCHIVED` to list archived nodes only. There is no built-in "ALL" sentinel; to list both ACTIVE and ARCHIVED nodes, issue two requests with explicit `status` values and merge client-side.

          '
        required: false
        style: form
        explode: true
        schema:
          type: string
          enum:
          - ACTIVE
          - ARCHIVED
          default: ACTIVE
      - name: limit
        in: query
        description: Maximum number of results to return
        required: false
        style: form
        explode: true
        schema:
          maximum: 1000
          minimum: 1
          type: integer
          format: int32
          default: 100
      - name: cursor
        in: query
        description: Pagination cursor from a previous query result
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: The list of nodes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeGraphNodeListResult'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::KnowledgeGraph
    post:
      tags:
      - KnowledgeGraph
      summary: Create a knowledge graph node
      description: Creates a new node in the knowledge graph for a workspace. Server generates the node_id with suffix -kgn.
      operationId: createKnowledgeGraphNode
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKnowledgeGraphNodeRequest'
        required: true
      responses:
        '201':
          description: The created node
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeGraphNode'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Create::KnowledgeGraph
  /knowledgeGraph/nodes/{node_id}:
    get:
      tags:
      - KnowledgeGraph
      summary: Get a knowledge graph node
      description: Retrieves a specific knowledge graph node by ID
      operationId: getKnowledgeGraphNode
      parameters:
      - name: node_id
        in: path
        description: The ID of the node
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: workspace_id
        in: query
        description: The workspace ID (required for auth scope)
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: application_id
        in: query
        description: The application ID (required for auth scope)
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: The node
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeGraphNode'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::KnowledgeGraph
    delete:
      tags:
      - KnowledgeGraph
      summary: Delete a knowledge graph node
      description: Deletes a knowledge graph node. soft_delete=true (default) sets status=ARCHIVED. soft_delete=false hard-deletes the row and cascades to all incoming and outgoing edges and external refs in the same Spanner transaction.
      operationId: deleteKnowledgeGraphNode
      parameters:
      - name: node_id
        in: path
        description: The ID of the node to delete
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: workspace_id
        in: query
        description: The workspace ID (required for auth scope)
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: application_id
        in: query
        description: The application ID (required for auth scope)
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: soft_delete
        in: query
        description: If true (default), archives the node. If false, hard-deletes with cascade.
        required: false
        style: form
        explode: true
        schema:
          type: boolean
      responses:
        '200':
          description: Successfully archived (soft_delete=true)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeGraphNode'
        '204':
          description: Successfully hard-deleted (soft_delete=false)
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Delete::KnowledgeGraph
    patch:
      tags:
      - KnowledgeGraph
      summary: Update a knowledge graph node
      description: Updates an existing knowledge graph node. Mandatory If-Match header for optimistic locking. Re-embeds atomically when name, summary, or content changes. On Vertex 5xx, returns 503 with Retry-After.
      operationId: updateKnowledgeGraphNode
      parameters:
      - name: node_id
        in: path
        description: The ID of the node to update
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: workspace_id
        in: query
        description: The workspace ID (required for auth scope)
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: application_id
        in: query
        description: The application ID (required for auth scope)
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: 'ETag for optimistic locking. Functionally required: omitting it surfaces a typed 428 (Precondition Required) response with code "etag_required" so an agent can recover deterministically. Declared as required=false at the schema level so the request reaches the service rather than being rejected by the OpenAPI validator with a generic 400.

          '
        required: false
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateKnowledgeGraphNodeRequest'
        required: true
      responses:
        '200':
          description: The updated node
          headers:
            ETag:
              description: ETag for the updated node, for use with subsequent If-Match requests
              style: simple
              explode: false
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeGraphNode'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
        '412':
          $ref: '#/components/responses/ErrorResponse'
        '428':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::KnowledgeGraph
  /knowledgeGraph/nodes/search:
    post:
      tags:
      - KnowledgeGraph
      summary: Search knowledge graph nodes
      description: Hybrid search across knowledge graph nodes using semantic (vector), fulltext, and substring modes. Supports Reciprocal Rank Fusion (RRF) when multiple input types are provided. At least one of query_text, literal_phrases, or name_substring must be supplied. When mode=auto (default), the server selects the active modes based on which inputs are present; modes_used reflects the actual modes that ran.
      operationId: searchKnowledgeGraphNodes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchKnowledgeGraphNodesRequest'
        required: true
      responses:
        '200':
          description: Search results with RRF-fused ranking and per-mode ranks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchKnowledgeGraphNodesResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::KnowledgeGraph
  /knowledgeGraph/nodes/resolve:
    post:
      tags:
      - KnowledgeGraph
      summary: Resolve a concept name to a knowledge graph node
      description: 'Name-based resolution of a concept name to a knowledge graph node: (1) exact lowercased name + label match, (2) substring match via SEARCH_SUBSTRING on name_substring_tokens. Returns null when neither produces a match. The two are NOT equivalent: an exact match is a deterministic identity, while a substring match is a lexical name-overlap SIGNAL (match_kind name_substring) that the caller surfaces to its agent as a candidate to weigh, not an identity verdict. Semantic similarity is not performed here; use the similarityNeighbors endpoint for embedding-based neighborhood lookup. Writer-only endpoint (AMA uses this; not for general-purpose search). concept_type is restricted to Page, Workflow, Feature (AMA''s writable concept labels).'
      operationId: resolveKnowledgeGraphNode
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveKnowledgeGraphNodeRequest'
        required: true
      responses:
        '200':
          description: 'A node matched by exact name+label (a deterministic identity) or by name substring (a lexical name-overlap signal for the caller''s agent to weigh).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveKnowledgeGraphNodeResponse'
        '204':
          description: 'No node matched either resolution tier. Generated clients should treat this as a "no match" outcome (no response body).

            '
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::KnowledgeGraph
  /knowledgeGraph/nodes/similarityNeighbors:
    post:
      tags:
      - KnowledgeGraph
      summary: Find nearest-neighbor concepts to a candidate
      description: 'Returns the top-K active concept nodes most similar to a candidate concept by symmetric cosine similarity over the node embedding column. The App Modeling Agent uses this to see the nearest existing concepts when resolving a candidate, and judges whether the candidate is the same concept, a variant, or genuinely new. No score threshold is applied — every returned neighbor is ranked, none filtered out.

        The candidate is embedded server-side using the same symmetric document format as the stored embeddings (`title: : | text: `) with `RETRIEVAL_DOCUMENT` task type, so candidate-vs-stored cosine distance is meaningful. When `candidate_text` is omitted, the candidate name alone is used as the embedding text.

        Writer-only endpoint (consumes embedding API quota); `concept_type` is restricted to the agent''s writable labels (Page, Workflow, Feature). Returns 503 when the embedding service is unavailable, so the caller treats it as a transient failure rather than reading an empty neighborhood as "this candidate is unique".'
      operationId: similarityNeighborsKnowledgeGraphNodes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimilarityNeighborsKnowledgeGraphNodesRequest'
        required: true
      responses:
        '200':
          description: Top-K similar nodes (may be empty when no concepts of the given label exist).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimilarityNeighborsKnowledgeGraphNodesResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
        '503':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::KnowledgeGraph
  /knowledgeGraph/appModelIndex:
    get:
      tags:
      - KnowledgeGraph
      summary: Get a condensed app model index for an application's Knowledge Graph
      description: 'Internal read-only aggregate for agent context injection (not part of the public API): the active Page/Workflow/Feature concepts for one application, each with its linked-test counts by role, plus graph-wide edge counts. Assembled from three Spanner reads so a caller does not need to compose nodes + edges + external refs itself. Node summaries and names are agent-authored from customer test content — the same trust class as every other Knowledge Graph read.'
      operationId: getKnowledgeGraphAppModelIndex
      parameters:
      - name: workspace_id
        in: query
        description: The workspace ID (required for auth scope)
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: application_id
        in: query
        description: The application to build the index for
        required: true
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: The application's app model index
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppModelIndexResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::KnowledgeGraph
  /knowledgeGraph/edges:
    get:
      tags:
      - KnowledgeGraph
      summary: List knowledge graph edges
      description: 'Lists edges in a knowledge graph with optional filters. Note: application_id is used for auth scope but does not filter result rows (knowledge_graph_edge has no application_id column).'
      operationId: listKnowledgeGraphEdges
      parameters:
      - name: workspace_id
        in: query
        description: The workspace ID (required for auth scope)
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: application_id
        in: query
        description: Application ID (required for auth scope; does not filter rows)
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: source_node_id
        in: query
        description: Filter by source node ID
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: destination_node_id
        in: query
        description: Filter by destination node ID
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: label
        in: query
        description: Filter by edge label
        required: false
        style: form
        explode: true
        schema:
          $ref: '#/components/schemas/KnowledgeGraphEdgeLabel'
      - name: limit
        in: query
        description: Maximum number of results to return
        required: false
        style: form
        explode: true
        schema:
          maximum: 1000
          minimum: 1
          type: integer
          format: int32
          default: 100
      - name: cursor
        in: query
        description: Pagination cursor from a previous query result
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: The list of edges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeGraphEdgeListResult'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::KnowledgeGraph
    post:
      tags:
      - KnowledgeGraph
      summary: Create a knowledge graph edge
      description: Creates a new directed edge between two nodes in the knowledge graph. Server generates the edge_id with suffix -kge. Validates that source and destination nodes exist in the same workspace. On duplicate (source, label, destination) returns 409 with the existing edge.
      operationId: createKnowledgeGraphEdge
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKnowledgeGraphEdgeRequest'
        required: true
      responses:
        '201':
          description: The created edge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeGraphEdge'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Create::KnowledgeGraph
  /knowledgeGraph/edges/{edge_id}:
    get:
      tags:
      - KnowledgeGraph
      summary: Get a knowledge graph edge
      description: Retrieves a specific knowledge graph edge by ID. source_node_id is required for PK-aligned lookup.
      operationId: getKnowledgeGraphEdge
      parameters:
      - name: edge_id
        in: path
        description: The ID of the edge
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: workspace_id
        in: query
        description: The workspace ID (required for auth scope)
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: application_id
        in: query
        description: The application ID (required for auth scope)
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: source_node_id
        in: query
        description: The source node ID (required for PK-prefix-aligned lookup)
        required: true
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: The edge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeGraphEdge'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::KnowledgeGraph
    delete:
      tags:
      - KnowledgeGraph
      summary: Delete a knowledge graph edge
      description: Hard-deletes the edge. Returns 404 if the edge does not exist.
      operationId: deleteKnowledgeGraphEdge
      parameters:
      - name: edge_id
        in: path
        description: The ID of the edge to delete
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: workspace_id
        in: query
        description: The workspace ID (required for auth scope)
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: application_id
        in: query
        description: The application ID (required for auth scope)
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: source_node_id
        in: query
        description: The source node ID (required for PK-prefix-aligned delete)
        required: true
        style: form
        explode: true
        schema:
          type: string
      responses:
        '204':
          description: Successfully deleted
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Delete::KnowledgeGraph
    patch:
      tags:
      - KnowledgeGraph
      summary: Update a knowledge graph edge
      description: Updates mutable fields of a knowledge graph edge (ordinal, weight, description, properties). Immutable fields (source_node_id, destination_node_id, label, created_at) are rejected with 400. Mandatory If-Match header. source_node_id is required for PK-aligned lookup.
      operationId: updateKnowledgeGraphEdge
      parameters:
      - name: edge_id
        in: path
        description: The ID of the edge to update
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: workspace_id
        in: query
        description: The workspace ID (required for auth scope)
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: application_id
        in: query
        description: The application ID (required for auth scope)
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: source_node_id
        in: query
        description: The source node ID (required for PK-prefix-aligned lookup)
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: 'ETag for optimistic locking. Functionally required: omitting it surfaces a typed 428 (Precondition Required) response with code "etag_required" so an agent can recover deterministically. Declared as required=false at the schema level so the request reaches the service rather than being rejected by the OpenAPI validator with a generic 400.

          '
        required: false
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateKnowledgeGraphEdgeRequest'
        required: true
      responses:
        '200':
          description: The updated edge
          headers:
            ETag:
              description: ETag for the updated edge, for use with subsequent If-Match requests
              style: simple
              explode: false
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeGraphEdge'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
        '412':
          $ref: '#/components/responses/ErrorResponse'
        '428':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::KnowledgeGraph
  /knowledgeGraph/nodes/{node_id}/externalRefs:
    get:
      tags:
      - KnowledgeGraph
      summary: List knowledge graph external references for a node
      description: Lists external references attached to the node identified in the path with optional filters. Test-typed references whose referenced test has been deleted are omitted from list results; get and delete by key are unaffected.
      operationId: listKnowledgeGraphExternalRefsForNode
      parameters:
      - name: node_id
        in: path
        description: The knowledge graph node whose external references should be listed
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: workspace_id
        in: query
        description: The workspace ID (required for auth scope)
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: application_id
        in: query
        description: The application ID (required for auth scope)
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: entity_type
        in: query
        description: Filter by entity type
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: entity_id
        in: query
        description: Filter by entity ID
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: relationship
        in: query
        description: Filter by relationship
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of results to return
        required: false
        style: form
        explode: true
        schema:
          maximum: 1000
          minimum: 1
          type: integer
          format: int32
          default: 100
      - name: cursor
        in: query
        description: Pagination cursor from a previous query result
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: The list of external references
          content:
