components:
  responses:
    ErrorResponse400:
      description: Invalid or missing parameter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse403:
      description: User not authorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse401:
      description: User not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse:
      description: Unknown error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse404:
      description: Entity not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
  schemas:
    SimilarityNeighborsKnowledgeGraphNodesResponse:
      required:
      - neighbors
      type: object
      properties:
        neighbors:
          type: array
          description: 'Ranked neighbors ordered by similarity descending (closest first). Empty when no active concepts of the requested label exist in the workspace.

            '
          items:
            $ref: '#/components/schemas/KnowledgeGraphSimilarityNeighbor'
      description: Response from the App Modeling Agent's concept-neighborhood lookup
    KnowledgeGraphSimilarityNeighbor:
      required:
      - label
      - name
      - node_id
      - similarity
      type: object
      properties:
        node_id:
          type: string
          description: Unique identifier of the neighbor node
        label:
          $ref: '#/components/schemas/KnowledgeGraphNodeLabel'
        name:
          type: string
          description: The neighbor concept's name
        summary:
          type: string
          description: The neighbor concept's short summary (may be absent)
        similarity:
          maximum: 1.0
          minimum: 0.0
          type: number
          description: Cosine similarity in [0.0, 1.0]; equals 1.0 - cosine_distance
          format: double
      description: A single nearest-neighbor result from the similarity search
    UpdateKnowledgeGraphEdgeRequest:
      type: object
      properties:
        ordinal:
          type: integer
          description: Updated ordering hint (preserves existing value if absent or null)
          format: int64
        weight:
          type: number
          description: Updated edge weight (preserves existing value if absent or null)
          format: double
        description:
          type: string
          description: Updated relationship description (preserves existing value if absent or null)
        properties:
          type: object
          description: Updated additional structured properties (preserves existing value if absent or null)
        agent_type:
          type: string
          description: Agent type performing the update (preserves existing value if absent or null)
        agent_version:
          type: string
          description: Agent version performing the update (preserves existing value if absent or null)
      description: 'Request body for updating a knowledge graph edge (ordinal, weight, description, properties, agent metadata only). PATCH uses merge semantics: only fields present in the request body with a non-null value are updated; fields that are absent or explicitly null are preserved at their existing stored value. Immutable identity fields (workspace_id, edge_id, source_node_id, destination_node_id, label) cannot be changed via PATCH.

        '
    GuardrailRefusal:
      type: object
      properties:
        id:
          type: string
          description: The id of the guardrail policy that decided the refusal.
        reason:
          type: string
          description: Why the policy refuses the request, written for the person the agent acts for.
        decision_id:
          type: string
          description: The id of this decision in the guardrail decision log.
        action:
          type: string
          description: The action the request was evaluated as, written Verb::Resource (for example Delete::Test), as declared by the operation's x-mabl-action extension.
        policy_source:
          type: string
          description: 'Who set the deciding policy: workspace for a rule the workspace''s owners wrote, account for a rule set for the workspace''s account, mabl_agent_type for the agent type''s ceiling, and mabl_default for mabl''s own defaults.'
        approval:
          description: The approval for this request; present when error_code is approval_required and the approval could be recorded. Without it the request cannot be approved.
          allOf:
          - $ref: '#/components/schemas/GuardrailApprovalRef'
      description: The guardrail policy that refused an agent request.
    KnowledgeGraphEdgeLabel:
      type: string
      description: Label for a knowledge graph edge indicating its relationship type
      enum:
      - CONTAINS
      - HAS_KNOWLEDGE
      - DEPENDS_ON
      - RELATED_TO
      - COVERS
    UpdateKnowledgeGraphExternalRefRequest:
      type: object
      properties:
        entity_variant_id:
          type: string
          description: Updated variant/version ID of the external entity (preserves existing value if absent or null)
        referenced_entity_version:
          type: string
          description: Updated version of the externally referenced entity (preserves existing value if absent or null)
        description:
          type: string
          description: Updated relationship description (preserves existing value if absent or null)
        properties:
          type: object
          description: Updated additional structured properties (preserves existing value if absent or null)
        agent_type:
          type: string
          description: Agent type performing the update (preserves existing value if absent or null)
        agent_version:
          type: string
          description: Agent version performing the update (preserves existing value if absent or null)
      description: 'Request body for updating a knowledge graph external reference (entity_variant_id, referenced_entity_version, description, properties, agent metadata only). PATCH uses merge semantics: only fields present in the request body with a non-null value are updated; fields that are absent or explicitly null are preserved at their existing stored value. Composite identity fields (workspace_id, node_id, entity_type, entity_id, relationship) cannot be changed via PATCH.

        '
    SearchKnowledgeGraphNodesResponse:
      required:
      - modes_used
      - nodes
      type: object
      properties:
        nodes:
          type: array
          description: Ranked search results
          items:
            $ref: '#/components/schemas/KnowledgeGraphSearchResult'
        modes_used:
          type: array
          description: The actual search modes that contributed to the results
          items:
            type: string
            enum:
            - semantic
            - fulltext
            - substring
      description: Response from hybrid knowledge graph node search
    GuardrailApprovalKind:
      type: string
      description: Who decides a guardrail approval. SELF is decided by the person the agent acts for; WORKSPACE, for an agent acting for an API key, by a workspace owner or editor.
      enum:
      - SELF
      - WORKSPACE
    KnowledgeGraphNode:
      type: object
      properties:
        node_id:
          type: string
          description: Unique identifier for the node (server-generated, suffix -kgn)
