        properties:
          type: object
          description: Additional structured properties
        agent_type:
          type: string
          description: Agent type creating this edge
        agent_version:
          type: string
          description: Agent version creating this edge
      description: Request body for creating a new knowledge graph edge
    ResolveKnowledgeGraphNodeRequest:
