openapi: 3.2.0
info:
  title: mabl User API
  description: APIs for interacting with mabl services
  version: 0.599.3.1792436330
  x-readme-id: 62c896636916ce01d2ff4f5a
servers:
- url: /
security:
- basicAuth: []
- bearerAuth: []
tags:
- name: User
paths:
  /self:
    get:
      tags:
      - User
      summary: Retrieve current user based on bearer token
      description: Used to retrieve information about the current user based on the bearer token presented in the Authentication header
      operationId: getSelf
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          description: Unrecognized user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::User
    patch:
      tags:
      - User
      summary: Update user metadata from authentication service
      description: Used to pull updated information about the current user from the authentication service
      operationId: updateSelf
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::User
  /users:
    get:
      tags:
      - User
      summary: Query users
      description: Query for users
      operationId: queryUsers
      parameters:
      - name: email
        in: query
        description: E-Mail address to query
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: workspace_id
        in: query
        description: Workspace ID to query. Must be provided and match the workspace of the api key provided.
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of users to return in a single response. Additional pages of results can be retrieved by passing the cursor (returned in the results) on a subsequent call.
        required: false
        style: form
        explode: true
        schema:
          maximum: 200
          minimum: 1
          type: integer
          format: int32
      - name: cursor
        in: query
        description: Cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: include_historic
        in: query
        description: Include all users with audit history in the workspace, such as former workspace users.
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Results of the query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserQueryResult'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::User
      x-mabl-scope: public
    post:
      tags:
      - User
      summary: Register new user
      description: Used to register a new user
      operationId: registerUser
      requestBody:
        description: The registration request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
        required: true
      responses:
        '201':
          description: User registered
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '409':
          description: User with this email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Create::User
  /users/workspaceAssociations:
    get:
      tags:
      - User
      summary: Query all non-tombstoned Users.
      description: Used to query User-to-Workspace associations
      operationId: queryWorkspaceUserAssociations
      parameters:
      - name: limit
        in: query
        description: Maximum number of users to return in a single response. Additional pages of results can be retrieved by passing the cursor (returned in the results) on a subsequent call.
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
      - name: cursor
        in: query
        description: Cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Results of the query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserIdAndRolesResult'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::User
  /users/companyAdmins:
    get:
      tags:
      - User
      summary: Query admins for a specified company
      operationId: queryCompanyAdmins
      parameters:
      - name: company_id
        in: query
        description: Company ID to query.
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of users to return in a single response. Additional pages of results can be retrieved by passing the cursor (returned in the results) on a subsequent call.
        required: false
        style: form
        explode: true
        schema:
          maximum: 200
          minimum: 1
          type: integer
          format: int32
      - name: cursor
        in: query
        description: Cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Results of the query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserQueryResult'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::User
  /users/withAllAttributes:
    get:
      tags:
      - User
      summary: Query Users with all the attributes
      description: Used to query users with all the attributes
      operationId: queryUsersWithAllAttributes
      parameters:
      - name: email
        in: query
        description: The E-Mail address to query
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: organization_id
        in: query
        description: The organization ID to query
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: limit
        in: query
        description: The limit to use for pagination
        required: false
        style: form
        explode: true
        schema:
          minimum: 1
          type: integer
          format: int32
      - name: cursor
        in: query
        description: The cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Results of the query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWithAllAttributesQueryResult'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::User
  /users/reactivate:
    post:
      tags:
      - User
      summary: Restarts the activation flow for a new user
      description: Used to reactivate a user who lost a previous activation email/token
      operationId: reactivateUser
      requestBody:
        description: The reactivation request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReactivateUserRequest'
        required: true
      responses:
        '202':
          description: User reactivated
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::User
  /workspaces/{workspace_id}/users/batch:
    post:
      tags:
      - User
      summary: Resolve workspace users by ID
      description: Batch-resolve users (current or historic members) within a workspace by their IDs. Users with no association to the workspace are omitted from the result.
      operationId: getWorkspaceUsersBatch
      parameters:
      - name: workspace_id
        in: path
        description: Workspace ID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: The IDs of the workspace users to resolve
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceUsersBatchRequest'
        required: true
      responses:
        '200':
          description: The resolved workspace users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserQueryResult'
        '400':
          description: Invalid request - more than 100 user IDs requested, or no IDs provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::User
  /workspaces/{workspace_id}/users/{id}:
    get:
      tags:
      - User
      summary: Get workspace user
      description: Retrieve a user in the context of a workspace. This will also retrieve high-level user information for any users that were historically in the workspace. Users not in the workspace will be filtered out.
      operationId: getWorkspaceUser
      parameters:
      - name: workspace_id
        in: path
        description: Workspace ID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: ID of the user to retrieve
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: User that was retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-scope: public
      x-mabl-action: Read::User
    delete:
      tags:
      - User
      summary: Remove a user from a workspace
      description: Remove a user's role in a workspace. The user's memberships in other workspaces are unaffected. This operation is idempotent - removing a user who is not a member of the workspace returns 204. Available to workspace owners, company owners, and properly permissioned API keys.
      operationId: removeWorkspaceUser
      parameters:
      - name: workspace_id
        in: path
        description: Workspace ID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: ID of the user to remove from the workspace
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: If-Match
        in: header
        description: If-Match header according to http/1.1 spec section 14.24. Allows for enforced atomic updates, to prevent update collisions
        required: false
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '204':
          description: The user holds no role in the workspace, either because it was just removed or because it was already absent
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: No user exists with the given id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '409':
          description: Removal conflicts with workspace constraints, such as removing the last owner or an If-Match header version mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-scope: public
      x-mabl-action: Delete::User
    patch:
      tags:
      - User
      summary: Change a workspace member's role
      description: Change a user's role within a workspace. The user must already be a member of the workspace. Available to workspace owners, company owners, and properly permissioned API keys.
      operationId: updateWorkspaceUserRole
      parameters:
      - name: workspace_id
        in: path
        description: Workspace ID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: ID of the user whose role should be changed
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: If-Match
        in: header
        description: If-Match header according to http/1.1 spec section 14.24. Allows for enforced atomic updates, to prevent update collisions
        required: false
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: The new role for the user in this workspace
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceRoleUpdate'
        required: true
      responses:
        '200':
          description: The user's role in this workspace after applying the update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRoles'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: User is not a member of this workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '409':
          description: Update conflicts with workspace constraints, such as demoting the last owner or an If-Match header version mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-scope: public
      x-mabl-action: Edit::User
  /users/{id}:
    get:
      tags:
      - User
      summary: Retrieve User
      description: Used to retrieve existing users
      operationId: getUser
      parameters:
      - name: id
        in: path
        description: ID of the user to retrieve
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: User that was retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::User
    delete:
      tags:
      - User
      summary: Remove User
      description: Used to remove existing users
      operationId: removeUser
      parameters:
      - name: id
        in: path
        description: The user ID to remove
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: The user that was removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Delete::User
    patch:
      tags:
      - User
      summary: Update User
      description: Used to update existing users
      operationId: updateUser
      parameters:
      - name: id
        in: path
        description: The user ID to update
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: If-Match
        in: header
        description: If-Match header according to http/1.1 spec section 14.24. Allows for enforced atomic updates, to prevent update collisions
        required: false
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: The user fields to update
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      responses:
        '200':
          description: The updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::User
  /users/withAllAttributes/{id}:
    get:
      tags:
      - User
      summary: Retrieve User
      description: Used to retrieve existing users
      operationId: getUserWithAllAttributes
      parameters:
      - name: id
        in: path
        description: The user ID to retrieve
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: The user that was retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWithAllAttributes'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::User
  /user-roles/{id}:
    get:
      tags:
      - User
      summary: Get User Roles
      description: Used to get all of a user's roles
      operationId: getUserRoles
      parameters:
      - name: id
        in: path
        description: The ID of the user whose roles should be retrieved
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: The complete list of roles for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRoles'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::User
    patch:
      tags:
      - User
      summary: Update User Roles
      description: Used to modify roles for a user. Available to global write clients, owners or company owners of all affected workspaces, API keys with write:users scope on every affected workspace, and to the user themselves for removals only. Adding a role in a workspace where the user already holds one returns 409.
      operationId: updateUserRoles
      parameters:
      - name: id
        in: path
        description: The user ID to update
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: If-Match
        in: header
        description: If-Match header according to http/1.1 spec section 14.24. Allows for enforced atomic updates, to prevent update collisions
        required: false
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: The user roles to update
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRoleUpdate'
        required: true
      responses:
        '200':
          description: The complete list of roles after applying this update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRoles'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::User
  /user-company-roles/{id}:
    get:
      tags:
      - User
      summary: Get User's Company Roles
      description: Used to get all of a user's company roles
      operationId: getUserCompanyRoles
      parameters:
      - name: id
        in: path
        description: The ID of the user whose company roles should be retrieved
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: The complete list of company roles for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCompanyRoles'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::User
    patch:
      tags:
      - User
      summary: Update User's Company Roles
      description: Used to modify company roles for a user
      operationId: updateUserCompanyRoles
      parameters:
      - name: id
        in: path
        description: The user ID to update
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: If-Match
        in: header
        description: If-Match header according to http/1.1 spec section 14.24. Allows for enforced atomic updates, to prevent update collisions
        required: false
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: The user roles to update
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCompanyRoleUpdate'
        required: true
      responses:
        '200':
          description: The complete list of roles after applying this update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCompanyRoles'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::User
  /user-roles/acknowledge/{workspace_id}:
    post:
      tags:
      - User
      summary: Acknowledge users own role in the specified workspace
      description: Acknowledging a workspace role means the user has been presented with and dismissed information about their role and joining their new workspace
      operationId: acknowledgeWorkspaceRole
      parameters:
      - name: workspace_id
        in: path
        description: The workspace in which the role will be acknowledged
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '204':
          description: No content response indicates successful acknowledgement of the role.
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: User or user role not found in this workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::User
  /users/{id}/organizations:
    get:
      tags:
      - User
      summary: Get User Organizations
      description: Used to get all of a user's organizations
      operationId: getUserOrganizations
      parameters:
      - name: id
        in: path
        description: The ID of the user whose organizations should be retrieved
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
