          description: The timezone identifier to run the test with, e.g. America/Los_Angeles, etc.
      description: Localization-related settings to apply on the browser in browser tests, e.g. timezone, locale. When not specified, cloud tests run with UTC timezone and default locale for the region of the cloud runs. Local runs use the timezone and locale of the machine running the test.
    TestObjective:
      type: object
      properties:
        summary:
          type: string
          description: A natural language summary of what this test version does. Omitting it on a save keeps the stored one; sending it empty removes the objective outright, since source, state, and gap all describe a summary.
        source:
          $ref: '#/components/schemas/TestObjectiveSource'
        state:
          $ref: '#/components/schemas/TestObjectiveState'
        gap:
          type: string
          description: 'When state is drifted or accepted_gap, how the steps of this version fall short of the summary. Retained after the user accepts the gap so the accepted difference stays readable. Unindexed: free prose nothing queries, and long enough to exceed Datastore''s 1500-byte ceiling on an indexed string.'
          x-dao-unindexed: true
      description: 'What this test version is trying to accomplish, in natural language. Version-scoped, so each version records the objective it was authored against rather than sharing one across the whole test''s history. Saved through test_objective: a full save may set it alongside steps as one version, and omitting it keeps the stored one. A field_mask=test_objective write may only record state and gap; changing summary or source that way is refused, so use a full save.'
    PlanRunScripts:
      type: object
      properties:
        id:
          type: string
          description: id of the journey run
        journey_id:
          type: string
          description: id of the journey
        deployment:
          $ref: '#/components/schemas/Deployment'
        status:
          type: string
          description: The current status of this journey run; valid values are the same as those of the journey run status enum
        started_time:
          type: integer
          description: The time this jourey run was started
          format: int64
        completed_time:
          type: integer
          description: The time this journey run was completed
          format: int64
        terminated_by_id:
          type: string
          description: The ID of the user who terminated this journey run
        termination_reason:
          type: string
          description: Why this journey run was terminated, when it was
        status_cause:
          type: string
          description: Explains the current status, e.g. why a terminated run never executed
        browser_type:
          type: string
          description: The browser used during this journey run
        browser_version:
          type: string
          description: Specific version of the browser that was used during this journey run
        device_emulation:
          $ref: '#/components/schemas/DeviceEmulation'
        stage_index:
          minimum: 0
          type: integer
          description: Zero-indexed stage index for this journey run
          format: int32
          readOnly: true
        journey_run_index:
          minimum: 0
          type: integer
          description: Zero-indexed journey run index for this jorney run within its plan run
          format: int32
          readOnly: true
        retry_of_id:
          type: string
          description: On a plan run retry, the ID of the journey run from the retried plan run that this run re-runs
          readOnly: true
        run_multiplier_index:
          minimum: 0
          type: integer
          description: Zero-indexed run multiplier index for this journey run
          format: int32
          readOnly: true
        variable_row_id:
          type: string
          description: The ID of the data table row injected into this journey run, if any
          readOnly: true
        source_control_tag:
          type: string
          description: The source control tag associated with this journey run
    PlanRunExecutionStage:
      type: object
      properties:
        concurrency:
          type: string
          description: How journeys should be executed
          enum:
          - sequential
          - parallel
        always_run_stage:
          type: boolean
          description: if true this stage will always run regardless of whether previous stages have passed
        always_run_journeys:
          type: boolean
          description: if true all journeys within this stage will be run even if a preceding journey has failed
        concurrency_limit:
          type: integer
          description: The maximum number of concurrent test runs for this stage. Only used with parallel execution
          format: int32
        execution_stats:
          type: object
          properties:
            running:
              type: integer
              description: The number of running tests
              format: int32
            completed:
              type: integer
              description: The number of completed/successful tests
              format: int32
            terminated:
              type: integer
              description: The number of terminated tests
              format: int32
            failed:
              type: integer
              description: The number of failed tests
              format: int32
            total:
              type: integer
              description: The total number of tests
              format: int32
          description: Stage level execution stats
        stage_index:
          type: integer
          description: The index of this stage
          format: int32
      description: A single execution stage of a plan run
    Variable:
      type: object
      properties:
        name:
          type: string
          description: The variable name
