openapi: 3.2.0
info:
  title: mabl Execution API
  description: APIs for interacting with mabl services
  version: 0.599.3.1792436330
  x-readme-id: 62c896636916ce01d2ff4f5a
servers:
- url: /
security:
- basicAuth: []
- bearerAuth: []
tags:
- name: Execution
paths:
  /execution/runPolicy/{plan_id}/runPolicyExecution:
    post:
      tags:
      - Execution
      summary: Create a Plan Run
      description: Creates and schedules an execution of a run policy
      operationId: createRunPolicyExecution
      parameters:
      - name: plan_id
        in: path
        description: The plan ID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: The run policy execution
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRunOptions'
        required: false
      responses:
        '201':
          description: The run policy execution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanRun'
        '404':
          description: Invalid run policy ID was supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      deprecated: true
      x-mabl-action: Run::PlanExecution
  /execution/runPolicyExecution:
    get:
      tags:
      - Execution
      summary: Retrieve a set of run policy executions for a given run policy
      description: Used to query run policy executions
      operationId: queryRunPolicyExecutions
      parameters:
      - name: organization_id
        in: query
        description: The organization the run policy execution belongs to
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: status
        in: query
        description: The run policy execution status
        required: false
        style: form
        explode: true
        schema:
          type: string
          enum:
          - queued
          - pre_execution
          - scheduling
          - scheduled
          - succeeded
          - failed
          - cancelled
          - post_execution
          - completed
          - terminated
      - name: policy_id
        in: query
        description: The run policy to query by
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: limit
        in: query
        description: The limit to use for pagination
        required: false
        style: form
        explode: true
        schema:
          minimum: 1
          type: integer
          format: int32
      - name: cursor
        in: query
        description: The cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Array of run policy executions matching the query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanRunQueryResult'
        default:
          $ref: '#/components/responses/ErrorResponse'
      deprecated: true
      x-mabl-action: Read::PlanExecution
  /execution/runPolicyExecution/{id}:
    get:
      tags:
      - Execution
      summary: Retrieve Run Policy Execution
      description: Used to retrieve an existing run policy execution
      operationId: getRunPolicyExecution
      parameters:
      - name: id
        in: path
        description: The run policy execution ID to retrieve
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: The run policy execution that was retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanRun'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
        default:
          $ref: '#/components/responses/ErrorResponse'
      deprecated: true
      x-mabl-action: Read::PlanExecution
    patch:
      tags:
      - Execution
      summary: Update Run Policy Execution
      description: Used to update the status of an existing run policy execution
      operationId: updateRunPolicyExecution
      parameters:
      - name: id
        in: path
        description: The run policy execution ID to retrieve
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: If-Match
        in: header
        description: If-Match header according to http/1.1 spec section 14.24
        required: false
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: The run policy execution
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRun'
        required: true
      responses:
        '200':
          description: The Run Policy Execution was successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanRun'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
        default:
          $ref: '#/components/responses/ErrorResponse'
      deprecated: true
      x-mabl-action: Edit::PlanExecution
  /execution/runPolicyExecution/{id}/terminate:
    post:
      tags:
      - Execution
      summary: Terminate Run Policy Execution
      description: Used to terminate an ongoing run policy execution
      operationId: terminateRunPolicyExecution
      parameters:
      - name: id
        in: path
        description: The run policy execution ID to terminate
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '204':
          description: The Run Policy Execution was successfully terminated
        '404':
          description: Run Policy Execution not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '409':
          description: The Run Policy Execution cannot be terminated in its current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      deprecated: true
      x-mabl-action: Edit::PlanExecution
  /execution/runPolicyExecution/{plan_run_id}/testScriptExecution:
    get:
      tags:
      - Execution
      summary: Retrieve a test scripts executions for a run policy execution
      description: Used to query test scripts execution
      operationId: queryTestScriptExecutions
      parameters:
      - name: plan_run_id
        in: path
        description: The run policy execution to query by
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: status
        in: query
        description: A test script execution status to filter by
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: limit
        in: query
        description: The limit to use for pagination
        required: false
        style: form
        explode: true
        schema:
          minimum: 1
          type: integer
          format: int32
      - name: cursor
        in: query
        description: The cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Array of test scripts matching the query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRunQueryResult'
        default:
          $ref: '#/components/responses/ErrorResponse'
      deprecated: true
      x-mabl-action: Read::PlanExecution
  /execution/organization/{organization_id}/runPolicy/{run_policy_id}/testScript/{test_script_id}:
    get:
      tags:
      - Execution
      summary: Retreive Test Script Executions by run policy
      description: used to query test scripts executions
      operationId: queryTestScriptExecutionsByRunPolicy
      parameters:
      - name: organization_id
        in: path
        description: The organization the run policy execution belongs to
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: run_policy_id
        in: path
        description: The run policy to filter by.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: test_script_id
        in: path
        description: The test script id to filter for.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: status
        in: query
        description: The status to limit results to.
        required: false
        style: form
        explode: true
        schema:
          type: string
          enum:
          - queued
          - running
          - completed
          - terminated
          - failed
      - name: limit
        in: query
        description: The limit to use for pagination
        required: false
        style: form
        explode: true
        schema:
          minimum: 1
          type: integer
          format: int32
      - name: cursor
        in: query
        description: The cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Array of test scripts matching the query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRunQueryResult'
        default:
          $ref: '#/components/responses/ErrorResponse'
      deprecated: true
      x-mabl-action: Read::PlanExecution
  /execution/runPolicyExecution/{plan_run_id}/testScriptExecution/{id}:
    get:
      tags:
      - Execution
      summary: Retrieve Test Script Execution
      description: Used to retrieve an existing test script execution
      operationId: getTestScriptExecution
      parameters:
      - name: plan_run_id
        in: path
        description: The run policy execution ID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: The test script execution ID to retrieve
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: The test script execution that was retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRun'
        '404':
          description: Run Policy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      deprecated: true
      x-mabl-action: Read::PlanExecution
    put:
      tags:
      - Execution
      summary: Create/Update Test Script Execution
      description: Used to put the status of an existing run policy execution
      operationId: putTestScriptExecution
      parameters:
      - name: plan_run_id
        in: path
        description: The run policy execution ID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: The test script execution ID to retrieve
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: The run policy execution
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestRun'
        required: true
      responses:
        '200':
          description: The Run Policy Execution was successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRun'
        '404':
          description: Run Policy Execution not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      deprecated: true
      x-mabl-action: Edit::PlanExecution
  /execution/runPolicyExecution/{plan_run_id}/testScriptExecution/{id}/terminate:
    post:
      tags:
      - Execution
      summary: Terminate Test Script Execution
      description: Used to terminate a running test script execution
      operationId: terminateTestScriptExecution
      parameters:
      - name: plan_run_id
        in: path
        description: The run policy execution ID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: The test script execution ID to terminate
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: The test script execution that was terminated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRun'
        '404':
          description: Run Policy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      deprecated: true
      x-mabl-action: Edit::PlanExecution
  /execution/runPolicyExecution/{plan_run_id}/testScriptExecution/{id}/insights:
    get:
      tags:
      - Execution
      summary: Get Insights for Test Execution
      description: Used to query insights by type and test run
      operationId: queryInsightsByTypeAndTestExecution
      parameters:
      - name: plan_run_id
        in: path
        description: Restricts the query to insights associated with the given plan run ID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: Restricts the query to insights associated with the given test ID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: insight_type
        in: query
        description: Restricts the query to insights of the given type
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: limit
        in: query
        description: The limit to use for pagination
        required: false
        style: form
        explode: true
        schema:
          minimum: 1
          type: integer
          format: int32
      - name: cursor
        in: query
        description: The cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Results of the query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightQueryResult'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      deprecated: true
      x-mabl-action: Read::PlanExecution
  /execution/organization/{organization_id}/testScriptExecution:
    get:
      tags:
      - Execution
      summary: Retrieve Test Script Executions for an Organization
      description: Used to retrieve all test script executions for an organization
      operationId: queryTestScriptExecutionsByOrganization
      parameters:
      - name: organization_id
        in: path
        description: The organization ID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: status
        in: query
        description: A test script execution status to filter by
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: limit
        in: query
        description: The limit to use for pagination
        required: false
        style: form
        explode: true
        schema:
          minimum: 1
          type: integer
          format: int32
      - name: cursor
        in: query
        description: The cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Array of test scripts matching the query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRunQueryResult'
        default:
          $ref: '#/components/responses/ErrorResponse'
      deprecated: true
      x-mabl-action: Read::PlanExecution
components:
  schemas:
    SkippedTest:
      required:
      - reason
      - test_id
      type: object
      properties:
        test_id:
          type: string
          description: The id of the test that was not run
          x-mabl-scope: public
        reason:
          type: string
          description: Why the test was not run
          enum:
          - disabled
          x-mabl-scope: public
      description: A test that a selection named but that mabl did not run
    PerformanceFailureCriteriaOptionalParameters:
      type: object
      properties:
        metric_aggregation:
          type: string
          description: The aggregation level of the metric determining failure case
          enum:
          - average
          - percentile
        metric_percentile:
          type: integer
          description: The percentile for the metric we are considering
          format: int32
        metric_error_codes:
          type: array
          description: Response codes that count as errors for error rate
          items:
            type: string
            enum:
            - codes_3xx
            - codes_4xx
            - codes_5xx
        metric_step_ids:
          type: array
          description: IDs of steps to include in metric calculations
          items:
            type: string
        metric_cwv_measurements:
          type: array
          description: Individual CWV measurements' failure criteria configuration
          items:
            $ref: '#/components/schemas/PerformanceFailureCriteriaCWVMeasurement'
      description: Optional parameters related to specific failure criteria
    TestRunResultOutcomeEnum:
      type: string
      enum:
      - passed
      - failed
      - stopped
    Plan:
      type: object
      properties:
        id:
          maxLength: 50
          type: string
          description: Plan id. Set by system.
          x-mabl-public: true
        cloud_safe_id:
          type: string
          description: Cloud safe ID representation (e.g. GCP/email/Kubernetes safe)
        organization_id:
          type: string
          description: DEPRECATED - use workspace_id instead
        workspace_id:
          type: string
          description: The workspace id this plan belongs to
          x-mabl-public: true
        plan_type:
          type: string
          description: The type of plan
          enum:
          - functional
          - performance
          x-mabl-public: true
        plan_source:
          $ref: '#/components/schemas/TestSource'
        ref_id:
          type: string
          description: Reference id to this plan in another system
          x-mabl-scope: public
        deployment_id:
          type: string
          description: DEPRECATED - use deployment_ids - The deployment ID associated with this run policy
        deployment_ids:
          type: array
          description: The deployment IDs associated with this run policy
          items:
            type: string
        uri:
          type: string
          description: DEPRECATED - Alias for web_url
        web_url:
          type: string
          description: Optional URL override for web deployments
        api_url:
          type: string
          description: Optional URL override for API deployments
        link_agent_label:
          type: string
          description: DEPRECATED - use link_agent_labels
          deprecated: true
        link_agent_labels:
          type: array
          description: Optional Link Agent Labels override for the deployment
          items:
            type: string
        link_bypass_mabl_proxy:
          type: boolean
          description: Optional link_bypass_mabl_proxy override for the deployment (mabl link only)
        use_personal_link_agent:
          type: boolean
          description: 'Route this run''s test traffic through the triggering user''s own personal Link 3.0 tunnels instead of the environment''s configured Link tunnels: when any personal tunnel is used, it is the run''s only Link path. Overrides the deployment''s use_personal_link_agent for this run. The owner is the user who triggers the run, resolved server-side — there is no id to pass. By default the run stripes across every live personal tunnel the user has (e.g. one per machine); set personal_link_tunnel_label to pin it to one. When no personal tunnel can be used, the run proceeds over its normal network path rather than failing.

            '
        personal_link_tunnel_label:
          type: string
          description: 'Restrict use_personal_link_agent to a single personal tunnel by its (server-derived) Link label, instead of striping across all of the user''s live personal tunnels. Ignored when use_personal_link_agent is not set.

            '
        tcm_bindings:
          type: array
          description: The plan's external TCM bindings. Populated at read time on single plan reads when include_tcm_bindings is true; empty if the plan has no bindings; not persisted.
          items:
            $ref: '#/components/schemas/XrayEntityBinding'
          x-dao-derived: true
        credentials_id:
          type: string
          description: Optional ID of the credentials object to use with this run policy
        credentials_required:
          type: boolean
          description: Flag indicating whether or not credentials are required for this run policy
        http_auth_credentials_id:
          type: string
          description: Optional ID of credentials to pass in the HTTP request (as opposed to interactive login credentials)
        http_auth_credentials_required:
          type: boolean
          description: Flag indicating whether or not HTTP auth credentials are required for this run policy
        http_headers:
          type: array
          description: Custom HTTP headers to send with all requests
          items:
            $ref: '#/components/schemas/HttpHeader'
        http_headers_required:
          type: boolean
          description: Flag indicating whether or not custom HTTP headers are required for this run policy
        enabled:
          type: boolean
          description: Whether this run policy is currently enabled
        generated:
          type: boolean
          description: Whether this run policy was automatically generated by the platform as opposed to being entered by a user
        default:
          type: boolean
          description: Whether this is the default run policy
        ephemeral:
          type: boolean
          description: Whether this is an ephemeral run policy created for an ad hoc plan run
        created_time:
          type: integer
          description: time the run policy was created
          format: int64
        created_by_id:
          type: string
          description: The ID of the user who created this run policy
        last_updated_time:
          type: integer
          description: time the run policy object was last updated
          format: int64
        last_updated_by_id:
          type: string
          description: The ID of the user who last updated this run policy
        name:
          type: string
          description: The display name of the run policy
        description:
          type: string
          description: Detailed description of this run policy
        journeys:
          type: array
          description: DEPRECATED - use execution_stages
          items:
            $ref: '#/components/schemas/TestConfiguration'
        test_invariant_ids:
          type: array
          description: Server-maintained denormalized list of invariant ids of every test referenced anywhere in this plan's execution_stages. Used to index plan-by-test lookups in Datastore (which cannot index doubly-nested array paths). Do not set from clients - any value provided will be overwritten on save.
          items:
            type: string
        page_load_wait:
          type: string
          description: The amount of time to wait after page loads, if supported by the runtime.
          enum:
          - FAST
          - NORMAL
          - SLOW
          - SLOWER
          - INHERIT
          x-force-uppercase: true
        flow_variants:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: Any specific flow variants that should be used when running the plan.  Any flow variants set here will be used instead of the head version when the given flow is encountered for this plan
        journeys_ddt_migration_backup:
          type: array
          description: Backup of journeys list to prevent data loss in case of failed migration
          items:
            $ref: '#/components/schemas/TestConfiguration'
        parameters:
          type: array
          description: Execution parameters that are shared across all Tests in the Plan
          items:
            $ref: '#/components/schemas/ExecutionParameter'
        triggers:
          type: array
          items:
            $ref: '#/components/schemas/Trigger'
        browser_type:
          type: string
          description: DEPRECATED - The browser that should be used when executing journeys, use browser_types
          deprecated: true
          enum:
          - chrome
          - edge
          - firefox
          - internet_explorer
          - safari
          - webkit
        browser_types:
          type: array
          description: The browser that should be used when executing journeys
          items:
            type: string
        mobile_device_ids:
          type: array
          description: Devices to use for mobile testing
          items:
            type: string
        emulation_mode:
          type: string
          description: Desktop (default) or mobile device emulation. When mobile is specified, browser_types is ignored in favor of web_emulation_types.
          enum:
          - desktop
          - mobile_web
          default: desktop
        web_emulation_types:
          type: array
          items:
            $ref: '#/components/schemas/WebEmulationConfiguration'
        execution_runner_type:
          type: string
          description: '[Deprecated] Test execution runner to use, optional'
          enum:
          - cloud_java_v1
          - cloud_nodejs_v2
        browser_runner_types:
          $ref: '#/components/schemas/PlanBrowserRunnerTypes'
        nodejs_runtime_variant:
          type: string
          description: Override the Node.js execution runtime variant, if v2 runtime in use
          enum:
          - playwright
          - puppeteer
        tags:
          type: array
          description: Tag objects associated with this entity
          items:
            $ref: '#/components/schemas/Tag'
        labels:
          type: array
          description: User provided labels
          items:
            $ref: '#/components/schemas/Label'
        run_multiplier:
          minimum: 1
          type: integer
          description: if > 1, will start multiple copies of each journey run when this plan runs
          format: int32
        debug_level:
          type: integer
          description: The debugging level to use for the test run.  Higher debug levels include more debug information in the run. Default is zero and runs with standard debugging.
        excluded_action_attributes:
          type: array
          description: Exclude action attributes during execution
          items:
            $ref: '#/components/schemas/ActionAttributeType'
        excluded_observers:
          type: array
          description: Exclude specific observers during execution
          items:
            type: string
        execution_stages:
          type: array
          description: Describes how journey should be executed
          items:
            $ref: '#/components/schemas/ExecutionStage'
        retry_on_failure:
          type: boolean
          description: If true, runs of this plan will automatically be retried if any journey run fails
        retry_failed_journeys_only:
          type: boolean
          description: If true, will only retry journeys that had failed journey runs
        refresh_and_retry_failed_step_mode:
          description: Runtime Recovery Refresh mode for runs of this plan; off when omitted.
          allOf:
          - $ref: '#/components/schemas/RefreshAndRetryFailedStepModeEnum'
        visual_change_baseline_overwrite:
          type: object
          properties:
            environment_id:
              type: string
              description: The ID of the environment that will serve as baseline for visual comparison
            plan_id:
              type: string
              description: The ID of the plan that will serve as baseline for visual comparison
          description: values used to substitute when looking for the baseline to do visual comparison
        use_visual_models:
          type: boolean
          description: If true, use and maintain models for visual change detection
        send_mabl_header:
          type: boolean
