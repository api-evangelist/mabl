        existing_email_domain:
          type: boolean
          description: Indicates if the user has an email that matched the registered ones in the CompanyDomain entity, at the moment of the user creation. This is a ReadOnly field that's only filled when the user doesn't have a role in any workspace.
        should_create_trial_with_existing_email_domain:
