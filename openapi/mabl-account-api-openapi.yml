        used:
          type: integer
          description: Seats consumed for the queried month.
          format: int32
          x-mabl-scope: public
        available:
          type: integer
          description: max(total - used, 0). Omitted when total is unknown or unlimited.
          format: int32
          x-mabl-scope: public
        unlimited:
          type: boolean
          description: True if this seat class has no allocation cap (mabl Core accounts). total and available are omitted when true. Absent, rather than false, on accounts where this doesn't apply.
          x-mabl-scope: public
      description: Allocated, used, and available counts for a single seat class
    UserOnboarding:
      type: object
      properties:
        lang_prompt_shown:
