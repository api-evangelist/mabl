        page_settings:
          type: object
          additionalProperties:
            type: string
          description: The settings to load for specified pages
        trainer_type:
          type: string
          description: The users preferred type for the trainer
          enum:
          - chrome_extension
          - electron
        customer_view_mode:
          type: string
          description: When set to customer, hides employee-only features for demo purposes
          enum:
          - standard
          - customer
        default_workspace_summary_schedule:
          type: string
          description: Schedule for the workspace summary email this user is subscribed to when they join a workspace. `none` leaves them unsubscribed. Unset is treated as `weekly`.
          enum:
          - none
          - daily
          - weekly
    User:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier representing a specific user
          x-mabl-scope: public
        created_time:
          type: integer
          description: Time at which the user was created
          format: int64
          x-mabl-scope: public
        created_by_id:
          type: string
          description: The ID of the user who created this user
        desktop_app_installed:
          type: boolean
          description: Flag indicating whether or not the user has installed electron app
        last_updated_time:
          type: integer
          description: Time at which the user was last updated
          format: int64
          x-mabl-scope: public
        last_updated_by_id:
          type: string
          description: The ID of the user who last updated this user
        email:
          type: string
          description: The user's E-Mail address
          x-mabl-scope: public
        email_verified:
          type: boolean
          description: Flag indicating whether or not the user's e-mail address has been verified
        name:
          type: string
          description: The user's full name
          x-mabl-scope: public
        given_name:
          type: string
          description: The user's first/given name
          x-mabl-scope: public
        family_name:
          type: string
          description: The user's surname
          x-mabl-scope: public
        nickname:
