openapi: 3.2.0
info:
  title: mabl Account API
  description: APIs for interacting with mabl services
  version: 0.599.3.1792436330
  x-readme-id: 62c896636916ce01d2ff4f5a
servers:
- url: /
security:
- basicAuth: []
- bearerAuth: []
tags:
- name: Account
paths:
  /accounts/{account_id}/seats:
    get:
      tags:
      - Account
      summary: Account seat allocation and utilization
      description: Allocated, used, and available seats for an account, split by automator and participant. Available is max(allocated - used, 0). Available to company administrators and company-scoped API keys (USER_MANAGEMENT or REPORTING).
      operationId: getAccountSeats
      parameters:
      - name: account_id
        in: path
        description: Account ID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: month
        in: query
        description: One based month (1-12) for the used-seat computation. Defaults to the current month.
        required: false
        style: form
        explode: true
        schema:
          maximum: 12
          minimum: 1
          type: integer
          format: int32
      - name: year
        in: query
        description: 0 based year for the used-seat computation (e.g. 2020). Defaults to the current year.
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Seat allocation and utilization summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatSummary'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-scope: public
      x-mabl-action: Read::Account
  /accounts/{account_id}/seats/usage:
    get:
      tags:
      - Account
      summary: Per-user seat utilization for an account
      description: Per-user seat utilization for an account over a calendar month, classifying each active user as an automator or participant based on their automator-event count. Available to company administrators and company-scoped API keys (USER_MANAGEMENT or REPORTING).
      operationId: getAccountSeatUsage
      parameters:
      - name: account_id
        in: path
        description: Account ID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: month
        in: query
        description: One based month (1-12) to report on. Defaults to the current month.
        required: false
        style: form
        explode: true
        schema:
          maximum: 12
          minimum: 1
          type: integer
          format: int32
      - name: year
        in: query
        description: Zero based year to report on (e.g. 2020). Defaults to the current year.
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        description: Maximum number of users to return in a single response.
        required: false
        style: form
        explode: true
        schema:
          maximum: 200
          minimum: 1
          type: integer
          format: int32
      - name: cursor
        in: query
        description: Cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Per-user seat utilization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatUsage'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-scope: public
      x-mabl-action: Read::Account
  /accounts:
    get:
      tags:
      - Account
      summary: Query Accounts
      description: Used to query accounts
      operationId: queryAccounts
      parameters:
      - name: company_id
        in: query
        description: If present, return only accounts in the given company
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: limit
        in: query
        description: The limit to use for pagination
        required: false
        style: form
        explode: true
        schema:
          minimum: 1
          type: integer
          format: int32
      - name: cursor
        in: query
        description: The cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Results of the query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountQueryResult'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::Account
    post:
      tags:
      - Account
      summary: Create Account
      description: Used to create new accounts
      operationId: createAccount
      parameters:
      - name: organizationId
        in: query
        description: The primary organization to associate this account with
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: legacy
        in: query
        description: Whether to create a legacy billing account
        required: false
        style: form
        explode: true
        schema:
          type: boolean
      requestBody:
        description: The account to create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Account'
        required: true
      responses:
        '201':
          description: The account that was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Create::Account
  /accounts/{id}:
    get:
      tags:
      - Account
      summary: get account details
      description: Get the details for a given account
      operationId: getAccount
      parameters:
      - name: id
        in: path
        description: The id of the account to retrieve
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Account found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::Account
    delete:
      tags:
      - Account
      summary: Remove Account
      description: Removes an account and associated workspaces
      operationId: removeAccount
      parameters:
      - name: id
        in: path
        description: The ID of the account to remove
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '204':
          description: Account successfully removed
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Delete::Account
    patch:
      tags:
      - Account
      summary: update account object
      description: Update the account object
      operationId: updateAccount
      parameters:
      - name: id
        in: path
        description: The id of the account to update
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: The account update to apply
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Account'
        required: true
      responses:
        '200':
          description: Account updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::Account
  /accounts/{account_id}/workspaces:
    post:
      tags:
      - Account
      summary: Create workspace under existing account
      description: Create a new workspace in an existing billing account
      operationId: createWorkspaceForAccount
      parameters:
      - name: account_id
        in: path
        description: The ID of the account to create the workspace under
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: The workspace to create and associated configuration
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceForAccountRequest'
        required: true
      responses:
        '201':
          description: The workspace that was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Create::Workspace
  /accounts/{account_id}/features:
    put:
      tags:
      - Account
      summary: Sets granted and excluded features to the given account
      description: Sets the granted_features and/or excluded_features fields of the account
      operationId: setFeatureOverrides
      parameters:
      - name: account_id
        in: path
        description: The id of the account to retrieve
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: The account update containing the granted/excluded features to set
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Account'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::Account
  /accounts/{account_id}/executionLocationPin:
    put:
      tags:
      - Account
      summary: Pin where the account's test runs execute
      description: Pins the cloud and region that test runs of this account execute in. A pin on a workspace wins over one on its account, which wins over one on its company. A run whose test type does not execute in the pinned location runs in the default one. Only mabl can set it (global accounts write scope or mabl global admin).
      operationId: setAccountExecutionLocationPin
      parameters:
      - name: account_id
        in: path
        description: The ID of the account
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: The location to pin
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionLocation'
        required: true
      responses:
        '200':
          description: The updated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::Account
    delete:
      tags:
      - Account
      summary: Remove the account's execution location pin
      description: Removes the account's pin, so its test runs follow the next pin up, or the default location. Same authorization as setting it.
      operationId: clearAccountExecutionLocationPin
      parameters:
      - name: account_id
        in: path
        description: The ID of the account
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '204':
          description: The pin was removed, or there was none
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::Account
  /accounts/{account_id}/completedAdditionalTrialInfo:
    put:
      tags:
      - Account
      summary: Sets the has_completed_additional_trial_info with true
      operationId: setCompletedAdditionalTrialInfo
      parameters:
      - name: account_id
        in: path
        description: The ID of the account to update
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Account flag updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::Account
  /accounts/{account_id}/migrations/core:
    put:
      tags:
      - Account
      summary: Migrate an existing Account to a Core billing Account
      description: Used to migrate an existing Account to a Core billing Account
      operationId: migrateAccountToCore
      parameters:
      - name: account_id
        in: path
        description: The ID of the account to update
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: trial
        in: query
        description: Whether or not to convert the Account to a trial Account. Defaults to whether the existing `account.mabl_plan_type == 'trial'`
        required: false
        style: form
        explode: true
        schema:
          type: boolean
      - name: trial_start_time
        in: query
        description: Trial start time. Defaults to the existing trial start time.
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int64
      - name: trial_end_time
        in: query
        description: Trial end time. Defaults to the existing trial end time.
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int64
      - name: start_time
        in: query
        description: Subscription start start time. Defaults to the existing subscription start time.
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int64
      - name: end_time
        in: query
        description: Subscription end time. Defaults to the existing subscription end time.
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int64
      responses:
        '201':
          description: The Account that was migrated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::Account
  /accounts/{account_id}/executionCreditWeights:
    put:
      tags:
      - Account
      summary: Sets Account ExecutionCreditWeights with the lastest iteration
      operationId: updateExecutionCreditWeights
      parameters:
      - name: account_id
        in: path
        description: The ID of the account to update
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Updated Account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::Account
  /accounts/{account_id}/billing:
    put:
      tags:
      - Account
      summary: update account with billing details
      description: Sets the billing details for an account
      operationId: setBillingDetails
      parameters:
      - name: account_id
        in: path
        description: The id of the account to retrieve
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: The billing details for the account
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingDetails'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '402':
          description: Payment failed (e.g. card declined)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::Account
  /accounts/{account_id}/subscription:
    put:
      tags:
      - Account
      summary: update account with new subscription details
      description: Sets the billing details for an account
      operationId: setSubscriptionDetails
      parameters:
      - name: account_id
        in: path
        description: The id of the account to retrieve
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: The subscription details for the account
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionUpdate'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::Account
    delete:
      tags:
      - Account
      summary: Unsubscribe account from all billing plans
      description: Sets the billing details for an account
      operationId: unsubscribe
      parameters:
      - name: account_id
        in: path
        description: The id of the account to retrieve
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::Account
  /accounts/{account_id}/payment:
    put:
      tags:
      - Account
      summary: update account with billing details
      description: Sets the payment details for an account
      operationId: setPaymentDetails
      parameters:
      - name: account_id
        in: path
        description: The id of the account to retrieve
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: The billing details for the account
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingDetails'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::Account
  /accounts/plans:
    get:
      tags:
      - Account
      summary: Query Plans
      description: Used to query plans
      operationId: queryPlans
      responses:
        '200':
          description: Results of the query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MablPlanQueryResult'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::Account
  /accounts/products:
    get:
      tags:
      - Account
      summary: Query Products
      description: Used to query products
      operationId: queryProducts
      responses:
        '200':
          description: Results of the query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MablProductQueryResult'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::Account
  /recover/accounts/{account_id}:
    post:
      tags:
      - Account
      summary: Recover Account
      description: Recover tombstoned account and all associated workspaces
      operationId: recoverAccount
      parameters:
      - name: account_id
        in: path
        description: The id of the account to recover
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: The account that was recoveed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: No account to recover
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Recover::Account
  /accounts/{account_id}/users:
    get:
      tags:
      - Account
      summary: List account users
      description: List the users across all workspaces in an account, deduplicated. Each user's roles are scoped to the workspaces within this account. Available to company admins (all users in the account); workspace members or properly permissioned API keys see only the users in their own workspaces.
      operationId: listAccountUsers
      parameters:
      - name: account_id
        in: path
        description: Account ID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of users to return in a single response. Additional pages of results can be retrieved by passing the cursor (returned in the results) on a subsequent call.
        required: false
        style: form
        explode: true
        schema:
          maximum: 200
          minimum: 1
          type: integer
          format: int32
      - name: cursor
        in: query
        description: Cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: inactive_users_only
        in: query
        description: If true, return only users with no activity in the account within the lookback window.
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          default: false
      - name: lookback_days
        in: query
        description: Activity window in days used by the inactive_users_only filter. Defaults to 90.
        required: false
        style: form
        explode: true
        schema:
          maximum: 365
          minimum: 1
          type: integer
          format: int32
          default: 90
      responses:
        '200':
          description: Results of the query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserQueryResult'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-scope: public
      x-mabl-action: Read::User
  /accounts/{account_id}/users/{id}:
    get:
      tags:
      - Account
      summary: Get account user
      description: Retrieve a user's details within the context of an account, including their roles across the account's workspaces. Returns 404 if the user has no role in any of the account's workspaces. Available to company admins; workspace members or properly permissioned API keys see the user only within their own workspaces.
      operationId: getAccountUser
      parameters:
      - name: account_id
        in: path
        description: Account ID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: ID of the user to retrieve
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: User that was retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: User is not a member of this account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-scope: public
      x-mabl-action: Read::User
components:
  responses:
    ErrorResponse400:
      description: Invalid or missing parameter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse403:
      description: User not authorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse401:
      description: User not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse:
      description: Unknown error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
  schemas:
    Subscription:
      type: object
      properties:
        plan_type:
          type: string
          description: The type of plan this subscription is on
          enum:
          - journey_executions
          - executions
          - monthly
          - quarterly
          - technical_account_manager
          - yearly
          - annual_executions
        plan_subtype:
          type: string
          enum:
          - a11y
          - api
          - browser
          - technical_account_manager
          - performance
        plan_id:
          type: string
          description: The id for the plan subscribed to in stripe
          readOnly: true
        subscription_id:
          type: string
          description: The id of the subscription in stripe.  A subscription can have multiple subscription items.
          readOnly: true
        subscription_items_id:
          type: string
          description: The id of the subscription item for this account on this plan.  This is the id we need to bill against.
      description: A stripe subscription
    SubscriptionUpdatePricingPlans:
      type: object
      properties:
        plan_type:
          type: string
          description: The type of pricing plan.  Each customer can be subscribed to a max one pricing plan of each type.  MONTHLY is a monthly subscription charge.  JOURNEY_RUNS is a per usage plan.
          enum:
          - monthly
          - quarterly
          - yearly
          - journey_executions
          - executions
          - technical_account_manager
          - annual_executions
        plan_subtype:
          type: string
          enum:
          - a11y
          - api
          - browser
          - technical_account_manager
          - performance
        pricing_plan_id:
          type: string
          description: The id of the pricing plan.  Pricing plan must already exist in stripe.
      description: The pricing plans to update the customers subscription to.  These should be a complete set of all the pricing plans the customer should be subscribed to
    CreateWorkspaceForAccountRequest:
      required:
