          description: Indicates the status of the browser test run guided tour
          enum:
          - complete
          - skipped
          - not_started
          - not_available
          - incomplete
        mobile_testing_guide_status:
          type: string
          description: Indicates the status of the guided mobile testing experience
          enum:
          - complete
          - skipped
          - not_started
          - not_available
          - incomplete
      description: An object containing the onboarding information for a specific User.
    SeatSummary:
      type: object
      properties:
        account_id:
          type: string
          description: Id of the account
          x-mabl-scope: public
        interval_start:
          type: integer
          description: Start of the period the used counts cover, in epoch milliseconds
          format: int64
          x-mabl-scope: public
        interval_end:
          type: integer
          description: End of the period the used counts cover, in epoch milliseconds
          format: int64
          x-mabl-scope: public
        has_subscription:
          type: boolean
