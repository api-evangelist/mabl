openapi: 3.2.0
info:
  title: mabl Analysis API
  description: APIs for interacting with mabl services
  version: 0.599.3.1792436330
  x-readme-id: 62c896636916ce01d2ff4f5a
servers:
- url: /
security:
- basicAuth: []
- bearerAuth: []
tags:
- name: Analysis
paths:
  /analysis/{workspace_id}/assertion/evaluate:
    post:
      tags:
      - Analysis
      summary: Evaluate an AI assertion
      description: (deprecated - use /agent/assertion?workspaceId={workspace_id}) Evaluate an AI assertion
      operationId: evaluateAiAssertion
      parameters:
      - name: workspace_id
        in: path
        description: The workspace associated with this assertion
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: The request with the assertion and context to evaluate
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisEvaluateAssertionRequest'
        required: true
      responses:
        '301':
          description: Permanent redirect to agent assertion endpoint
          headers:
            Location:
              description: The URL of the agent assertion endpoint
              style: simple
              explode: false
              schema:
                type: string
                example: /agent/assertion?workspaceId={workspace_id}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedirectResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Run::AiAnalysis
  /analysis/{workspace_id}/run/summary:
    post:
      tags:
      - Analysis
      summary: Load the saved failure analysis for a test run
      description: Returns the synopsis and summary of the test run's finished failure analysis, or an empty response when it has none. Generates nothing. Use getSavedTestRunFailureAnalysis to read an analysis and createTestRunFailureAnalysis to start one.
      operationId: analyzeTestRun
      parameters:
      - name: workspace_id
        in: path
        description: The workspace associated with this test run
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: regenerate
        in: query
        description: DEPRECATED - ignored
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          default: false
      requestBody:
        description: The request with the run to analyze
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestRunAnalysisRequest'
        required: true
      responses:
        '200':
          description: The finished analysis of the test run failure, or an empty response when there is none
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRunAnalysisResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      deprecated: true
      x-mabl-action: Read::AiAnalysis
  /analysis/{workspace_id}/planRun/summary:
    post:
      tags:
      - Analysis
      summary: Load the saved failure analysis for a plan run
      description: Returns the headline and summary of the plan run's finished failure analysis, or an empty response when it has none. Generates nothing; failed plan runs are analyzed automatically. Use getSavedPlanRunFailureAnalysis to read an analysis.
      operationId: analyzePlanRun
      parameters:
      - name: workspace_id
        in: path
        description: The workspace associated with this plan run
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: regenerate
        in: query
        description: DEPRECATED - ignored
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          default: false
      requestBody:
        description: The request with the plan run to analyze
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRunAnalysisRequest'
        required: true
      responses:
        '200':
          description: The finished analysis of the plan run, or an empty response when there is none
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanRunAnalysisResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      deprecated: true
      x-mabl-action: Read::AiAnalysis
  /analysis/{workspace_id}/planRun/{plan_run_id}/summary:
    get:
      tags:
      - Analysis
      summary: Load a saved FailureAnalysis
      description: Retrieve most recent saved FailureAnalysis for the provided PlanRun, if available.
      operationId: getSavedPlanRunFailureAnalysis
      parameters:
      - name: workspace_id
        in: path
        description: The workspace associated with this PlanRun
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: plan_run_id
        in: path
        description: ID of PlanRun for which to fetch the associated FailureAnalysis
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Requested FailureAnalysisResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailureAnalysisResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: No such Plan Run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::AiAnalysis
  /analysis/{workspace_id}/deployment/{deployment_event_id}/summary:
    get:
      tags:
      - Analysis
      summary: Load a saved FailureAnalysis for a deployment event
      description: Retrieve most recent saved FailureAnalysis for the provided deployment event, if available.
      operationId: getSavedDeploymentFailureAnalysis
      parameters:
      - name: workspace_id
        in: path
        description: The workspace associated with this deployment event
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: deployment_event_id
        in: path
        description: ID of the deployment event for which to fetch the associated FailureAnalysis
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Requested FailureAnalysisResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailureAnalysisResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: No such deployment event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::AiAnalysis
  /analysis/{workspace_id}/jira/issueDescription:
    get:
      tags:
      - Analysis
      summary: Resolve a Jira issue to its description text
      description: Fetches a Jira issue via the workspace's Atlassian Connect integration and returns its summary and description as plain text.
      operationId: getJiraIssueDescription
      parameters:
      - name: workspace_id
        in: path
        description: The workspace whose Jira integration should be used
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: issue_id
        in: query
        description: The Jira issue key (e.g. PROJ-123)
        required: true
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: The resolved Jira issue description
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraIssueDescriptionResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::AiAnalysis
  /analysis/{workspace_id}/testRun/{test_run_id}/summary:
    get:
      tags:
      - Analysis
      summary: Load a saved FailureAnalysis
      description: Retrieve most recent saved FailureAnalysis for the provided TestRun, if available. This endpoint should be called before createTestRunFailureAnalysis.
      operationId: getSavedTestRunFailureAnalysis
      parameters:
      - name: workspace_id
        in: path
        description: The workspace associated with this TestRun
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: test_run_id
        in: path
        description: ID of TestRun for which to fetch the associated FailureAnalysis
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Requested FailureAnalysisResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailureAnalysisResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: No such Test Run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::AiAnalysis
    post:
      tags:
      - Analysis
      summary: Start a failure analysis for a test run
      description: Starts the results analysis agent on a failed TestRun that has no analysis, and saves a queued FailureAnalysis that the agent result supersedes. Rejected with 409 while the TestRun has an analysis or one is still in progress.
      operationId: createTestRunFailureAnalysis
      parameters:
      - name: workspace_id
        in: path
        description: The workspace associated with this TestRun
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: test_run_id
        in: path
        description: ID of the failed TestRun to analyze
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '201':
          description: The queued FailureAnalysisResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailureAnalysisResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: No such Test Run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '409':
          $ref: '#/components/responses/ErrorResponse409'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Run::AiAnalysis
  /analysis/{workspace_id}/skipReasons:
    get:
      tags:
      - Analysis
      summary: Query failure analysis skip reasons
      description: Whether the failure burst guard skipped automatic failure analysis for the given test runs or plan runs when they failed. Ids not skipped, or whose record expired, are absent. Up to 200 ids.
      operationId: queryFailureAnalysisSkipReasons
      parameters:
      - name: workspace_id
        in: path
        description: The workspace the ids belong to
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: ids
        in: query
        description: Test run or plan run ids
        required: true
        style: form
        explode: false
        schema:
          maxItems: 200
          minItems: 1
          type: array
          items:
            type: string
      responses:
        '200':
          description: Skip reasons for the skipped ids
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailureAnalysisSkipReasonsResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::AiAnalysis
  /analysis/{workspace_id}/agentAnalysis/save:
    put:
      tags:
      - Analysis
      summary: Save agent-generated analysis result
      description: Saves structured analysis output (title, summary, evidence, failure category) to the target entity (test run, plan run, or deployment). Used by the auto-analysis agent system.
      operationId: saveAgentAnalysisResult
      parameters:
      - name: workspace_id
        in: path
        description: The workspace associated with this entity
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveAgentAnalysisRequest'
        required: true
      responses:
        '204':
          description: Analysis result saved successfully
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Entity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::AiAnalysis
components:
  schemas:
    FailureAnalysis:
      type: object
      properties:
        id:
          type: string
          description: Analysis ID - may be different when analysis regenerated
        execution_id:
          type: string
          description: Execution identifier (e.g. plan run ID)
        workspace_id:
          type: string
          description: Owning workspace ID
        execution_entity_type:
          type: string
          description: Analysis type
          enum:
          - plan_run
          - test_run
          - deployment
        synopsis:
          type: string
          description: A synopsis of the failure summary
        summary_text:
          type: string
          description: A summary describing the PlanRun failure and potential root cause
        prompt_id:
          type: string
          description: ID of the prompt used to generate this entity
        created_by_id:
          type: string
          description: ID of the user who created this entity
        created_time:
          type: integer
          description: Time of entity creation in epoch milliseconds
          format: int64
        generated_time:
          type: integer
          description: Time of successful analysis generation for this entity in epoch milliseconds
          format: int64
        agent_session_id:
          type: string
          description: ID of the agent session that generated this analysis
        evidence_details:
          type: string
          description: Agent-generated detailed evidence with visual and technical evidence
          x-dao-unindexed: true
        content_blocks_json:
          type: string
          description: Pre-computed structured content blocks for rich rendering of evidence_details, stored as a JSON array string. Parsed by the UI into ContentBlock[] for rendering.
          x-dao-unindexed: true
        expire_datetime:
          type: string
          description: Date time entity will be automatically purged from storage
          format: date-time
          x-dao-unindexed: true
        dedup_fingerprint_hash:
          type: string
          description: SHA-256 of the per-failing-test signature multiset, used by plan-FA dedup.
          x-dao-unindexed: true
        reused_from_run_id:
          type: string
          description: When the failure analysis was reused from a prior run, the ID of the original run that produced the analysis.
        analysis_source:
          type: string
          description: Who authored this analysis. `auto` is the automatic analysis agent; `user_correction` is a correction a user made in the results chat, which supersedes the automatic reading and is not overwritten by a later automatic analysis of the same execution. Absent on rows written before this field existed, which are automatic.
          enum:
          - auto
          - user_correction
        failing_step_number:
          type: string
          description: The step number the run terminally failed at (e.g. "12.4"), from the execution log when the server could determine it, otherwise from the analysis agent. Test-run analyses only.
          x-dao-unindexed: true
      description: Generative AI failure analysis for a PlanRun
    FailureAnalysisSkipReason:
      type: string
      description: Why automatic analysis was skipped during a failure burst
      enum:
      - plan_run_fraction
      - workspace_burst
    GuardrailRefusal:
      type: object
      properties:
        id:
          type: string
          description: The id of the guardrail policy that decided the refusal.
        reason:
          type: string
          description: Why the policy refuses the request, written for the person the agent acts for.
        decision_id:
          type: string
          description: The id of this decision in the guardrail decision log.
        action:
          type: string
          description: The action the request was evaluated as, written Verb::Resource (for example Delete::Test), as declared by the operation's x-mabl-action extension.
        policy_source:
          type: string
          description: 'Who set the deciding policy: workspace for a rule the workspace''s owners wrote, account for a rule set for the workspace''s account, mabl_agent_type for the agent type''s ceiling, and mabl_default for mabl''s own defaults.'
        approval:
          description: The approval for this request; present when error_code is approval_required and the approval could be recorded. Without it the request cannot be approved.
          allOf:
          - $ref: '#/components/schemas/GuardrailApprovalRef'
      description: The guardrail policy that refused an agent request.
    FailureAnalysisSkipReasonsResponse:
      required:
      - complete
      - skip_reasons
      - skipped_test_run_counts
      type: object
      properties:
        skip_reasons:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FailureAnalysisSkipReason'
          description: Skip reason keyed by entity id; only skipped ids are present.
        skipped_test_run_counts:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: 'For plan run ids in the request: how many of the plan run''s test runs had automatic analysis skipped by the burst guard. Only plan runs with at least one are present.'
        complete:
          type: boolean
          description: False when the lookup could not read every id (for example a cache timeout), so counts may be low.
    GuardrailApprovalKind:
      type: string
      description: Who decides a guardrail approval. SELF is decided by the person the agent acts for; WORKSPACE, for an agent acting for an API key, by a workspace owner or editor.
      enum:
      - SELF
      - WORKSPACE
    RedirectResponse:
      type: object
      properties:
        redirectUrl:
          type: string
          x-mabl-scope: public
    TestRunAnalysisRequest:
      required:
      - test_run_id
      type: object
      properties:
        test_run_id:
          type: string
          description: The ID of the test run to analyze
        save_summary:
          type: boolean
          description: DEPRECATED - ignored
          default: false
    GuardrailApprovalRef:
      type: object
      properties:
        id:
          type: string
          description: The approval's id.
        state:
          description: Where the approval stands.
          allOf:
          - $ref: '#/components/schemas/GuardrailApprovalState'
        kind:
          description: Who decides the approval.
          allOf:
          - $ref: '#/components/schemas/GuardrailApprovalKind'
        request_expires_time:
          type: integer
          description: When the approval expires if nobody decides it, in epoch milliseconds.
          format: int64
        url:
          type: string
          description: The mabl app page where a person reviews the approval.
      description: 'An approval a guardrail policy asks for. While it is PENDING, stop: give the person the url, tell them the request is waiting for approval, and do not repeat the request or poll in a loop. Once a person tells you it is APPROVED, repeat the identical request with the header X-Mabl-Approval set to id. DENIED means a person said no, so do not work around it.'
    JiraIssueDescriptionResponse:
      type: object
      properties:
        description:
          type: string
          description: The resolved Jira issue description text (summary + description combined)
    SaveAgentAnalysisRequest:
      required:
      - entity_id
      - entity_type
      - summary
      - title
      type: object
      properties:
        entity_id:
          type: string
          description: ID of the entity to save analysis on (test run, plan run, or deployment event)
        entity_type:
          type: string
          description: The type of entity
          enum:
          - test_run
          - plan_run
          - deployment
        title:
          type: string
          description: Agent-generated analysis title
        summary:
          type: string
          description: Agent-generated analysis summary (root cause + next steps)
        failure_category:
          type: string
          description: Agent-suggested failure category ID
        evidence_details:
          type: string
          description: Agent-generated evidence details
        content_blocks_json:
          type: string
          description: Pre-computed structured content blocks for evidence_details, serialized as a JSON array string. Stored as-is on the FailureAnalysis entity and deserialized by consumers.
        agent_session_id:
          type: string
          description: ID of the agent session that generated this analysis
        reused_from_run_id:
          type: string
          description: When the failure analysis was reused from a prior run, the ID of the original run that produced the analysis.
        analysis_source:
          type: string
          description: 'Who authored this analysis. Defaults to `auto` (the automatic analysis agent) when absent. `user_correction` marks a correction a user made in the results chat: it is stored as a new analysis attributed to that user, and a later automatic analysis of the same execution will not overwrite it. A correction may omit `evidence_details` and `content_blocks_json`, in which case the evidence already stored for the execution is kept.'
          enum:
          - auto
          - user_correction
        failing_step_number:
          type: string
          description: The step number the run terminally failed at (e.g. "12.4"), taken from the execution log when the server could determine it, otherwise from the analysis agent. Test-run analyses only.
    AnalysisEvaluateAssertionRequest:
      required:
      - assertion_prompt
      - screenshot
      - test_run_id
      type: object
      properties:
        test_run_id:
          type: string
          description: The test run ID for which this assertion is being evaluated
        assertion_prompt:
          type: string
          description: The assertion prompt text to use in evaluating the assertion
        assertion_criteria:
          type: array
          description: The assertion criteria to use in evaluating the assertion
          items:
            type: string
        regenerate_criteria:
          type: boolean
          description: Whether to regenerate the assertion criteria for the assertion (if no criteria are specified, they will always be generated regardless of this setting)
          default: false
        screenshot:
          type: string
          description: Base64-encoded screenshot of the element to use in evaluating the assertion
        screenshot_mime_type:
          type: string
          description: The MIME type of the Base64-encoded screenshot data (optional; defaults to image/png if not provided)
          default: image/png
        files:
          type: array
          description: Files in the assertion context
          items:
            $ref: '#/components/schemas/GenAiFileAttachment'
        session_id:
          type: string
          description: The ID of the current editing session for the assertion, if applicable
        test_invariant_id:
          type: string
          description: The ID of the test in which this assertion is being evaluated
        test_type:
          $ref: '#/components/schemas/TestTypeEnum'
        training_session_id:
          type: string
          description: The ID of the current training session for the assertion, if applicable
        url:
          type: string
          description: The URL on which this assertion is being evaluated
        variables:
          type: array
          items:
            $ref: '#/components/schemas/Variable'
        override:
          $ref: '#/components/schemas/GenAiOverrideOptions'
    PlanRunAnalysisRequest:
      required:
      - plan_run_id
      type: object
      properties:
        plan_run_id:
          type: string
          description: The ID of the plan run to analyze
        save_summary:
          type: boolean
          description: DEPRECATED - ignored
          default: false
    TestRunAnalysisResponse:
      type: object
      properties:
        synopsis:
          type: string
          description: The failure synopsis for the analysis
        summary:
          type: string
          description: The summary of the analysis for the test run failure
        failure_category_id:
          type: string
          description: DEPRECATED - never set
        empty_response_reason:
          type: string
          description: DEPRECATED - never set
          enum:
          - test_deleted
          - test_log_unavailable
    GenAiOverrideOptions:
      type: object
      properties:
        model_id:
          type: string
          description: The model ID to use instead of the default model used by the endpoint
          readOnly: true
        meta_prompt:
          type: string
          description: The meta-prompt to use instead of the default used by the endpoint
          readOnly: true
        temperature:
          type: number
          description: The temperature to use instead of the default used by the endpoint
          format: float
          readOnly: true
    GuardrailApprovalState:
      type: string
      description: Where a guardrail approval stands. PENDING awaits a decision and expires undecided after 24 hours; APPROVED lets the agent repeat the request, as often as it does, for 20 minutes; DENIED refuses the same request for 20 minutes after the decision, after which asking again opens a new approval; CANCELLED means a person withdrew it while pending or revoked it while approved. EXPIRED and CANCELLED are final.
      enum:
      - PENDING
      - APPROVED
      - DENIED
      - EXPIRED
      - CANCELLED
    FailureAnalysisStatus:
      type: string
      description: Analysis state
      enum:
      - queued
      - done
      - unavailable
      - skipped
    GenAiFileAttachment:
      type: object
      properties:
        data:
          type: string
          description: Base64 encoded file data. Mutually exclusive with file_uri - provide exactly one.
        file_name:
          type: string
          description: Name of the file
        file_uri:
          type: string
          description: GCS URI of the file (gs://bucket/path format). Mutually exclusive with data - provide exactly one.
        mime_type:
          type: string
          description: MIME type of the file (required for both data and file_uri)
      description: File attachment for AI evaluation. Exactly one of 'data' or 'file_uri' must be provided.
    FailureAnalysisResponse:
      type: object
      properties:
        execution_id:
          type: string
