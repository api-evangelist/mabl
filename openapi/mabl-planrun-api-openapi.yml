openapi: 3.2.0
info:
  title: mabl Plan Run API
  description: APIs for interacting with mabl services
  version: 0.599.3.1792436330
  x-readme-id: 62c896636916ce01d2ff4f5a
servers:
- url: /
security:
- basicAuth: []
- bearerAuth: []
tags:
- name: PlanRun
paths:
  /planRuns:
    post:
      tags:
      - PlanRun
      summary: Create a plan run
      description: Creates and schedules a run of a plan
      operationId: createPlanRun
      requestBody:
        description: Plan run options
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRunOptions'
        required: true
      responses:
        '201':
          description: The plan run that was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanRun'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Run::PlanRun
  /planRuns/duplicate:
    post:
      tags:
      - PlanRun
      summary: Duplicate a plan run
      description: Creates and schedules a run copied from an existing plan run
      operationId: duplicatePlanRun
      requestBody:
        description: Configuration for duplicating a plan run
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRunDuplicationRequest'
        required: true
      responses:
        '201':
          description: The plan run that was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanRun'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Run::PlanRun
  /planRuns/external:
    post:
      tags:
      - PlanRun
      summary: Record an external plan run. This endpoint will not cause tests to be executed
      description: Records an external plan run
      operationId: recordPlanRun
      requestBody:
        description: The external PlanRun to record
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalPlanRunReference'
        required: true
      responses:
        '201':
          description: The plan run that was recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanRun'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '402':
          $ref: '#/components/responses/ErrorResponse402'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Create::PlanRun
  /planRuns/external/{id}:
    patch:
      tags:
      - PlanRun
      summary: Update an external plan run
      description: Updates an external plan run
      operationId: updateExternalPlanRun
      parameters:
      - name: id
        in: path
        description: The ID of the plan run to update
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: If-Match
        in: header
        description: If-Match header according to http/1.1 spec section 14.24
        required: false
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: Information to update the external plan run
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRun'
        required: true
      responses:
        '200':
          description: The updated plan run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanRun'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '402':
          $ref: '#/components/responses/ErrorResponse402'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::PlanRun
  /planRuns/workspace/{workspace_id}:
    get:
      tags:
      - PlanRun
      summary: Queries plan runs
      description: Used to query plan runs
      operationId: queryPlanRuns
      parameters:
      - name: workspace_id
        in: path
        description: The workspace associated with the plan
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: environment_id
        in: query
        description: The environment associated with the plan
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: status
        in: query
        description: The plan run status
        required: false
        style: form
        explode: true
        schema:
          type: string
          enum:
          - cancelled
          - completed
          - failed
          - post_execution
          - pre_execution
          - queued
          - scheduled
          - scheduling
          - succeeded
          - terminated
      - name: plan_id
        in: query
        description: The ID of the plan to query by
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: limit
        in: query
        description: The limit to use for pagination
        required: false
        style: form
        explode: true
        schema:
          minimum: 1
          type: integer
          format: int32
      - name: cursor
        in: query
        description: The cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: populate_test_script_executions
        in: query
        description: If we should populate the test script executions or not
        required: false
        style: form
        explode: true
        schema:
          type: boolean
      - name: min_created_time
        in: query
        description: The min_created_time to use for querying any plan run after given created time in milliseconds
        required: false
        style: form
        explode: true
        schema:
          minimum: 13
          type: integer
          format: int64
      - name: include_ad_hoc_runs
        in: query
        description: Whether to include ad-hoc runs in the results. Defaults to true if not specified.
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          default: true
      - name: include_latest_xray_sync
        in: query
        description: Whether to include each plan run's latest Xray sync status and error message in the results; requires a limit of at most 50. Defaults to false if not specified.
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Array of plan runs matching the query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanRunQueryResult'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::PlanRun
  /planRuns/workspace/{workspace_id}/querySummaries:
    post:
      tags:
      - PlanRun
      summary: Retrieve plan run summaries for a workspace
      description: Used to query plan run summaries for a workspace
      operationId: queryPlanRunSummaries
      parameters:
      - name: workspace_id
        in: path
        description: The workspace ID to filter by
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: limit
        in: query
        description: The limit to use for pagination (default is 100)
        required: false
        style: form
        explode: true
        schema:
          maximum: 1000
          minimum: 1
          type: integer
          format: int32
      - name: cursor
        in: query
        description: The cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      requestBody:
        description: Constraints (filters) to apply to query
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRunSummaryQueryOptions'
        required: true
      responses:
        '200':
          description: Array of plan run summary records matching the query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanRunSummaryQueryResult'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::PlanRun
  /planRuns/workspace/{workspace_id}/summaries:
    get:
      tags:
      - PlanRun
      summary: Retrieve plan run summaries by plan ID (narrow agent path)
      description: Lightweight query for agent tools. Returns a narrow subset of fields, uses keyset pagination, and requires plan_id.
      operationId: queryPlanRunSummariesForAgent
      parameters:
      - name: workspace_id
        in: path
        description: The workspace ID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: plan_id
        in: query
        description: The plan ID to filter by
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: limit
        in: query
        description: Max results to return (default 30, max 1000)
        required: false
        style: form
        explode: true
        schema:
          maximum: 1000
          minimum: 1
          type: integer
          format: int32
      - name: cursor
        in: query
        description: Keyset cursor for pagination (created_time_ms|plan_run_id)
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: status
        in: query
        description: Optional status filter
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: min_created_time
        in: query
        description: Optional minimum created time in epoch milliseconds
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int64
      - name: max_created_time
        in: query
        description: Optional maximum created time in epoch milliseconds
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int64
      - name: environment_id
        in: query
        description: Optional environment filter; matches rows whose denormalized environment_ids contains this value
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: application_id
        in: query
        description: Optional application filter; matches rows whose denormalized application_ids contains this value
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Plan run summaries matching the query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanRunSummaryQueryResult'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::PlanRun
  /planRuns/workspace/{workspace_id}/aggregate:
    get:
      tags:
      - PlanRun
      summary: Aggregate plan run counts for a workspace (fast Datastore counts)
      description: 'Returns total plan runs and counts grouped into normalized status buckets for the workspace,

        optional environment/application filters, and created_time range. Uses server-side aggregation (not full listing).

        Newest failing plan runs and top plans by failure count are derived from a bounded sample of recent failures

        when failures exist. Ad-hoc runs (single test runs launched outside any plan) are excluded from all counts

        and samples.'
      operationId: aggregateWorkspacePlanRuns
      parameters:
      - name: workspace_id
        in: path
        description: The workspace (organization) id
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: environment_id
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: application_id
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: min_created_time
        in: query
        description: Inclusive lower bound on created_time (epoch ms)
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int64
      - name: max_created_time
        in: query
        description: Inclusive upper bound on created_time (epoch ms)
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int64
      - name: failed_plan_run_sample_limit
        in: query
        description: Max newest failed plan runs to return (0 skips). Default 20, max 150 — same bounds as `PlanRunServiceImpl` and the results-analysis overview tool.
        required: false
        style: form
        explode: true
        schema:
          maximum: 150
          minimum: 0
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: Aggregated workspace plan run statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanRunWorkspaceAggregateResult'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::PlanRun
  /planRuns/workspace/{workspace_id}/aggregate/daily:
    get:
      tags:
      - PlanRun
      summary: Exact per-day plan run counts for a workspace (fast Spanner aggregation)
      description: Returns exact passed/failed/total plan run counts per calendar day for a workspace window, computed by one Spanner query over terminal runs only. Ordered oldest first; only days with runs are included. Ad-hoc runs are excluded, matching aggregateWorkspacePlanRuns.
      operationId: aggregateWorkspacePlanRunsByDay
      parameters:
      - name: workspace_id
        in: path
        description: The workspace (organization) id
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: environment_id
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: application_id
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: min_created_time
        in: query
        description: Inclusive lower bound on created_time (epoch ms)
        required: true
        style: form
        explode: true
        schema:
          type: integer
          format: int64
      - name: max_created_time
        in: query
        description: Inclusive upper bound on created_time (epoch ms)
        required: true
        style: form
        explode: true
        schema:
          type: integer
          format: int64
      - name: day_offset_minutes
        in: query
        description: Minutes subtracted from created_time before bucketing into a UTC calendar day, for aligning day boundaries to a non-UTC offset. Negative for UTC+ zones.
        required: false
        style: form
        explode: true
        schema:
          maximum: 720
          minimum: -720
          type: integer
          format: int32
          default: 0
      responses:
        '200':
          description: Exact per-day workspace plan run counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDailyRunCounts'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::PlanRun
  /planRuns/workspace/{workspace_id}/latestByEnvironment:
    get:
      tags:
      - PlanRun
      summary: Latest terminal plan run per plan/environment pair for a workspace window
      description: 'Returns one row per (plan, environment) pair that had a terminal run in the window: the latest such run plus a run/failure tally for that pair over the window. Ad-hoc runs are excluded, matching aggregateWorkspacePlanRuns. A plan with no environment on a run (an empty or null environment_ids array) still gets a row, with environment_id absent.'
      operationId: getWorkspaceLatestPlanRunsByEnvironment
      parameters:
      - name: workspace_id
        in: path
        description: The workspace (organization) id
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: environment_id
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: application_id
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: min_created_time
        in: query
        description: Inclusive lower bound on created_time (epoch ms)
        required: true
        style: form
        explode: true
        schema:
          type: integer
          format: int64
      - name: max_created_time
        in: query
        description: Inclusive upper bound on created_time (epoch ms)
        required: true
        style: form
        explode: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Latest plan run per plan/environment pair, with window tallies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceLatestPlanRunsByEnvironment'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::PlanRun
  /planRuns/deployment/{deployment_id}:
    get:
      tags:
      - PlanRun
      summary: Queries plan runs by deployment event
      description: Used to query all plan runs for a given deployment
      operationId: queryPlanRunsByEventId
      parameters:
      - name: deployment_id
        in: path
        description: The deployment that triggered the plan runs to retrieve
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: limit
        in: query
        description: The limit to use for pagination
        required: false
        style: form
        explode: true
        schema:
          minimum: 1
          type: integer
          format: int32
      - name: cursor
        in: query
        description: The cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Array of plan runs matching the query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanRunQueryResult'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::PlanRun
  /planRuns/{plan_run_id}/browserState:
    get:
      tags:
      - PlanRun
      summary: Get signed URLs for the browser state a plan run's tests share
      description: 'Returns the signed URLs a test runner needs to read and write browser state that the

        tests of one plan run share.


        The state belongs to the plan run, and there is one per session scope — the application

        origin plus the credentials. A flow plays no part in addressing it, and deliberately so:

        the session is what decides reuse. A test that finds state for its session starts from it,

        without comparing its marked flows against whatever the producing test had marked.


        A marked flow still runs every time. It is not skipped, so it must decide for itself

        whether there is anything left to do — a login flow, for example, wraps its sign-in steps

        in a condition that only holds when the login page is actually showing. Leaving that

        judgment to the flow is what makes reuse safe: a test can never miss a flow''s effect

        because some other test produced the state.


        `signed_upload_url` is always present. `signed_download_url` is present only when state has

        already been stored for this plan run and session scope, so its absence tells a runner to

        run the flow itself. Runners that start together can all see no download URL and all

        produce, and the write is unconditional, so the last one to upload wins — deliberately,

        since a runner that finds an expired session has to be able to replace it. Answering both

        questions in one response keeps a miss to the same number of round trips as a hit.


        The workspace, and therefore the bucket, is derived server-side from the plan run, and the

        object key is composed here from the plan run, the application origin and the

        credentials. The caller supplies no path and learns no bucket name, so the URLs cannot be

        steered at an unrelated object, and state is only ever shared between tests that would have

        logged in as the same user against the same application.


        The stored state belongs to the plan run and is never addressable by a later one, since

        the key carries the plan run ID. It is not deleted when the run ends; it expires with the

        workspace''s stored test artifacts, and sooner where a shorter rule applies.'
      operationId: getPlanRunBrowserStateUrls
      parameters:
      - name: plan_run_id
        in: path
        description: The ID of the plan run whose tests share the stored state
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: application_url
        in: query
        description: 'The URL the flow runs against. Its origin scopes the stored state, so two tests

          reaching different pages of the same site share one stored session.

          '
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: credentials_id
        in: query
        description: 'The credentials the calling test logs in with, when it has any. Part of the scope, so

          a test carrying one credential never loads a session established with another.

          '
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: The signed URLs for this plan run's stored browser state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactUrls'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::PlanRun
  /planRuns/{id}:
    get:
      tags:
      - PlanRun
      summary: Retrieve a plan run
      description: Used to retrieve an existing plan run
      operationId: getPlanRun
      parameters:
      - name: id
        in: path
        description: The ID of the plan run to retrieve
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: The plan run that was retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanRun'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::PlanRun
    delete:
      tags:
      - PlanRun
      summary: Delete plan run
      description: Used to delete an existing plan run
      operationId: removePlanRun
      parameters:
      - name: id
        in: path
        description: The ID of the plan run to update
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: The Plan Run was successfully removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanRun'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Delete::PlanRun
    patch:
      tags:
      - PlanRun
      summary: Update plan run
      description: Used to update an existing plan run
      operationId: updatePlanRun
      parameters:
      - name: id
        in: path
        description: The ID of the plan run to update
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: If-Match
        in: header
        description: If-Match header according to http/1.1 spec section 14.24
        required: false
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: The update to apply
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRun'
        required: true
      responses:
        '200':
          description: The Plan Run was successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanRun'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::PlanRun
  /planRun/{id}/terminate:
    post:
      tags:
      - PlanRun
      summary: Terminate plan run
      description: Used to terminate an ongoing plan run
      operationId: terminatePlanRun
      parameters:
      - name: id
        in: path
        description: The ID of the plan run to terminate
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: The plan run was successfully terminated
          content:
