        execution_runner_size:
          $ref: '#/components/schemas/ExecutionRunnerSizeEnum'
        test_recovery_agent_mode:
          description: Test Recovery Agent mode for this plan. An explicit value (off/fail_at_end/pass) overrides the workspace-level default for all runs of this plan. Use `inherit` to clear the override and fall back to the workspace default. Omitting the field on update leaves the stored value unchanged.
          allOf:
          - $ref: '#/components/schemas/TestRecoveryAgentModeEnum'
        trace_fidelity:
          description: How much Chrome trace data to capture for runs of this plan. Use `inherit` to fall back to the runtime default; it is also how you clear a previously stored value, since an update merges into what is persisted and a null therefore leaves the stored value alone. Omitting the field on update also leaves it unchanged. A rerun request can override it for one run.
          allOf:
          - $ref: '#/components/schemas/TraceFidelityEnum'
        trace_retention:
          description: Whether runs of this plan keep the Chrome trace file. Use `inherit` to fall back to the default, `discard`; it is also how you clear a previously stored value, since an update merges into what is persisted and a null therefore leaves the stored value alone. Omitting the field on update also leaves it unchanged. A rerun request can override it for one run.
          allOf:
          - $ref: '#/components/schemas/TraceRetentionEnum'
