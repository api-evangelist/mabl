          description: Device manufacturer (Apple, Google, Samsung)
        device_name:
          type: string
          description: Device display name (iPhone 14, Pixel 7 Pro)
        device_id:
          type: string
          description: Vendor unique device id (pixel_7_pro)
        screen_dimensions:
          $ref: '#/components/schemas/DeviceScreenDimensions'
        os_version:
          type: string
          description: OS version (16.6.1, Oreo, 12.0)
        retired:
          type: boolean
          description: The configuration is no longer supported for new runs. Retired configurations are still returned so that plans and tests already referencing them can be displayed, but they cannot be selected or executed.
          default: false
        android_configuration:
          $ref: '#/components/schemas/AndroidDeviceConfiguration'
      description: Represents a mobile device configuration (model, OS version) for executing mobile tests
      x-implements-interface:
      - HasId
      - HasCreatedActivity
    StaticScenarioSelection:
      required:
      - count
      - scenario_ids
      type: object
      properties:
        type:
          type: string
          enum:
          - static
        scenario_ids:
          type: array
          description: The selection scenario IDs
          items:
            type: string
        count:
          type: integer
          description: The estimated count of scenarios
      description: Static scenario selection parameter argument
    SourceControl:
      type: object
      properties:
        revision:
          type: string
          description: the primary source revision associated with this object
          x-mabl-scope: public
        revisions:
          type: array
          description: all source revision ids associated with this object
          items:
            type: string
          x-mabl-scope: public
        commit_username:
          type: string
          description: the username of the user who committed the revision associated with this object
        branch_name:
          type: string
          description: the branch associated with this object
        branches:
          type: array
          description: Related branches
          items:
            $ref: '#/components/schemas/SourceControlBranch'
          x-mabl-scope: public
        pull_request:
          $ref: '#/components/schemas/SourceControlPullRequest'
        pull_requests:
          type: array
          description: Related pull requests
          items:
            $ref: '#/components/schemas/SourceControlPullRequest'
          x-mabl-scope: public
        authors:
          type: array
          description: Related authors. Should be at least one
          items:
            $ref: '#/components/schemas/SourceControlAuthor'
          x-mabl-scope: public
        repository_url:
          type: string
          description: the url of the repository associated with this object
        repository_name:
          type: string
          description: the name of the repository associated with this object
        repository:
          $ref: '#/components/schemas/SourceControlRepository'
    PlanRunWebhookCompletionEvent:
      type: object
      properties:
        webhook_statuses:
          type: array
          description: array of webhook statuses associated with this event
          items:
            $ref: '#/components/schemas/PlanRunWebhookStatus'
        plan_run_status:
          type: string
          description: the status the plan should have after the web hooks complete (required for post-execution hooks); see PlanRun.status
      description: Event indicating that all webhooks associated with a plan run's current lifecycle status have completed
    GuardrailRefusal:
      type: object
      properties:
        id:
          type: string
          description: The id of the guardrail policy that decided the refusal.
        reason:
          type: string
          description: Why the policy refuses the request, written for the person the agent acts for.
        decision_id:
          type: string
          description: The id of this decision in the guardrail decision log.
        action:
          type: string
          description: The action the request was evaluated as, written Verb::Resource (for example Delete::Test), as declared by the operation's x-mabl-action extension.
        policy_source:
          type: string
          description: 'Who set the deciding policy: workspace for a rule the workspace''s owners wrote, account for a rule set for the workspace''s account, mabl_agent_type for the agent type''s ceiling, and mabl_default for mabl''s own defaults.'
        approval:
          description: The approval for this request; present when error_code is approval_required and the approval could be recorded. Without it the request cannot be approved.
          allOf:
          - $ref: '#/components/schemas/GuardrailApprovalRef'
      description: The guardrail policy that refused an agent request.
    RefreshAndRetryFailedStepModeEnum:
      type: string
      description: How a plan uses Runtime Recovery Refresh, which reloads the page and re-runs a failed browser step once. `pass` lets the test pass when the re-run passes. `fail_at_end` keeps running from the refreshed page but the step keeps its failure, so the test still fails. `off` never reloads.
      enum:
      - 'off'
      - fail_at_end
      - pass
    PlanRunSummaryFilterCondition:
      type: object
      description: Filter options for querying plan run summaries
      allOf:
      - $ref: '#/components/schemas/BaseFilterCondition'
      - type: object
        properties:
          column_name:
            type: string
            description: Column name to apply the constraint to
            enum:
            - status
            - plan_id
            - plan_name
            - created_time
            - environment_id
            - application_ids
    PlanRunWorkspaceTopFailingPlanEntry:
      required:
      - failed_run_count
      - plan_id
      type: object
      properties:
        plan_id:
          type: string
        plan_name:
          type: string
          description: Present when available on stored plan run
        failed_run_count:
          type: integer
          format: int64
      description: Plan with many failing plan runs within the sampled failed runs
    PlanRunRerunOptions:
      type: object
      properties:
        branch:
          maxLength: 200
          type: string
          description: The mabl branch the rerun's tests run from, in place of the original run's. It must exist in the plan run's workspace. Blank or master runs from master; omitted keeps the original run's branch. Each test runs its latest version on the branch, even where the plan pins a test version.
        test_ids:
          maxItems: 100
          minItems: 1
          type: array
          description: Rerun only these tests, by invariant id. Every stage keeps only the listed tests it contains. When combined with failedJourneysOnly or failedAndSkippedJourneys, a test must satisfy both.
          items:
            type: string
        keep_event_trigger:
          type: boolean
          description: 'Keep the rerun attached to the deployment event that triggered the original run, so the event''s plan runs include it. Only valid for a run a deployment event triggered. The rerun is still a manual run: it is not retried automatically and does not change the event''s status.'
          default: false
      description: Narrows or redirects a rerun of a plan run
    PlanRunSummaryQueryResult:
      type: object
      properties:
        plan_run_summaries:
          type: array
          description: All plan run summary objects that matched the query
          readOnly: true
          items:
            $ref: '#/components/schemas/PlanRunSummary'
        cursor:
          type: string
          description: Cursor used for pagination
          readOnly: true
      description: Result envelope for plan run summary query results
    PlanRunDuplicationRequest:
      required:
      - id
      - triggering_resource_type
      type: object
      properties:
        id:
          type: string
          description: The id of the plan run to duplicate
        target_runtime_version:
          type: string
          description: Target execution test runner image tag to execute
        triggering_resource_type:
          type: string
          description: Optional override for triggering resource type
          enum:
          - event
          - insight
          - runPolicyExecution
          - mabl_scheduler
          - microsoft_teams_webhook_integration
          - slack_integration
          - user
        triggered_by_id:
          type: string
          description: Optional override for the id of the triggering user
        test_recovery_agent_mode_override:
          $ref: '#/components/schemas/TestRecoveryAgentModeEnum'
        trace_fidelity_override:
          $ref: '#/components/schemas/TraceFidelityEnum'
        trace_retention_override:
          description: Whether every test run in this plan run keeps the Chrome trace file, overriding the plan's setting. `inherit` or null defers to the plan.
          allOf:
          - $ref: '#/components/schemas/TraceRetentionEnum'
        runtime_api_image:
          type: string
          description: Preview API image to use
      description: Configuration for duplicating a plan run
    BaseFilterCondition:
      required:
      - comparator
      type: object
      properties:
        comparator:
          $ref: '#/components/schemas/ComparatorEnum'
        numeric_value:
          type: integer
          description: Numeric value for comparison
          format: int64
          x-mabl-scope: public
        string_value:
          type: string
          description: String value for comparison
          x-mabl-scope: public
        string_values:
          type: array
          description: Array of string values for comparison (only 'in' comparator makes sense when array is used)
          items:
            type: string
          x-mabl-scope: public
    SourceControlRepositoryOwner:
      required:
      - html_url
      - id
      - name
      - owner_type
      type: object
      properties:
        id:
          type: string
          description: vendor unique repository id (immutable)
          x-mabl-scope: public
        name:
          type: string
          description: repository name unique within owner scope
          x-mabl-scope: public
        owner_type:
          type: string
          description: repository name unique within owner scope
          x-mabl-scope: public
        html_url:
          type: string
          description: HTML page url to view branch tree
          x-mabl-scope: public
        avatar_url:
          type: string
          description: owner avatar image URL
          x-mabl-scope: public
      description: the SCM repository associated with this object
    LocalizationOptions:
      type: object
      properties:
        locale:
          type: string
          description: The language locale identifier to run the test with, e.g. en-US, jp, etc.
        timezone_identifier:
          type: string
          description: The timezone identifier to run the test with, e.g. America/Los_Angeles, etc.
      description: Localization-related settings to apply on the browser in browser tests, e.g. timezone, locale. When not specified, cloud tests run with UTC timezone and default locale for the region of the cloud runs. Local runs use the timezone and locale of the machine running the test.
    PlanRunScripts:
      type: object
      properties:
        id:
          type: string
          description: id of the journey run
        journey_id:
          type: string
          description: id of the journey
        deployment:
          $ref: '#/components/schemas/Deployment'
        status:
          type: string
          description: The current status of this journey run; valid values are the same as those of the journey run status enum
        started_time:
          type: integer
          description: The time this jourey run was started
          format: int64
        completed_time:
          type: integer
          description: The time this journey run was completed
          format: int64
        terminated_by_id:
          type: string
          description: The ID of the user who terminated this journey run
        termination_reason:
          type: string
          description: Why this journey run was terminated, when it was
        status_cause:
          type: string
          description: Explains the current status, e.g. why a terminated run never executed
        browser_type:
          type: string
          description: The browser used during this journey run
        browser_version:
          type: string
          description: Specific version of the browser that was used during this journey run
        device_emulation:
          $ref: '#/components/schemas/DeviceEmulation'
        stage_index:
          minimum: 0
          type: integer
          description: Zero-indexed stage index for this journey run
          format: int32
          readOnly: true
        journey_run_index:
          minimum: 0
          type: integer
          description: Zero-indexed journey run index for this jorney run within its plan run
          format: int32
          readOnly: true
        retry_of_id:
          type: string
          description: On a plan run retry, the ID of the journey run from the retried plan run that this run re-runs
          readOnly: true
        run_multiplier_index:
          minimum: 0
          type: integer
          description: Zero-indexed run multiplier index for this journey run
          format: int32
          readOnly: true
        variable_row_id:
          type: string
          description: The ID of the data table row injected into this journey run, if any
          readOnly: true
        source_control_tag:
          type: string
          description: The source control tag associated with this journey run
    PlanRunExecutionStage:
      type: object
      properties:
        concurrency:
          type: string
          description: How journeys should be executed
          enum:
          - sequential
          - parallel
        always_run_stage:
          type: boolean
          description: if true this stage will always run regardless of whether previous stages have passed
        always_run_journeys:
          type: boolean
          description: if true all journeys within this stage will be run even if a preceding journey has failed
        concurrency_limit:
          type: integer
          description: The maximum number of concurrent test runs for this stage. Only used with parallel execution
          format: int32
        execution_stats:
          type: object
          properties:
            running:
              type: integer
              description: The number of running tests
              format: int32
            completed:
              type: integer
              description: The number of completed/successful tests
              format: int32
            terminated:
              type: integer
              description: The number of terminated tests
              format: int32
            failed:
              type: integer
              description: The number of failed tests
              format: int32
            total:
              type: integer
              description: The total number of tests
              format: int32
          description: Stage level execution stats
        stage_index:
          type: integer
          description: The index of this stage
          format: int32
      description: A single execution stage of a plan run
    Variable:
      type: object
      properties:
        name:
          type: string
          description: The variable name
          x-mabl-scope: public
        value:
          type: string
          description: The value associated with the variable defined in the "name" field
          x-mabl-scope: public
      x-mabl-scope: public
      x-implements-interface:
      - HasName
    HttpHeader:
      required:
      - name
      type: object
      properties:
        name:
          type: string
          description: The name of the header
          x-mabl-scope: public
        value:
          type: string
          description: The value of the header
          x-mabl-scope: public
        log_header_value:
          type: boolean
          description: Log the header value in the execution log, if not true only the header name is logged.
          x-mabl-scope: public
      description: An HTTP header
    DeviceScreenDimensions:
      required:
      - height
      - width
      type: object
      properties:
        height:
          type: integer
          description: Height (pixels)
          format: int32
          x-mabl-scope: public
        width:
          type: integer
          description: Width (pixels)
          format: int32
          x-mabl-scope: public
  responses:
    ErrorResponse403:
      description: User not authorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse401:
      description: User not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse404:
      description: Entity not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse400:
      description: Invalid or missing parameter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse:
      description: Unknown error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: apiKey
