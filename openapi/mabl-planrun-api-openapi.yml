        excluded_action_attributes:
          type: array
          description: Exclude action attributes during execution
          items:
            $ref: '#/components/schemas/ActionAttributeType'
        excluded_observers:
          type: array
          description: Exclude specific observers during execution
          items:
            type: string
        execution_stages:
          type: array
          description: Describes how journey should be executed
          items:
            $ref: '#/components/schemas/ExecutionStage'
        retry_on_failure:
          type: boolean
          description: If true, runs of this plan will automatically be retried if any journey run fails
        retry_failed_journeys_only:
          type: boolean
          description: If true, will only retry journeys that had failed journey runs
        refresh_and_retry_failed_step_mode:
          description: Runtime Recovery Refresh mode for runs of this plan; off when omitted.
          allOf:
          - $ref: '#/components/schemas/RefreshAndRetryFailedStepModeEnum'
        visual_change_baseline_overwrite:
          type: object
          properties:
