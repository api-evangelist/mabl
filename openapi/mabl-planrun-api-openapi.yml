          - cloud_nodejs_v2
        browser_runner_types:
          $ref: '#/components/schemas/PlanBrowserRunnerTypes'
        nodejs_runtime_variant:
          type: string
          description: Override the Node.js execution runtime variant, if v2 runtime in use
