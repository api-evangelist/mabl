openapi: 3.2.0
info:
  title: Link Mablnet API
  description: APIs for interacting with mabl services
  version: 0.599.3.1792436330
  x-readme-id: 62c896636916ce01d2ff4f5a
servers:
- url: /
security:
- basicAuth: []
- bearerAuth: []
tags:
- name: LinkMablnet
paths:
  /link/mablnet/peer-ca:
    get:
      tags:
      - LinkMablnet
      summary: Get the current mablnet peer-CA trust bundle for a link infrastructure cluster
      description: 'Returns the publisher-signed envelope carrying the X.509 root certificate(s) every mablnet client trusts as peer-CA roots when verifying mabl-side Host certs during the peer-to-peer QUIC TLS handshake. One bundle per link infrastructure cluster: the shared cluster''s unless `infrastructure_key` names a dedicated one, and the same bundle for every caller asking for that cluster. A dedicated cluster''s envelope carries its key in a signed `cluster` field, which a caller must check against the key it asked for; the shared cluster''s has none. Bundle bytes come from the cluster''s published trust bundle — the same anchors its Link Routers load on startup. More than one anchor may be present: a root rotation publishes the incoming anchor alongside the outgoing one, and callers should trust every certificate in the envelope.

        The anchors are **non-secret** — X.509 root certificates are public artefacts by definition; protection here is integrity, not confidentiality. Auth is required for attribution / rate-limiting / audit, not because the bytes are sensitive. Integrity is what the envelope provides, and it is the only thing that makes these anchors safe to fetch: a caller must verify the signature against a publisher key it already holds, and must not accept anchors from anywhere else in this response.

        Conditional refetch: callers send their last-known ETag as `If-None-Match` on each poll. The server returns `304 Not Modified` (no body) when the bundle is unchanged. The current ETag is mirrored in both the standard `ETag` header and the mabl-specific `x-mabl-entity-version` header (the latter survives upstream gzip-Vary stripping).'
      operationId: getMablnetPeerCa
      parameters:
      - name: infrastructure_key
        in: query
        description: 'Link infrastructure key of the cluster whose bundle to return, as reported by `link_infrastructure_key` on the Link Agent or `infrastructure_key` on a resolved tunnel. Omit it, or pass `mabl`, for the shared cluster.

          '
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: If-None-Match
        in: header
        description: Last ETag the caller observed; server returns 304 when current ETag matches.
        required: false
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Current bundle returned in body; current ETag in headers.
          headers:
            ETag:
              description: Content-derived version of the bundle (SHA-256 hex of the published envelope bytes).
              style: simple
              explode: false
              schema:
                type: string
            x-mabl-entity-version:
              description: Mirror of ETag; survives upstream gzip stripping.
              style: simple
              explode: false
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MablnetPeerCa'
        '304':
          description: Bundle unchanged since the supplied If-None-Match. Empty body; ETag headers still present.
          headers:
            ETag:
              style: simple
              explode: false
              schema:
                type: string
            x-mabl-entity-version:
              style: simple
              explode: false
              schema:
                type: string
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: 'No trust bundle is published for this deployment or cluster — the environment is not configured for mablnet, the cluster does not exist, or its bundle has not been written yet. Distinguish this from a mistyped path by the error body. Deliberately not a 5xx: the server is up and answering, and 503 is a status the proxies in front of the api own.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '429':
          description: 'Too many bundles for dedicated clusters this server has not loaded yet were requested at once. Retry after the `Retry-After` header; this does not mean the cluster has no bundle.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::Mablnet
  /link/mablnet/authorize/host:
    post:
      tags:
      - LinkMablnet
      summary: Authorize a mablnet Host to join a Link Label's tunnel
      description: 'Validates a `HostCredentials` blob presented by a mablnet client (Link Agent, execution Host, or future desktop-app Host) and returns the `tenantId` / `hostIdentity` / `validUntil` triple the mablnet protocol needs to admit the client. Internally called by Link Router on every carrier-join — see `mablnet-client-authorization.md in link/mablnet/docs` for the full design.

        Three caller types are accepted, all auth''d against the standard mabl-api chain: `link_agent` API keys (workspace-scoped Link Agent keys), `execution` API keys (workspace-scoped, TTL''d, minted per test run), or user OAuth tokens (workspace members with write permission, mabl support admins included). The request body''s `workspace_id` is cross-checked against the auth principal.

        Failure semantics: `401` for bad credential / malformed body / stale `issued_at` / replayed `nonce` / (link_agent callers only) `host_id` not matching any active Link Agent; `402` for billing-suspended or LINK feature disabled; `403` for auth principal not authorised on `workspace_id`; `404` for a workspace that does not exist; `5xx` for transient backend failures including Redis-unavailable (fail-closed on the nonce cache).'
      operationId: authorizeMablnetClient
      requestBody:
        description: HostCredentials blob the client presented at carrier-join
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkLabelAuthorizationRequest'
        required: true
      responses:
        '200':
          description: Authorization granted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkLabelAuthorizationResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '402':
          description: 'Credential is valid but the workspace is billing-suspended or the LINK feature is disabled — the customer-facing churn signal Link Tunnel uses today.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: The tunnel's workspace does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::Mablnet
  /link/mablnet/authorize/operator/tenant:
    post:
      tags:
      - LinkMablnet
      summary: Mint a tenant-scoped mablnet operator session (peer JOIN credential +…
      description: 'Issues two short-lived signed artifacts the calling user needs to drive a mablnet operator session against a specific customer workspace:

        1. A `peer_credential` — an Ed25519-signed blob the operator presents at JOIN time to be admitted as a peer in the customer''s tenant. The api''s `/authorize/host` endpoint recognises `role: "peer"` and validates the signature in lieu of an api_key check.

        2. An `operator_token` — an Ed25519-signed blob carried per-request in `OperatorCommand.token`. The customer Host''s `MablOperatorAuthorizer` validates the signature, checks the embedded `workspace_id` matches the Host''s own workspace, and verifies the requested capability''s required scope is in the granted scope list.

        Both artifacts bind to one customer workspace (the `workspace_id` request parameter) so a leaked credential cannot cross tenant boundaries. The mabl-deployment private key is held in Cloud KMS; the api never sees the bytes. For operating on the Router fleet itself (not a customer Host), use `/authorize/operator/fleet`.

        Auth: user-OAuth callers only — operator tokens are an interactive support / engineering capability, not a workspace-scoped API. Requires **both** the mabl support-admin claim **and** access to the tunnel, because the two answer different questions. Tunnel access — a user who can modify the workspace (owner, editor, or a support admin where the workspace has enabled Support Access), a company member for a company-owned tunnel, or the owner of a personal tunnel — is what `/authorize/peer` asks on its own, since minting a peer credential for test training is ordinary. The token minted here instead carries `drain:host`, carrier recycle/disconnect and fault injection, so consent gates the reach and the support-admin role gates the capability. The mabl global-admin claim administers mabl''s own resources and grants nothing here.

        Scope policy: every admitted caller gets the whole tenant scope catalog — every `read:*`, `probe:destination`, the `recycle:carrier` / `disconnect:carrier` / `drain:host` mutations, and the diagnostic + fault-injection `start:*` / `stop:*` activities. Reaching the tunnel is the access control; there is no tier behind it. Callers do not request scopes — the api decides.

        Lifetime: 30 minutes per issued session; callers re-fetch when needed.'
      operationId: authorizeMablnetOperatorTenant
      requestBody:
        description: Operator session parameters (the customer workspace to operate on).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MablnetOperatorSessionRequest'
        required: true
      responses:
        '200':
          description: Operator session minted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MablnetOperatorSessionResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          description: 'Caller is authenticated but is not authorized for the requested tunnel — not a mabl support admin, or the tunnel''s owner has not granted them access.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '404':
          description: The requested workspace does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::Mablnet
  /link/mablnet/authorize/operator/fleet:
    post:
      tags:
      - LinkMablnet
      summary: Mint a fleet-scoped mablnet operator session (peer JOIN credential +…
      description: 'Issues the same pair of short-lived signed artifacts as `/authorize/operator/tenant`, but for a **fleet** operator session — one that operates on the Link Router fleet itself (Router inventory, drain a Router) rather than a customer Host.

        Both artifacts bind to the fleet sentinel workspace (`mabl`) rather than a customer workspace. The `peer_credential` is recognised locally by a Router''s `OperatorTenantAuthenticator` (verified against the same KMS-held Ed25519 key, never resolved against a customer tunnel) and admits the operator to the Router''s operator tenant; the `operator_token` carries the fleet scope set and is validated by the Router''s `MablFleetOperatorAuthorizer`.

        Auth: user-OAuth callers who are mabl **global admins only**. Fleet operations act across customers, so the support-admin diagnostic tier admitted by the tenant endpoint is deliberately excluded here.

        Scope policy: global admins get the fleet scope set (`read:router-inventory`, `drain:router`, `write:log-level`). Callers do not request scopes — the api decides.

        Lifetime: 30 minutes per issued session; callers re-fetch when needed.'
      operationId: authorizeMablnetOperatorFleet
      requestBody:
        description: Fleet operator session parameters (audit label only; binds to the fleet sentinel workspace).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MablnetFleetOperatorSessionRequest'
        required: false
      responses:
        '200':
          description: Fleet operator session minted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MablnetOperatorSessionResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          description: 'Caller is authenticated but is not a mabl global admin.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::Mablnet
  /link/mablnet/authorize/peer:
    post:
      tags:
      - LinkMablnet
      summary: Mint a mablnet peer JOIN credential for an OAuth-authenticated user
      description: 'Issues a single short-lived signed `peer_credential` the calling user presents at JOIN time to be admitted as a peer in a customer tenant. Unlike `/authorize/operator/tenant`, no operator-command token is minted — callers using this endpoint dial the customer''s services (e.g., `socks5` for test training) as regular intra-tenant peers; no operator-interface capabilities are involved.

        Auth: user-OAuth callers entitled to the tunnel''s owner. For a workspace owner, a user with write access to the workspace — customer workspace members training against the workspace''s SOCKS5 service, and mabl support admins where the workspace has enabled Support Access. For a company owner, a company admin or any member of the company; there is no standalone mabl global / support admin grant, because no company-level consent flag exists yet to gate one. For a user owner, that user alone.

        Lifetime: 30 minutes per issued credential. To keep a longer session alive without changing the bound Host identity, refresh by re-minting with the prior credential''s `host_id`.'
      operationId: authorizeMablnetPeer
      requestBody:
        description: Peer credential parameters (the customer workspace to JOIN).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MablnetPeerCredentialRequest'
        required: true
      responses:
        '200':
          description: Peer credential minted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MablnetPeerCredentialResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::Mablnet
  /link/mablnet/artifacts/{artifact}/manifest:
    get:
      tags:
      - LinkMablnet
      summary: Resolve the current mablnet worker manifest for the calling Host's channel
      description: 'Returns the signed release manifest the calling Host should run, after applying the channel''s staged-rollout decision for this Host. The manifest body is an opaque, Ed25519-signed document (see `manifest-format.md in link/mablnet/docs`); the api stores and returns it without altering field *values*, so the consumer''s JCS re-canonicalisation still verifies — see `link/mablnet/docs/deployment/release-pipeline-api.md` § Opaque signed documents. Rollout resolution (which version this Host receives) is computed server-side from the per-channel rollout state plus a stable per-Host bucket — see § Manifest resolution.

        Conditional refetch: callers send their last-known ETag as `If-None-Match`; the server returns `304 Not Modified` (no body) when the resolved manifest is unchanged. The current ETag is mirrored in both the `ETag` header and the mabl-specific `x-mabl-entity-version` header.'
      operationId: getMablnetManifest
      parameters:
      - name: artifact
        in: path
        description: 'Release artifact the channel belongs to: `mablnet-host` (the worker binary) or `link-agent` (the Java Link Agent bundle). Channels are namespaced per artifact, so `stable` for one artifact is unrelated to `stable` for another.

          '
        required: true
        style: simple
        explode: false
        schema:
          pattern: '[A-Za-z0-9][A-Za-z0-9._-]{0,63}'
          type: string
      - name: channel
        in: query
        description: 'Release channel to resolve against, within the artifact. The well-known channels are `latest` (newest main build — dev/non-prod) and `stable` (tag-promoted release — prod); ephemeral per-branch channels named for the branch (sanitised to `[A-Za-z0-9._-]`, as the release workflows publish them) are also accepted, as is a major-version channel such as `3` for the Link Agent. An operator-declared channel alias (see `PUT /link/mablnet/artifacts/{artifact}/channels/{channel}/alias`) is followed transparently — e.g. a request for `dev` resolves to `latest` when that alias is set — so an older client sending a renamed channel keeps working.

          '
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: host_id
        in: query
        description: 'Stable per-Host identifier used to bucket this Host within the channel''s staged rollout. When omitted, the workspace id from the API key is used, which moves a whole workspace''s Hosts together. See design doc § Bucketing identity.

          '
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: workspace_id
        in: query
        description: 'Workspace owning the calling Host''s tunnel. With `label`, identifies the Link Label (tenant) whose operator-set `worker_release_override` is applied before the channel''s staged rollout — a tenant pin can redirect the channel and/or pin an exact version. The override is a worker pin and is consulted only for artifact `mablnet-host`; other artifacts follow the channel rollout regardless. Omit (or omit `label`) for callers with no tenant pin. See design doc § Per-tenant pin.

          '
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: label
        in: query
        description: 'Link Label (tunnel name) the calling Host belongs to. Paired with `workspace_id` to resolve the tenant whose `worker_release_override` is consulted.

          '
        required: false
        style: form
        explode: true
        schema:
          pattern: '[a-z0-9\-]{1,24}'
          type: string
      - name: If-None-Match
        in: header
        description: Last ETag the caller observed; server returns 304 when the resolved manifest is unchanged.
        required: false
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Resolved manifest in body; current ETag in headers.
          headers:
            ETag:
              description: Content-derived version of the resolved manifest.
              style: simple
              explode: false
              schema:
                type: string
            x-mabl-entity-version:
              description: Mirror of ETag; survives upstream gzip stripping.
              style: simple
              explode: false
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MablnetManifestEnvelope'
        '304':
          description: Resolved manifest unchanged since the supplied If-None-Match. Empty body; ETag headers still present.
          headers:
            ETag:
              style: simple
              explode: false
              schema:
                type: string
            x-mabl-entity-version:
              style: simple
              explode: false
              schema:
                type: string
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: 'No release is current for the requested channel, or this deployment publishes no mablnet worker distribution at all.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::Mablnet
  /link/mablnet/keystore:
    get:
      tags:
      - LinkMablnet
      summary: Get a mablnet publisher keystore document
      description: 'Returns the signed keystore document (publisher public keys) a supervisor uses to verify manifest signatures. Defaults to the latest keystore; pass `keystore_version` to fetch a specific one — a supervisor does this when a manifest''s `requiredKeystoreVersion` exceeds its local keystore version. Like the manifest, the body is an opaque Ed25519-signed document returned with field values preserved.

        Conditional refetch via `If-None-Match` / `ETag`, identical to the manifest endpoint.'
      operationId: getMablnetKeystore
      parameters:
      - name: keystore_version
        in: query
        description: Specific keystore version to fetch; the latest keystore is returned when omitted.
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
      - name: If-None-Match
        in: header
        description: Last ETag the caller observed; server returns 304 when the keystore is unchanged.
        required: false
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Keystore document in body; current ETag in headers.
          headers:
            ETag:
              style: simple
              explode: false
              schema:
                type: string
            x-mabl-entity-version:
              style: simple
              explode: false
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MablnetKeystoreEnvelope'
        '304':
          description: Keystore unchanged since the supplied If-None-Match. Empty body; ETag headers still present.
          headers:
            ETag:
              style: simple
              explode: false
              schema:
                type: string
            x-mabl-entity-version:
              style: simple
              explode: false
              schema:
                type: string
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: No keystore exists at the requested version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::Mablnet
  /link/mablnet/releases:
    post:
      tags:
      - LinkMablnet
      summary: Publish a new mablnet worker release (operator / release CI)
      description: 'Stores a signed release manifest and initialises the channel''s rollout. The request body is the signed manifest produced by the release pipeline (see `link/mablnet/docs/deployment/release-pipeline.md` § Aggregate job). The api derives `artifact`, `channel` and `version` from the manifest, stores the manifest verbatim, sets the channel''s `current_version` to the new version and `fallback_version` to the prior current, and applies the default staged rollout schedule (1% → 10% → 50% → 100% over 24h).

        Auth: a release-engineering identity, not an interactive customer. The publishing principal is CI rather than a user-OAuth admin, so the exact machine-auth shape is an open api-team decision — see design doc § Release-publisher auth.'
      operationId: publishMablnetRelease
      requestBody:
        description: The signed release manifest to publish.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MablnetManifestEnvelope'
        required: true
      responses:
        '200':
          description: Release stored; the resulting channel rollout state is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MablnetRolloutState'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '409':
          description: A release with this artifact + channel + version already exists (republish goes through PUT artifacts/{artifact}/channels/{channel}/current).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Create::Mablnet
  /link/mablnet/artifacts/{artifact}/releases/{version}/rollout:
    get:
      tags:
      - LinkMablnet
      summary: Inspect a channel's rollout state (operator)
      description: Returns the current rollout state for the channel the given `version` belongs to. Rollout state is keyed by channel, so `channel` is a required query parameter that disambiguates which channel's state to read. Operator-only.
      operationId: getMablnetRollout
      parameters:
      - name: artifact
        in: path
        description: 'Release artifact the channel belongs to: `mablnet-host` (the worker binary) or `link-agent` (the Java Link Agent bundle). Channels are namespaced per artifact, so `stable` for one artifact is unrelated to `stable` for another.

          '
        required: true
        style: simple
        explode: false
        schema:
          pattern: '[A-Za-z0-9][A-Za-z0-9._-]{0,63}'
          type: string
      - name: version
        in: path
        description: Release version whose channel rollout is being inspected.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: channel
        in: query
        description: Channel the version belongs to (rollout state is keyed by channel).
        required: true
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Current rollout state for the channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MablnetRolloutState'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: No rollout state exists for the requested channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::Mablnet
    patch:
      tags:
      - LinkMablnet
      summary: Modify a channel's rollout — pause / resume / force-advance (operator)
      description: 'Adjusts the in-flight rollout for the channel the given `version` belongs to: pause or resume the staged schedule, or force the rolled-out percentage to an explicit value (overriding the time-based schedule). Operator-only. See design doc § Operator commands.'
      operationId: patchMablnetRollout
      parameters:
      - name: artifact
        in: path
        description: 'Release artifact the channel belongs to: `mablnet-host` (the worker binary) or `link-agent` (the Java Link Agent bundle). Channels are namespaced per artifact, so `stable` for one artifact is unrelated to `stable` for another.

          '
        required: true
        style: simple
        explode: false
        schema:
          pattern: '[A-Za-z0-9][A-Za-z0-9._-]{0,63}'
          type: string
      - name: version
        in: path
        description: Release version whose channel rollout is being modified.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: channel
        in: query
        description: Channel the version belongs to (rollout state is keyed by channel).
        required: true
        style: form
        explode: true
        schema:
          type: string
      requestBody:
        description: The rollout adjustment to apply.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MablnetRolloutUpdate'
        required: true
      responses:
        '200':
          description: Updated rollout state for the channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MablnetRolloutState'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: No rollout state exists for the requested channel.
          content:
            application/json:
              schema:
