  /link/mablnet/tunnels/resolve:
    get:
      tags:
      - LinkMablnet
      summary: Resolve the mablnet tunnel target for an owner + label
      description: 'Resolves which mablnet tunnel to reach for a given `label`, and where (the mablnet WSS Router endpoint + whether a live agent is serving it). Two modes:

        **Run resolution (default, `owner_type` omitted).** The cloud-test-run path: a test executor knows the run''s `workspace_id` and the configured label but not the tunnel''s owner. A company-owned tunnel `(company, label)` with a live agent wins, so standing up a company tunnel under a workspace tunnel''s label moves that workspace onto it with no environment change, and stopping the company agent moves it back. Otherwise a workspace-owned tunnel `(workspace_id, label)` is returned, live or not (so the caller fails the run rather than silently routing elsewhere); otherwise the company tunnel with no live agent, if one exists. `404` when neither exists. A workspace that needs its own tunnel must use a label its company does not also use. (Company tunnels carry no `workspace_id`, so the workspace agent listing cannot find them — this is why the endpoint encapsulates the resolution.)

        **Owner-aware (`owner_type` set).** Resolves the tunnel for an explicit owner — used by user-facing tooling (`mabl link-agents test …`) to reach a `user` (personal) or an explicit `company` tunnel. `owner_id` is required for `company`/`workspace`; for `user` it must be the caller''s own id (a personal tunnel is private to its owner). Authorized like `POST /link/mablnet/authorize/peer`: a `user` owner only by that user, a `company` owner by a company admin/member, a `workspace` owner by a user who can modify it. `404` when no such tunnel exists.

        `has_live_agent` reports whether a `ready` Link Agent advertising `mablnet_wss` has heartbeated within the liveness window for the resolved owner — the caller''s pre-run "is this tunnel serviceable" gate, mirroring the legacy Link Server check.'
      operationId: resolveMablnetTunnel
      parameters:
      - name: workspace_id
        in: query
        description: 'Run-resolution mode (`owner_type` omitted): the run''s workspace, from which its company is derived. Required in this mode; ignored when `owner_type` is set.

          '
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: label
        in: query
        description: Tunnel (Link Label) configured on the run's environment.
        required: true
        style: form
        explode: true
        schema:
          pattern: '[a-z0-9\-]{1,24}'
          type: string
      - name: owner_type
        in: query
        description: 'Owner-aware mode: the kind of owner to resolve the tunnel for. Omit for the default run resolution.

          '
        required: false
        style: form
        explode: true
        schema:
          $ref: '#/components/schemas/LinkTunnelOwnerType'
      - name: owner_id
        in: query
        description: 'Owner-aware mode: the owner''s id. Required when `owner_type` is `company` or `workspace`; for `user` it must be the caller''s own user id (a personal tunnel is private to its owner).

          '
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: The resolved tunnel target.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MablnetTunnelTarget'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: 'No resolvable mablnet tunnel for that workspace + label — either no tunnel (workspace- or company-owned) exists, or the owner''s cluster publishes no carrier endpoint. Both answer 404 deliberately: a status that distinguished them would tell an unauthorized caller which labels exist.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::Mablnet
  /link/mablnet/infrastructure-keys:
    get:
      tags:
      - LinkMablnet
      summary: List the link infrastructure keys in use
      description: 'Operator-only: every dedicated link infrastructure key currently assigned to a company (`Company.link_infrastructure_key`), plus the shared cluster''s key (`mabl`), each with its derived carrier FQDNs and holder company ids. Fleet tooling (mops) fans cluster-scoped operations out over this list, and the decommission runbook verifies a key has zero holders before removing its terraform `clusters` entry. See dedicated-link-infra.md in link/mablnet/docs.'
      operationId: getMablnetInfrastructureKeys
