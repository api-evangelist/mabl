openapi: 3.2.0
info:
  title: mabl Test Run API
  description: APIs for interacting with mabl services
  version: 0.599.3.1792436330
  x-readme-id: 62c896636916ce01d2ff4f5a
servers:
- url: /
security:
- basicAuth: []
- bearerAuth: []
tags:
- name: Test Run
paths:
  /journeyRuns/planRun/{plan_run_id}:
    get:
      tags:
      - Test Run
      summary: Query test runs
      description: Used to query test runs by plan run
      operationId: queryTestRunsByPlanRun
      parameters:
      - name: plan_run_id
        in: path
        description: The ID of the plan run to query by
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: status
        in: query
        description: A test run status to filter by
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: limit
        in: query
        description: The page size (default 1000, max 1000; clamped to 50 when include_variables is true); follow the returned cursor for more
        required: false
        style: form
        explode: true
        schema:
          maximum: 1000
          minimum: 1
          type: integer
          format: int32
          default: 1000
      - name: cursor
        in: query
        description: The cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: include_variables
        in: query
        description: When true, include imported and exported variables and their sources on each test run, and clamp the page size to 50. They are omitted by default because they can be very large; an omitted page never decodes them from storage.
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Array of test scripts matching the query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRunQueryResult'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::TestRun
  /testRuns/{test_run_id}/liveTestOutput/grantAccess:
    put:
      tags:
      - Test Run
      summary: Grant access to live test output, if user has relevant access
      description: 'Signals that the user will start viewing live test output for the given test run.

        Evaluates access permissions and, if permitted, writes an access control key to Firebase

        which triggers on-demand log replay by the test runner. Returns 401/403/404 if access is denied.'
      operationId: grantUserLiveTestOutputAccess
      parameters:
      - name: test_run_id
        in: path
        description: Test run ID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '204':
          description: Access granted
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::TestRun
  /testRuns/{test_run_id}/artifactUrl:
    get:
      tags:
      - Test Run
      summary: Get a signed URL for one of a test run's own artifacts
      description: 'Returns a short-lived signed URL for a single artifact belonging to this test run,

        identified by a key relative to the run''s workspace bucket.


        The workspace, and therefore the bucket, is derived server-side from the test run.

        The caller never supplies or learns a bucket name, and `object_key` is required to

        fall within this run''s own artifact prefix, so the endpoint cannot be used to reach

        an unrelated object even inside the same workspace. This is the run-scoped

        counterpart to `getArtifactUrl`, which instead parses the workspace out of a

        client-supplied absolute path.'
      operationId: getTestRunArtifactUrl
      parameters:
      - name: test_run_id
        in: path
        description: The ID of the test run that produced the artifact
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: object_key
        in: query
        description: 'The artifact''s key relative to the workspace bucket, as recorded on the run''s

          output — for example

          `execution-output/abcd/downloads/<test_run_id>/<nonce>/report.csv`.

          Must resolve within this run''s artifact prefix.

          '
        required: true
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: The signed URL for the requested artifact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedArtifactUrl'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::Artifact
  /testRuns/{test_run_id}/failureReason:
    delete:
      tags:
      - Test Run
      summary: Remove failure reason from a test run
      description: Remove a failure reason from an existing test run
      operationId: removeTestRunFailureReason
      parameters:
      - name: test_run_id
        in: path
        description: The ID of the test run to update
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: If-Match
        in: header
        description: If-Match header according to http/1.1 spec section 14.24
        required: false
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: The test run failure reason was successfully removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRun'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Test run not found for specified identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Delete::TestRun
    patch:
      tags:
      - Test Run
      summary: Update failure reason for a test run
      description: Updates the failure reason for a test run. If a failure reason does not yet exist, it will be created.
      operationId: updateTestRunFailureReason
      parameters:
      - name: test_run_id
        in: path
        description: The ID of the test run to update
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: If-Match
        in: header
        description: If-Match header according to http/1.1 spec section 14.24
        required: false
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: Detailed information about the test run failure
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailureCategorization'
        required: true
      responses:
        '200':
          description: The test run failure reason was successfully created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRun'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::TestRun
  /journeyRuns/workspace/{workspace_id}/aggregate:
    get:
      tags:
      - Test Run
      summary: Aggregate test run counts for a workspace (fast Spanner aggregation)
      description: 'Returns total test runs, counts grouped by status, and the top failing

        tests in the workspace. Optional filters: environment_id, application_id,

        start_time range. Mirrors aggregateWorkspacePlanRuns at the test-run

        level.'
      operationId: aggregateWorkspaceTestRuns
      parameters:
      - name: workspace_id
        in: path
        description: The workspace (organization) id
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: environment_id
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: application_id
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: min_start_time
        in: query
        description: Inclusive lower bound on start_time (epoch ms)
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int64
      - name: max_start_time
        in: query
        description: Inclusive upper bound on start_time (epoch ms)
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int64
      - name: top_tests_limit
        in: query
        description: Max top failing tests to return. Default 10, max 50. 0 skips the top-tests query entirely.
        required: false
        style: form
        explode: true
        schema:
          maximum: 50
          minimum: 0
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: Aggregated workspace test run statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRunWorkspaceAggregateResult'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::TestRun
  /journeyRuns/workspace/{workspace_id}/aggregate/daily:
    get:
      tags:
      - Test Run
      summary: Exact per-day test run counts for a workspace (fast Spanner aggregation)
      description: Returns exact passed/failed/total test run counts per calendar day for a workspace window, computed by one Spanner query. Ordered oldest first; only days with runs are included.
      operationId: aggregateWorkspaceTestRunsByDay
      parameters:
      - name: workspace_id
        in: path
        description: The workspace (organization) id
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: environment_id
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: application_id
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: min_start_time
        in: query
        description: Inclusive lower bound on start_time (epoch ms)
        required: true
        style: form
        explode: true
        schema:
          type: integer
          format: int64
      - name: max_start_time
        in: query
        description: Inclusive upper bound on start_time (epoch ms)
        required: true
        style: form
        explode: true
        schema:
          type: integer
          format: int64
      - name: day_offset_minutes
        in: query
        description: Minutes subtracted from start_time before bucketing into a UTC calendar day, for aligning day boundaries to a non-UTC offset. Negative for UTC+ zones.
        required: false
        style: form
        explode: true
        schema:
          maximum: 720
          minimum: -720
          type: integer
          format: int32
          default: 0
      responses:
        '200':
          description: Exact per-day workspace test run counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDailyRunCounts'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::TestRun
  /journeyRuns/workspace/{workspace_id}:
    get:
      tags:
      - Test Run
      summary: Retrieve test runs for a workspace
      description: Used to retrieve all test runs for a workspace
      operationId: queryTestRunsByWorkspace
      parameters:
      - name: workspace_id
        in: path
        description: The workspace ID to filter by
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: status
        in: query
        description: A test run status to filter by
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: limit
        in: query
        description: The limit to use for pagination
        required: false
        style: form
        explode: true
        schema:
          minimum: 1
          type: integer
          format: int32
      - name: cursor
        in: query
        description: The cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Array of test scripts matching the query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRunQueryResult'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::TestRun
  /journeyRuns/virtualMachine/{virtual_machine_id}/{virtual_machine_name}:
    get:
      tags:
      - Test Run
      summary: Fetch latest Test Run for given Virtual Machine
      description: Fetch latest Test Run for a given virtual machine id/name
      operationId: queryLatestTestRunByVmIdAndName
      parameters:
      - name: virtual_machine_id
        in: path
        description: Virtual machine id
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: virtual_machine_name
        in: path
        description: Virtual machine name
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Array of test scripts matching the query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRun'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: No match found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::TestRun
  /journeyRuns/workspace/{workspace_id}/querySummarys:
    post:
      tags:
      - Test Run
      summary: Retrieve test run summaries for a workspace
      description: Used to query test run summaries for a workspace
      operationId: queryTestRunSummaryByWorkspace
      parameters:
      - name: workspace_id
        in: path
        description: The workspace ID to filter by
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: The organization invitation to create and send
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestRunSummaryFilterOptions'
        required: true
      responses:
        '200':
          description: Array of test scripts matching the query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRunSummaryQueryResult'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::TestRun
  /testRuns/workspace/{workspace_id}/byTest:
    get:
      tags:
      - Test Run
      summary: Retrieve last 10 test runs for each test in a workspace
      description: Used to retrieve last n test runs for each test in a workspace
      operationId: queryRecentTestRunsByTestAndWorkspace
      parameters:
      - name: workspace_id
        in: path
        description: The workspace ID to filter by
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: maxRunsPerTest
        in: query
        description: Max number of runs per test
        required: true
        style: form
        explode: true
        schema:
          maximum: 50
          minimum: 1
          type: integer
          format: int32
      - name: limit
        in: query
        description: The limit to use for pagination
        required: false
        style: form
        explode: true
        schema:
          minimum: 1
          type: integer
          format: int32
          default: 50
      - name: cursor
        in: query
        description: The cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: History of test runs by tests in the specified workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestHistoryQueryResult'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::TestRun
  /testRuns/workspace/{workspace_id}/byTestIds:
    post:
      tags:
      - Test Run
      summary: Retrieve last n test runs for each of the specified tests
      description: 'Retrieve the last n test runs for each test in the provided list of test

        invariant ids within a workspace. Test ids that do not belong to the

        workspace are omitted from the response. Scoped to a single page of the

        Tests list so the client does not have to fetch the whole workspace.'
      operationId: queryRecentTestRunsByTestIds
      parameters:
      - name: workspace_id
        in: path
        description: The workspace ID the tests belong to
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecentTestRunsByTestIdsRequest'
        required: true
      responses:
        '200':
          description: History of test runs for the specified tests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestHistoryQueryResult'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::TestRun
  /journeyRuns/journey/{journey_id}/byPlan:
    get:
      tags:
      - Test Run
      summary: Retrieve last 10 test runs of a test for each plan the test is in
      description: Used to retrieve last n test runs for each test-plan combination
      operationId: queryRecentTestRunsByTestAndPlan
      parameters:
      - name: journey_id
        in: path
        description: The Test ID to retrieve runs for
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: maxRunsPerJourney
        in: query
        description: Max number of runs per test
        required: true
        style: form
        explode: true
        schema:
          maximum: 50
          minimum: 1
          type: integer
          format: int32
      responses:
        '200':
          description: History for journeys in the specified workspace
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TestPlanHistory'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::TestRun
  /journeyRuns/{id}/duplicate:
    post:
      tags:
      - Test Run
      summary: Duplicate a test run
      description: Creates and schedules a run copied from an existing test run.
      operationId: duplicateTestRun
      parameters:
      - name: id
        in: path
        description: id of test to re-run
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: Configuration for duplicating a test run
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestRunDuplicationRequest'
        required: true
      responses:
        '201':
          description: The test run that was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanRun'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Test run not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Run::TestRun
  /journeyRuns/{id}/reschedule:
    post:
      tags:
      - Test Run
      summary: Sends a message to stop the current execution of the test run and send another…
      description: Sends a message to terminate the test run, and if the attempt count number is not over the limit, sends another message to schedule execution of the test run and updates the attempt count of the existing run.
      operationId: reschedule
      parameters:
      - name: id
        in: path
        description: id of test to schedule execution of a second time
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: The reschedule attempt was received and a termination message was sent, but a scheduling message was not sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRunRescheduleResponse'
        '201':
          description: The reschedule attempt was allowed and both a termination and another scheduling message were sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRunRescheduleResponse'
        '404':
          description: Test run not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Run::TestRun
  /journeyRuns/journey/{journey_id}:
    get:
      tags:
      - Test Run
      summary: Retrieve last 50 test runs of a test
      description: Used to retrieve last n test runs
      operationId: queryRecentTestRunsByTest
      parameters:
      - name: journey_id
        in: path
        description: The Test ID to retrieve runs for
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: limit
        in: query
        description: The limit to use for pagination
        required: false
        style: form
        explode: true
        schema:
          minimum: 1
          type: integer
          format: int32
          default: 50
      - name: cursor
        in: query
        description: The cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Array of test scripts matching the query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRunQueryResult'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::TestRun
  /journeyRuns/plan/{plan_id}/journey/{journey_id}:
    get:
      tags:
      - Test Run
      summary: Retrieve test runs by plan and test
      description: Used to retrieve all test runs for a plan and test with a given status
      operationId: queryTestRunsByPlanAndTest
      parameters:
      - name: plan_id
        in: path
        description: The plan ID to filter by
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: journey_id
        in: path
        description: The test ID to filter by
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: status
        in: query
        description: A test run status to filter by
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: limit
        in: query
        description: The limit to use for pagination
        required: false
        style: form
        explode: true
        schema:
          minimum: 1
          type: integer
          format: int32
      - name: cursor
        in: query
        description: The cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Array of test scripts matching the query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRunQueryResult'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::TestRun
  /journeyRuns:
    post:
      tags:
      - Test Run
      summary: (Deprecated, needs to be replaced in tests) Creates a test run
      description: Creates a Test Run
      operationId: createTestRunForInternalTesting
      requestBody:
        description: The test run to create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestRun'
        required: true
      responses:
        '201':
          description: Created Test Run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRun'
        '400':
          description: Invalid test run was supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Run::TestRun
  /testRun/external:
    post:
