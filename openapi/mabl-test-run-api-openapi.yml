    IterationConfiguration:
      type: object
      properties:
        iteration_type:
          type: string
          description: The type of iteration
          enum:
          - fixed
          - variable
          - list
          - elements
          - variable_array
          - condition
          - none
        iteration_value:
          type: string
          description: A number, the name of the variable containing the number, a range of values to iterate over, a CSS query whose matching elements are iterated over (one iteration per matched element when iteration_type is elements), or the name of a variable whose array value is iterated over (one iteration per array element when iteration_type is variable_array; a non-array value iterates once). Not used when iteration_type is condition, which carries its condition in iteration_condition instead.
        iteration_condition:
          description: 'Required when iteration_type is condition. A single step in the json_steps format, keyed If, in the same shape a conditional step group uses - for example {"If": {"target": {...}, "condition": {...}, "actionCode": "conditional_if"}}. It is evaluated before each iteration and the loop runs for as long as it holds, so a condition that is false to begin with runs the flow zero times. See iteration_limit for what happens when the loop hits its cap.'
          x-dao-serialize: true
        iteration_count_variable:
          type: string
          description: Optional variable name (elements iteration only). When set, the number of elements the loop iterated over is written to a variable with this name once the loop completes, so later steps can reference it.
        iteration_limit:
          type: integer
          description: Optional maximum number of iterations (elements, variable_array, and condition iteration only). When set, the loop runs at most this many iterations even if more elements match or the array is longer. Capped at the system maximum of 500. Elements and variable_array loops stop quietly on reaching it; a condition loop whose condition still holds at the cap fails the step.
        prefetch:
          type: boolean
          description: Optional (elements iteration only). When true, the loop counts all matching elements once at the start and iterates by index, which is navigation-safe; use it when the loop body navigates away from or reloads the page (for example clicking each matching row to open a detail page and then returning). When false or unset, the loop marks the matched DOM elements and revisits them each iteration, which is faster but breaks if the page changes between iterations.
      description: Configuration for iterations on a flow
    GuardrailApprovalState:
      type: string
      description: Where a guardrail approval stands. PENDING awaits a decision and expires undecided after 24 hours; APPROVED lets the agent repeat the request, as often as it does, for 20 minutes; DENIED refuses the same request for 20 minutes after the decision, after which asking again opens a new approval; CANCELLED means a person withdrew it while pending or revoked it while approved. EXPIRED and CANCELLED are final.
      enum:
      - PENDING
      - APPROVED
      - DENIED
      - EXPIRED
      - CANCELLED
