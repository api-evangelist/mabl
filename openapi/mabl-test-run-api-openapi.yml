          description: Overrides the link_bypass_mabl_proxy in the associated environment (mabl link only)
        use_personal_link_agent:
          type: boolean
          description: 'Route this run''s test traffic through the triggering user''s own personal Link 3.0 tunnels (tunnels whose egress is that user''s machine) instead of the environment''s configured Link tunnels: when any personal tunnel is used, it is the run''s only Link path. The owner is the user who triggers the run, resolved server-side — there is no id to pass. By default the run stripes across every live personal tunnel the user has (e.g. one per machine); set personal_link_tunnel_label to pin it to one. When no personal tunnel can be used (no triggering user, personal tunnels are off for the workspace, or no live personal Link Agent), the run proceeds over its normal network path rather than failing.

            '
        personal_link_tunnel_label:
          type: string
          description: 'Restrict use_personal_link_agent to a single personal tunnel by its Link label (the tunnel-safe machine hostname the user''s `link-agents start --personal` registers under), instead of striping across all of the user''s live personal tunnels. Ignored when use_personal_link_agent is not set.

            '
        source_control_tag_target:
          type: string
          description: Overrides the source_control_tag_target in the associated environment
        mobile_app_file_id:
          type: string
          description: Identifier of mobile app file for this deployment (empty for web_application and api deployment types)
