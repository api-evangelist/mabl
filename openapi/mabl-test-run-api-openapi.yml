      - inherit
    FileValue:
      required:
      - mime_type
      - name
      - origin
      - size
      type: object
      properties:
        origin:
          type: string
          description: 'Provenance of the file. `upload` is a durable, reusable FileUpload (see file_upload_id). `download` is a transient file produced by a test run (see download_ref).

            '
          enum:
          - upload
          - download
        name:
          type: string
          description: the base file name
        mime_type:
          type: string
          description: the true MIME type (e.g. application/pdf), not a file extension
        size:
          type: integer
          description: the size of the file in bytes
          format: int64
        checksum:
          type: string
          description: optional content checksum
        file_upload_id:
          type: string
          description: 'Set when origin == upload; the id of a durable FileUpload (FileUpload.id). This is how a persisted or authored file variable references its file.

            '
        download_ref:
          description: Set when origin == download; run-scoped coordinates for a file downloaded during a test run.
          allOf:
          - $ref: '#/components/schemas/FileDownloadReference'
      description: 'A typed file value for a file-typed variable, reconciling field-for-field with the runtime FileValue (mabl-cli mablscript-find). `origin` selects which reference is populated: `upload` uses file_upload_id, `download` uses download_ref. This one-of invariant is NOT enforced by the schema (a oneOf/discriminator would make the generated Java/TS clients polymorphic and diverge from the flat runtime FileValue); it must be enforced by validation on the Flow/Test write path, tracked in MABL-20387, before file variables are consumed (first reader: MABL-20718). Until then a malformed file_value is accepted but unused. The run-local localUri from the runtime shape is intentionally omitted (ephemeral, never persisted).

        '
