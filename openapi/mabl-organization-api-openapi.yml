          type: array
          items:
            $ref: '#/components/schemas/UserRole'
          x-mabl-scope: public
    WorkspaceLinkAccessConfig:
      description: 'A workspace''s consent flags: everything an owner of either kind carries, plus enable_personal_tunnels, which only a workspace has.

        '
      allOf:
      - $ref: '#/components/schemas/LinkAccessConfig'
      - type: object
        properties:
          enable_personal_tunnels:
            type: boolean
            description: 'When true, members of this workspace may start personal tunnels, and this workspace may route cloud test traffic to one. A user may start a personal tunnel if any workspace they belong to allows it, since no single workspace owns it; but only a workspace that allows them may send its runs through one.

              '
    WorkspaceSupportAccessEnabledResponse:
      required:
