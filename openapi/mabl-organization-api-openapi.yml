      type: object
      properties:
        enable_support_access:
          type: boolean
          description: Enables support access to workspace
    WorkspaceLinkAccessConfigUpdate:
      description: 'Consent changes for a workspace, applied by PATCH. Adds the workspace-only flag to the set both owner kinds share.

        '
      allOf:
      - $ref: '#/components/schemas/LinkAccessConfigUpdate'
