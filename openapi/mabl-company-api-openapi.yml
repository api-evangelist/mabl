openapi: 3.2.0
info:
  title: mabl Company API
  description: APIs for interacting with mabl services
  version: 0.599.3.1792436330
  x-readme-id: 62c896636916ce01d2ff4f5a
servers:
- url: /
security:
- basicAuth: []
- bearerAuth: []
tags:
- name: Company
paths:
  /user-company-roles/{id}:
    get:
      tags:
      - Company
      summary: Get User's Company Roles
      description: Used to get all of a user's company roles
      operationId: getUserCompanyRoles
      parameters:
      - name: id
        in: path
        description: The ID of the user whose company roles should be retrieved
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: The complete list of company roles for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCompanyRoles'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::User
    patch:
      tags:
      - Company
      summary: Update User's Company Roles
      description: Used to modify company roles for a user
      operationId: updateUserCompanyRoles
      parameters:
      - name: id
        in: path
        description: The user ID to update
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: If-Match
        in: header
        description: If-Match header according to http/1.1 spec section 14.24. Allows for enforced atomic updates, to prevent update collisions
        required: false
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: The user roles to update
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCompanyRoleUpdate'
        required: true
      responses:
        '200':
          description: The complete list of roles after applying this update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCompanyRoles'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::User
  /companies:
    get:
      tags:
      - Company
      summary: Query Companies
      description: Used to query companies
      operationId: queryCompanies
      parameters:
      - name: limit
        in: query
        description: The limit to use for pagination
        required: false
        style: form
        explode: true
        schema:
          minimum: 1
          type: integer
          format: int32
      - name: cursor
        in: query
        description: The cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Results of the query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyQueryResult'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::Company
    post:
      tags:
      - Company
      summary: Create Company
      description: Used to create new Companies
      operationId: createCompany
      requestBody:
        description: The company to create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyUpdateRequest'
        required: true
      responses:
        '201':
          description: The company that was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Create::Company
  /companies/{id}:
    get:
      tags:
      - Company
      summary: get company details
      description: Get the details for a given company
      operationId: getCompany
      parameters:
      - name: id
        in: path
        description: The id of the company to retrieve
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Company found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Company not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::Company
    delete:
      tags:
      - Company
      summary: Remove Company
      description: Removes an company and associated workspaces
      operationId: removeCompany
      parameters:
      - name: id
        in: path
        description: The ID of the company to remove
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '204':
          description: The company that was removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Company not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Delete::Company
    patch:
      tags:
      - Company
      summary: update company object
      description: Update the company object
      operationId: updateCompany
      parameters:
      - name: id
        in: path
        description: The id of the company to update
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: The company update to apply
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyUpdateRequest'
        required: true
      responses:
        '200':
          description: Company updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Company not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::Company
  /companies/{id}/sessionTimeout:
    patch:
      tags:
      - Company
      summary: Update session timeout for a company
      description: Update the session timeout for a company
      operationId: updateCompanySessionTimeout
      parameters:
      - name: id
        in: path
        description: The ID of the company to update its session timeout
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: The session timeout update to apply
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanySessionTimeoutUpdateRequest'
        required: true
      responses:
        '200':
          description: Company session timeout updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Company not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::Company
  /companies/{id}/linkAccess:
    patch:
      tags:
      - Company
      summary: Update the company's Link tunnel access consent settings
      description: Set which callers may reach a Link (mablnet) tunnel owned by this company. Only settings present in the request are applied; omitted ones keep their current value, and an absent setting has always meant not consented. Available only to a company owner — deliberately not to global admins, api keys, or an owner of some member workspace, since a company tunnel is shared across workspaces and this is the company's consent to give. Returns the updated company.
      operationId: updateCompanyLinkAccess
      parameters:
      - name: id
        in: path
        description: The ID of the company
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: The consent settings to change
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkAccessConfigUpdate'
        required: true
      responses:
        '200':
          description: The updated company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Company not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::Company
  /companies/{id}/executionLocationPin:
    put:
      tags:
      - Company
      summary: Pin where the company's test runs execute
      description: Pins the cloud and region that test runs of this company execute in. A pin on a workspace wins over one on its account, which wins over one on its company. A run whose test type does not execute in the pinned location runs in the default one. Only mabl can set it (global companies write scope or mabl global admin).
      operationId: setCompanyExecutionLocationPin
      parameters:
      - name: id
        in: path
        description: The ID of the company
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: The location to pin
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionLocation'
        required: true
      responses:
        '200':
          description: The updated company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Company not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::Company
    delete:
      tags:
      - Company
      summary: Remove the company's execution location pin
      description: Removes the company's pin, so its test runs follow the next pin up, or the default location. Same authorization as setting it.
      operationId: clearCompanyExecutionLocationPin
      parameters:
      - name: id
        in: path
        description: The ID of the company
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '204':
          description: The pin was removed, or there was none
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Company not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::Company
  /companies/{id}/linkInfrastructureKey:
    put:
      tags:
      - Company
      summary: Assign the company's dedicated Link infrastructure key
      description: Pin the company's Link (mablnet) tunnels to a dedicated infrastructure cluster. The key must be unique across companies unless `allow_shared` is set. Operator-only (global company write scope or mabl global admin). Takes effect within the endpoint resolver's cache TTL plus each agent's next poll.
      operationId: setCompanyLinkInfrastructureKey
      parameters:
      - name: id
        in: path
        description: The ID of the company
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: The key assignment to apply
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyLinkInfrastructureKeyUpdateRequest'
        required: true
      responses:
        '200':
          description: The updated company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Company not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '409':
          description: Key already held by another company and allow_shared not set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::Company
    delete:
      tags:
      - Company
      summary: Clear the company's dedicated Link infrastructure key
      description: Revert the company's Link (mablnet) tunnels to the shared multi-tenant cluster. Agents re-home on their next poll; decommission the terraform cluster only after verifying no company still holds the key.
      operationId: clearCompanyLinkInfrastructureKey
      parameters:
      - name: id
        in: path
        description: The ID of the company
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: The updated company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Company not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::Company
  /companies/{id}/workspaces:
    get:
      tags:
      - Company
      summary: List workspaces in a company
      description: Returns every workspace belonging to the company, grouped by the owning account. Endpoint authorized with a company-scoped API key, or by a company admin user.
      operationId: getCompanyWorkspaces
      parameters:
      - name: id
        in: path
        description: Company ID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: The accounts in the company, each with its workspaces
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyWorkspacesResult'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Company not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::Company
      x-mabl-scope: public
    post:
      tags:
      - Company
      summary: Create a workspace in a company
      description: Creates a new workspace in one of the company's billing accounts. Endpoint authorized with a company-scoped API key, or by a company admin user.
      operationId: createCompanyWorkspace
      parameters:
      - name: id
        in: path
        description: Company ID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: The workspace to create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyWorkspaceRequest'
        required: true
      responses:
        '201':
          description: The workspace that was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Company not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Create::Workspace
      x-mabl-scope: public
  /recover/companies/{company_id}:
    post:
      tags:
      - Company
      summary: Recover Company
      description: Recover tombstoned company and all associated workspaces
      operationId: recoverCompany
      parameters:
      - name: company_id
        in: path
        description: The id of the company to recover
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: The company that was recovered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          description: Invalid or missing parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '403':
          description: User not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '404':
          description: No company to recover
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
      x-mabl-action: Recover::Company
components:
  responses:
    ErrorResponse400:
      description: Invalid or missing parameter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse403:
      description: User not authorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse401:
      description: User not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse:
      description: Unknown error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
  schemas:
    CompanyLinkInfrastructureKeyUpdateRequest:
      required:
      - key
      type: object
      properties:
        key:
          pattern: ^[a-z]([a-z0-9-]{0,10}[a-z0-9])$
          type: string
          description: 'The dedicated cluster''s link infrastructure key. 2-12 chars of [a-z0-9-], starting with a letter and ending alphanumeric (the 12-char cap is a derived-GCP-resource-name budget; must match the terraform cluster key). Must correspond to an applied `clusters` map entry in infra/terraform/mablnet.

            '
        allow_shared:
          type: boolean
          description: 'Explicit consent to assign a key that another company already holds (holding-company / M&A case). Evaluated per request, never persisted — without it, assigning an already-held key fails naming the current holders.

            '
    CompanyQueryResult:
      type: object
      properties:
        companies:
          type: array
          description: All companies that matched the query
          readOnly: true
          items:
            $ref: '#/components/schemas/Company'
        cursor:
          type: string
          description: Cursor used for pagination
          readOnly: true
    ExecutionLocation:
      required:
      - cloud
      - region
      type: object
      properties:
        cloud:
          type: string
          description: Cloud identifier, e.g. gcp or aws
        region:
          type: string
          description: Region as the cloud names it, e.g. us-south1
      description: 'Where test runs execute: a cloud and one of that cloud''s regions. A region name means nothing without its cloud, so the two are always set together.'
    LinkAccessConfig:
      type: object
      properties:
        created_time:
          type: integer
          description: created time, epoch millis
          format: int64
        created_by_id:
          type: string
          description: created by user id
        last_updated_time:
          type: integer
          description: last updated time, epoch millis
          format: int64
        last_updated_by_id:
          type: string
          description: last update by user id
        enable_link_access_by_support:
          type: boolean
          description: 'When true, a mabl support admin may reach the tunnel''s published services, such as the SOCKS proxy and reachability probes. When false they may still reach the tunnel''s control plane — draining a host, inspecting carriers — which is never gated, but no traffic-carrying service.

            '
        member_access_roles:
          type: array
          description: 'Which member roles may reach the tunnel''s published services with their own credentials — the tunnel''s audience. A caller is admitted when they hold at least one role named here, so holding a role is necessary and never sufficient: the owner has to have named it. An empty array admits nobody, which is where every owner starts, and leaves only api keys — cloud execution is unaffected.


            Absent and empty both admit nobody; the difference is about the PATCH, not about access. A PATCH omitting this field leaves the audience as it is, and one sending an empty array clears it.

            '
          items:
            $ref: '#/components/schemas/LinkAccessRoleEnum'
      description: 'Consent settings governing who may reach a Link (mablnet) tunnel owned by this workspace or company. Deliberately separate from support_access_config: not all of this has anything to do with support, and reaching a customer''s network is a distinct decision from seeing their workspace.


        This is the set an owner of either kind carries. A workspace additionally carries enable_personal_tunnels — see WorkspaceLinkAccessConfig, which extends this. That flag is meaningless for a company: a personal tunnel belongs to a user, and both halves of the decision it governs are asked of a workspace.


        Everything here is opt-in. An absent config, and an absent setting within a present config, both admit nobody. The exception is a workspace on a trial account, which reads each setting its owner has not set as the most permissive value — support may reach the tunnel, every role is admitted, personal tunnels are allowed — and is returned that way. Those defaults are never stored, so they end with the trial. None of this affects api-key access to a tunnel — an `execution` key reaching a tunnel for a cloud test run is unaffected throughout.

        '
    GuardrailRefusal:
      type: object
      properties:
        id:
          type: string
          description: The id of the guardrail policy that decided the refusal.
        reason:
          type: string
          description: Why the policy refuses the request, written for the person the agent acts for.
        decision_id:
          type: string
          description: The id of this decision in the guardrail decision log.
        action:
          type: string
          description: The action the request was evaluated as, written Verb::Resource (for example Delete::Test), as declared by the operation's x-mabl-action extension.
        policy_source:
          type: string
          description: 'Who set the deciding policy: workspace for a rule the workspace''s owners wrote, account for a rule set for the workspace''s account, mabl_agent_type for the agent type''s ceiling, and mabl_default for mabl''s own defaults.'
        approval:
          description: The approval for this request; present when error_code is approval_required and the approval could be recorded. Without it the request cannot be approved.
          allOf:
          - $ref: '#/components/schemas/GuardrailApprovalRef'
      description: The guardrail policy that refused an agent request.
    CompanyWorkspaceSummary:
      type: object
      properties:
        id:
          type: string
          description: The id of the workspace
          x-mabl-scope: public
        name:
          type: string
          description: The display name of the workspace
          x-mabl-scope: public
      description: Minimal identifying details for a workspace in the company
    UserCompanyRole:
      required:
      - company_id
      - role
      type: object
      properties:
        role:
          $ref: '#/components/schemas/UserRoleEnum'
        company_id:
          type: string
          description: The company to which this role applies
    CompanyUpdateRequest:
      type: object
      properties:
        company:
          $ref: '#/components/schemas/Company'
        account_ids:
          type: array
          items:
            type: string
        admin_ids:
          type: array
          description: The IDs of Company administrators
          items:
            type: string
    GuardrailApprovalKind:
      type: string
      description: Who decides a guardrail approval. SELF is decided by the person the agent acts for; WORKSPACE, for an agent acting for an API key, by a workspace owner or editor.
      enum:
      - SELF
      - WORKSPACE
    UserCompanyRoles:
      required:
      - roles
      type: object
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/UserCompanyRole'
    LinkAccessRoleEnum:
      type: string
      description: 'A role that may be admitted to a Link (mablnet) tunnel''s published services, as named in member_access_roles.


        `company_admin` is the company OWNER: of the owning workspace''s company for a workspace-owned tunnel, of the company itself for a company-owned one. The three workspace roles mean that role in the owning workspace; on a company-owned tunnel they mean that role in any workspace belonging to the company.

