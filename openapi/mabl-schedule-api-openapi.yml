openapi: 3.2.0
info:
  title: mabl Schedule API
  description: APIs for interacting with mabl services
  version: 0.599.3.1792436330
  x-readme-id: 62c896636916ce01d2ff4f5a
servers:
- url: /
security:
- basicAuth: []
- bearerAuth: []
tags:
- name: Schedule
paths:
  /schedule/runPolicy:
    get:
      tags:
      - Schedule
      summary: Retrieve a set of run policies by query
      description: Used to query run policies
      operationId: queryRunPolicies
      parameters:
      - name: organization_id
        in: query
        description: The organization id to query
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: deployment_id
        in: query
        description: The deployment id to query
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: test_id
        in: query
        description: The test id to filter by; returns only plans that include this test. When supplied, organization_id is required (returns 400 otherwise) - tests are workspace-scoped so the workspace context is needed to use the indexed lookup.
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: limit
        in: query
        description: The limit to use for pagination
        required: false
        style: form
        explode: true
        schema:
          minimum: 1
          type: integer
          format: int32
      - name: cursor
        in: query
        description: The cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: name
        in: query
        description: Return only plans whose name equals this value, ignoring case and surrounding whitespace. Applied in memory after a full workspace scan, so the response contains every match up to `limit` and the returned cursor is empty; `truncated` is true when `limit` cut the match set short. Cannot be combined with cursor (returns 400) - the scan has to start at the beginning to see every match.
        required: false
        style: form
        explode: true
        schema:
          maxLength: 500
          type: string
      - name: include_labels
        in: query
        description: Return only plans carrying at least one of these labels, matched ignoring case and surrounding whitespace. All plans are considered when it is absent. Applied in memory after a full workspace scan on the same terms as `name`, so the returned cursor is empty, `truncated` is true when `limit` cut the match set short, and it cannot be combined with cursor (returns 400).
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
          default: []
      responses:
        '200':
          description: Array of run policies matching the query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanQueryResult'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::Plan
    post:
      tags:
      - Schedule
      summary: Create a Run Policy
      description: Creates a Run Policy that describes how and when to run a set of tests
      operationId: createRunPolicy
      requestBody:
        description: The run policy to create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Plan'
        required: true
      responses:
        '201':
          description: The complete run policy that was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '400':
          description: Invalid run policy was supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Create::Plan
  /schedule/runPolicy/default:
    post:
      tags:
      - Schedule
      summary: Create default Run Policies
      description: Creates default Run Policies
      operationId: createDefaultRunPolicies
      requestBody:
        description: A template for the default run policies
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefaultPlan'
        required: true
      responses:
        '201':
          description: The complete run policy that was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunPoliciesResult'
        '400':
          description: Invalid run policy was supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Create::Plan
  /schedule/runPolicy/{id}/migrate/maybeOnlyEncryptOnce:
    get:
      tags:
      - Schedule
      summary: Migrate Double Encrypted policy
      description: Migrate DataTable associations from plan journey configs to journeys
      operationId: maybeOnlyEncryptOnce
      parameters:
      - name: id
        in: path
        description: The ID of the policy to migrate
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '204':
          description: The operation was successful
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::Plan
  /schedule/runPolicy/{id}:
    get:
      tags:
      - Schedule
      summary: Retrieve Run Policy
      description: Used to retrieve an existing run policy
      operationId: getRunPolicy
      parameters:
      - name: id
        in: path
        description: The run policy ID to retrieve
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: include_tcm_bindings
        in: query
        description: When true, include the plan's external TCM bindings in the response
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: The run policy that was retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '404':
          description: Run Policy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::Plan
    delete:
      tags:
      - Schedule
      summary: Remove Run Policy
      description: Used to remove existing run policies
      operationId: removeRunPolicy
      parameters:
      - name: id
        in: path
        description: The ID of the run policy to remove
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: The run policy that was removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '404':
          description: Run Policy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Delete::Plan
    patch:
      tags:
      - Schedule
      summary: Update Run Policy
      description: Used to update existing run Policies
      operationId: updateRunPolicy
      parameters:
      - name: id
        in: path
        description: The ID of the Run Policy to update
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: If-Match
        in: header
        description: If-Match header according to http/1.1 spec section 14.24
        required: false
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: The Run Policy fields to update
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Plan'
        required: true
      responses:
        '200':
          description: The updated run policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '404':
          description: Run Policy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::Plan
  /recover/runPolicy/{run_policy_id}:
    post:
      tags:
      - Schedule
      summary: Recover a deleted run policy. Admin only
      description: Recovers a deleted run policy if it has not been fully scrubbed yet.
      operationId: recoverRunPolicy
      parameters:
      - name: run_policy_id
        in: path
        description: The id of the policy to recover
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '201':
          description: The complete run policy that was recovered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '404':
          description: Run policy not found.  It was either hard deleted or never existed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Recover::Plan
  /schedule/report:
    get:
      tags:
      - Schedule
      summary: Retrieve a set of reports by query
      description: Used to query reports
      operationId: queryReports
      parameters:
      - name: organization_id
        in: query
        description: The organization id to query
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: plan_id
        in: query
        description: The plan id to query
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: journey_id
        in: query
        description: The journey id to query
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: report_type
        in: query
        description: The type of report summary (plan or workspace). Default is plan_summary
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: limit
        in: query
        description: The limit to use for pagination
        required: false
        style: form
        explode: true
        schema:
          minimum: 1
          type: integer
          format: int32
      - name: cursor
        in: query
        description: The cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Array of reports matching the query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportQueryResult'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::ScheduledReport
    post:
      tags:
      - Schedule
      summary: Create a Report
      description: Creates a Report that describes how and when to run a set of tests
      operationId: createReport
      requestBody:
        description: The report to create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Report'
        required: true
      responses:
        '201':
          description: The complete report that was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '400':
          description: Invalid report was supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Create::ScheduledReport
  /schedule/report/own:
    get:
      tags:
      - Schedule
      summary: Retrieve a set of reports created by the user
      description: Used to query user's own reports
      operationId: queryOwnReports
      parameters:
      - name: organization_id
        in: query
        description: The organization id to query
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: report_type
        in: query
        description: The type of report summary (plan or workspace). Default is plan_summary
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: limit
        in: query
        description: The limit to use for pagination
        required: false
        style: form
        explode: true
        schema:
          minimum: 1
          type: integer
          format: int32
      - name: cursor
        in: query
        description: The cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Array of reports matching the query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportQueryResult'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::ScheduledReport
  /schedule/report/{id}:
    get:
      tags:
      - Schedule
      summary: Retrieve Report
      description: Used to retrieve an existing report
      operationId: getReport
      parameters:
      - name: id
        in: path
        description: The report ID to retrieve
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: The report that was retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '404':
          description: Report not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::ScheduledReport
    delete:
      tags:
      - Schedule
      summary: Remove Report
      description: Used to remove existing report
      operationId: removeReport
      parameters:
      - name: id
        in: path
        description: The ID of the report to remove
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: The report that was removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '404':
          description: Report not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Delete::ScheduledReport
    patch:
      tags:
      - Schedule
      summary: Update Report
      description: Used to update existing report
      operationId: updateReport
      parameters:
      - name: id
        in: path
        description: The ID of the report to update
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: If-Match
        in: header
        description: If-Match header according to http/1.1 spec section 14.24
        required: false
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: The report fields to update
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Report'
        required: true
      responses:
        '200':
          description: The updated report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '404':
          description: Report not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::ScheduledReport
  /cron/scheduledPolicies/{shard}:
    get:
      tags:
      - Schedule
      summary: Run scheduled policies
      description: Used to retrieve an existing run policy
      operationId: runScheduledPolicies
      parameters:
      - name: shard
        in: path
        description: The run policy shard to run scheduled tests over.  Defines a subset of all run policies
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '204':
          description: Succesful scheduling
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Run::Plan
  /cron/testRun/sweeper:
    get:
      tags:
      - Schedule
      summary: Run scheduled policies
      description: Used to look for queued tests that were never executed and reschedule them
      operationId: rescheduleUnstartedTests
      responses:
        '204':
          description: Successful run
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Run::Plan
  /schedule/runPolicy/labels:
    get:
      tags:
      - Schedule
      summary: Retrieve the set of run policy labels
      description: Used to query run policy labels
      operationId: queryRunPolicyLabels
      parameters:
      - name: organization_id
        in: query
        description: The organization id to query
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: limit
        in: query
        description: The limit to use for pagination
        required: false
        style: form
        explode: true
        schema:
          minimum: 1
          type: integer
          format: int32
      - name: cursor
        in: query
        description: The cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Array of labels matching the query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanLabelQueryResult'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::Plan
components:
  responses:
    ErrorResponse400:
      description: Invalid or missing parameter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse403:
      description: User not authorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse401:
      description: User not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse:
      description: Unknown error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
  schemas:
    Label:
      required:
      - name
      type: object
      properties:
        name:
          type: string
          description: name
          x-mabl-scope: public
        color:
          type: string
          description: color
    ExecutionParameter:
      required:
      - type
      - value
      type: object
      properties:
        type:
          type: string
          description: The type of this parameter
          enum:
          - basic_auth
          - credentials
          - ignore_variables
          - value
          - variable_row
          - variables
        name:
          type: string
          description: The name of this parameter
        value:
          type: string
          description: The value of this parameter
        argument:
          type: string
          description: Additional text data for this parameter.
        argumentObject:
          description: Additional data for this parameter.
          oneOf:
          - $ref: '#/components/schemas/DynamicScenarioSelection'
          - $ref: '#/components/schemas/StaticScenarioSelection'
      description: A parameter that is passed during execution of a Plan
    PlanLabelQueryResult:
      type: object
      properties:
        labels:
          type: array
          description: All run labels that matched the query
          readOnly: true
          items:
            $ref: '#/components/schemas/Label'
        cursor:
          type: string
          description: Cursor used for pagination
          readOnly: true
      description: result envelope for run policy label query results
    Tag:
      required:
      - name
      type: object
      properties:
        name:
          type: string
          description: tag name
          x-mabl-scope: public
        values:
          maxItems: 32
          minItems: 0
          type: array
          items:
            type: string
    GuardrailRefusal:
      type: object
      properties:
        id:
          type: string
          description: The id of the guardrail policy that decided the refusal.
        reason:
          type: string
          description: Why the policy refuses the request, written for the person the agent acts for.
        decision_id:
          type: string
          description: The id of this decision in the guardrail decision log.
        action:
          type: string
          description: The action the request was evaluated as, written Verb::Resource (for example Delete::Test), as declared by the operation's x-mabl-action extension.
        policy_source:
          type: string
          description: 'Who set the deciding policy: workspace for a rule the workspace''s owners wrote, account for a rule set for the workspace''s account, mabl_agent_type for the agent type''s ceiling, and mabl_default for mabl''s own defaults.'
        approval:
          description: The approval for this request; present when error_code is approval_required and the approval could be recorded. Without it the request cannot be approved.
          allOf:
          - $ref: '#/components/schemas/GuardrailApprovalRef'
      description: The guardrail policy that refused an agent request.
    Plan:
      type: object
      properties:
        id:
          maxLength: 50
          type: string
          description: Plan id. Set by system.
          x-mabl-public: true
        cloud_safe_id:
          type: string
          description: Cloud safe ID representation (e.g. GCP/email/Kubernetes safe)
        organization_id:
          type: string
          description: DEPRECATED - use workspace_id instead
        workspace_id:
          type: string
          description: The workspace id this plan belongs to
          x-mabl-public: true
        plan_type:
          type: string
          description: The type of plan
          enum:
          - functional
          - performance
          x-mabl-public: true
        plan_source:
          $ref: '#/components/schemas/TestSource'
        ref_id:
          type: string
          description: Reference id to this plan in another system
          x-mabl-scope: public
        deployment_id:
          type: string
          description: DEPRECATED - use deployment_ids - The deployment ID associated with this run policy
        deployment_ids:
          type: array
          description: The deployment IDs associated with this run policy
          items:
            type: string
        uri:
          type: string
          description: DEPRECATED - Alias for web_url
        web_url:
          type: string
          description: Optional URL override for web deployments
        api_url:
          type: string
          description: Optional URL override for API deployments
        link_agent_label:
          type: string
          description: DEPRECATED - use link_agent_labels
          deprecated: true
        link_agent_labels:
          type: array
          description: Optional Link Agent Labels override for the deployment
          items:
            type: string
        link_bypass_mabl_proxy:
          type: boolean
          description: Optional link_bypass_mabl_proxy override for the deployment (mabl link only)
        use_personal_link_agent:
          type: boolean
          description: 'Route this run''s test traffic through the triggering user''s own personal Link 3.0 tunnels instead of the environment''s configured Link tunnels: when any personal tunnel is used, it is the run''s only Link path. Overrides the deployment''s use_personal_link_agent for this run. The owner is the user who triggers the run, resolved server-side — there is no id to pass. By default the run stripes across every live personal tunnel the user has (e.g. one per machine); set personal_link_tunnel_label to pin it to one. When no personal tunnel can be used, the run proceeds over its normal network path rather than failing.

            '
        personal_link_tunnel_label:
          type: string
          description: 'Restrict use_personal_link_agent to a single personal tunnel by its (server-derived) Link label, instead of striping across all of the user''s live personal tunnels. Ignored when use_personal_link_agent is not set.

            '
        tcm_bindings:
          type: array
          description: The plan's external TCM bindings. Populated at read time on single plan reads when include_tcm_bindings is true; empty if the plan has no bindings; not persisted.
          items:
            $ref: '#/components/schemas/XrayEntityBinding'
          x-dao-derived: true
        credentials_id:
          type: string
          description: Optional ID of the credentials object to use with this run policy
        credentials_required:
          type: boolean
          description: Flag indicating whether or not credentials are required for this run policy
        http_auth_credentials_id:
          type: string
          description: Optional ID of credentials to pass in the HTTP request (as opposed to interactive login credentials)
        http_auth_credentials_required:
          type: boolean
          description: Flag indicating whether or not HTTP auth credentials are required for this run policy
        http_headers:
          type: array
          description: Custom HTTP headers to send with all requests
          items:
            $ref: '#/components/schemas/HttpHeader'
        http_headers_required:
          type: boolean
          description: Flag indicating whether or not custom HTTP headers are required for this run policy
        enabled:
          type: boolean
          description: Whether this run policy is currently enabled
        generated:
          type: boolean
          description: Whether this run policy was automatically generated by the platform as opposed to being entered by a user
        default:
          type: boolean
          description: Whether this is the default run policy
        ephemeral:
          type: boolean
          description: Whether this is an ephemeral run policy created for an ad hoc plan run
        created_time:
          type: integer
          description: time the run policy was created
          format: int64
        created_by_id:
          type: string
          description: The ID of the user who created this run policy
        last_updated_time:
          type: integer
          description: time the run policy object was last updated
          format: int64
        last_updated_by_id:
          type: string
          description: The ID of the user who last updated this run policy
        name:
          type: string
          description: The display name of the run policy
        description:
          type: string
          description: Detailed description of this run policy
        journeys:
          type: array
          description: DEPRECATED - use execution_stages
          items:
            $ref: '#/components/schemas/TestConfiguration'
        test_invariant_ids:
          type: array
          description: Server-maintained denormalized list of invariant ids of every test referenced anywhere in this plan's execution_stages. Used to index plan-by-test lookups in Datastore (which cannot index doubly-nested array paths). Do not set from clients - any value provided will be overwritten on save.
          items:
            type: string
        page_load_wait:
          type: string
          description: The amount of time to wait after page loads, if supported by the runtime.
          enum:
