openapi: 3.2.0
info:
  title: mabl Workspace Integration API
  description: APIs for interacting with mabl services
  version: 0.599.3.1792436330
  x-readme-id: 62c896636916ce01d2ff4f5a
servers:
- url: /
security:
- basicAuth: []
- bearerAuth: []
tags:
- name: WorkspaceIntegration
paths:
  /workspaces/{workspace_id}/integrations/claim:
    post:
      tags:
      - WorkspaceIntegration
      summary: Claim Workspace Integration
      description: Claim a claimable Workspace Integration (e.g. GitHub)
      operationId: claimIntegration
      parameters:
      - name: workspace_id
        in: path
        description: Workspace Integrations object
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: Workspace Integrations object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceIntegrationClaimRequest'
        required: true
      responses:
        '201':
          description: Claimed Workspace Integration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceIntegration'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '409':
          description: Conflict on attempt to reclaim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Create::Integration
  /integrations:
    get:
      tags:
      - WorkspaceIntegration
      summary: Get Workspace Integrations for predicate
      description: Get Workspace Integration by predicate
      operationId: queryWorkspaceIntegrations
      parameters:
      - name: integration_type
        in: query
        description: GitHub installation identifier filter predicate
        required: true
        style: form
        explode: true
        schema:
          $ref: '#/components/schemas/IntegrationTypeEnum'
      - name: installation_id
        in: query
        description: Installation identifier filter predicate
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: github_installation_id
        in: query
        description: deprecated GitHub installation identifier filter predicate
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int64
      - name: workspace_id
        in: query
        description: The workspace to get integrations for
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Workspace Integrations, if any
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceIntegrationQueryResult'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: WorkspaceIntegration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::Integration
    post:
      tags:
      - WorkspaceIntegration
      summary: Create Workspace Integration
      operationId: createWorkspaceIntegration
      requestBody:
        description: Workspace Integrations object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceIntegration'
        required: true
      responses:
        '201':
          description: Created Workspace Integration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceIntegration'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Create::Integration
  /integrations/{id}:
    get:
      tags:
      - WorkspaceIntegration
      summary: Get Workspace Integrations
      description: Get Workspace Integration
      operationId: getWorkspaceIntegration
      parameters:
      - name: id
        in: path
        description: workspace integration id
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: with_secrets
        in: query
        description: Whether to include secrets in the response. Honored only for a principal holding read_secret:integrations in the integration's workspace; otherwise the request is served as if it were false, with the secret fields empty, rather than refused.
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          default: false
      - name: renew_secrets
        in: query
        description: Renew time sensitive secrets, if relevant to the given integration, and IFF with_secrets is true. Honored only for a principal holding read_secret:integrations in the integration's workspace; otherwise the request is served as if it were false, and no secret is renewed or persisted.
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Workspace Integration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceIntegration'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: WorkspaceIntegration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::Integration
    put:
      tags:
      - WorkspaceIntegration
      summary: Update Workspace Integration
      operationId: updateWorkspaceIntegration
      parameters:
      - name: id
        in: path
        description: Workspace Integrations identifier
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: If-Match
        in: header
        description: If-Match header according to http/1.1 spec section 14.24
        required: false
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: Workspace Integrations object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceIntegration'
        required: true
      responses:
        '200':
          description: Updated Workspace Integration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceIntegration'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::Integration
    delete:
      tags:
      - WorkspaceIntegration
      summary: Remove Workspace Integration
      operationId: removeWorkspaceIntegration
      parameters:
      - name: id
        in: path
        description: workspace integration id
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '204':
          description: Workspace Integration Removed
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Delete::Integration
  /integrations/{id}/issueTracker/schemas:
    put:
      tags:
      - WorkspaceIntegration
      summary: Upsert issue tracker schemas
      description: Creates/updates one or more schemas associated with this issue tracker integration
      operationId: upsertIssueTrackerSchemas
      parameters:
      - name: id
        in: path
        description: Workspace Integrations identifier
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: List of schemas to upsert
        content:
          application/json:
            schema:
              maxItems: 25
              type: array
              items:
                $ref: '#/components/schemas/IssueSchema'
        required: true
      responses:
        '204':
          description: Schemas upserted
        '400':
          description: Required field missing, or specified integration is not an issue tracker type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Integration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::Integration
  /integrations/{id}/azureBoards/events:
    post:
      tags:
      - WorkspaceIntegration
      summary: Receive an Azure DevOps service-hook event
      description: Called by the Azure DevOps service-hook subscription mabl creates for an Azure Boards integration, not by mabl clients. Authenticated with HTTP Basic carrying the integration's webhook secret as the password; any failure to verify answers 401 without saying whether the integration exists. workitem.updated, workitem.deleted and workitem.restored each mirror the work item's current open state, or its absence, onto mabl's issue. Answers 503 when Azure DevOps cannot be read, so the event is redelivered.
      operationId: receiveAzureBoardsEvent
      parameters:
      - name: id
        in: path
        description: Workspace Integrations identifier
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: The service-hook payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AzureBoardsServiceHookEvent'
        required: true
      responses:
        '200':
          description: The event was verified; it was applied or deliberately ignored
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::Integration
  /integrations/{id}/issueTracker/schemaKeyFields:
    get:
      tags:
      - WorkspaceIntegration
      summary: Gets all schema metadata for this integration
      description: Schema metadata includes only information about schema key fields. For the full schema use getIssueTrackerSchema.
      operationId: getIssueTrackerSchemaKeyFields
      parameters:
      - name: id
        in: path
        description: Workspace Integrations identifier
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: The metadata for each schema associated with this issue tracker integration
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IssueSchema'
        '400':
          description: Required field missing, or specified integration is not an issue tracker type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Integration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::Integration
  /integrations/{integration_id}/issueTracker/schemas/{schema_id}:
    get:
      tags:
      - WorkspaceIntegration
      summary: Get issue tracker schema
      description: Creates/updates one or more schemas associated with this issue tracker integration
      operationId: getIssueTrackerSchema
      parameters:
      - name: integration_id
        in: path
        description: Workspace Integrations identifier
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: schema_id
        in: path
        description: Schema ID within the integration
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Issue schema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueSchema'
        '400':
          description: Required field missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Integration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::Integration
  /integrations/{id}/issueTracker/schemaIds:
    put:
      tags:
      - WorkspaceIntegration
      summary: Sets the schema IDs that are valid for this integration.
      description: Sets the list of valid schema IDs for this integration, and removes all schemas not referenced by this list.
      operationId: setIssueTrackerSchemaIds
      parameters:
      - name: id
        in: path
        description: Workspace Integrations identifier
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: List of schema IDs to set
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
        required: true
      responses:
        '204':
          description: Schema IDs set
        '400':
          description: Required field missing, or specified integration is not an issue tracker type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: Integration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Edit::Integration
  /workspaces/{workspace_id}/integrations:
    get:
      tags:
      - WorkspaceIntegration
      summary: Query Workspace Integrations
      description: Query matching Integration Configurations for Workspace
      operationId: queryByWorkspaceId
      parameters:
      - name: workspace_id
        in: path
        description: workspace id
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: integration_type
        in: query
        description: integration type filter
        required: false
        style: form
        explode: true
        schema:
          $ref: '#/components/schemas/IntegrationTypeEnum'
      - name: oauth_token_id
        in: query
        description: Return only if has a matching OAuth token id
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: user_id
        in: query
        description: Return only if has a matching user id
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: enabled
        in: query
        description: Return only enabled or disabled integrations
        required: false
        style: form
        explode: true
        schema:
          type: boolean
      - name: limit
        in: query
        description: The limit to use for pagination
        required: false
        style: form
        explode: true
        schema:
          minimum: 1
          type: integer
          format: int32
      - name: cursor
        in: query
        description: The cursor to use for pagination
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: integration_types
        in: query
        description: Multiple integration types filter. Will be used only `integration_type` is not provided
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationTypeEnum'
      - name: with_secrets
        in: query
        description: Return decrypted secrets if true. Honored only for a principal holding read_secret:integrations in the requested workspace; otherwise the query is served as if it were false, with the secret fields empty, rather than refused.
        required: false
        style: form
        explode: true
        schema:
          type: boolean
      - name: renew_secrets
        in: query
        description: Renew time sensitive secrets, if relevant to the given integration, and IFF with_secrets is true. Honored only for a principal holding read_secret:integrations in the requested workspace; otherwise the query is served as if it were false, and no secret is renewed or persisted.
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Workspace Integrations, if any
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceIntegrationQueryResult'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '403':
          $ref: '#/components/responses/ErrorResponse403'
        '404':
          description: WorkspaceIntegration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseGeneric'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-mabl-action: Read::Integration
components:
  responses:
    ErrorResponse400:
      description: Invalid or missing parameter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse403:
      description: User not authorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse401:
      description: User not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
    ErrorResponse:
      description: Unknown error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseGeneric'
  schemas:
    SlackUser:
      type: object
      properties:
        user_id:
          type: string
          description: Slack user ID that will be used in slack API calls
        user_name:
          type: string
          description: Name of the user
      description: Slack user ID and name
    ZephyrRegionEnum:
      type: string
      description: The Zephyr Cloud region hosting the instance; selects the API host.
      enum:
      - us
      - eu
      - au
      - de
    Tag:
      required:
      - name
      type: object
      properties:
        name:
          type: string
          description: tag name
          x-mabl-scope: public
        values:
          maxItems: 32
          minItems: 0
          type: array
          items:
            type: string
    ZephyrCycleModeEnum:
      type: string
      description: 'per_plan_run: each plan run''s results go to a test cycle mabl creates for it. fixed: results go to the configured cycle of each project.'
      enum:
      - per_plan_run
      - fixed
    GuardrailRefusal:
      type: object
      properties:
        id:
          type: string
          description: The id of the guardrail policy that decided the refusal.
        reason:
          type: string
          description: Why the policy refuses the request, written for the person the agent acts for.
        decision_id:
          type: string
          description: The id of this decision in the guardrail decision log.
        action:
          type: string
          description: The action the request was evaluated as, written Verb::Resource (for example Delete::Test), as declared by the operation's x-mabl-action extension.
        policy_source:
          type: string
          description: 'Who set the deciding policy: workspace for a rule the workspace''s owners wrote, account for a rule set for the workspace''s account, mabl_agent_type for the agent type''s ceiling, and mabl_default for mabl''s own defaults.'
        approval:
          description: The approval for this request; present when error_code is approval_required and the approval could be recorded. Without it the request cannot be approved.
          allOf:
          - $ref: '#/components/schemas/GuardrailApprovalRef'
      description: The guardrail policy that refused an agent request.
    AzureBoardsWorkItemTypeSettings:
      required:
      - name
      type: object
      properties:
        name:
          type: string
          description: The work item type's name, e.g. Bug
        hidden_fields:
          type: array
          description: Reference names removed from the create form. A required field stays shown unless it has a usable default.
          items:
            type: string
        field_defaults:
          type: array
          description: Values applied at create to fields the submission leaves out.
          items:
            $ref: '#/components/schemas/AzureBoardsFieldDefault'
      description: How mabl's create-issue form treats one Azure Boards work item type.
    GuardrailApprovalKind:
      type: string
      description: Who decides a guardrail approval. SELF is decided by the person the agent acts for; WORKSPACE, for an agent acting for an API key, by a workspace owner or editor.
      enum:
      - SELF
      - WORKSPACE
    GuardrailApprovalRef:
      type: object
      properties:
        id:
          type: string
          description: The approval's id.
        state:
          description: Where the approval stands.
          allOf:
          - $ref: '#/components/schemas/GuardrailApprovalState'
        kind:
          description: Who decides the approval.
          allOf:
          - $ref: '#/components/schemas/GuardrailApprovalKind'
        request_expires_time:
          type: integer
          description: When the approval expires if nobody decides it, in epoch milliseconds.
          format: int64
        url:
          type: string
          description: The mabl app page where a person reviews the approval.
      description: 'An approval a guardrail policy asks for. While it is PENDING, stop: give the person the url, tell them the request is waiting for approval, and do not repeat the request or poll in a loop. Once a person tells you it is APPROVED, repeat the identical request with the header X-Mabl-Approval set to id. DENIED means a person said no, so do not work around it.'
    IssueSchemaField:
      required:
      - id
      - is_required
      - name
      - type
      type: object
      properties:
        id:
          type: string
          description: Field identifier
        name:
          type: string
          description: Human-friendly field descriptor
        type:
          type: string
          description: Field type
          enum:
          - project
          - issuetype
          - user
          - priority
          - text
          - textarea
          - labels
          - number
          - date
          - datetime
          - checkboxes
          - radiobuttons
        allowed_values:
          type: array
          description: Allowed values for the field if applicable
          items: {}
        is_required:
          type: boolean
          description: Whether the field is required
        default_value:
          type: string
          description: A value to pre-fill the field with, as the tracker takes it. Set by Azure Boards integrations whose admin configured a default; absent otherwise.
      description: Issue schema field
      example:
        id: affected_platform
        name: Affected Platform
        type: labels
        allowed_values:
        - value: Chrome
        - value: Edge
        - value: Firefox
        - value: IE11
        - value: Safari
        is_required: true
    XrayFunctionalMobileTestEvidenceArtifactTypeEnum:
      type: string
      enum:
      - screenshots
    XrayFunctionalApiTestEvidenceArtifactTypeEnum:
      type: string
      enum:
      - request_assertions
    AzureBoardsFieldDefault:
      required:
      - field
      - value
      type: object
      properties:
        field:
          type: string
          description: The field's reference name, e.g. System.Tags
        value:
          type: string
          description: The default as text; converted at create to the field's type (integer, double, boolean, string or html).
    AzureBoardsServiceHookEvent:
      type: object
      properties:
        eventType:
          type: string
          description: For example workitem.updated, workitem.deleted or workitem.restored
        resource:
          type: object
          additionalProperties: true
          description: The event's resource. For workitem.updated it is the update, whose workItemId names the work item; for workitem.deleted and workitem.restored it is the work item, whose id names it.
      description: The fields mabl reads from an Azure DevOps service-hook payload; others are ignored.
    WorkspaceIntegrationQueryResult:
      required:
      - integrations
      type: object
      properties:
        integrations:
          type: array
          description: All insights that matched the query
          readOnly: true
          items:
            $ref: '#/components/schemas/WorkspaceIntegration'
        cursor:
          type: string
          description: Cursor used for pagination
          readOnly: true
    ZephyrEnvironmentMappingEnum:
      type: string
      description: 'by_name: send the mabl environment''s name when the Zephyr project has an environment of that name. none: never send an environment.'
      enum:
      - by_name
      - none
    GuardrailApprovalState:
      type: string
      description: Where a guardrail approval stands. PENDING awaits a decision and expires undecided after 24 hours; APPROVED lets the agent repeat the request, as often as it does, for 20 minutes; DENIED refuses the same request for 20 minutes after the decision, after which asking again opens a new approval; CANCELLED means a person withdrew it while pending or revoked it while approved. EXPIRED and CANCELLED are final.
      enum:
      - PENDING
      - APPROVED
      - DENIED
      - EXPIRED
      - CANCELLED
    WorkspaceIntegrationClaimRequest:
      required:
      - integration_type
      type: object
      properties:
        integration_type:
          type: string
          description: Integration type
          enum:
          - slack
          - github_app
          - jira
          - atlassian_connect
          - atlassian_forge
          - export_feed_google_bigquery
          - export_feed_google_cloud_storage
          - export_feed_google_pubsub
          - segment
        installation_id:
          type: string
          description: installation id for this specific app installation
        github_installation_id:
          type: integer
          description: deprecated GitHub identifier for this specific app installation
          format: int64
    ZephyrStatusNames:
      type: object
      properties:
        passed:
          type: string
        failed:
          type: string
        skipped:
          type: string
          description: When unset or empty, a case whose mabl runs were all skipped gets no execution. On update, an empty string clears a saved value; omitting it keeps the saved value.
      description: Zephyr test execution status names, by mabl outcome.
    SlackGroup:
      type: object
      properties:
        group_id:
          type: string
