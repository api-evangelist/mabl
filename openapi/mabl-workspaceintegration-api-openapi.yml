                  description: GUID of the Azure DevOps project this integration is bound to. Source of truth for the project; project_name is display only.
                project_name:
                  type: string
                  description: Display name of the Azure DevOps project, captured when the project is selected. A display convenience only - project_id remains the source of truth, and this value may be stale if the project is renamed in Azure DevOps.
                default_work_item_type:
