                  type: boolean
                  description: When true, mabl marks the Azure Test Cases its tests link (AB#123 or a work item URL) as Automated by writing their associated automation fields, and clears its own marker once no test links the case. Automation another tool set is never changed. Unset reads as false; an update that omits it keeps the saved value.
              description: Configuration for an Azure Boards integration
