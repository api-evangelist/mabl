                  type: boolean
                  description: When true, mabl records each completed plan run's results in Zephyr without a manual sync request. Ad hoc runs and plan runs whose tests carry no Zephyr case keys are skipped. Unset reads as false; an update that omits it keeps the saved value.
                token_expires_at:
